tual fund scheme with recurring expenses including: - marketing and selling expenses including agents’ commission, if any - brokerage and transaction cost - registrar services for transfer of units sold or redeemed - fees and expenses of trustees - audit fees - custodian fees etc.","answer_source":"explicit"},{"n":35,"q":"Which is the Source Scheme in a Systematic Transfer Plan ?","options":["It is the scheme with the lower NAV","It is the scheme from which funds are transferred","It is the scheme to which funds are transferred","It is the scheme with the higher NAV"],"answer":1,"explanation":"In a Systematic Transfer Plan (STP), the amount that is withdrawn from a scheme (called the source scheme) is re-invested in some other scheme (called the target scheme) of the same mutual fund. For eg. An investor has invested Rs 50,000 in SBI Debt Fund and has a STP to transfer Rs 5000 every month into SBI Mid Cap Fund. Here SBI Debt Fund is the Source fund and SBI Mid Cap Fund is the Target fund.","answer_source":"explicit"},{"n":36,"q":"Identify the FALSE statement/s with respect to a New Fund Offer (NFO).","options":["1. A Closed-ended mutual fund NFO will have a NFO opening date, a NFO closing date and a scheme Re-opening date","2. A Open-ended mutual fund NFO will have a NFO opening date, a NFO closing date and a scheme Re-opening date","Only 1 is false","Only 2 is false","Both 1 and 2 are false"],"answer":3,"explanation":"Closed-ended mutual funds typically do not have a scheme re-opening date, as they are not open for continuous subscription and redemption. Once the NFO period is over, investors can buy or sell units on the stock exchange, but the fund is not open for fresh subscriptions . On the other hand, open-ended mutual funds usually re-open for subscription after the NFO period, allowing investors to buy or sell units at the prevailing Net Asset Value (NAV) Therefore, only statement 1 is false.","answer_source":"manual"},{"n":37,"q":"Which of these information is not contained in the Scheme Information Document (SID)?","options":["Names of securities in the scheme's portfolio","Investment objective of the scheme","Risk factors of the scheme","Portfolio features"],"answer":0,"explanation":"The names of securities in the scheme's portfolio is contained in the Fund fact sheet and not in the SID.","answer_source":"heuristic"},{"n":38,"q":"Opening of time stamping machine needs to be documented and reported to the Asset Management Company (AMC) - State whether True or False?","options":["True","False"],"answer":1,"explanation":"The points of acceptance for mutual fund transactions have time stamping machines with tamper-proof seal. Opening the machine for repairs or maintenance is permitted only by vendors or nominated persons of the mutual fund. Such opening of the machine has to be properly documented and reported to the Trustees.","answer_source":"explicit"},{"n":39,"q":"Identify the INCORRECT statement with respect to SEBI Complaints Redress System (SCORES).","options":["SCORES enables the market intermediaries and listed companies to receive complaints from investors, redress such complaints and report redressal","SCORES is a web-based centralized grievance redress system","SCORES is completely online, so an investor cannot lodge a physical compliant","If an investor lodges a physical complaint then such complaints are scanned and then uploaded in SCORES for processing"],"answer":2,"explanation":"While SCORES is primarily online, investors can still submit physical complaints to the SEBI office or concerned intermediary. These physical complaints are then scanned and uploaded onto SCORES for further processing. Therefore - 'SCORES is completely online, so an investor cannot lodge a physical compliant' - is incorrect.","answer_source":"explicit"},{"n":40,"q":"Identify the FALSE statement/s with respect to benchmarks for mutual fund schemes.","options":["A. A Multi-Cap fund can have Nifty 500 index as its benchmark","B. A Multi-Cap fund can have BSE Sensex as its benchmark","Only A is false","Only B is false","Both A and B are false","None of the above"],"answer":3,"explanation":"A Multi-Cap fund invests in Large Cap, Mid Cap and Small Cap stocks as per proportions stipuated by SEBI. The Nifty500 index represents top 100 large cap companies, top 150 Mid-cap companies and top 250 small cap companies. Therefore, it can be a good benchmark for a Multi-Cap fund. The BSE Sensex has 30 large cap stocks from various sectors and it can be good benchmark for a large cap fund and not for a multi cap fund.","answer_source":"explicit"},{"n":41,"q":"Identify the TRUE statement/s with respect to the risks associated with short selling and stock lending.","options":["1. There is counterparty risk and liquidity risk in short selling","2. There is no risk associated with stock lending as the transaction is done through an approved intermediary","Only 1 is true","Only 2 is true","Both 1 and 2 are true"],"answer":2,"explanation":"Short-selling is the sale of shares or securities that the seller does not own at the time of trading. Instead, he borrows it from someone who already owns it. Later, the short seller buys back the stock/security he shorted and returns the stock/security to the lender to close out the loan. The inherent risks are Counterparty risk and liquidity risk of the stock/security being borrowed. The security being short sold might be illiquid or become illiquid and covering of the security might occur at a much higher price level than anticipated, leading to losses. Securities Lending is lending of securities through an approved intermediary to a borrower under an agreement for a specified period with the condition that the borrower will return equivalent securities of the same type or class at the end of the specified period along with the corporate benefits accruing on the securities borrowed. There are risks inherent in securities lending, including the risk of failure of the other party. Such failure can result in a possible loss of rights to the collateral, the inability of the approved intermediary to return the securities deposited by the lender and the possible loss of corporate benefits accruing thereon.","answer_source":"manual"},{"n":42,"q":"Mr. Suresh invests Rs 30000 in an equity fund. The face value of this scheme is Rs 10 and the NAV is Rs 12. The exit load is 2%. How many units will be allotted to Mr. Suresh ?","options":["3000","2142.8571","2500","2411.1574"],"answer":2,"explanation":"Exit load is not applicable on purchase of units. Its applicable only on sale of units. The units will be allotted to Mr. Suresh as per the NAV which is Rs. 12. Amount invested is Rs 30,000 Units allotted = Amount Invested / NAV = 30000 / 12 = 2500","answer_source":"explicit"},{"n":43,"q":"Amongst the distribution channel mentioned below, which one is likely to sell funds of only a single mutual fund house?","options":["Distribution Company","Independent financial advisor","Institutional sales team of the Asset Management Company","Bank"],"answer":2,"explanation":"An independent financial advisor, a bank or a distribution company will sell mutual fund schemes of various mutual fund houses as per their clients requirements and other considerations. However, an institutional sales team of an Asset Management Company will sell schemes only of the single mutual fund house which has appointed it.","answer_source":"explicit"},{"n":44,"q":"These debt mutual funds have been arranged from lowest risk to highest risk. Identify the risk which we are discussing :","options":["1. Liquid Funds 2. Money market funds 3. Medium term bond funds","Interest Rate Risk","Concentration Risk","Default Risk","Credit Risk"],"answer":1,"explanation":"Interest rate risk is the risk that an investment's value will change as a result of a change in interest rates. The interest rate risk varies for bonds with different maturities. Those with longer maturity would witness higher price fluctuations in comparison to those with shorter maturities. Similarly short term debt funds will have lower interest rate risk when compared to longer term debt funds. In the above question, Liquid funds have the shortest duration and so will have less adverse effect of interest rate risk when compared to Money market funds and Medium term bond funds.","answer_source":"heuristic"},{"n":45,"q":"Which of these funds will generally have a higher fund management cost?","options":["Debt Fund","Active Equity Fund","Passive Equity Fund","Equity Index Fund"],"answer":1,"explanation":"In Active Equity Funds the fund manager does a lot of buying / selling which result in higher transaction costs. Also a lot of research work goes into it. So the cost of fund management are higher. Equity Index Funds or Passive Equity funds invest in a portfolio that mimics a market index. There is no selection risk in index funds because the fund manager has no role in creating the portfolio. For this reason, the costs that an index fund is allowed to charge is also lower since there are no research or other fund management expenses.","answer_source":"explicit"},{"n":46,"q":"SEBI Complaint Redress System (SCORES) helps an investor to ______ .","options":["Only 1","Only 1 and 3","Only 1 and 2","All 1, 2 and 3"],"answer":3,"explanation":"SEBI Complaint Redress System (SCORES) is a web-based centralized grievance redress system of SEBI. SCORES enables investors to lodge, follow up on their complaints and track the status of redressal of such complaints online on the website - http://scores.gov.in","answer_source":"explicit","statements":["1. Lodge a complaint for a grievance","2. Make a follow-up on the complaint","3. Track the status of redressal of such complaints online"]},{"n":47,"q":"Among equity funds, Focused funds carry _______ risks as compared to diversified funds due to ______ .","options":["Lower ; highly concentrated portfolio","Higher ; highly concentrated portfolio","Lower ; lower expenses of the fund","Higher ; investments in debt securities"],"answer":1,"explanation":"Among the equity funds, some schemes may have a portfolio concentrated in a few stocks. Such scheme category is known as “Focused funds”. . These schemes carry higher risk than a diversified fund, due to higher concentration among smaller number of stocks.","answer_source":"explicit"},{"n":48,"q":"Which debt schemes of mutual funds invest only in debt securities where moneys will be repaid within 91 days?","options":["Money Market Funds","Medium term debt funds","Fixed Maturity Plans","Liquid Funds"],"answer":3,"explanation":"Liquid Funds invest in debt and money market instruments with a maturity of up to 91 days. These are considered relatively low-risk and highly liquid among debt mutual funds.","answer_source":"explicit"},{"n":49,"q":"Identify the false statement/s :","options":["A. While evaluating the mutual fund schemes, the expense ratio matters more in debt funds than equity funds","B. An Ultra-short term debt fund has to mandatorily invest in high credit quality debt securities","Only A is false","Only B is false","Both A and B are false"],"answer":3,"explanation":"Any cost is a drag on investor’s returns. Investors need to be particularly careful about the cost structure of debt schemes, because in the normal course, debt returns can be much lower than equity schemes. So expense ratio is more critical for debt funds. When the limits are not tightly defined, the fund manager may assume an active role in managing the risk, e.g. an ultra-short term debt fund may take credit risk, since the SEBI regulations only define the permitted maturity profile, which indicates how much interest rate risk the scheme can take.","answer_source":"explicit"},{"n":50,"q":"Identify the TRUE statement -","options":["A. It is mandatory for the AMC to disclose the valuation policy","B. The AMC is not accountable for policies and procedures for detecting and preventing incorrect valuation","Only A is true","Only B is true","Both A and B are true"],"answer":2,"explanation":"Disclosure of the valuation policy and procedures approved by the Board of the AMC shall be made in Statement of Additional Information, on the website of the AMC to ensure transparency of valuation norms to be adopted by asset management company. The responsibility of true and fairness of valuation and correct NAV shall be of the Asset Management Company, irrespective of disclosure of the approved valuation policies and procedures.","answer_source":"manual"},{"n":51,"q":"Performance of a portfolio is influenced by _______ .","options":["Stock Selection","Investment Policy","Asset Allocation Strategy","All of the above"],"answer":3,"explanation":"A portfolio consists of various types of investment products. It is influenced by the investment policy includes the scheme’s asset allocation and investment style. Also equity returns are a function of sector and stock selection which will influence the portfolio performance.","answer_source":"explicit"},{"n":52,"q":"The additional Total Expense Ratio (TER) charged has to be credited back to the Mutual Fund in which of these situations?","options":["When the performance of the mutual fund declines as compared to previous year","When the inflows from beyond the top 30 cities are redeemed within a period of 1 year from the date of investment.","When the TER of the mutual fund exceeds the limit specified under the regulations","All of the above"],"answer":1,"explanation":"Mutual funds can charge additional TER if the new inflows are from beyond top 30 cities (subject to some conditions) However, the additional TER on account of inflows from beyond the top 30 cities so charged shall be credited back to the scheme in case the said inflows are redeemed within a period of 1 year from the date of investment.","answer_source":"explicit"},{"n":53,"q":"All transactions of purchase and sale of securities by key personnel of the AMC, who are directly involved in investment operations shall be disclosed to the compliance officer of the member at least on _______ .","options":["Weekly basis","Monthly basis","Half-Yearly basis","Yearly basis"],"answer":2,"explanation":"As per the AMFI Code of Ethics - All transactions of purchase and sale of securities by key personnel who are directly involved in investment operations shall be disclosed to the compliance officer of the member at least on half yearly basis and subsequently reported to the Board of Trustees if found having conflict of interest with the transactions of the fund.","answer_source":"explicit"},{"n":54,"q":"Identify the correct statement(s) related to the Statement of Additional Information (SAI).","options":["A) The SAI should be updated regularly within three months after the close of every financial year.","B) Any material changes must be updated on an ongoing basis and displayed on the websites of both the mutual fund and AMFI.","Only A","Only B","Both A and B","None of the above"],"answer":4,"explanation":"The Statement of Additional Information (SAI) contains extra details about the mutual fund, such as operational and legal information. SEBI rules require that the SAI be updated regularly within 3 months after the end of each financial year. Any material changes must also be updated immediately and uploaded on the websites of the Mutual Fund and Association of Mutual Funds in India (AMFI).","answer_source":"explicit"},{"n":55,"q":"Identify the FALSE statement/s :","options":["1. For equity mutual funds schemes which are actively managed (eg. Diversified equity fund/Balance funds), the net asset value need NOT be declared up to 4 decimal points","2. Each mutual fund scheme’s account is combined with the accounts of the Asset Management Company","Only 1 is false","Only 2 is false","Both 1 and 2 are false"],"answer":3,"explanation":"Key Accounting and Reporting Requirements for mutual funds : - The accounts of the schemes need to be maintained distinct from the accounts of the AMC. The auditor for the AMC has to be different from that of the schemes. - NAV for equity and balanced funds is to be calculated up to at least 2 decimal places. (and not 4). NAV is to be calculated up to 4 decimal places in the case of index funds, liquid funds and other debt funds.","answer_source":"explicit"},{"n":56,"q":"A top performing scheme within a category _______ .","options":["Is the best choice for an investor to invest his funds","may or may not be the top performer in the next years to come","usually remains the top performer for a long period of time","usually be the worst performer in the next years to come"],"answer":1,"explanation":"As experience has shown time and again, the top performers during one period may not necessarily remain as a top performer forever or near the other top performers. In such a case, simply buying into a scheme due to good returns in the recent past may not be a wise approach. The mutual fund advertisements use the disclaimer: “Past performance may or may not be sustained in future”.","answer_source":"explicit"},{"n":57,"q":"Identify the TRUE statement with respect to ‘Jensen’s Alpha’ of a mutual fund scheme?","options":["It is a measure of outperformance after adjusting for the risk taken","It is a measure of risk and outperformance is related to returns","It is a measure of simple outperformance, irrespective of the risk taken","None of the above"],"answer":0,"explanation":"Jensen's Alpha is used to determine the abnormal return of a security or portfolio of securities over the theoretical expected return. It is a risk-adjusted performance measure that represents the average return on a portfolio or investment, above or below that predicted by the capital asset pricing model (CAPM), given the portfolio's or investment's beta and the average market return.","answer_source":"manual"},{"n":58,"q":"The appropriate benchmark for a short term debt scheme will be _______ .","options":["1 Year T-Bill index","Nifty50","10 year dated GoI security","5 year dated GoI security"],"answer":0,"explanation":"Appropriate Benchmarks : Equity scheme - Sensex or Nifty Long term debt scheme - 10 year dated GoI security Short-term debt fund - 1 year T-Bill","answer_source":"manual"},{"n":59,"q":"As per SEBI guidelines, _________ is/are vested with the responsibility of developing indices as benchmark for debt mutual fund schemes.","options":["AMFI","The mutual fund themselves","The risk management department of the AMC's","Research and rating agencies"],"answer":3,"explanation":"As per the SEBI guidelines, the benchmark for debt (and balanced schemes) should be developed by research and rating agencies recommended by AMFI. CRISIL, ICICI Securities and NSE have developed various such indices.","answer_source":"explicit"},{"n":60,"q":"SEBI has to approve the Scheme Related Documents in ______ .","options":["7 days","15 days","1 month","SEBI does not approve the Scheme Related Documents. It only gives its observations"],"answer":3,"explanation":"SEBI does not approve or disapprove the Scheme Related Documents, it gives its observations. The mutual fund needs to incorporate these observations in these documents. Thus, the documents in the market are “vetted” by SEBI, and not approved by SEBI.","answer_source":"explicit"},{"n":61,"q":"______ is an example of physical asset.","options":["Bank Deposit","Shares and Debentures","Land and Building","Futures and Options"],"answer":2,"explanation":"Land and buildings are physical property. Shares, Debentures, Bank Deposits, F&O are all financial assets/instruments.","answer_source":"explicit"},{"n":62,"q":"Mohit needs Rs. 2,00,000 in 5 years from now. The interest rate is 7%. The amount required today to be invested can be calculated by using the formula ______ .","options":["200000 / (1+0.07)^5","200000 * (1- 0.07)^5","200000 / (1+0.07)*5","200000 * (1+0.07)*5"],"answer":0,"explanation":"The formula for calculating the Future Value of an investment made today is FV = PV * (1 + r) ^ n Where FV is the future value ; PV is the present value ; r is the rate of inflation or interest rate ; n is the number of years Thus the formula for Present value will be PV = FV / (1 + r) ^ n Subsituting the above numbers : PV = 2,00,000 / (1+0.07)^ 5","answer_source":"manual"},{"n":63,"q":"SEBI has regulations pertaining to restrictions on the investment policies of mutual fund schemes for ensuring that _____ .","options":["The mutual scheme can improve their ratings over a period of time","The scheme returns are better than the benchmark returns","The scheme returns are better than the Nifty/Sensex","The mutual fund scheme has a minimum diversification as per the requirements"],"answer":3,"explanation":"The investors have no control, over the investment management of the mutual fund. It is in this context that SEBI has laid down regulations pertaining to investment universe, restrictions and portfolio diversification for investment by mutual fund schemes. Such regulations intend to control the risks taken by the mutual fund managers.","answer_source":"explicit"},{"n":64,"q":"Which exam has to be cleared to get the Employee Unique Identification Number (EUIN) from AMFI?","options":["SEBI - VA Mutual Fund Distributors Certification Examination","AMFI - VA Mutual Fund Distributors Certification Examination","NISM - VA Mutual Fund Distributors Certification Examination","NISM - VB Mutual Fund Distributors Certification Foundation"],"answer":2,"explanation":"Institutions that are into the distribution of mutual funds need to register with AMFI. The employees of these institutions need to clear the NISM Series V-A: Mutual Fund Distributors Certification Examination and obtain an Employee Unique Identification Number (EUIN) from AMFI.","answer_source":"explicit"},{"n":65,"q":"In the usual course of events, a fund manager will have to provide the maximum liquid assets for _______ .","options":["Gold ETFs","Equity ETFs","Close-end fund","Open-end fund"],"answer":3,"explanation":"ETFs and Close-end funds are listed on the stock exchanges and investors can sell their units their. They need not give redemption request to the AMCs. So, the fund manager need not maintain liquid funds for Close-end funds and ETFs. In an open-end fund, investors can buy or redeem units directly from the fund at any time. Therefore, the fund manager needs to maintain higher liquid assets/cash to meet frequent redemption requests. Hence, maximum liquidity is normally required for an Open-end fund.","answer_source":"explicit"},{"n":66,"q":"_______ can be used in lieu of Income distribution cum capital withdrawal pay-outs.","options":["Systematic Investment Plan","Systematic Transfer Plan","Systematic Withdrawal Plan","All of the above"],"answer":2,"explanation":"The Income distribution cum capital withdrawal (dividend) pay-out option is for investors wanting a regular income. Systematic Withdrawal Plan(SWP) is a facility which allows an investor to withdraw a fixed amount at pre-determined intervals. Therefore an Income distribution cum capital withdrawal (dividend) pay-out option is similar to SWP. The difference is that the dividend is paid only when the fund has a surplus amount and in SWP the amount is compulsarily paid. (The dividend pay-out plan is renamed as pay-out of income distribution cum capital withdrawal, dividend re-investment plan is renamed as reinvestment of income distribution cum capital withdrawal option followed by renaming of dividend transfer plan to transfer of income distribution cum capital withdrawal plan)","answer_source":"explicit"},{"n":67,"q":"Which of these expenses can be charged to a mutual fund scheme by the AMC?","options":["Rent for registered office of the mutual fund","Salaries of fund management team","General administration expenses of the AMC","Fees of custodians and fund administrators"],"answer":3,"explanation":"As per SEBI regulations, Asset Management Companies (AMCs) can charge certain expenses to a mutual fund scheme, but they must be directly related to the management and operation of the fund. Custodian and fund administrator fees are essential expenses for managing the fund’s assets and ensuring compliance with regulatory requirements. Rent for the registered office, salaries of the fund management team, and general administration expenses of the AMC are not directly attributable to a specific mutual fund scheme and must be borne by the AMC itself.","answer_source":"explicit"},{"n":68,"q":"As per the Advertisement Guidelines for Mutual Funds, Point-to-point returns on a standard investment of Rs. 10,000 shall also be shown in addition to CAGR for a scheme which has been for existence _______ .","options":["More than 5 years","More than 3 years","More than 2 years","Irrespective of years of existence, all mutual fund schemes must show the point to point returns"],"answer":1,"explanation":"As per the SEBI Advertisement Guidelines for Mutual Funds, when the mutual fund scheme has been in existence for more than THREE years : - Performance advertisement of mutual fund schemes shall be provided in terms of CAGR for the past 1 year, 3 years, 5 years and since inception. - Point-to-point returns on a standard investment of Rs. 10,000 shall also be shown in addition to CAGR for the scheme to provide ease of understanding to retail investors.","answer_source":"explicit"},{"n":69,"q":"Which of the following is INCORRECT with respect to advertisements of Mutual Funds by AMCs.","options":["The advertisements can use celebrities for endorsements","The advertisements can show past performance of the scheme","The advertisements can show the return numbers","All of the above are incorrect"],"answer":0,"explanation":"As per SEBI guidelines, mutual fund advertisements cannot use celebrities for endorsements. The aim is to ensure that investment decisions are based on the merits of the scheme and not influenced by the popularity of a celebrity. (Note - AMFI can use celebrities to promote mutual funds investment like it does with the tag line 'Mutual Funds Sahi Hai' but individual mutual funds cannot use celebrities)","answer_source":"manual"},{"n":70,"q":"Ms. Priya redeems 2000 units at an NAV of Rs 13. If the exit load is 1 percent, what is the redemption value of the investment?","options":["Rs. 25500","Rs. 26000","Rs. 25740","Rs. 26250"],"answer":2,"explanation":"Ms. Priya redeems 2000 units at an NAV of Rs 13 = 2000 x 13 = 26000 Exit load at 1% of 26000 = 260 Redemption value = 26000 - 260 = Rs. 25740 Q 1. Which of the following correctly explains the difference between the Sharpe Ratio and the Treynor Ratio? Sharpe Ratio is meant for schemes that outperform benchmarks, while Treynor Ratio applies to underperforming funds The Sharpe Ratio measures risk using Standard Deviation, while the Treynor Ratio uses Beta as the risk metric Both ratios are exactly the same and serve the same purpose None of the above WRONG ANSWER CORRECT ANSWER: The Sharpe Ratio measures risk using Standard Deviation, while the Treynor Ratio uses Beta as the risk metric Explanation: Both Sharpe Ratio and Treynor Ratio measure a fund's risk-adjusted return — i.e., how much excess return the fund generates over the risk-free rate per unit of risk. However, the key difference lies in how they define and measure \"risk.\" Sharpe Ratio uses Standard Deviation as the risk measure — which captures the fund's total risk (both systematic + unsystematic risk). It is ideal for evaluating a standalone/concentrated portfolio. Treynor Ratio uses Beta as the risk measure — which captures only systematic risk (market risk). It is more suitable for evaluating a well-diversified portfolio where unsystematic risk has already been eliminated. Q 2. Identify the mandatory scheme-related documents from the options given below: A) Key Information Memorandum (KIM) B) Fund factsheet C) Addendum D) Scheme Information Document (SID) E) Statement of Additional Information (SAI) A, B, C, D and E B, C, D and E A, B and E A, C, D and E WRONG ANSWER CORRECT ANSWER: A, C, D and E Explanation: Mandatory Scheme-Related Documents (as per SEBI/AMFI guidelines) : - Statement of Additional Information (SAI) – contains statutory information about the mutual fund, AMC, trustees, etc. - Scheme Information Document (SID) – detailed document about the specific scheme, including objectives, risks, fees, and portfolio strategy. - Key Information Memorandum (KIM) – a summarized version of SID, highlighting key facts for investors. - Addendum – issued whenever there is a change in SID/SAI/KIM; it is considered part of the mandatory documentation. Not Mandatory : - Fund Fact Sheet – this is an investor communication tool published monthly/quarterly, but it is not a statutory mandatory document under SEBI regulations. Q 3. Which of the following tools is commonly used to assess an investor’s risk appetite? Risk aggregators Risk profilers Asset allocators Portfolio optimizers WRONG ANSWER CORRECT ANSWER: Risk profilers Explanation: Risk appetite means the level of risk an investor is willing to take. It is assessed using risk profilers, which ask questions about income, goals, investment horizon, and comfort with market fluctuations. Based on the answers, the investor is categorized as conservative, moderate, or aggressive. This helps in selecting suitable mutual fund schemes. Q 4. A sum of Rs.5,00,000 was invested by an investor in a 370-day FMP scheme, and the maturity value received was Rs. 5,36,400 . Calculate the capital gain in rupees. Rs. 36400 Rs. 34750 Rs. 32500 Complete data not available CORRECT ANSWER Explanation: Capital gain means the profit earned on the investment. Capital Gain = Maturity Amount − Investment Amount 5,36,400 – 5,00,000 = 36,400 So, the investor earned a profit of Rs. 36,400 on the FMP investment. The number of days (370 days) does not change the capital gain amount in this question. Q 5. Identify the true statement from the options below: A) Expense ratios play a more important role in evaluating debt mutual fund schemes compared to equity schemes B) A fund that has performed well over the long term will necessarily continue to provide higher returns in the future C) An ultra short-term debt fund will always invest only in high credit quality instruments Statement A only Statement B only Statement C only All are true CORRECT ANSWER Explanation: Expense ratio is very important in debt mutual funds because debt funds generally generate moderate returns. A higher expense ratio can significantly reduce the investor’s final return. Statement B is false because past performance does not guarantee future returns. Statement C is also false as there is no mandatory rule that ultra short duration funds must invest only in high credit quality instruments. The fund manager has discretion on credit quality. Q 6. Which of the following strategies helps in ensuring the suitability of a mutual fund scheme to an investor’s needs and circumstances? Asset allocation Tax harvesting Dividend stripping Indexation CORRECT ANSWER Explanation: Asset Allocation is the strategy of spreading investments across different asset classes — such as equity, debt, gold, and cash — based on the investor's age, risk appetite, financial goals, and investment horizon. It ensures that the right mix of schemes is chosen that truly suits the investor's personal situation. It helps ensure that the mutual fund investment suits the investor’s financial situation and risk appetite. A proper asset allocation strategy balances risk and return. Q 7. Which of the following correctly describes a mutual fund unit holder? A shareholder in the Asset Management Company (AMC) A depositor in the mutual fund A shareholder of the trustee company A beneficial owner of the assets held by the fund WRONG ANSWER CORRECT ANSWER: A beneficial owner of the assets held by the fund Explanation: When an investor puts money into a mutual fund, they receive units in return. These units represent their proportionate ownership in the pool of assets held by the fund. The investor is therefore called a \"Beneficial Owner\" — meaning they enjoy the economic benefits (returns, dividends, appreciation) of the underlying assets without directly holding those assets in their name. Q 8. State whether the following statement is correct: 'In the Income Distribution cum Capital Withdrawal (IDCW) reinvestment option, investments appreciate more quickly than in the growth option because investors receive extra units.' Determined by whether the scheme is open-ended or closed-ended False for all fund categories Correct for all fund categories Correct only for equity-oriented schemes WRONG ANSWER CORRECT ANSWER: False for all fund categories Explanation: This is a very common misconception among investors. Many people think that the IDCW Reinvestment option grows faster because you get \"extra units.\" However, this is NOT true : When an IDCW (dividend) is declared, the NAV of the fund drops by exactly the dividend amount before reinvestment. The additional units you receive are bought at this lower NAV. So the total value of your investment remains the same — you just have more units at a lower NAV. In other words : In the IDCW reinvestment option, the distributed amount is used to buy additional units, but the NAV falls to the extent of the IDCW paid. Therefore, IDCW reinvestment does not grow faster simply because additional units are allotted. Q 9. Identify the statement that is NOT TRUE about the Key Information Memorandum (KIM). KIM contains merely the names of the sponsor, trust, and AMC without explaining their roles KIM needs to be issued only if an investor requests for it KIM serves as an abridged form of scheme information documents KIM is attached with every mutual fund application form WRONG ANSWER CORRECT ANSWER: KIM needs to be issued only if an investor requests for it Explanation: The Key Information Memorandum (KIM) is a short summary of the Scheme Information Document (SID). It is mandatory to attach the KIM with every mutual fund application form so investors can understand the scheme before investing. It includes details about the AMC, sponsor, trustee, and their functions. Therefore, it is not given only on request — it must be provided to all investors. Q 10. When an investor applies for mutual fund units in dematerialised form, where will the allotted units be credited? A newly opened Demat account with a depository tied up with the mutual fund The investor’s Demat account mentioned in the application form A newly created Demat account linked to the mutual fund’s Demat account Any of the above options WRONG ANSWER CORRECT ANSWER: The investor’s Demat account mentioned in the application form Explanation: When an investor applies for mutual fund units in dematerialised form, the units are credited directly to the investor’s own Demat account. The Demat account details must be provided in the application form. No new Demat account is opened by the mutual fund or depository for this purpose. Hence, the units are credited to the existing Demat account mentioned by the investor. Q 11. An international fund of fund is required to invest at least what percentage of its total assets in the underlying fund ? 95% 50% 80% 65% CORRECT ANSWER Explanation: An International Fund of Fund (FoF) mainly invests in units of an overseas mutual fund or scheme. As per SEBI regulations, such funds must invest at least 95% of their total assets in the underlying overseas fund. This ensures the scheme truly reflects international exposure. Q 12. A mutual fund scheme pools funds primarily from investors who have : Similar investment objectives Similar surplus funds for investment Investors belonging to the same geographical region Similar levels of investment capital CORRECT ANSWER Explanation: A mutual fund scheme pools money from a large number of investors who share a common investment objective For example, some investors may want long-term capital growth, some may want regular income, and some may want capital safety. Each type of investor chooses a fund that matches their goal (objective). Q 13. Identify the true statement related to benchmarking of Gold Exchange Traded Funds (ETFs). CRISIL Gilt Fund Index serves as a benchmark for Gold ETFs Gold prices are generally used as the benchmark for Gold ETFs Benchmarking is not possible for Gold ETFs Gold ETFs do not require any benchmark WRONG ANSWER CORRECT ANSWER: Gold prices are generally used as the benchmark for Gold ETFs Explanation: Gold ETFs invest primarily in physical gold, so their performance is expected to closely reflect the movement in gold prices. Therefore, the most appropriate benchmark for a Gold ETF is the price of gold itself. Q 14. An asset management company cannot recover which of the following expenses from a mutual fund scheme? Expenditure on mandatory statutory advertisements Costs incurred for investor communications Interest paid due to delayed redemption payouts Expenses related to marketing and sales activities WRONG ANSWER CORRECT ANSWER: Interest paid due to delayed redemption payouts Explanation: An Asset Management Company (AMC) can charge certain operating expenses to a mutual fund scheme such as marketing expenses, statutory advertisement costs and investor communication expenses, because these are part of running and managing the scheme. However, if the AMC delays redemption payments beyond the allowed timeline, the interest penalty for that delay must be borne by the AMC itself and not by the mutual fund scheme or investors. This rule protects investors from suffering due to operational inefficiency or mistakes made by the AMC. Q 15. What is the risk known as which arises out of the mis-pricing or improper valuation of derivative contracts? Credit Risk Basis Risk Model Risk Duration Risk WRONG ANSWER CORRECT ANSWER: Model Risk Explanation: Model risk arises when the pricing or valuation model used for derivatives is incorrect or inappropriate. If the derivative contract is wrongly valued, it can lead to losses for investors or the fund. This risk is especially important in complex financial instruments. Therefore, mis-pricing or improper valuation of derivatives is called model risk. Q 16. An Indian international fund is investing in US stocks. What would be the impact on it if US Dollar appreciates against the Indian Rupee? No impact on the fund as its investing in stocks and not currency The NAV of the scheme in Indian Rupees will appreciate The NAV of the scheme in Indian Rupees will depreciate WRONG ANSWER CORRECT ANSWER: The NAV of the scheme in Indian Rupees will appreciate Explanation: An Indian international mutual fund investing in US stocks is exposed to two things: Performance of the US stocks and Currency movement (USD/INR). So when the US Dollar appreciates against the Indian Rupee: 1. The value of the US assets, when converted into INR, becomes higher 2. Therefore, the NAV of the fund in INR increases, even if the underlying US stocks remain flat. Example : Suppose the fund owns 1,000 US Dollars worth of US stocks. If USD/INR = Rs. 80 then value in INR = Rs. 80,000 If USD/INR rises to Rs. 85 then value in INR = Rs. 85,000 Even if the US stock values remain the same, the NAV rises due to currency appreciation. Q 17. Identify the information which is NOT included in the Statement of Additional Information (SAI) ? Tax, Legal & General Information Current SIP returns of the mutual fund schemes Investment Valuation Norms Rights of Unit-holders WRONG ANSWER CORRECT ANSWER: Current SIP returns of the mutual fund schemes Explanation: Statement of Additional Information (SAI), which has statutory information about the mutual fund or AMC, that is offering the scheme like the Constituents of the mutual fund, Rights of Unit-holders, Investment Valuation Norms, Rights of Unit-holders etc. Latest SIP returns are dynamic performance data that change regularly and are scheme-specific — so they are disclosed through Factsheets or the AMFI website, not in the SAI. Q 18. Non resident Indian (NRI) applications should be accompanied by cheque drawn on _______ for repatriable investments. NRE Account only NRO Account only NRE and NRO Account only Local Account CORRECT ANSWER Explanation: Non resident Indian (NRI) / Person of Indian Origin (PIO) residents abroad have the facility of investing on a repatriable basis i.e., when they sell their investments, the sale proceeds can be transferred abroad. Alternatively, they can invest on a non-repatriable basis, in which case the proceeds from the sale of those investments cannot be remitted abroad. NRI/PIO applications need to be accompanied by a cheque drawn on an NRO/NRE account (for non-repatriable investment) or NRE account (for repatriable investment). Q 19. Identify the CORRECT statement/s. A mutual fund unit holder can approach the court of law for a matter which was fairly and transparently stated in the Scheme Documents, but he wasn't aware of it A mutual fund unit holder can approach the court of law for a provision of law, which was fairly and transparently stated in the Scheme Documents, but he wasn't aware of it Both of the above None of the above WRONG ANSWER CORRECT ANSWER: None of the above Explanation: The principle of caveat emptor (LET THE BUYER BEWARE) applies to mutual fund investments. So, the unit-holder cannot seek legal protection on the grounds of not being aware, especially when it comes to the provisions of law and matters fairly and transparently stated in the Scheme Documents. Q 20. As per the fair valuation principles laid out by SEBI, it is mandatory to disclose the valuation policy in ______. Statement of Additional Information Statement of Accounts sent to investors periodically Fund fact sheet The fair valuation principles are not to be put in public CORRECT ANSWER Explanation: Disclosure of the valuation policy and procedures approved by the Board of the asset management company shall be made in Statement of Additional Information. Q 21. A mutual fund scheme mentions that it will invest not more than 10% of its assets in the money market. This is considered to be the scheme's ________ . Investment Policy Investment Objective Stock Market Policy Risk Profile CORRECT ANSWER Explanation: The Investment Policy of mutual fund scheme includes the scheme’s asset allocation and investment style. A mutual fund scheme with the objective of providing liquidity would invest in money market instruments or in debt papers of very short-term maturity. At the same time, a mutual fund scheme that aims to generate capital appreciation over long periods would invest in equity shares. This would reflect in the scheme’s asset allocation, which would be disclosed in the Scheme Information Document (SID). Q 22. In a Large Cap mutual fund scheme, the minimum investment limit in equity and equity related instruments of large cap companies is ______ . 90% 80% 70% 60% WRONG ANSWER CORRECT ANSWER: 80% Explanation: A Large Cap Fund is an open-ended equity scheme predominantly investing in large cap stocks. As per SEBI rules on asset allocation, the minimum investment in equity and equity related instruments of large cap companies shall be 80 percent of total assets. Q 23. Which entity processes the purchase and redemption transactions of investors of an open-ended fund ? The Custodian The Broker / Mutual Fund Agent AMFI The R & T Agent WRONG ANSWER CORRECT ANSWER: The R & T Agent Explanation: The Registrar and Transfer Agency (RTA) maintains investor records as well as allots or redeems units, processes purchase/redemption/switch requests, dividends, etc. It also generates the account statement that an investor receives. Q 24. Which of these authorities uses the information collected under FATCA? Foreign Government Indian Government Indian Tax Authorities All of the above WRONG ANSWER CORRECT ANSWER: All of the above Explanation: To comply with the requirements of Foreign Account Tax Compliance Act (FATCA) and Common Reporting Standards (CRS) provisions, financial institutions, including mutual funds, are required to undertake due diligence process to identify foreign reportable accounts and collect such information as required under the said provisions and report the same to the US Internal Revenue Service/any other foreign government or to the Indian Govt / Tax Authorities for onward transmission to the concerned foreign authorities. Q 25. The investment in equity and equity related instruments is between _________ in a Balanced Hybrid Fund. Between 65 percent and 80 percent of total assets Between 50 percent and 75 percent of total assets Between 40 percent and 60 percent of total assets Between 10 percent and 25 percent of total assets WRONG ANSWER CORRECT ANSWER: Between 40 percent and 60 percent of total assets Explanation: Balanced Hybrid Fund: An open-ended balanced scheme investing in equity and debt instruments. The investment in equity and equity related instruments shall be between 40 percent and 60 percent of total assets while investment. In Conservative Hybrid Fund, its between10 percent and 25 percent of total assets. In Aggressive Hybrid Fund, its between 65 percent and 80 percent of total assets. Q 26. Which of these is NOT included in the Statement of Account issued by a mutual fund? The Unit Balance The NAV at the time of issue of the statement All the transactions done during the period of the statement The securities in which the money was invested WRONG ANSWER CORRECT ANSWER: The securities in which the money was invested Explanation: Mutual funds issue the Statement of Account and this shows for each transaction (sale/re-purchase) during that period, the value of the transaction, the relevant NAV and the number of units transacted. Besides, it also provides the closing balance of units held in that folio and the value of those units based on the latest NAV. It does not show in which stocks / debt etc. the money is invested. Q 27. What is the regulatory requirement with respect to a change in the controlling interest in an AMC ? The unitholders have to be given the option to exit A minimum of 50% of the unitholders have to approve the change in controlling interest The trustees have to give the unitholders the option to wind-up the scheme All of the above CORRECT ANSWER Explanation: A change in the control of the AMC directly or indirectly can be made only with the prior approval of the trustees and SEBI. A written communication about the change in the control of the AMC is sent to each unitholder and an advertisement is given. The unitholders are given the option to exit on the prevailing Net Asset Value (NAV) without any exit load within a time period not less than 30 calendar days from the date of communication. Q 28. No redemption or subscription is allowed in a Segregated Portfolio - State whether True or False? True False CORRECT ANSWER Explanation: “Segregated portfolio” means a portfolio, comprising of debt or money market instrument affected by a credit event, that has been segregated in a mutual fund scheme. No redemption or subscription is allowed in the segregated portfolio. However, in order to facilitate exit to unitholders in segregated portfolio, AMC shall enable listing of units of segregated portfolio on the recognized stock exchange. Q 29. A Certificate of Deposit issued by a bank will be for ________ . 3 days to 2 Years 7 days to 1 Year 45 days 3 years WRONG ANSWER CORRECT ANSWER: 7 days to 1 Year Explanation: A Certificate of Deposit is a fixed-income financial tool that is governed by the Reserve Bank of India and is issued in a dematerialized form. It is a type of agreement made between the depositors and the banks, wherein the bank pays an interest on your investment. Certificates of Deposit are issued by Banks (for 7 days to 1 year) or by Financial Institutions (for 1 to 3 years). Q 30. Identify the TRUE statement with respect to Trustees of mutual funds. The Trustees can legally change the Asset Management Company (AMC) The Asset Management Company (AMC) appoints the Trustees The Trustees appoint the Sponsors of the Asset Management Company (AMC) The Trustees have to approve the appointment of the distributors of its mutual fund schemes CORRECT ANSWER Explanation: The Trustees act as the guardians of the mutual fund and are responsible for protecting the interests of the investors. They supervise the functioning of the Asset Management Company (AMC) and ensure that it complies with SEBI regulations. If the AMC fails to perform its duties properly or acts against the interests of unit holders, the Trustees have the legal authority to replace it. However, the Trustees are not appointed by the AMC and do not approve the appointment of distributors, as these responsibilities lie with the Sponsor and the AMC. The Sponsor is the entity that establishes the mutual fund. It is the Sponsor who appoints the Trustees, not the other way around. Q 31. Identify which of these are Non-Financial transactions? A) Transmission B) Nomination C) Pledge D) Switch Transmission, Nomination, Switch Transmission, Nomination, Pledge Transmission, Pledge, Switch Nomination, Pledge, Switch WRONG ANSWER CORRECT ANSWER: Transmission, Nomination, Pledge Explanation: Pledge of units. Nomination and Transmission are Non Financial transactions in a mutual fund. A Switch is redemption from one scheme and a purchase into another, combined into one transaction and is a financial transaction. Q 32. How will an application to subscribe mutual fund units be treated if an AMFI Registration Number (ARN) is mentioned in the application form and the choice of Regular Plan is indicated ? It will be treated as an incomplete application and rejected It will be treated as a regular plan application It will be treated as an incomplete application and returned for completion It will be treated as a direct plan application WRONG ANSWER CORRECT ANSWER: It will be treated as a regular plan application Explanation: If investment (purchase/repurchase) is routed through a distributor, then it is considered that one has chosen to invest in the Regular Plan. Mutual Fund distributors shall quote a valid ARN and EUIN in the client’s application / transaction feed, in order to place transactions in Regular Plan and receive commissions. Q 33. The NAV which is applicable for processing an investor transaction depends on whether the transaction is received within the _________ . Asset Management Company's office timings R&T Agents office timings Stock Markets timing Cut-off time for the scheme WRONG ANSWER CORRECT ANSWER: Cut-off time for the scheme Explanation: The sale and re-purchase prices are a function of the applicable NAV for the transaction. The applicable NAV depends on the cut-off time prescribed for the particular type of scheme and the transaction value. Q 34. The additional Total Expense Ratio (TER) charged has to be credited back to the Mutual Fund scheme if the inflows from beyond the top 30 cities are redeemed within a period of 1 year from the date of investment. State whether True or False? True False CORRECT ANSWER Explanation: Mutual funds are allowed to charge an additional TER for inflows from cities beyond the top 30 (B-30 cities). However, if such investments are redeemed within one year, the extra TER collected must be credited back to the scheme. This ensures that investors from B-30 cities are encouraged to stay invested longer. Q 35. A mutual fund scheme shall not invest more than 10 percent of its total NAV in debt instruments. This rule is not applicable for which type of debt instrument? Triparty repo on Government securities Treasury Bills Government Securities All of the above WRONG ANSWER CORRECT ANSWER: All of the above Explanation: Restrictions pertaining to investment in Debt Securities: A mutual fund scheme shall not invest more than 10 percent of its total NAV in debt instruments comprising money market instruments and non-money market instruments issued by a single issuer which are rated not below investment grade by a credit rating agency authorized to carry out such activity under the Act. However such limit shall not be applicable for investments in Government Securities, Treasury bills and Triparty repo on Government securities or treasury bills. Q 36. In the Mutual Fund industry - every AMC gives an ARN code number to the mutual fund distributor which is to be renewed every three years - True or False? True - this is as per SEBI rules False - AMFI issues the ARN code number. WRONG ANSWER CORRECT ANSWER: False - AMFI issues the ARN code number. Explanation: The ARN code is given by the Association of Mutual Funds in India (AMFI) and not by the AMC. After obtaining the NISM VA certification and completing KYD requirements, one has to register with AMFI. On registration, AMFI allots an AMFI Registration Number (ARN). Q 37. No investor can have a holding of more than 25 percent of a scheme - State True or False? True False CORRECT ANSWER Explanation: As per SEBI’s 20/25 Rule for mutual funds: A mutual fund scheme must have at least 20 investors. No single investor can hold more than 25% of the scheme’s corpus. Q 38. Long-term capital gains will be taxed after adjusting for _______ , if any. long-term capital loss only short-term capital loss only both long-term and short-term capital loss WRONG ANSWER CORRECT ANSWER: both long-term and short-term capital loss Explanation: As per Income Tax Act : 1. Short term capital loss is to be set off against short term capital gain or long- term capital gain 2. Long term capital loss can only be set off against long term capital gain. 3. Capital loss, short term or long term, cannot be set off against any other head of income (e.g., salaries). Thus, as per points 1 and 2, Long term capital gains will be taxed after adjusting for both long term and short term capital loss. Q 39. The sponsor of a mutual fund can be compared to the Chief Executive of a company - State True or False? True False WRONG ANSWER CORRECT ANSWER: False Explanation: The sponsor of a mutual fund is similar to a promoter of a company, as it sets up the mutual fund and appoints the trustees and the Asset Management Company (AMC). The Chief Executive role is performed by the AMC, not the sponsor. Q 40. Identify the TRUE statement/s - A. Time stamping is relevant only for Financial transactions and not for Non-Financial transactions B. Time stamping is relevant for both Financial and Non-Financial transactions Only A is true Only B is true Both A and B are true CORRECT ANSWER Explanation: Time stamping for financial transactions like purchase and redemptions etc. is very crucial as it determines the NAV at which the transaction will take place. Time stamping for non-financial transactions like the change of address, investor’s acknowledgement etc. is not crucial. Only date stamping is important for such non-financial transactions. Q 41. Key Information Memorandum (KIM) and Scheme Information Document (SID) are two broad types of scheme documents - State whether True or False? True False WRONG ANSWER CORRECT ANSWER: False Explanation: Scheme Information Document (SID) and Statement of Additional Information (SAI) are primarily the two important documents. Key Information Memorandum (KIM) is a summary of SID and SAI. Q 42. _______ will help the investors understand the suitability of a mutual fund scheme to them. Product Label Standard Deviation / Beta Tracking Error Alpha of the scheme CORRECT ANSWER Explanation: The risk levels in different categories of mutual fund schemes can be understood with the help of product labelling of Mutual Funds. SEBI had introduced product labelling of mutual funds to address the issue of mis-selling and to provide investors an easy understanding of the kind of product/scheme they are investing in and its suitability to them. All the mutual funds were required to ‘Label’ their schemes on the parameters such as - Nature of scheme, Investment objective, Level of risk depicted by colour code boxes etc. Q 43. Redemption proceeds has to be paid to the mutual fund unit holders within the time specified by _____ from time to time. AMFI SEBI Registrar of Companies Ministry of Finance WRONG ANSWER CORRECT ANSWER: SEBI Explanation: The applicable redemption guidelines for mutual funds are set out in SEBI (Mutual Funds) Regulations, 1996 and as amended from time to time. Q 44. Who has to ensures the compliance of the information contained in the scheme related documents with regulations? The Sponsors The Asset Management Company SEBI The Trustees WRONG ANSWER CORRECT ANSWER: The Trustees Explanation: A Compliance Officer signs a due-diligence certificate to the effect that all regulations have been complied with, and that all the intermediaries mentioned in the scheme related documents have the requisite statutory registrations and approvals. The Compliance Officer works closely with the Trustees on various compliance and regulatory issues. It is the responsibility of the compliance officer to report any issue of non-compliance directly and immediately to the trustees. Q 45. In case of an Index Fund, the minimum investment in securities of a particular index (which is being replicated/ tracked) shall be ________ . 80% of the total assets 85% of the total assets 90% of the total assets 95% of the total assets WRONG ANSWER CORRECT ANSWER: 95% of the total assets Explanation: Index Funds are open-ended scheme replicating/tracking a specific index. The minimum investment in securities of a particular index (which is being replicated/ tracked) shall be 95 percent of total assets. Q 46. Identify the TRUE statement/s : 1. The Beta of a diversified stock index is greater than 1 2. An investment with a beta of 0.8 will move 8 percent when markets move by 10% 3. Beta as a measure of risk is relevant only for equity schemes. Only 1 and 2 are true Only 2 and 3 are true Only 1 and 3 are true All 1, 2 and 3 are true WRONG ANSWER CORRECT ANSWER: Only 2 and 3 are true Explanation: Beta measures the fluctuation in periodic returns in a scheme, as compared to fluctuation in periodic returns of a diversified stock index (representing the market) over the same period. The diversified stock index, by definition, has a Beta of 1. Companies or schemes, whose beta is more than 1, are seen as riskier than the market. Beta less than 1 is indicative of a company or scheme that is less risky than the market. An investment with a beta of 0.8 will move 8 percent when markets move by 10 percent. This applies to increase as well as fall in values. An investment with a beta of 1.2 will move by 12 percent both on the upside and downside when markets move (up/down) by 10 percent. Beta as a measure of risk is relevant only for equity schemes. Q 47. Which of the following have the highest credit risk? Money Market Fund Junk Bond G-Sec Fund Income Fund WRONG ANSWER CORRECT ANSWER: Junk Bond Explanation: Junk bonds are a type of bond that carries a higher risk of default. The issuer of such bonds may not have the adequate cash flow to pay regular interest or repay the principal amount to the bondholders at the time of maturity. The bonds issued by financially struggling companies are termed junk bonds but they pay higher returns to make them attractive to investors. Q 48. Identify the information which is NOT included in the Statement of Additional Information (SAI). Rights of Unit-holders Transmission procedure SIP returns of the schemes Investment Valuation Norms WRONG ANSWER CORRECT ANSWER: SIP returns of the schemes Explanation: Statement of Additional Information (SAI), which has statutory information about the mutual fund or AMC, that is offering the scheme like the Constituents of the mutual fund, Rights of Unit-holders, Investment Valuation Norms, Rights of Unit-holders etc. It does not contain information on scheme returns etc. This information is available in the Mutual Fund Fact Sheet. Q 49. An Addendum has to be issued for changes in _______ . Fund Fact Sheet Half yearly results of the mutual fund Scheme Information Document (SID) Statement of Additional Information (SAI) WRONG ANSWER CORRECT ANSWER: Scheme Information Document (SID) Explanation: Any changes in the fundamental attributes of a mutual fund scheme require an Addendum to the SID. This ensures that investors are formally notified of modifications in scheme details such as investment objectives, asset allocation, or risk factors. Q 50. Identify the INCORRECT statement/s with respect to investments in real estate. The minimum amount required (Ticket size) for investing in real estate is high compared to other financial assets The transaction costs are low for investments in real estate as compared to other financial assets The real estate market is quiet illiquid and the pricing is not transparent All of the above are incorrect WRONG ANSWER CORRECT ANSWER: The transaction costs are low for investments in real estate as compared to other financial assets Explanation: Transaction costs, in the form of stamp duty, registration fees, brokerage etc. are high in real estate transactions. Therefore the statement - 'The transaction costs are low for investments in real estate as compared to other financial assets' is incorrect. Real estate is a less liquid asset class. The intermediation chain of real estate agents is largely unorganized in India. . Regulatory risk is high in real estate, as is the risk of litigation and other encumbrances. The transparency level is low even among the real estate development and construction companies. Q 51. The portfolio of a fund of funds consists of ______ . Equity securities only Debt securities only Units of other mutual fund schemes Money market securities only WRONG ANSWER CORRECT ANSWER: Units of other mutual fund schemes Explanation: A ‘Fund Of Funds’ (FOF) is an investment strategy of holding a portfolio of other investment funds rather than investing directly in stocks, bonds or other securities. An FOF Scheme of a primarily invests in the units of another Mutual Fund scheme. Q 52. Which of the following is true for unclaimed dividend in mutual fund schemes? Asset Management Company is expected to make a continuous effort to remind the investors to claim their dues The responsibility for ensuring that the dues are claimed lies with the distributor in a dividend plan The responsibility for ensuring that the dues are claimed lies solely with the investor CORRECT ANSWER Explanation: AMC is expected to make a continuous effort to remind the investors through letters to claim their dues. The Annual Report has to mention the unclaimed amount and the number of such investors for each scheme. Q 53. Identify the TRUE statements with respect to measuring returns for mutual fund schemes. 1. The returns published in a mutual fund advertisement should factor the entry or exit load 2. Compounded Annual Growth Rate (CAGR) is the accepted standard of showing returns for investment of holding period of more than one year 3. Simple returns can be calculated by the formula :(Sale price – Cost price) / Cost price x 100 Only 1 and 2 are true Only 2 and 3 are true Only 1 and 3 are true All 1, 2 and 3 are true WRONG ANSWER CORRECT ANSWER: Only 2 and 3 are true Explanation: Statement 1 is false because - the returns published in a mutual fund advertisement would be without factoring the entry or exit load. Statement 2 is true because - CAGR is the standard way to present returns for an investment held for more than one year, as it annualizes the return. Statement 3 is true because -The Simple Return is calculated with the following formula : (Sale price – Cost price) / Cost price x 100 Q 54. Ms. Apeksha invests Rs 2 crore in a Gilt scheme at 2 pm with a local cheque. What would be the applicable NAV for allotment of units? Closing NAV of date of application Closing NAV of next business day Closing NAV of day immediately preceding the date of application NAV of the business day on which the funds are available for utilization WRONG ANSWER CORRECT ANSWER: NAV of the business day on which the funds are available for utilization Explanation: For large investments of Rs. 2 Lakhs and above, SEBI has a special rule — the cut-off time (3:00 PM) does NOT matter! What matters is when the money actually reaches the AMC's bank account and is realised. The applicable NAV depends on when the funds are actually available for utilization by the mutual fund. Since the investor invested Rs.2 crore at 2 PM, the same-day NAV may not apply unless funds are credited and available before the cut-off rules. Therefore, the investor gets the NAV of the day when the funds become available for use. Q 55. Ms Shweta purchases through a distributor 5000 units of a mutual fund scheme at a NAV of Rs 30. The current NAV of the scheme is Rs 28. What will be the trail commission for today if the trail commission rate is 1% per annum Rs. 13.8356 Rs. 7.2256 Rs. 26.7463 Rs. 3.8356 WRONG ANSWER CORRECT ANSWER: Rs. 3.8356 Explanation: Trail commission is always calculated on the current NAV. The current total value of investments in the above question is Rs. 28 X 5000 units = Rs. 1,40,000 Trail commission for the day = Current value X trail commission rate p.a./365 = 1,40,000 X 1% / 365 days = 1400 / 365 = Rs. 3.8356 Q 56. For units of Equity Linked Savings Scheme (ELSS), the lock-in period is ______ . three years from the date of original investment, even in case of subsequent purchases by SIP three years from the date of original investment for each individual unit for purchases made by SIP There is no lock-in period if tax exemption is claimed WRONG ANSWER CORRECT ANSWER: three years from the date of original investment for each individual unit for purchases made by SIP Explanation: If one is investing in ELSS through SIP then each investment would be locked-in from the date of the respective investment. The lock-in for the entire amount would not get over on completion of 3 years from the date of the first SIP instalment. Q 57. ______ is used to measure fund’s risk relative to market index. Tracking error Beta coefficient Treynor ratio Sharpe ratio WRONG ANSWER CORRECT ANSWER: Beta coefficient Explanation: Beta is a commonly used risk measure and calculates the relative volatility of a stock or Mutual Fund’s returns as against its benchmark. For example, if the Beta of a Mutual Fund scheme is 1, it means the fund moves in line with the benchmark. Likewise, say the Beta of a fund is higher than 1. Assume it is 1.5. So, if the NIFTY 50 jumps by 1%, the fund benchmarked against NIFTY 50 is likely to go up by 1.5%. Q 58. Who manages the contributions from investors and takes investment decisions in a mutual fund company? The Investors The Trustees The Asset Management Company (AMC) The Sponsors WRONG ANSWER CORRECT ANSWER: The Asset Management Company (AMC) Explanation: Fund management is the most critical function in an Asset Management Company. The main function of this team is to invest the investors’ money in line with the stated objective of the scheme and to manage the same effectively. Q 59. The __________ is used by the fund manager to communicate their views on the economy and the markets to the investors Key Information Memorandum (KIM) Statement of Additional Information (SAI) Scheme Information Document (SID) Fund Factsheet WRONG ANSWER CORRECT ANSWER: Fund Factsheet Explanation: A Fund Factsheet is like a monthly report card of a mutual fund scheme. It is published every month by the AMC and is the most investor-friendly document among all MF documents. It typically includes the fund manager's commentary on the economy, current market conditions, sector outlook, portfolio composition, top holdings, and scheme performance — making it the go-to document for anyone wanting to understand where the markets are headed and how the fund is positioned. Q 60. The equity share prices of gold mining companies can depend on : 1. The gold reserves of the company 2. The operational efficiency and management of the company 3. International prices of gold Only 1 and 2 Only 2 and 3 Only 1 and 3 All 1, 2 and 3 WRONG ANSWER CORRECT ANSWER: All 1, 2 and 3 Explanation: Profitability of gold mining companies is linked to several factors. For eg. - When gold metal price increases, gold mining companies with large reserves of gold can appreciate If there are concerns about a company’s management the share prices may see a decline irrespective of the price of gold. Q 61. Identify the FALSE statement/s : 1. A mutual fund investing across many countries will keep its benchmark index which is based on US equity markets 2. For Gold ETF, gold prices will be the ideal benchmark Only 1 is false Only 2 is false Both 1 and 2 are false CORRECT ANSWER Explanation: The benchmark would depend on where the scheme proposes to invest. Thus, a scheme seeking to invest in China might have the Shanghai Composite Index (Chinese index) as the benchmark. S&P 500 may be appropriate for a scheme that would invest largely in the US market. A scheme that seeks to invest across a number of countries, can structure a synthetic index that would be a blend of the indices relevant to the countries where it proposes to invest. Gold ETF NAVs closely track the price of gold since it reflects the value of gold held in custody for the units issued. Therefore, gold price would be the benchmark for such funds. Q 62. An Asset Management Company (AMC) can recover investment management and advisory fees on management of the unclaimed amounts, ________ . only on the actual expenses incurred in holding the funds at a maximum rate of 0.50 percent per annum as per the fee applicable on the scheme from which the redemption was made No investment management and advisory fees can be charged on unclaimed amounts WRONG ANSWER CORRECT ANSWER: at a maximum rate of 0.50 percent per annum Explanation: AMC is expected to make a continuous effort to remind the investors through letters to claim their uncliamed amounts. AMC can recover investment management and advisory fees on management of these unclaimed amounts, at a maximum rate of 0.50 percent per annum. Q 63. Identify which among the following is the first step in the sequence of creating a mutual fund product? Launching the New Fund Offer (NFO) Filing of Scheme Information Document (SID) with SEBI for observation Launch of advertising and public relations campaigns by AMC Approval of Trustees and AMC board for the new product and drafting of SID WRONG ANSWER CORRECT ANSWER: Approval of Trustees and AMC board for the new product and drafting of SID Explanation: Units in a mutual fund scheme are offered to investors for the first time by a New Fund Offer (NFO).The following are a few key steps leading to the NFO : 1. AMC decides on a scheme to take to the market. This is decided on the basis of inputs from the Chief Investment Officer (CIO) and the Chief Marketing Officer (CMO) 2. AMC prepares the Scheme Information Document (SID) for the NFO. This needs to be approved by the Trustees and the Board of Directors (BoD) of the AMC. 3. The documents are then filed with SEBI. 4. The AMC decides on a suitable timetable for the issue. launches its advertising and public relations campaigns etc 5. The Scheme Documents and Application Forms are distributed to market intermediaries, and circulated in the market so that investors can apply in the NFO. Q 64. From the below mentioned entities associated with a mutual fund, who has to mandatorily contribute to the corpus of the mutual fund? The Trustees The Custodians The Asset Management Company The Sponsors WRONG ANSWER CORRECT ANSWER: The Sponsors Explanation: The mutual fund trust is created by one or more Sponsors, who are the main persons behind the mutual fund business. The sponsor is the promoter of the mutual fund. The sponsor brings in capital and creates a mutual fund trust and sets up the AMC. The sponsor makes an application for registration of the mutual fund and contributes at least 40% of the net worth of the AMC. In other words, every MF needs a sponsor before it can commence operations. Q 65. The benchmark for a debt mutual fund scheme could be chosen on the basis of Scheme Type and Scheme Size. - State whether True or False? True False WRONG ANSWER CORRECT ANSWER: False Explanation: Scheme type and Choice of investment universe drive the choice of benchmark in debt schemes. For eg - Liquid schemes invest in securities of up to 91 days’ maturity. Therefore, a short-term money market benchmark such as NSE’s MIBOR or CRISIL Liquid Fund Index is suitable. Choice of Investment Universe Gilt funds invest only in Government securities. Therefore, indices based on Government Securities are appropriate. Debt funds that invest in a wide range of Government and Non-Government securities need to choose benchmarks that are calculated based on a diverse mix of debt securities. The size of the scheme is immaterial. Q 66. Once the mutual fund units are pledged, the unit holder/s _______ . Cannot sell the units Can sell the units but after a period of 3 months Cannot sell the units but can switch the units to another scheme Cannot do additional purchase in the same account CORRECT ANSWER Explanation: Banks, NBFCs and other financiers often lend money against the pledge of Units by the Unitholder. Once units are pledged, the Unit-holder/s cannot sell or switch out the pledged units, until the pledgee gives a written no-objection to release the pledge. Q 67. Where is the performance data for all schemes across the mutual fund industry available? The Scheme Information Document (SID) Key Information Memorandum (KIM) AMFI Website The Fund Fact Sheet WRONG ANSWER CORRECT ANSWER: AMFI Website Explanation: Each AMC is required to publish a scheme performance dashboard on its website, and update it on a regular basis. The scheme performance data is also available on the AMFI website AMFI website (www.amfiindia.com) carries the performance data of all the mutual fund schemes.This is an exhaustive resource and one can access the same for various different periods, and fund categories. Q 68. What would be the impact on an International fund investing in US stocks when the US Dollar appreciates against Indian Rupee? The NAV of the scheme in Indian Rupees will appreciate The NAV of the scheme in Indian Rupees will depreciate No impact on the fund as its investing in stocks and not currency CORRECT ANSWER Explanation: When an Indian investor invests in equities abroad, he is essentially taking two exposures: - An exposure on the international equity market. - An exposure to the exchange rate of the rupee. If the investor invests in the US, and the US Dollar becomes stronger during the period of his investment, he benefits; if the US Dollar weakens (i.e., Rupee becomes stronger), he loses or the portfolio returns will be lower. Q 69. How will the AMC /R&T agent process an application for subscribing to mutual fund units if the ARN is wrongly mentioned in it? It will be processed as a direct plan application It will be rejected as incomplete application It will be considered as an incomplete application and sent back for completion It will be treated as a regular plan subject to the error being corrected in the required time frame WRONG ANSWER CORRECT ANSWER: It will be treated as a regular plan subject to the error being corrected in the required time frame Explanation: If the wrong ARN code is mentioned in the application form, then the application will be processed as a Regular Plan. However, the AMC will contact the investor/distributor for the right ARN code within 30 calendar days of the receipt of the application form. If the error is not rectified within these 30 days, the application will be reprocessed as a direct application without charging any exit load. Q 70. Which one of these is an advantage of investing in Mutual Funds? Economies of scale Portfolio customization Choice overload All of the above CORRECT ANSWER Explanation: Large investment corpus of a mutual fund leads to various other economies of scale. For instance, costs related to investment research and office space gets spread across investors. Further, the higher transaction volume makes it possible to negotiate better terms with brokers, bankers and other service providers. Limitations of Mutual Fund - Lack of Portfolio Customization - A unitholder cannot influence what securities or investments the scheme would invest into. Choice Overload - There are multiple mutual fund schemes offered by several mutual fund houses and multiple options within those schemes which makes it difficult for investors to choose between them.","answer_source":"explicit"}]},{"category":"Equity Derivatives","set":"Set 1","count":50,"questions":[{"n":1,"q":"An exchange may launch futures and options contracts on an index only if a minimum of _____ of the stocks forming that index are eligible for derivatives trading on an individual basis.","options":["50%","60%","75%","80%"],"answer":3,"explanation":"According to SEBI guidelines: - Exchanges can launch futures and options contracts on a stock index only if at least 80% of the underlying stocks in that index are individually eligible for derivatives trading. - This ensures sufficient liquidity and minimizes risk, as the majority of the index components are actively traded in the derivatives segment.","answer_source":"explicit"},{"n":2,"q":"What types of risks do clients face when trading in exchange-traded equity futures ?","options":["Risk of unfavourable price movements leading to higher MTM margin payments","Risk related to settlement of trades","Risk of price decline due to time decay","Risk arising from counterparty default"],"answer":0,"explanation":"Unfavourable price changes leading to high MTM margin payments is the primary risk in futures. Unfavourable price movements in futures can cause your position to lose value, and these losses must be paid daily through mark-to-market (MTM) margin. If the market moves sharply against you, the MTM requirement can become very large, creating significant cash-flow pressure. This is the main financial risk for futures traders. There is no counter-party risk and settlement risk in exchange traded futures and time decay (theta) applies to options, not futures.","answer_source":"manual"},{"n":3,"q":"Under an options contract, the option holder has the _______, but not the _______, to purchase or sell the underlying asset.","options":["Right, Obligation","Obligation, Right","Duty, Claim","Claim, Duty"],"answer":0,"explanation":"In an options contract, the buyer pays a premium to obtain the right to execute the contract if it is favorable. However, the buyer is not obligated to exercise the option; they can simply let it expire. The seller (writer), on the other hand, carries the obligation if the buyer chooses to exercise.","answer_source":"manual"},{"n":4,"q":"Which of the following instruments are considered suitable and cost-effective for portfolio hedging by mutual funds and institutions?","options":["Index-based derivatives","Equity shares","Derivatives on individual stocks","Sovereign Gold Bonds"],"answer":0,"explanation":"For portfolio hedging, institutions and mutual funds often want to hedge the overall market or sector risk rather than individual stocks. Index-based derivatives allow them to efficiently hedge large portfolios in a cost-effective manner. Hedging with individual stocks or gold bonds would be less efficient and more expensive.","answer_source":"manual"},{"n":5,"q":"Who determines the contract size (lot size) in a futures contract?","options":["The contracting parties, at the time of delivery","The contracting parties, at the time of contract in
