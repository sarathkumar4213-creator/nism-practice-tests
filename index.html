itiation","The regulator, at the time of delivery of the underlying","The exchange"],"answer":3,"explanation":"In futures contracts, the contract size (lot size) is standardized so that all contracts traded on the exchange are identical. This standardization is done by the exchange, not by the regulator or by individual buyers and sellers.","answer_source":"explicit"},{"n":6,"q":"A derivatives market is best described as a market where :","options":["Commodities are bought and sold","Risk is traded","Equity shares are bought and sold","Bonds are bought and sold"],"answer":1,"explanation":"The derivatives market is primarily designed for managing and transferring risk using instruments like futures and options. Participants do not buy/sell actual shares, bonds, or physical commodities in this market; instead, they trade contracts whose value is derived from underlying assets. Thus, the core purpose of derivatives is risk transfer.","answer_source":"explicit"},{"n":7,"q":"The Beta of a portfolio is the _________ .","options":["Sum of the betas the constituent securities in that portfolio","Simple average of the beta’s of the constituent securities in that portfolio","Same as the beta of the stock with the highest market capitalization","Value weighted average of the beta’s of the constituent securities in that portfolio"],"answer":3,"explanation":"Portfolio beta is a weighted average of betas of individual stocks in the portfolio based on their investment proportion. For example, if there are four stocks in a portfolio with betas 0.5, 1.1, 1.30 and 0.90 having weights 35%, 15%, 20% and 30% respectively, the beta of this portfolio would be 0.87 ( = 0.5*0.35 +1.10*0.15 +1.30*0.20 +0.90*0.30)","answer_source":"explicit"},{"n":8,"q":"Identify the FALSE statement.","options":["For Call Options : With decrease in strike price, the premium on call increases","For Call Options : With increase in strike price, the premium on call increases","For Put Options : With increase in strike price, the premium on put increases","For Put Options : With decrease in strike price, the premium on put decreases"],"answer":1,"explanation":"Call Option Premium Behavior: A Call Option gives the buyer the right (but not the obligation) to buy an asset at a specified strike price before expiration. If the strike price decreases, the option becomes more attractive because the buyer can purchase the asset at a cheaper price. This increases the premium. (Statement 1 is TRUE) Conversely, if the strike price increases, the call option becomes less attractive, reducing the premium. (Statement 2 is FALSE) Put Option Premium Behavior: A Put Option gives the buyer the right to sell an asset at a specified strike price before expiration. If the strike price increases, the put option becomes more valuable since the asset can be sold at a higher price, leading to a higher premium. (Statement 3 is TRUE) If the strike price decreases, the put option becomes less attractive, leading to a lower premium. (Statement 4 is TRUE) Conclusion: Since statement 2 contradicts the basic principle of call options, it is the false statement.","answer_source":"explicit"},{"n":9,"q":"In an American Put Option, the buyer gets the right but not the obligation to _______ the writer an underlying asset at a specified price ________ .","options":["Buy from ; on or before the expiry date","Buy from ; on the expiry date","Sell to ; on or before the expiry date","Sell to ; on the expiry date"],"answer":2,"explanation":"American option: The owner (buyer/holder) of an American option can exercise his right at any time on or before the expiry date/day of the contract. A Put Option gives the buyer/holder a right to sell the underlying asset. Therefore an American Put Option gives the buyer the right but not the obligation to sell to the writer an underlying asset at a specified price on or before the expiry date.","answer_source":"explicit"},{"n":10,"q":"Identify the strategy in which an investor takes a short position in call option and long position in the underlying stock.","options":["Writing a naked call","Protective call strategy","Writing a covered call","Butterfly strategy"],"answer":2,"explanation":"Writing a covered call means an investor owns the stock and at the same time sells a call option on that same stock. For example, if you own 100 shares of a company, you can sell a call option on those 100 shares and receive a premium. The call is called “covered” because you already own the shares needed if the option is exercised. The main benefit is earning extra income through the premium, but the investor’s potential profit from a big rise in the stock price is limited.","answer_source":"explicit"},{"n":11,"q":"When SEBI has approved the bye-laws of a derivative exchange, the exchange is free to introduce futures contracts on any number of stocks and it does not require to go to SEBI every time - State True or False ?","options":["True","False"],"answer":1,"explanation":"Even after SEBI has approved the bye-laws of a derivatives exchange, the exchange cannot freely introduce futures contracts on any stock without SEBI’s approval. Each new derivative product (like stock futures or options) must be individually approved by SEBI before launch.","answer_source":"explicit"},{"n":12,"q":"Is it true that at expiration, the value of an option is its intrinsic value?","options":["Yes, its true for all options","No, its not true for all options","Yes, its true but only for Call options","Yes, its true but only for Put options"],"answer":0,"explanation":"At expiration, the exercise settlement value for each unit of the exercised contract is computed as follows: Call options = Closing price of the security on the day of exercise - Strike price Put options = Strike price - Closing price of the security on the day of exercise. In other words, the final settlement amount is equal to the intrinsic value of the option at expiration.","answer_source":"manual"},{"n":13,"q":"A clearing member has deposited eligible liquid assets of Rs.75 lacs. The exchange has minimum liquid net worth requirement of Rs. 50 lakhs. The member has not entered into any transactions so far. What is the margin available for trading. (in lakhs)","options":["75","50","25","125"],"answer":2,"explanation":"Liquid Networth is defined as Liquid Assets minus Initial Margin. In above case he has deposited Rs 75 lakhs as liquid assets. Rs 50 lakhs is the requirement, so the balance Rs 25 lakhs will be used as initial margin.","answer_source":"explicit"},{"n":14,"q":"Which of these derivative contracts, once entered into, usually cannot be closed or reversed till their expiry?","options":["Exchange traded options on futures","Exchange traded options","Future contracts","Forward contracts"],"answer":3,"explanation":"Forwards are bilateral over-the-counter (OTC) transactions where the terms of the contract, such as price, quantity, quality, time and place are negotiated between two parties to the contract. The tailor made contracts and their non-availability on exchanges creates illiquidity in the contracts. Therefore, it is very difficult for parties to exit from the forward contract before the contract’s maturity.","answer_source":"explicit"},{"n":15,"q":"From the various complaints against a trading member given below, identify which one can be taken up by the exchange for redressal ?","options":["Complaints in respect of transactions which are already subject matter of arbitration proceedings","Non-receipt of funds or securities","Complaints relating to land dealings between a client and a trading member","Claims for notional loss for the disputed period"],"answer":1,"explanation":"Exchanges provide assistance if the complaints fall within the purview of the Exchange and are related to trades that are executed on the Exchange Platform. ‘Non-receipt of funds / securities’ comes under this assistance.","answer_source":"explicit"},{"n":16,"q":"'Rho' is connected to the ______ .","options":["Volatility of the underlying","Time to expiry of the option","Price of the underlying asset","Interest rates in the market"],"answer":3,"explanation":"Rho is the change in option price given a one percentage point change in the risk-free interest rate. Rho measures the change in an option’s price per unit increase in the cost of funding the underlying. Rho = Change in an option premium / Change in cost of funding the underlying.","answer_source":"explicit"},{"n":17,"q":"The strategy of _________ involves options with different strike prices but same expiry dates.","options":["Straddle","Calendar spreads","Vertical spreads","Diagonal spreads"],"answer":2,"explanation":"Spreads are option strategies which involve combining options on the same underlying and of same type (call/ put) but with different strikes and maturities. These are limited profit and limited loss positions. Vertical spreads are created by using options having same expiry date but different strike prices. These can be created either using calls as combination or puts as combination. This strategy is commonly used to limit risk and reward while taking a directional view on the market.","answer_source":"explicit"},{"n":18,"q":"A client has asked for a quarterly settlement of his running account. In this connection, identify the INCORRECT statements.","options":["Both A and B are incorrect","Both B and C are incorrect","Both A and C are incorrect","None of the above"],"answer":1,"explanation":"With a view to prevent any misuse of a client’s funds by the broker, SEBI has made it mandatory for brokers to settle the running account of client funds on a monthly or quarterly basis as per the mandate of the client. To bring uniformity in the settlement of running accounts, brokers are now required to settle the running account after considering the client’s EOD obligations as on the date of settlement across all the Exchanges on the first Friday of the quarter, in case of clients requiring a quarterly settlement.","answer_source":"explicit","statements":["A. The settlement will be done on first Friday of the quarter","B. The settlement will be done on last Friday of the quarter","C. The settlement will be done on any trading day of the quarter"]},{"n":19,"q":"A Trading-cum-clearing member has a client X who has purchased and sold 1000 and 2000 contracts respectively in the June series of ABC futures (contract multiplier 50). The Trading-cum-clearing member has purchased and sold 2200 and 1500 contracts respectively on his own account in the same June series of ABC futures (contract multiplier 50). What is the outstanding liability (open position) of the member towards clearing corporation in the number of contracts?","options":["1700","300","6700","2200"],"answer":0,"explanation":"The open position of a client and the clearing member cannot be netted off with each other. Open position of client X is 1000 - 2000 = 1000 sale contracts Open position of Clearing member is 2200 - 1500 = 700 purchase contracts Total outstanding position of the clearing member towards the Clearing Corporation is 1000 + 700 = 1700 contracts","answer_source":"manual"},{"n":20,"q":"Identify which of these is not an application of indices?","options":["Exchange traded funds","Index funds","Index derivatives","Private equity funds"],"answer":3,"explanation":"Private Equity Funds are not connected to any index nor are they listed on a stock exchange. Traditionally, indices were used as a measure to understand the overall direction of stock market. However, few applications on index have emerged in the investment field such as Index Funds, Index Derivatives, Exchange Traded Funds etc.","answer_source":"explicit"},{"n":21,"q":"Which of these is an example of derivative contract?","options":["Treasury Bills of Government of India","Equity shares of XYZ Ltd","S&P 500 futures","Certificate of Deposit"],"answer":2,"explanation":"A derivative contract is a financial instrument whose value is derived from an underlying asset (like equity, index, commodity, or currency). Treasury Bills, Equity Shares, and Certificates of Deposit are direct securities. S&P 500 futures are based on the S&P 500 index, so their value depends on the performance of that underlying index. Hence, S&P 500 futures is the example of a derivative contract.","answer_source":"explicit"},{"n":22,"q":"'Time Decay' is beneficial to the _______ .","options":["Option Buyer","Option Seller","Option Buyer and Seller equally","Neither the option buyer or seller"],"answer":1,"explanation":"If all other factors affecting an option’s price remain the same, the time value portion of an option’s premium will decrease with the passage of time. This is also known as time decay. Options are known as ‘wasting assets’, due to this property where the time value gradually falls to zero. Any fall in premium is advantageous to the option seller.","answer_source":"explicit"},{"n":23,"q":"Which type of index is NSE NIFTY?","options":["Its a price-weighted index","Its a free-float market capitalisation index","Its an equally-weighted index","Its a market capitalisation – weighted index"],"answer":1,"explanation":"The free-float methodology is a method of calculating the market capitalization of a stock market index's underlying companies. With the free-float methodology, market capitalization is calculated by taking the equity's price and multiplying it by the number of shares readily available in the market. A majority of the stock indices globally, over a period of time, have moved to free float basis, including the Indian equity indices - Sensex, Nifty and SX40.","answer_source":"explicit"},{"n":24,"q":"In case there is a Stock Split of a company which is a part of an Index, than what will its impact on the index value?","options":["The index value can increase or decrease but this cannot be forecasted with accuracy","The index value will remain unchanged","The index value will decrease","The index value will increase"],"answer":1,"explanation":"A stock split lowers its stock price but doesn't weaken its value to current shareholders as the number of shares increase proportionally. Stock Split has an effect on Options, Strike Price etc. but has no impact on the index as such. Therefore, when a stock which is part of the index has a stock split, it does not have an impact on the index.","answer_source":"explicit"},{"n":25,"q":"Identify the TRUE statement with respect to a Put option.","options":["In a Put Option, both the buyer and seller have the obligation to buy and sell the underlying at a specified price","A put option will give the buyer a right but not an obligation to sell to the writer an underlying at a specified price","A put option will give the seller a right but not an obligation to buy from the buyer an underlying at a specified price","A put option will give the buyer an obligation but not the right to sell to the writer an underlying at a specified price"],"answer":1,"explanation":"Options may be categorized into two main types: · Call Options · Put Options An option, which gives the buyer/holder a right to buy the underlying asset, is called a call option; and an option which gives the buyer/holder a right to sell the underlying asset, is called a ’put option’. Therefore, a put option is a contract that allows the buyer to sell an asset at a fixed price (strike price). The buyer has a right, not a compulsion, to sell. The seller (writer) of the put option must buy the asset if the buyer chooses to exercise the option. Therefore, only the buyer has the choice, while the seller has the obligation.","answer_source":"explicit"},{"n":26,"q":"The Derivatives market helps in _________ .","options":["Transfer of risk from those who are exposed to risk but have low risk appetite to participants with high risk appetite","The reallocation of risk among the market participants","Both of the above","None of the above"],"answer":2,"explanation":"Derivatives play a positive role by reallocating risks. They help in transfer of various risks from those who are exposed to risk but have low risk appetite (Hedgers) to participants with high risk appetite (Speculators). For example, hedgers do not want any risk where as traders/speculators are willing to take risk. Derivatives were first invented as a Hedgeing tool so that people who wanted to play safe can use them to transfer the risk by hedgeing.","answer_source":"explicit"},{"n":27,"q":"How should a seller of an option treat the premium received in his books of accounts?","options":["It should be treated as an Income","It should be treated as an Expense","It should be treated as an Asset","It should be treated as a Liability"],"answer":3,"explanation":"When you sell an option, you get paid a premium upfront, but you also take on a future obligation to buy or sell a stock if the buyer wants to. Because you haven't fulfilled this obligation yet, you cannot count the money as profit right away. Instead, you must record it as a Liability on your balance sheet, representing a debt of service or asset you might owe. Only when the option expires, gets exercised, or is bought back does that liability disappear and turn into an official gain or loss.","answer_source":"explicit"},{"n":28,"q":"Identify the strategy which will be most appropriate when volatility is expected to be very low.","options":["Short Straddle","Short Butterfly","Long Butterfly","Long Straddle"],"answer":0,"explanation":"A Short Straddle strategy involves selling a Call and a Put option at the same strike price (usually at-the-money). It profits when the price remains stable and volatility is low, because both options lose value as time passes (time decay works in the seller’s favor). The trader earns the total premium received from selling both options. However, it carries high risk if the market moves sharply in either direction. Hence, when volatility is expected to remain very low, the most suitable strategy is a Short Straddle.","answer_source":"heuristic"},{"n":29,"q":"The facility for lending and borrowing securities is usually necessary for smooth execution of ________ .","options":["Cash and carry arbitrage","Reverse cash-and-carry arbitrage","Cross-hedge using futures","Calendar spread using futures"],"answer":0,"explanation":"Usually the futures prices are higher than cash market prices. The reverse cash-and-carry arbitrage is done when the futures contract are lower than the cash market price. For eg. Reliance Industries Ltd. is trading at Rs 2050 in the cash market and Rs. 2000 in futures market. The arbitrageur will sell in the cash market at Rs 2050 and buy in the future market at Rs 2000, thus making a profit of Rs 50 (less expenses). The arbitrageur should have the stock to deliver in the cash market, which will be bought back at the time of reversing the position. If stock is not available, arbitrageur needs to borrow the stock to implement the arbitrage. Therefore, existence of a facility for lending and borrowing securities is required for smooth execution Reverse cash-and-carry arbitrage.","answer_source":"explicit"},{"n":30,"q":"A hedger wants to offset the price risk on his equities, so he will take _________ .","options":["A long positions in futures","A short positions in futures","A long position in Call","Both a long or short position in futures"],"answer":1,"explanation":"Hedgers face risk associated with the prices of underlying assets and use derivatives to reduce their risk. If a person has a portfolio of equity stocks, he can sell futures to offset the price risk.","answer_source":"explicit"},{"n":31,"q":"A derivatives market would primarily have which of the following participants?","options":["Speculators","Long-term investors","Hedgers","Both Speculators and Hedgers"],"answer":0,"explanation":"There are broadly three types of participants in the derivatives market - hedgers, traders (also called speculators) and arbitrageurs. Long-term investors invest in the cash market and take delivery of the securities.","answer_source":"explicit"},{"n":32,"q":"A 'Closing buy transaction' is a buy transaction which will have the effect of offsetting a ______ .","options":["High position","Cross position","Long position","Short position"],"answer":3,"explanation":"A \"short position\" means you've sold an asset you don't own, with the obligation to buy it back later. A \"Closing buy transaction\" is when you buy that asset back, effectively closing out (offsetting) your short position.","answer_source":"explicit"},{"n":33,"q":"Longer the time to maturity of a PUT option, higher will be its ________ .","options":["Arbitrage value","Technical and Fundamental value","Intrinsic value","Time value"],"answer":3,"explanation":"Time value of the option depends upon how much time is remaining for the option to expire. Longer the time to maturity, higher will be the time value. The effect of time to expiration on both call and put options is similar to that of volatility on option premiums. Generally, longer the maturity of the option greater is the uncertainty and hence the higher premiums. If all other factors affecting an option’s price remain same, the time value portion of an option’s premium will decrease with the passage of time.","answer_source":"explicit"},{"n":34,"q":"Identify the TRUE statement with respect to Futures Contracts?","options":["Futures contracts and Forward contracts are basically one and the same","Futures contracts can be traded either on the OTC market or on an exchange","Futures contracts can be traded only on OTC market","Futures contracts can be traded only on an exchange"],"answer":3,"explanation":"A futures contract is similar to a forward, except that the deal is made through an organized and regulated exchange rather than being negotiated directly between two parties. Futures are also standardized contracts (in terms of their lot size, maturity date, etc.) so that they can be traded on the exchange. Indeed, we may say futures are exchange traded forward contracts.","answer_source":"explicit"},{"n":35,"q":"A trader has sold a ABC futures contract (contract multiplier 50) at 2500 and bought it back at 2700, what is the gain/loss for the trader?","options":["A gain of Rs. 10,000","A loss of Rs. 10,000","A gain of Rs. 15,000","A loss of Rs. 15,000"],"answer":1,"explanation":"You had sold ABC futures believing that its price will fall down, but it has risen - so there will be a loss. 2500 - 2700 = -200 Loss -200 x 50 shares = - Rs 10000","answer_source":"explicit"},{"n":36,"q":"Identify the correct statement for 'In-the-money' Call Option?","options":["Strike price will be higher than the market price","Strike price will be zero","Exercise price would be equal to the market price","Strike price will be lower than the market price"],"answer":3,"explanation":"An In-the-Money (ITM) Call Option occurs when: The strike price (also called exercise price) is less than the current market price of the underlying asset. This gives the option holder the right to buy the asset below market value, which has intrinsic value. Example of ITM Call Option : If a stock is trading at Rs. 120 and the call option has a strike price of Rs. 100: The option is Rs. 20 in-the-money The holder can buy at Rs. 100 and potentially sell at Rs. 120","answer_source":"explicit"},{"n":37,"q":"Strike price is that price at which the ________ can purchase (in case of a call) or sell (in case of put) the underlying asset by exercising the option.","options":["Option Buyer","Option Writer","Clearing Corporation","Options Stock Exchange"],"answer":0,"explanation":"An Option is a contract that gives the right, but not an obligation, to buy or sell the underlying on or before a stated date and at a stated price. While buyer of option pays the premium and buys the right, writer/seller of option receives the premium with obligation to sell/ buy the underlying asset, if the buyer exercises his right. An option, which gives the buyer/holder a right to buy the underlying asset, is called Call option and an option which gives the buyer/holder a right to sell the underlying asset, is called Put option.","answer_source":"manual"},{"n":38,"q":"Identify the CORRECT statement from the given options -","options":["A professional clearing member has the permission to trade on his own account as well as clear trades for others","A member, who is registered as self-clearing member on derivatives exchange can also clear trades of other trading members","A trading member on a registered derivatives exchange need not be registered with SEBI","A member who is registered as trading member on derivatives exchange will not have clearing rights"],"answer":3,"explanation":"A Professional Clearing Member (PCM) is not allowed to trade on their own account. A Self-Clearing Member (SCM) can only clear and settle trades for themselves and not for other trading members. All trading members of derivatives exchanges in India must be registered with SEBI as per SEBI regulations. A Trading Member (TM) is only allowed to execute trades and does not have clearing rights. Therefore - A member who is registered as trading member on derivatives exchange will not have clearing rights is correct.","answer_source":"explicit"},{"n":39,"q":"If the futures price of a stock is ______ and open interest of the futures contract of that stock is ______, then it signals a bullish trend.","options":["Falling , Rising","Rising , Falling","Rising , Rising","Falling , Falling"],"answer":2,"explanation":"Traders can decide whether to buy or sell futures based on changes in the open interest and the futures price. For eg - If the futures price is rising and open interest of the futures contract is also increasing, it signals a bullish trend. Traders usually prefer to go long the futures in such situations.","answer_source":"explicit"},{"n":40,"q":"As compared to the other financial products mentioned here, which one is more difficult to understand?","options":["Treasury Bills issued by Government of India","Index mutual funds replicating index like Nifty","Index options on a broad-based equity index like Nifty","Index futures on a broad-based equity index like Nifty"],"answer":2,"explanation":"Options are complex financial instruments and difficult to understand when compared to futures, bonds or mutual funds.","answer_source":"explicit"},{"n":41,"q":"Initial Margin can be paid by ________ .","options":["Bank guarantee","Bank transfer of funds","Acceptable securities","All of the above"],"answer":3,"explanation":"The amount one needs to deposit in the margin account at the time of entering into a futures contract is known as the initial margin. This can be paid by Cash, Bank Guarantee, Fixed Deposit Receipts and approved securities etc.","answer_source":"explicit"},{"n":42,"q":"A trading member has to issue which of these documents to all its clients?","options":["Risk Control Document","Risk Identification Document","Risk Monitoring Document","Risk Disclosure Document"],"answer":3,"explanation":"Brokers are required to make their clients understand the risks involved in trading derivatives and get a copy of the Risk Disclosure Document signed by their clients at the time of client on-boarding. The Risk Disclosure Document highlights the risk involved in trading on stock exchanges, and the rights and obligations of the broker and their clients.","answer_source":"explicit"},{"n":43,"q":"The buyer of an option is one who has a _______ but not the ______ to buy/sell the underlying asset in the contract.","options":["Obligation , Right","Right , Obligation","Duty , Claim","Claim , Duty"],"answer":1,"explanation":"Buyer of an option: The buyer of an option is one who has a right but not the obligation in the contract. For owning this right, he pays a price called ‘option premium’ to the seller of this right. He will have a right to buy the underlying asset in case of a call option and will have a right to sell the underlying asset in case of a put option.","answer_source":"explicit"},{"n":44,"q":"Is the statement correct or incorrect - A hedged portfolio will give higher returns than unhedged portfolio at all times.","options":["Correct","Incorrect"],"answer":0,"explanation":"Hedging controls your losses but also controls your profits. It does not ensure higher profits. An open position can give you more profits or more losses.","answer_source":"explicit"},{"n":45,"q":"With regards to futures market, BASIS is the _______ .","options":["price of the underlying stock","difference in price between spot and future prices","risk free rate of interest","volatility in the stock"],"answer":1,"explanation":"The difference between the spot price and the futures price is called basis. If the futures price is greater than spot price, basis for the asset is negative. Similarly, if the spot price is greater than futures price, basis for the asset is positive.","answer_source":"explicit"},{"n":46,"q":"Arbitrageurs are considered to be critical link between ______ .","options":["Derivative markets in different locations","Cash market and derivatives market on the same exchange","Cash markets in different locations/exchanges","All of the above"],"answer":3,"explanation":"An arbitrage is a deal that produces risk-free profits by exploiting a mispricing in the market. A simple arbitrage occurs when a trader purchases an asset cheaply in one location/ exchange and simultaneously arranges to sell it at another location/ exchange at a higher price. Therefore, arbitrage can be between cash and derivatives market on the same exchange or cash markets in different exchanges or derivatives market in different exchanges/locations etc.","answer_source":"explicit"},{"n":47,"q":"Identify the strategy which has a ‘limited potential gain with limited possible loss’.","options":["Going short in At-the-money index put and going long in Out-of-the-money index put option, both with the same expiry date","Going long in index put option","Going short in index call option","Going long in index call option"],"answer":0,"explanation":"A limited gain and limited loss strategy can be implemented using either two calls or two puts or both calls and puts. It cannot be implemented using a single Call or Put. Spreads involve combining options on the same underlying and of same type (call/ put) but with different strikes and maturities. These are limited profit and limited loss positions. They are primarily categorized into three sections as: · Vertical Spreads · Horizontal Spreads · Diagonal Spreads.","answer_source":"manual"},{"n":48,"q":"Intraday trading can be done in the case of _______ .","options":["All ETF units","All active mutual fund units","All index mutual fund units","All of the above"],"answer":0,"explanation":"Exchange Traded Funds (ETFs) is basket of securities that trade like individual stock, on an exchange. They have number of advantages over other mutual funds units as they can be bought and sold on the exchange. Since, ETFs are traded on exchanges, intraday transaction is possible.","answer_source":"manual"},{"n":49,"q":"Identify which of these is NOT an example of hedge.","options":["A fund manager is expecting market volatility after RBI policy, buys index put options to limit the loss on his portfolio","An exporter is expecting to receive dollars after 1 month, takes a short position in one-month USDINR futures to lock in his dollar price","Mr. Patil, a stock trader is bullish on the market and therefore buys an out-of -the-money index call and sells an out-of-the-money index put option","A trader with a short index futures position buys an out-of-the-money call on the index so as to limit his loss"],"answer":2,"explanation":"A hedge is basically created to safeguard an existing position. It is to minimise the losses or lock a profit. In ‘A stock trader is bullish on the market and buys an out-of -the-money index call and sells an out-of-the-money index put option’ - the trader has a view on the market and makes a trading strategy accordingly. This is not hedging.","answer_source":"explicit"},{"n":50,"q":"For setting limits on his trading members clearing through him, a Clearing Member will have to consult _______ .","options":["SEBI","The Stock Exchange","Clearing Corporation","The Clearing Member can set the limits on his own and no consultation is required"],"answer":3,"explanation":"A trading terminal helps the Clearing Members to monitor the open positions of all the Trading Members clearing and settling through him. A Clearing Member may set limits for a Trading Member clearing and settling through him. Clearing corporation assists the Clearing Member to monitor the intraday limits set up by a Clearing Member and whenever a Trading Member exceed the limits, it stops that particular Trading Member from further trading.","answer_source":"explicit"}]},{"category":"Equity Derivatives","set":"Set 2","count":50,"questions":[{"n":1,"q":"The shorter the time to maturity of a call option, the lower will be its _______ .","options":["Intrinsic value","Settlement value","Time value","Assignment value"],"answer":2,"explanation":"The time value of an option comes from the chance that the price may move in your favor before expiry. With less time left, that chance becomes smaller. So, as the option gets closer to expiry, its time value reduces.","answer_source":"explicit"},{"n":2,"q":"Under the Securities Contracts (Regulation) Act (SCRA), derivatives are defined to include :","options":["Securities derived from equity shares","Securities derived from debt instruments","Commodity derivatives","All of these"],"answer":3,"explanation":"As per the Securities Contracts (Regulation) Act (SCRA), the definition of derivatives is very broad. It includes: Derivatives based on shares Derivatives based on debt instruments Commodity derivatives And several other types such as index derivatives, interest rate derivatives, etc.","answer_source":"explicit"},{"n":3,"q":"Which of the following order types requires the trader to specify a trigger price?","options":["Day order","Immediate-or-cancel order","Stop-loss order","Market order"],"answer":2,"explanation":"A stop-loss order is designed to limit losses by triggering a market or limit order once the trigger price is reached. Stop-loss order needs a trigger price. When the market price reaches this trigger, the order is activated and sent to the exchange (usually as a market or limit order).","answer_source":"explicit"},{"n":4,"q":"Which of the following statements is correct?","options":["With all other factors unchanged, a client with a shorter investment horizon can invest in riskier assets compared to a client with a longer investment horizon","With all other factors unchanged, a client with a longer investment horizon can invest in riskier assets compared to a client with a shorter investment horizon","Investment horizon has no impact on an investor's risk tolerance.","None of the above"],"answer":1,"explanation":"Generally, a client with a longer investment horizon can afford to take on more risk and invest in riskier assets. This is because they have more time to ride out market fluctuations and recover from potential losses. With a short horizon, there is little time to recover losses. Hence, longer-horizon investors can take higher risks.","answer_source":"explicit"},{"n":5,"q":"Which of the following statements is correct ?","options":["A market order may fail to execute in a rapidly changing market.","A market order does not guarantee execution at the specified price or at a better price.","A market order is typically used by investors who are willing to wait for a specific price","A market order does not ensure execution even when there is high liquidity with several bids and offers available."],"answer":1,"explanation":"A market order does not guarantee execution at the specified price or at a better price - A market order prioritizes execution over price. It is executed at the best available prices in the order book, which may be worse than the last traded price or the client’s expectation. Hence, price is not guaranteed, only execution is (subject to availability of liquidity).","answer_source":"explicit"},{"n":6,"q":"A stock with a very high market price will have a greater impact on the index level in which of the following types of indices?","options":["A free-float market capitalisation-weighted index","A full market capitalisation-weighted index","An equal-weighted index","A price-weighted index"],"answer":3,"explanation":"In a price-weighted index, each stock’s weight depends on its share price. Stocks with higher prices have greater influence because weights are based directly on share price (e.g., Dow Jones Industrial Average). So, a high-priced stock has a larger impact on index movements. Hence, price alone matters most in a price-weighted index.","answer_source":"explicit"},{"n":7,"q":"When does the monthly series mature for Nifty index futures of NSE?","options":["First Wednesday of the month","First Thursday of the month","Last Tuesday of the month","Last Thursday of the month"],"answer":2,"explanation":"As per the revised NSE rules effective from September 2025, the expiry schedule has changed from Thrusday to Tuesdays. The monthly series of Nifty index futures now expires on the last Tuesday of the month. If the last Tuesday is a trading holiday, expiry shifts to the previous trading day.","answer_source":"explicit"},{"n":8,"q":"Identify the contract which is cleared and settled bilaterally?","options":["A one month Nifty futures contract","A one-month USDINR options contract","A 3-month forward contract to buy Swiss Francs against the Indian rupee","A one-month GOI bond futures contract"],"answer":2,"explanation":"Bilateral contract is a contract between two parties. Generally, all Forward contracts are bilateral contracts and are not done on any Exchange. In the above options, only 'A 3-month forward contract to buy Swiss Francs against the Indian rupee' is a forward contract and the other three are futures / options contract. A futures contract is an agreement made through an organized exchange to buy or sell a fixed amount of a commodity or a financial asset on a future date at an agreed price.","answer_source":"explicit"},{"n":9,"q":"A future contract ______ .","options":["can be squared off any time before expiry","can be traded on a one to one basis by counterparties","will never have a specified maturity","cannot be squared off before expiry"],"answer":0,"explanation":"A futures contract is a standardized derivative traded on an exchange. Key features: - Standardized contract – not traded on a one-to-one basis like forwards. - Specified maturity – each futures contract has a defined expiry date. - Squaring off – positions can be closed (squared off) anytime before expiry by taking an opposite position in the same contract. - Settlement occurs at expiry if not squared off.","answer_source":"manual"},{"n":10,"q":"A Mutual Fund manager has collected Rs. 300 crores in a New Fund Offer. He is planning to invest this amount over the next one month in buying 20 selected index stocks. How can he hedge the risk for this planned purchase of stocks?","options":["He can execute a long hedge using index futures","He can execute a short hedge using index futures contracts on each of the 20 stocks","He can execute a short hedge using index futures","He can execute a long hedge using put options on each of the 20 stocks"],"answer":0,"explanation":"Since the Mutual Fund manager is planning to buy stocks over the next month, he is exposed to the risk that stock prices might rise before he completes his purchases. To hedge against this risk, he should use a long hedge with index futures. Why is a long hedge using index futures appropriate? - A long hedge involves buying index futures, which will gain value if stock prices increase. - If the stock prices rise, the gains from the index futures will offset the higher cost of purchasing stocks later. - This ensures that the fund manager locks in a price level close to current market condition.","answer_source":"heuristic"},{"n":11,"q":"Default risk is also known as ________ .","options":["Credit Risk","Counterparty Risk","Both of the above","None of the above"],"answer":2,"explanation":"Counterparty risk is the risk arising out of the default of a counterparty to the transaction. It is the risk of an economic loss from the failure of the counterparty to fulfil its contractual obligation. This risk is also called default risk or credit risk. It is generally not applicable to clients trading in exchange-traded equity derivatives because the settlement of such transactions is guaranteed by the exchange / clearing corporation.","answer_source":"explicit"},{"n":12,"q":"What happens to a 'Day Order' if its not executed during the day?","options":["The Order will be executed in the auction market","The Order will be executed in the after-hours","The Order will be executed on the next trading day","The Order will be cancelled automatically at the end of the day"],"answer":3,"explanation":"A Day order is an order which is valid for a single day on which it is entered. If the order is not executed during the day, the trading system cancels the order automatically at the end of the day.","answer_source":"explicit"},{"n":13,"q":"One of the reason that future trading has become expensive is due to higher margins - True or False?","options":["True","False"],"answer":0,"explanation":"Cost components of futures transaction include margins, transaction costs (commissions), taxes etc. So, higher the margins more expensive the trading.","answer_source":"manual"},{"n":14,"q":"In futures trading, the margin is paid by ________","options":["The Buyer only","The Seller only","Both Buyer and Seller","The Clearing Corporation"],"answer":2,"explanation":"The amount one needs to deposit in the margin account at the time of entering into a futures contract is known as the initial margin. In case of futures, both the buyer and seller are required to pay initial margin as decided by exchanges for entering into futures contract. In case of Options, the initial margin is paid only by the sellers. The option buyers have to pay the premium to the option sellers.","answer_source":"explicit"},{"n":15,"q":"Ms. Seema, a stock market trader, is very bearish on specific companies. However she is bullish on the market as a whole. Identify the most appropriate strategy to take advantage from this view?","options":["She should sell shares of those specific companies and buy index futures","She should sell the shares of those specific companies and also sell index futures","She should buy the shares of those specific companies and sell index futures","She should not do anything"],"answer":0,"explanation":"Ms. Seema is bearish on specific companies - she expects their prices to fall - sell those shares. She is bullish on the overall market - she expects the index to rise - buy index futures. She should sell the shares of those specific companies in futures and buy index futures. By this she will profit when the stock prices of those specific companies fall and index rises - if her view proves correct.","answer_source":"manual"},{"n":16,"q":"If there is no cross margining between cash and derivative segments of an exchange, this will _________ .","options":["Promotes economic inefficiency","Increase the cost of trading","Reduces the volumes for given level of risk capital in the economy","All of the above"],"answer":3,"explanation":"If cross margining is not allowed between the cash and derivative segments, it leads to the following: Promotes economic inefficiency -Without cross margining, traders must maintain separate margins for positions that may offset each other (e.g., long in cash and short in futures), which is inefficient from a capital utilization perspective. Increases the cost of trading - More margin requirements mean higher capital tied up, increasing the opportunity cost and overall trading cost. Reduces the volumes for a given level of risk capital in the economy - Since capital is not optimally used, the same amount of risk capital supports fewer trades, reducing trading volumes.","answer_source":"explicit"},{"n":17,"q":"______ can write an option in the Indian stock market.","options":["Market Makers","Foreign portfolio investors","Individuals","All of the above"],"answer":3,"explanation":"All of the above can write (sell) options in Indian stock market. Individuals like traders, hedgers, arbitrageurs etc. can write options as per their plans. FIIs bring foreign capital to India, they invest in the F & O (Future and option market). FIIs can also write options or short futures, as required by their strategy. The market maker is a key stock market participant and like any trader or arbitrageur, he is also there for the profit and buy/write options.","answer_source":"explicit"},{"n":18,"q":"As per SEBI's guidelines, derivatives trading takes place through ______ .","options":["Online screen based trading system","Kerb trading","Auctions at public mandis","Open outcry method in the trading ring"],"answer":0,"explanation":"Derivatives trading as per SEBI’s guidelines takes place through an online screen based electronic trading system. In case of electronic trading, there are screen-based broker dealing terminals, instead of the trading pit. Futures and options trading in India is electronic in nature, with the bids and offers, and the acceptance being displayed on the terminal continuously.","answer_source":"heuristic"},{"n":19,"q":"What is a 'Stock Option'?","options":["Its a debt instrument","Its a derivative instrument","Its a foreign exchange instrument","Its a money market instrument"],"answer":1,"explanation":"Stock option: These options have individual stocks as the underlying asset. For example, option on ONGC, NTPC, etc. These options are derivative instruments.","answer_source":"explicit"},{"n":20,"q":"Those contracts which have been initiated but are not yet offset by a subsequent sale or purchase or by making or taking delivery are considered as ______ .","options":["Offsetting Positions","Clear Positions","Open Positions","Squared-off Positions"],"answer":2,"explanation":"Outstanding / unsettled position in various derivative contracts is called “Open Position”. For instance, if Mr. X shorts 5 contracts on Infosys futures and goes long on 3 contracts of Reliance futures, he is said to be having open position, which is equal to short on 5 contracts of Infosys and long on 3 contracts of Reliance. If on the next day, he buys 2 Infosys contracts of same maturity, his open position would be – short on 3 Infosys contracts and long on 3 Reliance contracts.","answer_source":"explicit"},{"n":21,"q":"A calendar spread in index futures will be treated as _________ in a far month contract if the near months contract is expired.","options":["Long position","Short position","Optional position","Naked position"],"answer":3,"explanation":"A calendar spread in index futures means taking opposite positions in two contracts of the same index but with different expiry months. The near-month contract helps hedge the risk of the far-month contract. When the near-month contract expires, that hedge is no longer available. The far-month contract remains as a standalone position, so it is treated as a naked position. Therefore, the trader may have to meet the higher margin requirements applicable to a naked futures position.","answer_source":"explicit"},{"n":22,"q":"What is the minimum price movement in a scrip called ?","options":["Badla Rate","Touchline","Market Lot","Tick"],"answer":3,"explanation":"Tick size is the minimum price movement of a trading instrument. Exchanges decide the tick sizes on traded contracts as part of contract specification. The exchange informs the lot size and the tick size for each of the contracts traded on F&O segment from time to time. For eg. Tick size for Nifty futures is 5 paisa.","answer_source":"explicit"},{"n":23,"q":"Hedgers and speculators are two important participants of a securities market and they strike a balance due to their needs as _______ .","options":["Hedger wants to avoids risk while the speculator wants to takes risk","Hedger wants to takes risk while speculators wants to avoids risk","Both hedgers and speculators want to avoid risk","Both hedgers and speculators want to take risk"],"answer":0,"explanation":"Corporations, Investing Institutions, banks and governments all use derivative products to hedge or reduce their exposures to market variables such as interest rates, share values, bond prices, currency exchange rates and commodity prices. Speculators/Traders try to predict the future movements in prices of underlying assets and based on the view, take positions in derivative contracts. They take a risk to make profits. Hedgers aim to hedge their risk where as speculators take the risk which hedgers plan to offload from their exposure.","answer_source":"manual"},{"n":24,"q":"The clearing member is free to close out transactions of a trading member if ________ .","options":["The trading member has not paid initial margin money","The trading member has not paid daily settlement dues","In both the above cases"],"answer":2,"explanation":"The following are some of the compliance lapses which attract penal charges: - Non fulfilment of initial margin obligations - Non-fulfilment of settlement obligation - Non-fulfilment of securities deliverable obligation - Non-fulfilment of minimum deposit requirements etc. In the event of a violation, Clearing Corporation may advice the Exchanges to withdraw any or all of the membership rights of the clearing member including the withdrawal of trading facilities of all trading members and/or clearing facility of custodial participants clearing through such clearing members, without any notice. In addition, the outstanding positions of such clearing member and/or trading members clearing and settling through such clearing member, may be closed out and such action shall be final and binding on the clearing member and/or trading member.","answer_source":"explicit"},{"n":25,"q":"Identify the transaction which is an example of a speculative trade using futures.","options":["When a person takes a long position in the stock futures in expectations of announcement of excellent results","When a person buys a under priced index futures contract of one month and simultaneously selling the overpriced index futures contract of another month","When a person buys a stock in the cash market and simultaneously shorts the overpriced stock futures contract","When a person takes a short position in index futures to protect against a decline in his portfolio value"],"answer":0,"explanation":"Speculative transactions in future are those transactions which : - Do not result in delivery - Are not done for hedging - Are not a part of a strategy or arbitrage When a person takes a long position in the stock futures in expectations of announcement of excellent results is pure speculative transaction as its not a hedge or a strategy or arbitrage.","answer_source":"heuristic"},{"n":26,"q":"_________ risk arises because of difference in price movement of the derivative vis-a-vis that of the security being hedged.","options":["Model Risk","Basis Risk","Market Liquidity Risk","Credit Risk"],"answer":1,"explanation":"Basis risk means the derivative and the security being hedged do not move by exactly the same amount. For example, if the stock price falls by Rs. 10, the futures price may fall by only Rs. 8. This difference of Rs. 2 creates basis risk, making the hedge less than perfect.","answer_source":"explicit"},{"n":27,"q":"In the Option segment, if you buy a CALL at a premium of Rs 35 at the Strike Price of Rs 400, lot is of 200 shares, then the maximum possible profit is ________ .","options":["Rs 400","Rs 7000","Rs 43000","Unlimited"],"answer":3,"explanation":"When you buy a CALL option, your losses are limited to the extent of premium paid, but your profits, theoretically can be unlimited as the price of the underlying can rise to any levels. When the price of an underlying rises, the price of an CALL option will also rise and so you can have unlimited profits.","answer_source":"explicit"},{"n":28,"q":"In ___________ , the strike price and market price are equal.","options":["Out-of-the money option","Same-the-money option","At-the-money option","In-the-money option"],"answer":2,"explanation":"At-the-money (ATM) option: At-the-money option would lead to zero cash flow if it were exercised immediately. Therefore, for both call and put ATM options, strike price is equal to spot / market price.","answer_source":"explicit"},{"n":29,"q":"Ms. Kavita wants to 'Sell' on a futures market. For this, she _________ .","options":["need not own the underlying","must own the underlying","must own at least 25% of the underlying","must own at least 50% of the underlying"],"answer":0,"explanation":"Selling on a futures market does not need any delivery. Only margin is required to be paid to Buy/Sell on a futures market. Therefore, Ms. Kavita can sell on the futures market even without owning the underlying. However, she needs to square up her position before the expiry.","answer_source":"heuristic"},{"n":30,"q":"In India, when the option holder exercises a call option on an equity stock, _________ .","options":["The option holder will receives cash amount equal to excess of spot price (at the time of exercise) over the strike price of the option","The option holder buys the underlying stock from the option writer at a pre-specified price","The option holder receives cash amount equal to excess of strike price of the call option over the spot price (at the time of exercise)","The option holder sells the underlying stock to the option writer at a pre-specified price"],"answer":1,"explanation":"In India, equity stock options are typically settled by physical delivery (especially on the NSE), not by cash settlement. This means when a call option is exercised, the option holder (buyer) has the right to buy the underlying equity stock at the strike price from the option writer (seller). Therefore, the option holder takes delivery of the stock and pays the strike price.","answer_source":"explicit"},{"n":31,"q":"An ‘European’ call option will give the buyer the right but not the obligation to buy from the seller an underlying at the strike price ________ .","options":["Only on the expiry date","On or before the expiry date","One day preceding the expiry date","One day after the expiry date"],"answer":0,"explanation":"European option: The owner (buyer/holder) of a European option can exercise his right only on the expiry date/day of the contract. In India, all index and stock options are European style options. American option: The owner (buyer/holder) of an American option can exercise his right at any time on or before the expiry date/day of the contract.","answer_source":"manual"},{"n":32,"q":"As strike price of put option is taken down, its intrinsic value ______ .","options":["Goes up","Goes down","Does not change","None of the above"],"answer":1,"explanation":"The intrinsic value of an option refers to the amount by which the option is In-the-money i.e., the amount an option buyer will realize, before adjusting for premium paid, if he exercises the option instantly. For a put option which is In-the-money, the intrinsic value is the excess of Strike price (X) over the spot price (S). Thus, the intrinsic value of put option can be calculated as X-S, with a minimum value possible as zero. For eg – If strike price is 100 and spot price is 90, the intrinsic value is 10 Likewise, if the strike price is 95, the intrinsic value will be about 5. Other Explanation : A put option gives the holder the right to sell an asset at the strike price. When the strike price decreases, the difference between the strike price and market price reduces, lowering the intrinsic value of the put option. If the strike price falls below the market price, the put option becomes out of the money (OTM) and its intrinsic value becomes zero. Thus, as the strike price decreases, the intrinsic value of the put option goes down.","answer_source":"explicit"},{"n":33,"q":"A CALL OPTION will give the buyer the _______ .","options":["Right to sell the underlying asset","Right to buy the underlying asset","Obligation to sell the underlying asset","Obligation to buy the underlying asset"],"answer":1,"explanation":"A call option gives the buyer the right but not the obligation to buy from the seller an underlying asset at the prevailing market price on or before the expiry date.","answer_source":"explicit"},{"n":34,"q":"Mr. Subu has buy position in a stock, he can square-off his long position in the stock by selling ____ .","options":["Any index stock of equal quantity","Any security of equal quantity","The same stock and same quantity","Any 'A' group stock of equal quantity"],"answer":2,"explanation":"To square up / cover a long position, the same quantity of the same stock has to be sold.","answer_source":"explicit"},{"n":35,"q":"________ is an example of a derivative on energy resources.","options":["Silver futures","Copper futures","Natural gas futures","Rubber futures"],"answer":2,"explanation":"Derivatives are also based on energy resources such as Oil (crude oil, products, cracks), Coal, Electricity, Natural Gas, etc.","answer_source":"explicit"},{"n":36,"q":"Identify the TRUE statement -","options":["The clearing members set the limits for the trading members under him","For enhanced risk management, the Clearing Corporation sets the limits for the trading members","The trading members have to possess a higher level of book networth than Clearing Members","The trading members should have the same level of Book networth as that of Clearing Members"],"answer":2,"explanation":"Each Clearing Member may have several Trading Members with him. The trading limits for each such Trading Member are decided by Clearing Members on the computerized trading system. If the Trading Member reaches his position limit, he will not be able to enter any fresh transactions which have the impact of increase his exposure. He will enter only those transactions which have the impact of reducing his exposure. Thus, new positions will not be permitted, but only squaring-off of existing positions will be permitted.","answer_source":"manual"},{"n":37,"q":"In India, when the option holder exercises a ITM Call Option on a stock, ________ .","options":["He/she buys the underlying stock from the option writer at a pre-specified price (strike price)","He/she sells the underlying stock to the option writer at a pre-specified price (strike price)","He/she receives cash amount equal to excess of strike price of the call option over the spot price (at the time of exercise)","He/she receives cash amount equal to excess of spot price (at the time of exercise) over the strike price of the call option"],"answer":0,"explanation":"Unlike index options, stock options are settled by physical delivery. All long ITM options are automatically assigned by the exchange on the expiry day to short positions in option contracts with the same series on a random basis. The final settlement takes place by physical delivery in accordance with the settlement schedule of the clearing corporation. In other words : A Call Option gives the holder the right to buy the underlying stock at the strike price. In India, stock options are settled by physical delivery (since Oct 2019, SEBI mandated physical settlement for stock derivatives). So, when the holder exercises an in-the-money (ITM) call option, they buy the underlying shares from the option writer at the strike price.","answer_source":"manual"},{"n":38,"q":"Mr. Sriniwas takes a short position in a call option but does not take any offsetting position in the underlying stock. This strategy is known as ______ .","options":["Writing a covered call","Writing a naked call","Butterfly strategy","Protective put strategy"],"answer":1,"explanation":"Naked position in options market simply means a long or short position in any option contract without having any position in the underlying asset. When one sells (short) a call it is also known as 'writing' a call. So the above strategy is - Writing a naked call option.","answer_source":"explicit"},{"n":39,"q":"Everest Mutual Fund had floated a new fund offer and received Rs. 500 crores from the investors. The fund manager of this fund is planning to invest this amount over the next one month in buying 25 high growth stocks. He can hedge the risk in this planned purchase of stock by executing __________ .","options":["A long hedge using put options on each of the 25 stocks","A short hedge using future contracts on each of the 25 stocks","A long hedge using index futures","A short hedge using index futures"],"answer":2,"explanation":"Since the fund manager is planning to purchase stocks over the next one month, there is a risk that stock prices might rise during this period. This risk is hedged by taking a long position in futures. Since the investment is across multiple stocks, using index futures is more practical and efficient than individual stock contracts.","answer_source":"explicit"},{"n":40,"q":"Which of the following is closest to the forward price of a share, if Cash Price =","options":["Rs.750, Forward Contract Maturity = 6 months from date, Market Interest rate = 12% pa.","795","840","940.80","772.50"],"answer":4,"explanation":"Forward/futures price of share can be calulated by adding the interest cost to its current price. 6 months maturity means half year of interest cost. 12% of 750 = Rs. 90 is the full year interest cost Half year interest cost = 90/2 = 45 750 + 45 = 795 is closest to six month forward price","answer_source":"manual"},{"n":41,"q":"Mr. Jones buys a put option with higher strike price and at the same time sells another put option with lower strike price, both on the same underlying share and same expiration date. This strategy is known as ______ .","options":["Butterfly spread","Calendar spread","Bearish spread","Bullish spread"],"answer":2,"explanation":"Bearish Vertical Spread using Puts : A trader is bearish on the market and so goes long in one put option with higher strike price by paying a premium. Further, to reduce his cost, he shorts another low strike put and receives a premium. This is done on the same underlying with same expiry date.","answer_source":"explicit"},{"n":42,"q":"Mr. Deepak wants to buy 20 contracts of October series at Rs. 3500 and Mr. Suraj wants to buy 12 contracts of November series at Rs. 3600. Lot size is 50 for both these contracts. The initial margin is fixed at 8%. How much initial margin is required to be collected from both these traders by the broker?","options":["Rs. 5,84,500","Rs. 3,75,200","Rs. 6,12,600","Rs. 4,52,800"],"answer":3,"explanation":"Intial Margin from Mr. Deepak Rs 3500 X 20 contracts X 50 (lot size) X 8% = Rs. 2,80,000 Initial Margin from Mr. Suraj Rs 3600 X 12 contracts X 50 (lot size) X 8% = Rs. 1,72,800 Total Margin = 280000 + 172800 = Rs. 4,52,800","answer_source":"explicit"},{"n":43,"q":"In the Indian derivatives exchange, the matching of bids and offers take place _____ .","options":["at the end of each minute","online and immediately","at the day's end","at the end of each hour"],"answer":1,"explanation":"In India, derivatives platforms offer an order driven market, wherein orders match automatically online on price time priority basis. Orders, as and when they are received, are first time stamped and then immediately processed for potential match. If a match is not found, then the orders are stored in different 'books'.","answer_source":"explicit"},{"n":44,"q":"If there are three series of one, two and three months futures open at a given point of time, how many calendar spread possibilities can arise?","options":["1","2","3","4"],"answer":2,"explanation":"The three calendar spreads can be between months 1 and 2, 2 and 3 and 1 and 3.","answer_source":"explicit"},{"n":45,"q":"_______ gives the right to sell an asset for a certain price on or before a specified date.","options":["European Call option","European Put option","American Call option","American Put option"],"answer":3,"explanation":"A Put Option gives the holder the right to sell the underlying asset on or before a particular date for a certain price. American option: The owner of such option can exercise his right at any time on or before the expiry date/day of the contract. (European option: The owner of such option can exercise his right only on the expiry date/day of the contract. In India, all Index and stock options are European)","answer_source":"explicit"},{"n":46,"q":"If the futures price is declining but open interest is increasing, it indicates a ________ .","options":["Bullish trend","Bearish trend","No trade trend","None of the above"],"answer":1,"explanation":"If the futures price is declining but open interest is increasing, it indicates a build-up of short positions and a bearish trend. Traders usually tend to go short on the futures in such a scenario.","answer_source":"explicit"},{"n":47,"q":"A ______ is not a Trading Member but clears and settles the trades of Trading Members and institutional clients.","options":["Trading cum clearing member","Custodial participant","Self clearing member","Professional clearing member"],"answer":3,"explanation":"Professional Clearing Member: Professional clearing member clears the trades of his associate Trading Member and institutional clients. PCM is not a Trading Member of the exchange. Typically banks or custodians become a PCM and clear and settle for Trading Members as well as for Custodial Participants.","answer_source":"explicit"},{"n":48,"q":"A Clearing member has to deposit liquid assets with the Clearing Corporation but these liquid assets cannot comprise entirely of _________ .","options":["Equity Shares","T Bills (Treasury Bills)","Cash","Fixed Deposits"],"answer":2,"explanation":"Clearing member is required to provide liquid assets which adequately cover various margins and liquid Net-worth requirements. The total liquid assets comprise of at least 50% of the cash component and the rest is non-cash component – This means 50% to 100% can be the cash component. Non-cash component cannot be more than 50%. All collateral deposits are segregated into cash component and non-cash component. Cash component means cash, bank guarantee, fixed deposit receipts, T-bills and dated government securities. Non-cash component means all other forms of collateral deposits like deposit of approved demat equity securities.","answer_source":"heuristic"},{"n":49,"q":"Which of these strategy has a same pay-of profile as that of Covered Call strategy?","options":["Bearish Call spread","Short Put strategy","Long Put strategy","Bullish Put spread"],"answer":1,"explanation":"A Covered Call strategy means the investor buys the stock and sells a call option on the same stock. The profit is limited because the call caps the upside, but losses are partly protected by the premium received from selling the call. A Short Put strategy also earns a fixed premium and has limited profit (the premium) with potential loss if the stock price falls below the strike price. When you compare both payoffs, they behave the same way — both benefit when the stock price stays steady or rises slightly, and both lose when the price drops sharply. Therefore, a Covered Call has the same payoff profile as a Short Put strategy.","answer_source":"explicit"},{"n":50,"q":"The price of Stock P and the price of stock Q is the same at Rs. 500. If every thing else is constant and if Stock P is more volatile than Stock Q, the call option on ______ will be priced higher.","options":["Stock P","Stock Q","Both calls will be equally priced","Inadequate information"],"answer":0,"explanation":"More the volatility in a stock, higher will be its price of its call and put option as compared to less volatile stocks of the same price. Vega is the measure of the sensitivity of an option price to changes in market volatility. It is the change of an option premium for a given change in the underlying volatility.","answer_source":"manual"}]},{"category":"Equity Derivatives","set":"Set 3","count":50,"questions":[{"n":1,"q":"What is the minimum age requirement for a designated partner to obtain membership as a trading member on a stock exchange ?","options":["18 years","21 years","25 years","28 years"],"answer":1,"explanation":"Stock exchanges require that a designated partner or proprietor of a trading member firm must be at least 21 years old to ensure legal capacity to enter contracts and meet regulatory responsibilities.","answer_source":"explicit"},{"n":2,"q":"Under the interoperability framework for clearing corporations, market participants are permitted to:","options":["Execute trades on a single exchange and settle through multiple clearing corporations","Execute trades on an exchange and clear only through the associated clearing corporation","Execute trades across multiple exchanges and clear through a single clearing corporation","Clear trades directly through a clearing corporation without the involvement of exchanges"],"answer":2,"explanation":"The interoperability framework introduced by SEBI was designed to unbundle the rigid link between a stock exchange and its affiliated clearing corporation. The interoperability of clearing corporation framework allows market participants to choose a single clearing corporation for settlement, even when they trade on multiple exchanges. This improves operational efficiency, reduces collateral requirements, and provides flexibility to participants.","answer_source":"explicit"},{"n":3,"q":"Which of the following statements is correct regarding a long position in a futures contract?","options":["It can be reversed only with the original counterparty","It can be reversed with any counterparty on the exchange platform","It can be reversed only with the permission of the stock exchange","It must be held until the contract expires"],"answer":1,"explanation":"A long futures position does not have to be held until expiry. Since the exchange clearing corporation is the counterparty to all trades, you can square off your position at any time by selling the same contract. This reversal can be done with any counterparty on the exchange platform, not just the one you originally bought from, and no special permission is required.","answer_source":"explicit"},{"n":4,"q":"Mr. P and Mr. Q, both Clearing Members, maintained liquid assets of Rs. 10 crore each (equity shares and cash) on 1st July. During the next 30 days, the value of Mr. P’s shares increased, while the value of Mr. Q’s shares declined. If both deal only in index futures in derivatives segment, which statement is true?","options":["Mr. P will be eligible for a higher maximum exposure than Mr. Q","Mr. Q will be eligible for a higher maximum exposure than Mr. P","Both will be eligible for the same maximum exposure","None of the above"],"answer":0,"explanation":"Exposure limits in the derivatives segment are linked to the value of Liquid Assets maintained by the clearing member. Since Mr. P’s deposited shares have appreciated, his available collateral value increases. Mr. Q’s collateral value reduces due to depreciation of shares, lowering his permissible exposure. Hence, Mr. P can take higher exposure than Mr. Q.","answer_source":"manual"},{"n":5,"q":"Which of the following instruments is regulated and traded under the provisions of the Securities Contracts (Regulation) Act, 1956?","options":["Cryptocurrencies","Foreign exchange","Debentures","Physical units of real estate"],"answer":2,"explanation":"Under the Securities Contracts (Regulation) Act, 1956, instruments classified as securities include shares, bonds, and debentures. These are tradable financial instruments regulated under the Act. In contrast, physical real estate units, cryptocurrencies, and foreign exchange transactions are governed by other laws, not SCRA. Hence, only debentures fall under its purview.","answer_source":"explicit"},{"n":6,"q":"Identify the option which has an intrinsic value?","options":["A put option with a strike price of 700 when the underlying stock price is Rs. 745","A put option with a strike price of 170 when the underlying stock price is Rs. 125","A call option with a strike price of 200 when the underlying stock price is Rs. 180","A call option with a strike price of 350 when the underlying stock price is Rs. 260"],"answer":1,"explanation":"An option has intrinsic value only when it is in-the-money. A Call option has intrinsic value if the stock price is above the strike price. A Put option has intrinsic value if the stock price is below the strike price. A put option is valuable when you can sell at a higher price than the market price. In the given choices, the put option with a strike price of 170 and a market price of Rs. 125 allows the holder to sell above market value. Hence, this option has intrinsic value equal to Rs. 45 (170 − 125). In other words : An option has intrinsic value when exercising it immediately gives a profit. A put option has value when the market price is below the strike price, and a call option has value when the market price is above the strike price. Only in Option 2, the stock price (Rs. 125) is lower than the put strike price (Rs. 170).","answer_source":"explicit"},{"n":7,"q":"Who can trade in derivative products?","options":["Any broker who is registered with SEBI can trade in derivative products","Any broker who is registered with SEBI for trading in derivatives products can trade in derivatives","Any member of a registered Stock Exchange","All of the above"],"answer":1,"explanation":"A normal equity market SEBI registered broker cannot deal in derivatives. The broker has to be specially registered for dealing in derivative products with SEBI to deal in derivatives.","answer_source":"explicit"},{"n":8,"q":"A loss which is incurred on derivatives transactions and which are carried out in a recognized stock exchange can be carried forward for a period of ______ .","options":["5 assessment years","7 assessment years","8 assessment years","10 assessment years"],"answer":2,"explanation":"Loss on derivative transactions can be set off against any other income during the year (except salary income). In case the same cannot be set off, it can be carried forward to subsequent assessment year and set off only against any other non-speculative business income of the subsequent year. Such losses can be carried forward for a period of 8 assessment years.","answer_source":"explicit"},{"n":9,"q":"A trader has a short position in a futures contract. If prices of this futures contract increases, than the mark-to-market margin account of the trader will be ______ .","options":["Credited for the loss","Credited for the gain","Debited for the loss","Debited for the gain"],"answer":2,"explanation":"In a short position, if the price increases, there is a loss. So, the mark to market margin will be debited.","answer_source":"explicit"},{"n":10,"q":"How is the forward contract, which is for hedging purpose, accounted for in books of accounts?","options":["The premium or discount will be shown in the Profit and Loss Account","The premium or discount will be ignored for accounting","The premium or discount will be amortized over the life of contract","No premium or discount will be recognised in the books of accounts"],"answer":2,"explanation":"Accounting for Forward Contract as per Accounting Standard - 11 When forward contract is for hedging - The premium or discount (i.e., difference between the value at spot rate and forward rate) should be amortized over the life of contract. - Exchange difference (difference between the value of settlement date/ reporting date and value at previous reporting date/ inception of the contract) is recognized in Profit & Loss statement of the year. - Profit/ loss on cancellation/ renewal of forward contract are recognized in P&L of the year.","answer_source":"explicit"},{"n":11,"q":"Why does 'Screen based trading' has a edge over 'Floor trading'?","options":["The technology needs are lower","There is no need to route the order through an exchange","There is transparency in trade execution and execution price","There are no set up costs in screen based trading"],"answer":2,"explanation":"Screen based (Trading thro' computers) trading is fully transparent. All the derivatives exchanges in India provide a fully automated screen-based trading platform for index futures, index options, stock futures and stock options. These trading systems support an order driven market and simultaneously provide complete transparency of trading operations. Derivative trading is similar to that of trading of equities in the cash market segment. All these exchanges have developed software for the F&O market to facilitate efficient and transparent trading in futures and options instruments.","answer_source":"explicit"},{"n":12,"q":"A trading member reaches his prescribed position limits, therefore he will ________ .","options":["be allowed to take only 5% additional exposure","not be able to reverse his position","be able to take fresh new positions for his clients but not in his proprietary account","not be able to open new positions"],"answer":3,"explanation":"A trading member, on reaching the prescribed limits, cannot open new positions. But he can reverse existing positions. Position limits are an important part of the risk management framework of a derivatives exchange. A position limit on a derivatives exchange is a restriction on the ownership that limits the number of derivatives contracts that a trading member or client, acting individually or together with others, can own. When client-level position limits are exceeded, the clearing member/ trading member must ensure that the client does not take any fresh positions and the existing positions must be reduced within permissible limits.","answer_source":"explicit"},{"n":13,"q":"On announcement of the record date for merger/demerger, the unexpired futures and options contracts on the underlying securities which are outstanding on the last cum date ________ .","options":["Will continue to be traded till their expiry date","Will compulsorily be settled at the settlement price on the last cum date","Will be squared up by the broker at the day’s opening price","Will be closed-off by the merged /demerged company at a predetermined price"],"answer":1,"explanation":"On announcement of the record date for merger/demerger, the last cum-date for merger/demerger would be determined by the Exchange/ Clearing Corporation. Un-expired contracts in the underlying, which shall cease to exist subsequent to the merger/demerger, outstanding as on last cum-date shall be compulsorily settled at the settlement price. The settlement price shall be the last available closing price of such underlying in the Capital Market segment of the Exchanges, on the last cum-date.","answer_source":"explicit"},{"n":14,"q":"Identify the INCORRECT statement with respect to Tracking error of index funds.","options":["From the point of view of the investors a low tracking error is desirable","Tracking error can also arise due to mutual fund expenses","Tracking error is same for all index funds as it is fixed by the regulator","Cash balances which are maintained by the fund manager can cause tracking error"],"answer":2,"explanation":"Tracking error measures how closely an index fund’s performance follows its benchmark index. A low tracking er
