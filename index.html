ror is desirable (1, correct). It can arise due to mutual fund expenses like expense ratios (2, correct) Cash balances held for liquidity, causing deviations from the index (4, correct). However, tracking error is not fixed by the regulator and varies across index funds based on management, expenses, and strategy. (Therefore statement 3 is incorrect)","answer_source":"explicit"},{"n":15,"q":"Identify the FALSE statement with respect to Options.","options":["Option contracts are NOT symmetrical regarding the rights and obligations of the parties involved","Buyer of an option gets the right while seller of an option bears the obligation","Options contracts have non-linear payoffs","Options contracts have linear payoffs"],"answer":3,"explanation":"Options have non-linear payoffs: The profit/loss profile of options is not a straight line; it depends on factors like strike price, premium, volatility, and time decay. In case of futures contracts, long as well as short position has unlimited profit or loss potential. This results into linear payoffs for futures contracts. However, option contracts do not have linear payoffs as the buyers and sellers have different obligations and risk factors. The buyer of an option has limited risk (premium which he pays) but can earn unlimited profits whereas the seller of the option has unlimited risk but can earn only limited profits (premium which he receives). Option contracts are not symmetrical as the buyers and sellers have different obligations and risk factors. The buyer has limited risk where as seller of an option has unlimited risk. Thus - 'Options contracts have linear payoffs' - is the false statement.","answer_source":"explicit"},{"n":16,"q":"Who becomes a legal counter party to every trade in futures transactions on a recognised stock exchange?","options":["SEBI","Custodian","Clearing Corporation","Depository"],"answer":2,"explanation":"Clearing Corporation is responsible for clearing and settlement of all trades executed on the F&O Segment of the Exchange. It acts as a legal counterparty to all trades on this segment and also guarantees their financial settlement.","answer_source":"explicit"},{"n":17,"q":"The BID PRICE is always __________ .","options":["Higher than ASK PRICE","Lower than ASK PRICE","Equal to ASK PRICE"],"answer":1,"explanation":"Bid price is the price buyer is willing to pay and ask price is the price seller is willing to sell. For example the prices as seen on the screen will be – Reliance Inds 2500 – 2501, where 2500 is the bid price and 2501 is the ask price. So the Bid price is always lower than Ask price.","answer_source":"explicit"},{"n":18,"q":"A Call Option will give the holder of the option a right to buy how much of the underlying from the writer of the option?","options":["The specified quantity or more than the specified quantity","The specified quantity or less than the specified quantity","Only the specified quantity"],"answer":2,"explanation":"Only the specified quantity as per the lot size of the option contract.","answer_source":"explicit"},{"n":19,"q":"A Derivative market helps in transferring the risk from ________ .","options":["Speculators to Hedgers","Arbitrageurs to Hedgers","Speculators to Arbitrageurs","Hedgers to Speculators"],"answer":3,"explanation":"A derivatives market primarily facilitates the transfer of risk from hedgers, who want to reduce or eliminate price risk, to speculators, who are willing to assume that risk in the hope of earning profits. Hedgers use derivative contracts to protect themselves against adverse price movements, while speculators accept the risk based on their market expectations. Thus, derivatives improve risk management and contribute to more efficient financial markets.","answer_source":"explicit"},{"n":20,"q":"What is the risk of bad delivery in an index futures contract?","options":["The risk does not exist","The risk is very high","The risk is there but quiet low","The risk is around 25% of the total deliveries"],"answer":0,"explanation":"Index futures are financial contracts whose underlying asset is a specific index like Nifty 50 or Bank Nifty. According to the SEBI regulations, all index futures contracts are cash-settled i.e. there is no delivery of stocks. As there is no delivery, risk of bad delivery does not arise. (Bad delivery means delivery of securities which cannot be legally transferred to the buyer due to some issue with the securities. For eg. Fake or stolen securities).","answer_source":"heuristic"},{"n":21,"q":"What happens to the intrinsic value of a Put Option if the Strike Price is taken down?","options":["The intrinsic value goes up","The intrinsic value goes down","Their is no change in the intrinsic value"],"answer":1,"explanation":"The intrinsic value of an option refers to the amount by which the option is In-the-money i.e., the amount an option buyer will realize, before adjusting for premium paid, if he exercises the option instantly. For a put option which is In-the-money, the intrinsic value is the excess of Strike price (X) over the spot price (S). Thus, the intrinsic value of put option can be calculated as X-S, with a minimum value possible as zero. For eg – If strike price is 100 and spot price is 90, the intrinsic value is 10 If the strike price is reduced to 95, the intrinsic value will be 5. Therefore the intrinsic value of put option goes down as strike price is taken down.","answer_source":"explicit"},{"n":22,"q":"Mr. Harish had purchased 20 call options on a stock by paying a premium of Rs 10 per call (Strike price of Rs. 125). The stock price has closed at Rs. 100 on the exercise date. Based on economic rationale alone, Mr. Harish _________ .","options":["Should exercise the option but he should not take delivery of the underlying","Should exercise the option","Should not exercise the option","Should exercise the option as he likes the management of the company"],"answer":2,"explanation":"Mr. Harish has purchased a call option which means he believed that the price of that call will go up. Instead the price has fallen. So he should not exercise the option and the maximum loss he will suffer is the premium paid by him. Mr. Harish bought calls with strike Rs 125 while the stock closed at Rs 100 Since the market price less than strike price, the call option is Out-of-the-Money and has no intrinsic value. Exercising would mean buying at Rs 125 when the market offers Rs 100 — an irrational loss. Therefore, based on economic rationale, Mr. Harish should not exercise the option; his loss is limited to the premium paid (Rs 10 per call).","answer_source":"explicit"},{"n":23,"q":"Identify the True formula for Cost of Carry model.","options":["Price of Futures = Cost of carry","Price of Futures = Spot price","Price of Futures = Spot + Cost of carry","Price of Futures = Spot - Cost of carry"],"answer":2,"explanation":"Cost of Carry is the relationship between futures prices and spot prices. For stock derivatives, carrying cost is the interest paid to finance the purchase. For example, assume the share of XYZ Ltd is trading at Rs. 500 in the cash market. A person wishes to buy the share, but does not have money. In that case he would have to borrow Rs. 500 at the rate of, say, 12% per annum. So 1% ie. Rs 5 ( 1% of Rs 500) is the per month interest cost. and this Rs 5 is the cost of carry. The future price (ideally) at the beginning of month will be Spot Price + Cost of Carry ie. Rs 500 + Rs 5 = Rs 505.","answer_source":"explicit"},{"n":24,"q":"The cost incurred due to the Bid-Ask spread is known as ______ .","options":["Transaction cost","Spread cost","Margin cost","Impact cost"],"answer":3,"explanation":"Impact cost is a measure of the cost incurred due to the bid-ask spread. Impact cost represents the cost of executing a transaction in a given stock, for a specific predefined order size, at any given point of time. Impact cost is the measure of liquidity of the security. It is the cost a buyer or seller has to incur for a particular quantity of order at a given point of time due to the existing liquidity condition of the security available in the market.","answer_source":"explicit"},{"n":25,"q":"Mr. Rohit is a Chartered Accountant and Mr. Ramesh is a Commerce Graduate. Both are clearing members of a recognized exchange. Base on this information, identify the TRUE statement.","options":["Mr. Rohit will enjoy higher exposure limits than Mr. Ramesh","Mr. Ramesh will enjoy higher exposure limits than Mr. Rohit","Both of them will enjoy the same exposure limits","Insufficient information to draw a conclusion"],"answer":3,"explanation":"Position limits are the maximum exposure levels which can be assumed by each investor or Clearing Member or the market as a whole. Such position limits are defined by SEBI. The exchanges lay down exposure limits either in rupee terms or as percentage of the Trade Guarantee Fund (TGF)/Settlement Guarantee Fund (SGF). Thus, exposure limits is dependent on the funds deposited by the Clearing member and not his education qualifications.","answer_source":"explicit"},{"n":26,"q":"Why is the Clearing Corporation considered very important in the derivatives market?","options":["Clearing Corporation provides settlement guarantee and assumes role of counterparty for each trade","Clearing Corporation deals with exchanges","Clearing Corporation related with stocks","Clearing Corporation collects margins from members"],"answer":0,"explanation":"Clearing corporations are required to have in place a Core Settlement Guarantee Fund (SGF). The primary objective of the Core SGF is to have a fund for each segment to guarantee the settlement of trades executed in the respective segment of the stock exchange. The Clearing Corporation acts as a legal counterparty for every contract.","answer_source":"heuristic"},{"n":27,"q":"What will the option holder receive when he exercises a put option on an index?","options":["He will receive cash amount equal to excess of spot price over exercise price","He will receive cash amount equal to excess of exercise price over spot price","He will receive cash amount equal to spot price","He will receive nothing"],"answer":1,"explanation":"An option will only be exercised when its In the Money (Profitable) A put option is In the Money when the Exercise price is higher than the spot price. So the excess of exercise price over the spot price will be receivable by the option holder. (IN THE MONEY - A call option with a strike (exercise) price that is lower than the market (spot) price of the underlying asset, or a put option with a strike price that is higher than the market price of the underlying asset. In the money means that your stock option is worth money and you can turn around and sell or exercise it.)","answer_source":"explicit"},{"n":28,"q":"Under which Act / Regulations is the Suspicious Transaction reporting required?","options":["SEBI Insider Trading Regulations","Foreign Account Tax Compliance Act (FATCA)","Anti-Money laundering (AML) and Combating of Financial Terrorism (CFT) Regulations","Foreign Exchange Management Act (FEMA)"],"answer":2,"explanation":"Under the Anti-Money Laundering (AML) and Combating of Financial Terrorism (CFT) regulations, certain suspicious transactions are required to be reported to the Financial Intelligence Unit – India (FIU-IND) set up by the Government to detect possible attempts at money laundering.","answer_source":"explicit"},{"n":29,"q":"Identify the FALSE statement with respect to trading on the OTC market.","options":["OTC markets have a centralised clearing and settlement of all trades","On the OTC markets, there are no limits on the positions that buyers and sellers can take","Buyers and sellers can trade in tailor-made contracts in the OTC markets","In the OTC markets, risk management is usually the responsibility of the parties themselves"],"answer":0,"explanation":"Forward contracts are also known as OTC contracts. It is a contractual agreement between two parties to buy/sell an underlying asset at a certain future date for a particular price that is pre-decided on the date of contract. Both the contracting parties are committed and are obliged to honour the transaction irrespective of the price of the underlying asset at the time of delivery. Since forwards are negotiated between two parties, the terms and conditions of contracts are customized/tailor made. These contracts are not regulated by an Exchange and there is no centralised clearing and settlement of trades.","answer_source":"manual"},{"n":30,"q":"Mr. Menon has bought a futures contract and the price rises. In this case, Mr. Menon will _________ .","options":["Make a profit","Make a loss","Make a profit or make a loss depending on the situation","Insufficient information to arrive at a conclusion"],"answer":0,"explanation":"Mr. Menon has bought the future contract which means he believes that the prices will rise so that he can gain from it. So he will make a profit if the price rises.","answer_source":"heuristic"},{"n":31,"q":"Ms. Deepika is bearish on the market, so she is expecting the market to _____ .","options":["Rise","Fall","Remain constant","Move sideways"],"answer":1,"explanation":"Investors who have a bearish on the stock or index expect the stock price or index level to fall, take a short position in the stock futures or index futures contract. (Investors who have a bullish view on the underlying stock or index expect the stock price or index level to increase and they take a long position in the stock futures or index futures contract).","answer_source":"explicit"},{"n":32,"q":"As per the Income Tax Act, any loss on derivatives transaction can be set-off against which income in the same year?","options":["Income from Salary","Income from any other business","Income from Capital Gains","Income from House property"],"answer":1,"explanation":"Finance Act, 2005 implies that income or loss on derivative transactions which are carried out in a “recognized stock exchange” is not taxed as speculative income or loss. Thus, loss on derivative transactions can be set off against any other income during the year (except salary income).","answer_source":"explicit"},{"n":33,"q":"Identify the correct statement with respect to a short position in a PUT option.","options":["Short position in a put option can be closed out by executing a long position in a put option with any exercise date and exercise price","Short position in a put option can be closed out by executing a long position in a put option with the same exercise date and exercise price","Short position in a put option can be closed out by executing a short position in a call option with the same exercise date and exercise price","Short position in a put option can be closed out by executing a long position in a call option with the same exercise date and exercise price"],"answer":1,"explanation":"A short position in a Put Option can be closed out (squared up) only by buying the same Put Option of the same exercise date and exercise (strike) price.","answer_source":"explicit"},{"n":34,"q":"If all other features are same, an American Call Option will have a higher value than that of European option. State whether True or False?","options":["The above statement is FALSE","The above statement is TRUE","Value depends on market conditions and this cannot be ascertained","Inadequate information"],"answer":1,"explanation":"American option: In case of an American option, the owner (buyer/holder) of such option can exercise his right at any time on or before the expiry date/day of the contract European option: In case of a European option, the owner (buyer/holder) of such option can exercise his right only on the expiry date/day of the contract American options are generally valued higher than European options as American options allow option holders to exercise the option at any time prior its maturity date, thus increasing the value of the option to the holder relative to European options, which can only be exercised at maturity. In India, all index and stock options are European style options.","answer_source":"explicit"},{"n":35,"q":"The key to determining if a futures transaction is for hedging or speculation lies in ______ .","options":["basic intention of the person entering into the transaction","whether there already exists a related commercial position which is has a risk of loss due to price movement","whether the futures position is held till expiry date","whether the transaction has resulted in a profit or a loss"],"answer":1,"explanation":"Hedging basically means doing a trade to reduce the risk of adverse price movements in an asset. Normally, a hedge consists of taking an offsetting position in a related security, such as a futures contract. A futures transaction is considered hedging when it is linked to an existing commercial position that faces price risk. The presence of such an underlying exposure distinguishes hedging from speculation. Intention, profit or loss or holding the contract till expiry do not determine the nature of the transaction.","answer_source":"explicit"},{"n":36,"q":"At a price level of Rs. 6300, what will be the value of one lot of ABC futures contract (Contract multiplier 50)?","options":["Rs. 5,00,000","Rs. 6,30,000","Rs. 3,15,000","Rs. 4,25,000"],"answer":2,"explanation":"The value of the futures contract is the Price X Lot size = Rs 6300 X 50 = Rs 315000","answer_source":"explicit"},{"n":37,"q":"If there is a debit balance in the _________ , it represents anticipated loss on a futures contract.","options":["Mark-to-market Margin account","Additional Margin account","Initial Margin account","Exposure Margin account"],"answer":0,"explanation":"Accounting for open interests as on the balance sheet date : Keeping in view \"prudence\" principle, provisions should be created by a debit to the profit and loss account for anticipated loss equivalent to the debit balance in the \"Mark-to-Market Margin Account\".","answer_source":"heuristic"},{"n":38,"q":"A trader has taken a short position of one contract in September ABC futures (Contract Multiplier 50) at a price of Rs. 1200. When he closed this position after some days, he realised that he has made a profit of Rs. 8000. Identify the action which would have enabled him to generate this profit of Rs. 8000.","options":["Selling one September ABC futures contract at Rs. 1040","Selling one September ABC futures contract at Rs. 1080","Buying one September ABC futures contract at Rs. 1040","Buying one September ABC futures contract at Rs. 1080"],"answer":2,"explanation":"The trader is short ie. he has sold ABC futures. He will make a profit when the future price falls. His profit is Rs 8000 and lot size is 50, so per share he has to get Rs 160 (8000 / 50) to make a profit of Rs 8000 (160 x 50) So when the ABC futures falls to 1040 and the trader buys it to square up his position, he will make a profit of Rs 8000. Other way to calculate : For a short futures position, profit arises when the price falls. Formula: Profit = (Sell Price − Buy Price) × Contract Multiplier Given: Sell Price = 1200 Profit = 8000 Multiplier = 50 So, 8000 = (1200 − Buy Price) × 50 ⇒ (1200 − Buy Price) = 160 ⇒ Buy Price = 1200 − 160 = 1040 To close a short position, the trader must buy the contract. Correct answer: 3. Buying one September ABC futures contract at Rs. 1040","answer_source":"explicit"},{"n":39,"q":"A member has two client M and N. M has bought 300 contracts and N has sold 250 contracts in October ABC futures series. Calculate the outstanding liability (open position) of the member towards Clearing Corporation in number of contracts?","options":["550","50","300","NIL"],"answer":0,"explanation":"While calculating the outstanding liability of a member, the total of all clients open position is taken into account. The positions cannot be netted against two clients. So in the above case the total open position is 300 + 250 = 550 contracts.","answer_source":"manual"},{"n":40,"q":"Option premium is the price which is paid by the _______ .","options":["Option seller to option buyer","Option buyer to option seller","Option buyer and option seller to the exchange","Option buyer and option seller to a third party"],"answer":1,"explanation":"Option Premium is the price which the option buyer pays to the option seller.","answer_source":"explicit"},{"n":41,"q":"How can an open position in a futures contract be closed?","options":["It has to be closed compulsorily before maturity","It can be closed by intra day transactions only","It can be closed only at maturity","It can be closed anytime on or before the date of maturity through reversed (square-off) transaction"],"answer":3,"explanation":"A futures position can be closed anytime before the maturity date by squaring off the transaction.","answer_source":"explicit"},{"n":42,"q":"According to the corporate hierarchy for users defined in the trading system for stock exchanges, the exposure limits for the branches of the broking firm can be defined only by the ________ .","options":["Dealer","Branch Manager","Corporate Manager","Firm Manager"],"answer":2,"explanation":"In the Futures and options trading software, trading member will have a provision of defining the hierarchy amongst users of the system. This hierarchy comprises: Corporate Manager, Branch Manager and Dealer Corporate Manager : As a user, it is the highest level in a trading firm. Corporate Manager can perform all the functions such as order and trade related activities, receiving reports for all branches of the trading member firm and also all dealers of the firm. Along with this he can also define exposure limits for the branches of the firm. This facility is available only to the corporate manager.","answer_source":"explicit"},{"n":43,"q":"Mr. Ashish had purchased 25 PUT options on a stock X by paying a premium of Rs 20 per put (strike price of Rs 180). The stock price has closed at Rs 240 on the exercise date. In such a situation. Mr. Ashish will choose to _____ .","options":["Exercise the option","Not to exercise the option","Exercise the option but should decline giving delivery of the underlying","Exercise the option as he likes the company X and its management"],"answer":0,"explanation":"Mr. Ashish has bought Put options assuming that prices will fall and he will make a profit. But the price has risen ( from Rs 180 to Rs 240) and he is in a loss. So he will choose not to exercise his option. His loss will be restricted to the premium paid.","answer_source":"explicit"},{"n":44,"q":"A buyer of Out-Of-the-Money (OTM) Call option is _______ .","options":["Bullish and pays the premium","Bullish and receives the premium","Bearish and pays the premium","Bearish and receives the premium"],"answer":0,"explanation":"A buyer of a Call Option, whether ITM, ATM or OTM, is bullish and payer of premium.","answer_source":"manual"},{"n":45,"q":"Identify the CORRECT statement?","options":["The margins paid by institutional investors are higher than retail investors","Margins in derivatives trading depend on volatility and price movement of the underlying","The margins paid by retail investors are higher than institutional investors","There are no margins on derivatives trading for Institutional investors"],"answer":1,"explanation":"Margins payable for a derivative instrument depends on the level of volatility in prices of that instrument. As high volatility assets carry more risk, the exchange would charge higher initial margin on them. (Both Institutional investors and Retail investors pay the same margin)","answer_source":"explicit"},{"n":46,"q":"The relationship between the spot price and the future price is known as _____ .","options":["Dividend","Risk premium","Payout difference","Cost of Carry"],"answer":3,"explanation":"Cost of Carry is the relationship between futures prices and spot prices. For equity derivatives, carrying cost is the interest paid to finance the purchase less (minus) dividend earned.","answer_source":"explicit"},{"n":47,"q":"Everest Ltd. entered into a contract with Bank of Baroda under which Everest Ltd will receive interest at 7.5% p.a. and pay interest to Bank of Baroda at MIBOR on a principal of Rs. 25 crore for a period of 3 years from today. This contract is known as ______ .","options":["Swap","Option contract","Futures contract","Forward contract"],"answer":0,"explanation":"A Swap is an agreement made between two parties to exchange cash flows in the future according to a prearranged formula. Swaps are, broadly speaking, series of forward contracts. Swaps help market participants manage risk associated with volatile interest rates, currency exchange rates and commodity prices.","answer_source":"manual"},{"n":48,"q":"An investor, who is anticipating a broad stock market fall, but is not willing to sell his","options":["entire portfolio of stocks, can offset his potential losses by shorting a certain number of Index futures.","True","False"],"answer":0,"explanation":"Index derivatives are useful as a tool to hedge against the market risk. An investor with a diversified equity portfolio, who wants to protect his portfolio from any temporary correction in the stock market can sell index futures for this purpose.","answer_source":"heuristic"},{"n":49,"q":"Ms. Mishra sold a Put option of strike Rs 500 on PQR stock for a premium of Rs 50. The lot size is 1000. On expiry day, PQR stock closed at Rs. 440. What is Ms. Mishra's net profit (+) or loss (-) ?","options":["+ 20,000","- 20,000","+ 10,000","- 10,000"],"answer":2,"explanation":"When one sells a put option, the view is bullish ie. price will rise. Here the price has fallen by Rs 60 (500-440). So there is a loss of Rs 60. When one sells an option, premium is received. Premium received is Rs 50. Therefore Net loss = 60 - 50 = 10 x lot sixe of 1000 = 10,000 loss.","answer_source":"explicit"},{"n":50,"q":"Each forward contract can have a different delivery location, a different maturity date and a different contract size. State whether True or False?","options":["True","False"],"answer":0,"explanation":"Forward contract is a contractual agreement between two parties to buy/sell an underlying asset at a certain future date for a particular price that is pre-decided on the date of contract. Since forwards are negotiated between two parties, the terms and conditions of contracts are customized. Each contract can have a different delivery location, maturity date and contract size.","answer_source":"manual"}]},{"category":"Equity Derivatives","set":"Set 4","count":50,"questions":[{"n":1,"q":"Loss incurred from speculative transactions is allowed to be set off against which of the following?","options":["Only speculative income","Only non-speculative income","Both of the above","None of the above"],"answer":0,"explanation":"As per tax rules, a loss from speculative transactions can be adjusted only against speculative profits. It cannot be set off against non-speculative or regular business income. Such losses may be carried forward to future years, but again only for set-off against speculative gains.","answer_source":"heuristic"},{"n":2,"q":"Which of the following statements regarding impact cost is correct ?","options":["Impact cost is lower for intraday transactions","Illiquid contracts have lower impact cost","Impact cost is a fee imposed by the Exchange","Wider bid–ask spreads lead to higher impact cost"],"answer":3,"explanation":"Impact cost measures the cost of executing a trade compared to the ideal price (mid-price between bid and ask). Impact cost is high when liquidity is low, and one of the strongest indicators of low liquidity is a large bid–ask spread. A wider spread means traders must buy at higher prices and sell at lower prices, increasing the slippage between the ideal price and the actual execution price. Therefore, contracts with large bid–ask spreads naturally experience higher impact costs.","answer_source":"explicit"},{"n":3,"q":"A trader with limited capital had a bullish outlook on a stock. The stock price went up significantly, validating his view. Which of the following positions would have generated the highest return on his invested capital?","options":["Short-selling the stock in the cash market by borrowing the shares","Taking a short position in the stock futures","Taking a long position in the stock futures","Buying the stock in the cash market"],"answer":2,"explanation":"Since the trader has limited capital, leverage becomes important. A long position in stock futures requires only a margin but gives exposure to the full value of the stock. When the stock price rises significantly, the profit relative to capital invested is highest in futures. Buying in the cash market needs full funds and hence gives a lower return on capital.","answer_source":"explicit"},{"n":4,"q":"The debit balance in the Mark-to-Market (MTM) margin account, as on the balance sheet date, should be classified as :","options":["Part of reserves and surplus","A long-term loan","A current asset under loans and advances","A current liability"],"answer":2,"explanation":"When the Mark-to-Market (MTM) margin account shows a debit balance, it means the company has paid margin but is yet to recover it. This represents money receivable, not payable. Hence, it is shown as a current asset under loans and advances in the balance sheet, not as a liability or reserve.","answer_source":"explicit"},{"n":5,"q":"Which of the following is true with respect to FORWARD contracts?","options":["Always result in delivery","May or may not result in delivery","Are always settled in cash","Always carry a settlement guarantee from a clearing corporation"],"answer":1,"explanation":"Forward contracts are private, OTC agreements between two parties, and the settlement method is entirely up to them. They may choose to settle by physical delivery of the underlying asset or settle in cash based on price differences. Unlike exchange-traded futures, forwards do not have a clearing corporation guarantee, so settlement terms are flexible and customizable.","answer_source":"explicit"},{"n":6,"q":"According to regulatory guidelines, which of the following correctly describes how brokers must communicate the execution or non-execution of client orders?","options":["Inform the client about the execution or non-execution of the order within two hours from the time of execution.","Inform the client about the execution or non-execution of the order within one hour from the time of execution.","Inform the client about the execution or non-execution of the order by the end of the trading day.","Inform the client immediately about the execution or non-execution of the order."],"answer":3,"explanation":"Regulatory guidelines require brokers to promptly inform clients whether their orders have been executed or not. This ensures transparency, protects investors, and allows clients to take timely decisions.","answer_source":"explicit"},{"n":7,"q":"How do stock exchanges interact with buyers and sellers?","options":["By directly interacting with buyers and sellers","Through trading members","Through clearing members","Via SEBI"],"answer":1,"explanation":"Exchanges do not deal directly with buyers and sellers. Instead, all trades are routed through Trading Members (brokers) who are registered with the exchange. These trading members execute client orders on the exchange platform, while clearing members handle the settlement process.","answer_source":"explicit"},{"n":8,"q":"The inspection of records of stock brokers, as provided under the SEBI (Stock Brokers) Regulations, 1992, is primarily carried out to _____.","options":["Check compliance with the Companies Act and related rules","Confirm that authorized persons function exclusively from the broker’s office","Ensure that stock brokers do not engage in any business other than stock broking","Verify that books of accounts and other records are maintained as prescribed"],"answer":3,"explanation":"Under SEBI (Stock Brokers) Regulations, 1992, inspections are carried out to check whether brokers are maintaining proper records, books of accounts, and documents as prescribed. The focus is on compliance with SEBI’s requirements for transparency, accountability, and investor protection. It is not specifically about verifying office premises, Companies Act compliance, or restricting brokers from other businesses.","answer_source":"explicit"},{"n":9,"q":"Delta refers to the Rate of change in the _______ .","options":["Option premium per day","Option premium for a unit change in spot price of the underlying","Option premium for a unit change in interest rate","Option premium for a unit change in volatility of the underlying"],"answer":1,"explanation":"Option premiums change with changes in the factors that determine option pricing i.e., factors such as strike price, volatility, term to maturity, etc. The sensitivities most commonly tracked in the market are known collectively as “Greeks” represented by Delta, Gamma, Theta, Vega and Rho The most important of the ‘Greeks’ is the option’s “Delta”. This measures the sensitivity of the option value to a given small change in the price of the underlying asset. It may also be seen as the speed with which an option moves with respect to price of the underlying asset. Delta = Change in option premium/ Unit change in price of the underlying asset.","answer_source":"explicit"},{"n":10,"q":"What should be the market-wide position limit for a stock for it to be eligible for launch in the futures and options contracts in the exchange traded equity derivatives segment in India?","options":["At least Rs. 100 crores","At least Rs. 500 crores","At least Rs. 1000 crores","At least Rs. 1500 crores"],"answer":3,"explanation":"As per the updated SEBI eligibility criteria for stocks to be included in the Futures & Options (F&O) segment, one of the key metrics is the Market Wide Position Limit (MWPL). A stock must have a minimum MWPL of Rs. 1,500 crore (on a rolling basis using cash market data) to be considered eligible for launch in equity derivatives contracts.","answer_source":"explicit"},{"n":11,"q":"Mark-to-market margins are collected _____ .","options":["On a weekly basis","On a daily basis","Every 2 days","Every 3 days"],"answer":1,"explanation":"In the futures market, profits and losses are settled on day-to-day basis – called mark to market (MTM) settlement. The exchange collects these margins (MTM margins) from the loss making participants and pays to the gainers on day-to-day basis.","answer_source":"explicit"},{"n":12,"q":"For calculating the net worth of a clearing member, which of these is/are NOT considered?","options":["His Fixed Assets","His pledged securities","His membership card","All of the above"],"answer":3,"explanation":"The networth of the member shall be computed as follows: Capital + Free reserves Less non-allowable assets which are : - Fixed assets - Pledged securities - Member’s card - Non-allowable securities (unlisted securities) - Bad deliveries - Doubtful debts and advances - Prepaid expenses - Intangible assets - 30% marketable securities","answer_source":"explicit"},{"n":13,"q":"Which of these is NOT included in the Indian equity derivatives market?","options":["Options on individual stocks","Options on equity market indices","Futures on individual stocks","Interest rate futures"],"answer":3,"explanation":"Although NSE and BSE allows trading in Interest rate futures but it is not a part of equity derivatives.","answer_source":"explicit"},{"n":14,"q":"What does 'Near Month' futures contract mean?","options":["'Near Month' is the current month of the futures contract","'Near Month' is the next month after the current month of the futures contract","'Near Month' is the month of expiry of the futures contract","None of the above"],"answer":0,"explanation":"Futures contract have a maximum of 3-month trading cycle – the near month contract (which is the 1st / Current month ) the next month contract (which is the 2nd month ) and the far month contract (which is the 3rd month ). Thus, on May 10th, 20XX, index and stock futures contracts on the NSE are available for trading for the near month (May 20XX), the next month (June 20XX) and the far month (July 20XX).","answer_source":"heuristic"},{"n":15,"q":"State whether True or False - A trading member of a derivatives exchange can clear his trades through a Clearing member, who may or may not be a Professional clearing member.","options":["True","False"],"answer":0,"explanation":"A trading member of a derivatives exchange can indeed clear their trades through a Clearing Member, who may or may not be a Professional Clearing Member (PCM). The PCM is a specialized clearing member who clears trades on behalf of other trading members, but a regular clearing member can also perform this function.","answer_source":"manual"},{"n":16,"q":"If a speculator purchases a naked Call Option, this means he/she has a ______ .","options":["Mixed view","Bullish view","Myopic view","Bearish view"],"answer":1,"explanation":"A naked call option purchase means the speculator is betting that the underlying asset price will rise. Buying a call option gives the right to buy at the strike price. If the market price goes up, the call option gains value. This reflects a bullish view on the underlying asset.","answer_source":"explicit"},{"n":17,"q":"__________ guarantees the performance of exchange traded contracts.","options":["Clearing Corporation","SEBI","Depositories","Custodians"],"answer":0,"explanation":"Clearing Corporation is responsible for clearing and settlement of all trades executed in the F&O Segment of the Exchange. According to the legal principle of ‘novation’, the Clearing Corporation becomes the central counterparty to all trades that take place on the exchange’s derivatives platform. A clearing corporation guarantees contract performance (settlement of transactions).","answer_source":"manual"},{"n":18,"q":"When an investor gives instruction to his broker to buy a certain number of contracts at or below a specific price, the order is called as _________ .","options":["Market Order","Arbitrage Order","Spread Order","Limit Order"],"answer":3,"explanation":"Limit order is an order to buy or sell a contract at a specified price. The user has to specify this limit price while placing the order and the order gets executed only at this specified limit price or at a better price than that.","answer_source":"explicit"},{"n":19,"q":"Which of these options is an example of a Calendar Spread?","options":["Going short on the underpriced futures contract of one month and at the same time buying the overpriced futures contract of another month","Buying stock futures contract while at the same time shorting the stock","Buying the underpriced futures contract of one month and simultaneously selling the overpriced futures contract of another month","Going short on the stock futures contract while simultaneously buying the stock"],"answer":2,"explanation":"Calendar spread refers to the arbitrage between futures contracts of different expiration months. In this strategy, the arbitrageur buys and sells the futures contracts of two different months. To execute this strategy, the arbitrageur must identify which contract to buy or sell. The principal rule of arbitrage is that one must buy the underpriced contract and sell the overpriced one. Hence, the arbitrageur needs to compute the fair price of both futures contracts and compare these with the traded prices, to decide which contract is overpriced and which one is underpriced.","answer_source":"explicit"},{"n":20,"q":"What is the rate of STT on the sale of an index or stock futures contract?","options":["0.01%","0.0125%","0.02%","0.05%"],"answer":3,"explanation":"The Securities Transaction Tax (STT) on sale of stock futures / index is 0.05% on the price at which such futures is traded.","answer_source":"explicit"},{"n":21,"q":"When does the Clearing Corporation change the initial margin requirements?","options":["Clearing Corporation can continuously change the initial margin requirements according to changes in market volatility","Clearing Corporation can continuously change the initial margin requirements whenever their is an increase in trading volumes","Clearing Corporation changes the initial margin requirements periodically, based on specific instructions received from SEBI","Clearing Corporation changes the initial margin requirements periodically, after each expiry date"],"answer":0,"explanation":"The initial margin is dependent on price movement of the underlying asset. As high volatility assets carry more risk, the Exchange / Clearing Corporation would charge higher initial margin on them.","answer_source":"heuristic"},{"n":22,"q":"Complete the sentence : Shorter the time to expiry of a PUT Option, lesser will be its _______ .","options":["Assignment Value","Time Value","Intrinsic Value","Settlement Value"],"answer":1,"explanation":"Other things being equal, options tend to lose time value each day throughout their life. This is due to the fact that the uncertainty element in the price decreases. Thus shorter the time to maturity, lower will be the time value.","answer_source":"explicit"},{"n":23,"q":"The risks connected with trading in derivatives have to be laid down in which document?","options":["Contract Note which is sent to the client","The Risk Disclosure document","It can be conveyed verbally to the client","None of the above"],"answer":1,"explanation":"The broker is required to get a Risk Disclosure Document signed by the client, at the time of client registration. This document informs clients about the kind of risks that derivatives can involve for the client. It makes the client aware and informed about the various risks associated with derivatives trading.","answer_source":"explicit"},{"n":24,"q":"Identify the TRUE statement with respect to Option Spreads.","options":["A bullish call spread will result in an initial cash inflow for the trader","A bearish call spread will result in an initial cash inflow for the trader","A bullish put spread will result in an initial cash outflow for the trader","A bearish put spread will result in an initial cash inflow for the trader"],"answer":1,"explanation":"In a bearish call spread, there is a net in-flow of premium when the spread is initiated. A bear call spread is achieved by simultaneously selling a call option and buying a call option at a higher strike price but with the same expiration date. The maximum profit to be gained using this strategy is equal to the credit received when initiating the trade. (In a bearish put spread and bullish call spread there is a net out-flow of premium when the spread is initiated. In a bullish put spread, there is a net in-flow of premium when the spread is initiated.)","answer_source":"explicit"},{"n":25,"q":"Mr X sells one ABC stock futures contract at Rs. 745. What is his profit (+) or loss (-), if he purchases the contract back at Rs. 754 ? Lot size is 1500","options":["+13500","-13500","+9800","-9800"],"answer":0,"explanation":"When you sell a stock future contract you make a profit if the share price falls or you make a loss if the price rises. In this case, ABC stock futures has risen by Rs. 9 (754 - 745). So there will be a loss. Rs. 9 x 1500 (Lot size) = Loss of Rs 13500","answer_source":"explicit"},{"n":26,"q":"'SCORES' is the name given to ________ .","options":["SEBI’s web-based compliant redressal system","Securities Collateral Records System","Exchange’s risk management and margin system","Suspicious transaction reporting system"],"answer":0,"explanation":"SEBI’s web-based complaints redressal system is called SCORES (Sebi COmplaints REdress System). SCORES is a centralized grievance management system with tracking mechanism to know the latest updates and time taken for complaint resolution.","answer_source":"heuristic"},{"n":27,"q":"Why are the margins for calendar spreads in index futures low ?","options":["Because calendar spreads are not traded on an Exchange","Because calendar spreads are OTT transaction","Because the market risk is low in calendar spreads","Because calendar spreads are special transactions guaranteed by RBI"],"answer":2,"explanation":"A calendar spread in index futures involves taking opposite positions in the same index with different expiry dates. Since both contracts are on the same underlying index, price movements tend to offset each other, resulting in lower market (price) risk. Because of this reduced risk, exchanges prescribe lower margin requirements for calendar spreads compared to outright futures positions.","answer_source":"explicit"},{"n":28,"q":"Trader A wants to sell 20 contracts of August series at Rs 4500 and Trader B wants to","options":["5,02,050","2,70,000","4,10,000","2,32,050"],"answer":0,"explanation":"Payment of Initial Margin by a broker cannot be netted against two or more clients. So he will have to pay the margin for the open position of each of his clients. So margin payable for Trader A is : 20 x 4500 x 50 (Lot size) at 6% = Rs 2,70,000 Margin payable for Trader B is : 17 x 4550 x 50 (Lot size) at 6% = Rs 2,32,050 Total = Rs 5,02,050.","answer_source":"manual","continuation":["sell 17 contracts of September series at Rs 4550. Lot size is 50 for both these contracts.","The Initial Margin is fixed at 6%. How much Initial Margin is required to be collected","from both these investors (sum of initial margins of A and B) by the broker?"]},{"n":29,"q":"The money and securities which are deposited in a clients account _______ .","options":["Can be attached for meeting the obligations of the broker on his proprietary account","Cannot be attached for meeting the obligations of the broker on his proprietary account","Can or cannot be attached depends on the decision of Clearing Corporation","None of the above"],"answer":1,"explanation":"The securities or money deposited by clients cannot be attached for meeting broker’s obligation on his proprietary account. The broker has to maintain separate client bank account for segregation of client money. Also brokers should keep margins collected from clients in a separate bank account.","answer_source":"explicit"},{"n":30,"q":"In connection with the futures market, basis is ________ .","options":["The current interest rate in the economy","Volatility in the market","The difference between the futures price and spot price","Underlying market price"],"answer":2,"explanation":"The difference between the spot price and the futures price is called basis. If the futures price is greater than spot price, basis for the asset is negative. Similarly, if the spot price is greater than futures price, basis for the asset is positive.","answer_source":"explicit"},{"n":31,"q":"When the volatility of the underlying stock decreases, the premium of its Call option will _______ .","options":["Increase","Decrease","Not change"],"answer":1,"explanation":"Higher volatility = Higher premium, Lower volatility = Lower premium (for both call and put options). Therefore, with a decrease in volatilty, the premium on the call option decreases.","answer_source":"explicit"},{"n":32,"q":"Identify the CORRECT statement","options":["A short position in a put option can be closed out by taking a long position in a put option of any exercise price and exercise date","A short position in a put option can be closed out by taking a long position in a call option with the same exercise price and exercise date","A short position in a put option can be closed out by taking a long position in a put option with the same exercise price and exercise date","A short position in a put option can be closed out by taking a short position in a call option with the same exercise price and exercise date"],"answer":2,"explanation":"A closing transaction for an option involves the sale or purchase of an option contract with the same terms (contract specifications), i.e., an option with the same strike price and same expiry date. A short position in a put option means the trader has sold a put option and is obligated to buy the underlying asset if exercised. To close out this position, the trader must take an opposite position, which is buying (going long) the same put option with the same strike price and expiration date. This ensures that any potential losses or obligations from the short put are neutralized by the long put.","answer_source":"explicit"},{"n":33,"q":"Identify the CORRECT statement .","options":["Penny stocks are and good investment options for senior citizens","Brokers of a stock exchange are not expected to disclose the investment risks to their clients","Low income families can use derivatives instruments to get rich quickly","Sales agents of the brokers should not use high pressure luring tactics"],"answer":3,"explanation":"As per ethical Sales Practices to be followed by brokers : Sales agents of brokers must at all times: - Be courteous and professional. - Shall refrain from making false assumptions, in particular over potential returns on their investments. - Avoid the use of high pressure/ luring tactics.","answer_source":"explicit"},{"n":34,"q":"Who pays the initial margin to the exchange while entering into a futures contract?","options":["Only buyers pay initial margin","Only sellers pay the initial margin","No margins are payable to the exchange by buyer or seller","Both the buyer and seller pay initial margin to the exchange"],"answer":3,"explanation":"The amount one needs to deposit in the margin account at the time of entering into a futures contract is known as the initial margin. In case of futures, The buyer and seller are required to pay iinitial margin as decided by exchanges for entering into futures contract. (In case of Options, the initial margin is paid only by the sellers. The option buyers have to pay the premium)","answer_source":"explicit"},{"n":35,"q":"Mr. Manoj is Nifty trader and feels that Nifty has fallen sharply in the last few days to 17500 levels and should bounce back to 17700 levels over the next week. Which option based strategy should Mr. Manoj use to back his view?","options":["He should take a long position in 17500 call and short position in 17700 call","He should take a long position in 17500 put and short position in 17100 put","He should take a short position in 17500 call and short position in 17100 call","He should take a short position in 17500 call and long position in 17700 call"],"answer":0,"explanation":"He should take a long position in 17500 call and short position in 17700 call This strategy is known as a Bull Call Spread, which is used when a trader expects a moderate upward movement in the underlying asset (Nifty in this case). Long 17500 Call: This benefits from Nifty rising above 17500. Short 17700 Call: This helps reduce the cost of the trade but limits the maximum profit. Payoff Structure: If Nifty stays below 17500, both options expire worthless, and the trader loses the premium paid. If Nifty rises above 17500 but stays below 17700, the trader makes a profit. If Nifty crosses 17700, the profit is capped due to the short call at 17700","answer_source":"heuristic"},{"n":36,"q":"_________ is a cost to the market participants but is not mentioned in the contract note.","options":["Impact Cost","SEBI turnover fees","Securities Transaction Tax","Exchange transaction charges"],"answer":0,"explanation":"Impact cost is the cost that a buyer or seller of stocks incurs while executing a transaction due to the prevailing liquidity condition on the counter. Lower the liquidity, higher will be the impact cost. The impact cost is not reflected in the contract notes.","answer_source":"heuristic"},{"n":37,"q":"Identify the FALSE statement with respect to Impact Cost.","options":["Impact cost is also to be considered while selecting stocks to be included in the index","Impact cost is the same for the seller and the buyer of the stock","Impact cost varies as per the transaction size","Impact cost of a stock is a measure of its liquidity"],"answer":1,"explanation":"Impact cost represents the cost of executing a transaction in a given stock, for a specific predefined order size, at any given point of time. It is the cost that a buyer or seller of stocks incurs while executing a transaction due to the prevailing liquidity condition on the counter. Impact cost can be different for buyers and sellers. For eg. - If there less sellers of a particular security in the market, then the impact cost will be higher for the buyers and vice versa.","answer_source":"explicit"},{"n":38,"q":"If you are a seller of put option, you expect ___________ of the underlying asset.","options":["No change in the price","Increase in the price","Both of the above","Decrease in the price"],"answer":2,"explanation":"When you sell a put option you expect the price to rise. Even if the price remains stable, you earn the option premium. Therefore, a seller of a put options gains in both ways - stable price or increase in price of the underlying.","answer_source":"explicit"},{"n":39,"q":"In a one-month CALL option on PQR stock with a strike price of Rs. 700 is Out-of-the money. Identify which of these could be the spot price of PQR stock?","options":["Rs. 650","Rs. 700","Rs. 750","Inadequate information"],"answer":0,"explanation":"Out-of-the-money option is one with strike price worse than the spot price for the holder of option. In other words, this option would give the holder a negative cash flow if it were exercised immediately. A call option is said to be OTM, when spot price is lower than strike price. In the above question, the strike price is 700, therefore, when the spot price of 650, it will be Out-of-the-money call option.","answer_source":"manual"},{"n":40,"q":"An investor has implemented a Short Hedge using stock futures. This is done to protect ______ .","options":["The investor’s existing stock holding against an anticipated price fall","Against a price rise for a planned stock purchase in the future","Against both a stock price fall and stock price rise in the future","Against a fall in the market as a whole"],"answer":0,"explanation":"A short hedge using stock futures is taken to hedge the price risk of a planned future sale of a stock. For eg. You are holding Reliance Industries share of Rs 10 lacs and need this money after 3 months. You can sell the 3-month futures of Reliance Industries to protect the amount which you need. Even if the price falls, the future amount is secured by this hedge. This is call Short Hedge.","answer_source":"manual"},{"n":41,"q":"A stock is trading at Rs 100. Mr. Ashwin buys a Straddle at a strike price of 100 and pays a premium of Rs.10 for the Call option and Rs.5 for the Put option. Based on this information, identify the correct statement.","options":["The break-even point for the Call Option is Rs 110","The break-even point for the Put Option is Rs 95","This straddle has two break-even points","All of the above"],"answer":2,"explanation":"Mr. Ashwin buys both a call and a put at the same strike price of ?100, paying a total premium of ?15 (Rs. 10 + Rs. 5). In a long straddle, the upper break-even point is Strike Price + Total Premium, i.e. Rs. 100 + Rs. 15 = Rs. 115. The lower break-even point is Strike Price − Total Premium, i.e. Rs. 100 − Rs. 15 = Rs. 85. Although Rs. 110 and Rs. 95 are the individual break-even points of the call and put respectively, they are not the break-even points of the combined straddle. Therefore, the correct statement is Option 3: the straddle has two break-even points.","answer_source":"explicit"},{"n":42,"q":"The terms of the contract are decided by mutual agreement between the parties in a futures contract. State whether True or False?","options":["True","False"],"answer":1,"explanation":"In futures market, the exchange (not the parties) decides all the terms of the contract other than price. (Forwards are bilateral over-the-counter (OTC) transactions where the terms of the contract, such as price, quantity, quality, time and place are negotiated between two parties to the contract)","answer_source":"explicit"},{"n":43,"q":"Which tax is applicable on the transactions done on a recognised Indian stock exchange?","options":["Stock Subversion Tax","Derivatives Transaction Tax","Securities Trading Tax","Securities Transaction Tax"],"answer":3,"explanation":"Securities Transaction Tax (STT) is levied on every purchase and sale of securities that are listed on the Indian stock exchanges. STT is levied on transactions involving equity, derivatives and equity oriented mutual funds.","answer_source":"explicit"},{"n":44,"q":"Mr. Surya has gone long on April Futures on ABC stock at 1200. He will make a loss if futures price move to _______ .","options":["1250","1375","1225","1175"],"answer":3,"explanation":"A long futures position will be loss making if the price falls below the purchase price. In the above question, the purchase price is Rs 1200. Therefore, when the futures price moves to Rs 1175, there will be losses.","answer_source":"explicit"},{"n":45,"q":"If the share price of ABC share increases by Rs 5 and the delta of its option is 0.5, then by how much will the option price rise ?","options":["Rs. 5","Rs. 10","Rs. 2.50","Rs. 1"],"answer":2,"explanation":"Delta measures the sensitivity of the option value to a given small change in the price of the underlying asset. In this case the price has moved by Rs 5 and the delta is 0.5, So Option Price will move by Rs 5 x 0.5 = Rs 2.50","answer_source":"explicit"},{"n":46,"q":"Calculate the Intrinsic Value for the following Call option :","options":["Current price of the stock - Rs. 340.","Call option of strike price Rs. 300 is quoted at Rs. 56","Rs. 16","Rs. 40","Rs. 56","NIL"],"answer":3,"explanation":"When the Strike Price is below the Spot Price, the Call Option is 'In the Money' ie. profitable. Intrinsic Value for a such a Call Option = Spot Price - Strike Price = 340 - 300 = 40","answer_source":"explicit"},{"n":47,"q":"For extra-ordinary dividends above 2% of the market value of the underlying security, the amount of dividend is _____ the strike price of options on the stock.","options":["divided by","subtracted from","added to","multiplied to"],"answer":1,"explanation":"In case of declaration of \"extra-ordinary\" dividend by any company, the total dividend amount (special and / or ordinary) would be reduced from all the strike prices of the option contracts on that stock. The revised strike prices would be applicable from the ex-dividend date specified by the exchange.","answer_source":"explicit"},{"n":48,"q":"Speculators are those who wish to _____ risks whereas hedgers are those who wish to _____ risks.","options":["Decrease, Increase","Take, Reduce","Reduce, Decrease","Increase, Take"],"answer":1,"explanation":"Derivatives market helps in transfer of various risks from those who are exposed to risk but have low risk appetite to participants with high risk appetite. For example, hedgers want to give away the risk where as traders/speculators are willing to take risk.","answer_source":"explicit"},{"n":49,"q":"The calculation of premium of an option is a function of _______ .","options":["The volatility of a stock","Time left to expiry and interest rates","The current stock price and strike price","All of the above"],"answer":3,"explanation":"There are five fundamental parameters on which the option price depends upon: 1) Spot price of the underlying asset 2) Strike price of the option 3) Volatility of the underlying asset’s price 4) Time to expiration 5) Interest rates","answer_source":"explicit"},{"n":50,"q":"Which of these is true for an 'In-the-money' option ?","options":["'In-the-money' has a negative intrinsic value","'In-the-money' option has zero time value","'In-the-money' option cannot be profitably exercised by the holder immediately","'In-the-money' has a positive intrinsic value"],"answer":3,"explanation":"In-the-money (ITM) option: This option would give the option holder a positive cash flow, if it were exercised immediately. The intrinsic value of an option refers to the amount by which the option is in-themoney i.e., the amount an option buyer will realize, before adjusting for premium paid, if he exercises the option instantly. Therefore, only in-the-money options have intrinsic value whereas at-the-money and out-of-the-money options have zero intrinsic value. The intrinsic value of an option can never be negative.","answer_source":"explicit"}]},{"category":"Interest Rate Derivatives","set":"Set 1","count":50,"questions":[{"n":1,"q":"The contract value is ________ when an investor purchases 10 lots of single bond futures at Rs. 99.","options":["Rs. 20,00,000","Rs. 20,20,000","Rs. 19,80,000","Rs. 19,90,000"],"answer":2,"explanation":"The Lot size for bond futures is 2000 Lots purchased = 10 Price = Rs 99 Therefore the contract value = 2000 x 10 x 99 = Rs 19,80,000","answer_source":"explicit"},{"n":2,"q":"With respect to investments, what does 'Diversification' mean?","options":["Diversification is for insuring against market risks","Diversification is for minimizing market risks","Diversification is for taking market risks","Diversification is for eliminating market risks"],"answer":1,"explanation":"Diversification is the strategy of investing in a variety of assets (like stocks, bonds, sectors, geographies, gold etc.) to reduce the overall risk of a portfolio. It helps in minimizing unsystematic risk (specific to a company or sector), and can somewhat reduce exposure to market risk, but cannot eliminate it completely.","answer_source":"explicit"},{"n":3,"q":"Assuming no other changes, what happens to the price of a put option when the underlying asset becomes more volatile?","options":["The price of a put option will increase","The price of a put option will decrease","There will be no change in the price of a put option","It cannot be determined"],"answer":0,"explanation":"When volatility of the underlying asset increases, the premium of both call and put options increases This is because: - Higher volatility increases the probability that the option will end up in the money before expiry. - Therefore, the potential for profit is higher, which makes the option more valuable.","answer_source":"manual"},{"n":4,"q":"The timeframe for all entities to resolve investor complaints received via SCORES is ____ calendar days from the date of receipt.","options":["10","15","21","30"],"answer":2,"explanation":"Under the SEBI SCORES 2.0 framework, when a person lodges a complaint against a SEBI-registered entity, the complaint is automatically forwarded to the concerned entity. The entity is then required to respond and submit an Action Taken Report (ATR) on the SCORES platform within 21 calendar days of receiving the complaint. If the entity fails to respond within this timeframe or the investor is not satisfied with the response, the complaint is escalated to a first-level review with a designated body.","answer_source":"explicit"},{"n":5,"q":"What is a feature of Contract-level minimum margin?","options":["It will be same for all treasury bill futures and government securities futures","It will be different for treasury bill and Government bond futures but same for all government bond futures","It will be different for each treasury bill and for each government bond futures","There are no margins for treasury bills and other Government Securities"],"answer":1,"explanation":"Treasury bill futures and government bond futures have different risk profiles, mainly due to differences in maturity and volatility. Therefore, their minimum margin requirements will differ. Within the category of government bond futures, the exchange may have standardized margin requirements or may vary them based on the specific underlying security, however the most common practice is to have a standardized margin for all government bond futures.","answer_source":"explicit"},{"n":6,"q":"How is the premium settled for exchange-traded interest rate option contracts?","options":["Its Cash settled","Its adjusted to liquid assets","Both of the above","None of the above"],"answer":0,"explanation":"For exchange-traded interest rate option contracts in India, the premium (i.e., the price paid by the buyer to the seller of the option) is settled in cash. This is a standard practice for exchange-traded derivatives, ensuring efficient and transparent settlement. No physical delivery or adjustment to liquid assets is involved in premium settlement.","answer_source":"heuristic"},{"n":7,"q":"Mr. Raj enters a long futures position at Rs. 58 and the underlying price settles at Rs. 56 on expiry. What is the consequence for Mr. Raj?","options":["There is no profit or loss","There is a profit of Rs 2","There is a loss of Rs 2","None of the above"],"answer":2,"explanation":"Mr. Raj goes long in a futures contract at Rs 58. On expiry, the underlying price is Rs 56. Since futures are marked-to-market and settled at the underlying price on expiry: Loss = 58 - 56 = Rs 2","answer_source":"explicit"},{"n":8,"q":"According to the ICAI, derivatives used to hedge recognized assets or liabilities must be classified as __________ .","options":["Current asset","Current liability","Current or non current based on classification of hedge","None of these"],"answer":2,"explanation":"As per The Institute of Chartered Accountants of India (ICAI) guidance notes - Derivatives that are hedges of recognised assets or liabilities should be classified as current or non-current based on the classification of the hedged item.","answer_source":"explicit"},{"n":9,"q":"Losses incurred from derivative transactions executed on a recognized Stock Exchange are eligible for offset against various other income sources within the same fiscal year, with the exception of which particular income type?","options":["Business Income","Salary Income","Income from other sources","None of these"],"answer":1,"explanation":"Under the Indian Income Tax Act, losses from derivative transactions that are carried out on a recognized stock exchange can be set off against certain types of income, but not against salary income. Derivative transactions are considered speculative business losses, and as such, they can only be set off against other business income or speculative business income in the same financial year. Salary income is not considered part of business income and therefore cannot be offset against speculative losses (such as from derivatives).","answer_source":"explicit"},{"n":10,"q":"If someone plans to borrow money later and expects interest rates to go up, what hedging strategy can he/she employ?","options":["Buy GOI Bond Call option","Sell GOI Bond futures","Both of the above","None of the above"],"answer":1,"explanation":"If a person expects interest rates to rise in the future: Bond prices fall when interest rates rise (they have an inverse relationship). So, to hedge against rising interest rates, the person should take a position that profits when bond prices fall. Sell Govt Of India bond futures - This is a hedge against falling bond prices (i.e., rising interest rates). If interest rates go up, bond prices drop, and the short futures position makes a profit, offsetting losses elsewhere.","answer_source":"explicit"},{"n":11,"q":"What are the implications of having a housing loan with a fixed interest rate? Which of the following statements is correct?","options":["There is exposure to interest rate risk","There is no exposure to interest rate risk","There is exposure to bank risk","There is exposure to credit risk"],"answer":1,"explanation":"Interest rate risk refers to the potential for financial loss (or reduced earnings) due to changes in market interest rates. Fixed-rate loan means your interest rate does not change with market fluctuations. Since the rate is locked, rising or falling interest rates do not affect your payments. Hence, there is no interest rate risk.","answer_source":"explicit"},{"n":12,"q":"What is the net payoff in rupees for Ms. Smita, who purchased a Rs 21.50 strike call option for Rs 0.20, if the underlying bond price closes at Rs 21.70 on the expiry date?","options":["0.20","0.40","-0.20","0"],"answer":0,"explanation":"Since the expiry price (Rs. 21.70) > strike price (Rs. 21.50), the call option is in-the-money and will be exercised. Lets calculate Gross Payoff from Exercise Gross Payoff = Expiry Price – Strike Price 21.70 − 21.50 = Rs. 0.20 To get the net pay-off, we subtract the premium paid of Rs. 0.20 Net Payoff = Gross Payoff – Premium 0.20 − 0.20 = 0","answer_source":"explicit"},{"n":13,"q":"Do treasury bills issued by the Indian government pay a coupon? If so, what is it?","options":["7.5%","6%","The coupon varies from issue to issue","Treasury bills are issued as Zero-coupon instruments"],"answer":3,"explanation":"Treasury bills (T-bills) issued by the Government of India do not pay a coupon rate or periodic interest payments. Instead, they are zero-coupon instruments. T-bills are sold at a price lower than their face value (also known as the par value or maturity value). On the maturity date, the investor receives the full face value of the T-bill. The investor's profit is the difference between the face value they receive at maturity and the discounted price they paid at the time of purchase. This difference effectively represents the interest earned.","answer_source":"explicit"},{"n":14,"q":"The clearing corporation in India functions as the __________ for exchange-traded interest rate derivatives, providing a trade guarantee by becoming a party to each transaction","options":["Central counterparty","Custodian","Depository","Broker"],"answer":0,"explanation":"The Clearing Corporation acts as a central counterparty i.e., it provides financial guarantees for all transactions executed on the Exchange. It acts as a legal counterparty to all trades through the process called novation. Thus Clearing Corporation becomes the buyer to every seller and seller to every buyer. If there is a default in this scenario, Clearing Corporation being counter party, is responsible for ensuring the settlement, thus managing risk and guaranteeing settlement to both the parties.","answer_source":"heuristic"},{"n":15,"q":"If an FPI holds derivative positions for a period less than 12 months, the resulting gain or loss will be taxed under the category of __________.","options":["Long term capital gain or loss","Short term capital gain or loss","Not taxable","As per the tax bracket"],"answer":1,"explanation":"According to the Indian tax laws: - If a Foreign Portfolio Investor (FPI) holds derivatives positions for less than 12 months, the gain or loss arising from these transactions is considered as a short-term capital gain or short-term capital loss. - Derivatives are typically treated as securities under the Income Tax Act, and gains from securities held for less than 12 months are taxed as short-term capital gains.","answer_source":"explicit"},{"n":16,"q":"How is the closing price for cash-settled GOI bond futures contracts determined for a trading day? It's based on _______ .","options":["The weighted average of all transaction prices for that contract in the last half hour of the trading day, calculated across all relevant exchanges","The weighted average of all transaction prices for that contract in the last one hour of the trading day, calculated across all relevant exchanges","The weighted average of all transaction prices for that contract in the last one and half hour of the trading day, calculated across all relevant exchanges","None of these"],"answer":0,"explanation":"For cash-settled GOI bond futures contracts, the closing price is calculated based on the weighted average price of the contract during the last half-hour of trading on the respective exchanges. This methodology helps ensure that the closing price reflects the most recent trading activity and is not unduly influenced by short-term price fluctuations that may occur just before the market closes.","answer_source":"heuristic"},{"n":17,"q":"What is the limit of net long position for Foreign Portfolio Investors (FPIs) to collectively can transact in Interest Rate Futures (IRF) ?","options":["Rs. 5 billion","Rs. 25 billion","Rs. 50 billion","Rs. 100 billion"],"answer":2,"explanation":"As per RBI circular - Foreign Portfolio Investors (FPIs), collectively, may also transact in interest rate futures (IRF) up to a limit of net long position of INR 50 billion.","answer_source":"explicit"},{"n":18,"q":"Individuals selecting the presumptive taxation under 44AD can declare profits as _____ % of turnover received digitally/via cheque and _____ % for cash income.","options":["6 , 8","5 , 10","8 , 6","7, 12"],"answer":0,"explanation":"If the taxpayer is opting for the presumptive taxation scheme under Section 44AD of the Income Tax Act, the profits can be declared as follows: - 6% of turnover/gross receipts received through digital modes (like cheque, bank transfer, UPI, cards, etc.) - 8% of turnover/gross receipts received in cash.","answer_source":"manual"},{"n":19,"q":"Option time value is ________ proportional to its time until expiration.","options":["Inversely","Directly","Directly for Put option only","Directly for Call option only"],"answer":1,"explanation":"The time value of an option is the portion of the option's premium that is attributed to the time remaining until expiration. Longer time to expiration - Higher is the time value As the expiration date approaches, the time value decays, eventually becoming zero at expiry. This relationship holds true for both Call and Put options.","answer_source":"explicit"},{"n":20,"q":"Which of the following instruments offers a return that can be accurately determined in advance i.e. for which of the following investments is the real or exact return predictable beforehand?","options":["Zero Coupon Bond","Consols","Annuity","Coupon Bond"],"answer":0,"explanation":"Zero Coupon Bond: The return (yield) is fixed and known in advance because it is purchased at a discount and redeemed at face value. There is no intermediate cash flows. The difference represents the pre-determined return. Other Instruments: - Consols (Perpetual Bonds): No maturity date, so return depends on future interest rates. - Annuity: Payments are fixed, but the true return depends on lifespan/duration. - Coupon Bond: Return varies if sold before maturity (due to changing yields). Therefore, only zero coupon bonds guarantee a pre-computable return if held to maturity.","answer_source":"manual"},{"n":21,"q":"Mr. Sunny takes two positions: buying a call option (strike Rs. 40.25, premium Rs. 0.20) and selling a call option (strike Rs. 39.50, premium Rs. 0.60). Determine his net profit or loss if the underlying asset's price at expiry is Rs. 39.50","options":["Rs. -0.60","Rs. 0.20","Rs. 0.40","0"],"answer":2,"explanation":"Mr. Sunny has paid a premium of Rs 0.20 and received a premium of Rs 0.60. Net Premium received = 0.60 - 0.20 = 0.40 Now, lets evaluate the payoff of each position: Long Call (Strike 40.25) : Since spot price < strike, the option expires worthless. Payoff = 0 Short Call (Strike 39.50) : Since spot price = strike, this call also expires worthless. Payoff = 0 Thus the payoff on the two positions = 0 The Net Premium received is 0.40 and that will be the final payoff.","answer_source":"explicit"},{"n":22,"q":"On what basis are Treasury Bill futures contracts quoted?","options":["100 plus discount yield","100 minus discount yield","100 plus investment yield","100 minus investment yield"],"answer":1,"explanation":"Treasury bill futures contracts are quoted using the discount yield method, and the price is calculated as: Quoted Price = 100 − Discount Yield This means that if the discount yield on a T-bill is 5%, the futures contract would be quoted at 100 – 5 = 95.00.","answer_source":"explicit"},{"n":23,"q":"Which of the following statements correctly describes 'position limit'?","options":["Position limit is the maximum daily volume at clearing member level","Position limit is the maximum exposure level for market, trading member and clients","Position limit is the maximum daily volume at trading member level","Position limit is the maximum daily volume at client level"],"answer":1,"explanation":"In order to avoid building up of huge open positions, the regulator has specified the maximum allowable open position limit at client level, member level etc. Position limits are the maximum exposure levels which the entire market can go up to and each trading member or investor can go up to.","answer_source":"explicit"},{"n":24,"q":"The payment an option buyer makes to secure the right from the seller is known as _________ .","options":["Strike Price","Market Price","Agreed Price","Premium"],"answer":3,"explanation":"In options trading, the option buyer pays a PREMIUM to the option seller (writer) to acquire the right, but not the obligation, to buy or sell the underlying asset at a specified price (the strike price) before or at expiry.","answer_source":"explicit"},{"n":25,"q":"Why does Basis Risk arise?","options":["Because the futures expiry date is standardized","Because the futures contract amount is standardized","Both of the above","None of the above"],"answer":2,"explanation":"Basis risk arises due to a mismatch between the hedged asset and the futures contract used for hedging. Two key reasons are: - Futures contract amount is standardized – The contract size may not exactly match the quantity of the asset being hedged. - Futures expiry date is standardized – The contract may not mature at the exact time when the hedge is needed. These standardizations create a risk that the futures price and the spot price will not move perfectly in sync, leading to basis risk.","answer_source":"explicit"},{"n":26,"q":"Which SEBI regulations prescribe a code of conduct for securities brokers?","options":["SEBI (Stock Brokers) Regulations","SEBI (KYC Registration Agency) Regulations","SEBI (Prohibition of Insider Trading) Regulations","SEBI (Prohibition of Fraudulent and Unfair Trade Practices) Regulations"],"answer":0,"explanation":"Schedule II of the SEBI (Stock Brokers) Regulations, 1992 prescribes a code of conduct for securities brokers. This includes general code of conduct of stock brokers, Duty towards the Investor, Duty towards Other Stock-Brokers etc.","answer_source":"heuristic"},{"n":27,"q":"How is the price of a bond futures contract calculated?","options":["Cash price + Accrued interest","Cash price - Income on cash position","Cash price + Financing cost","Cash price + Financing cost - Income on cash position"],"answer":2,"explanation":"The futures price of a bond is calculated using the cost-of-carry model, which considers: 1. Cash Price: The current market price of the bond. 2. Financing Cost: The cost incurred to finance the purchase of the bond until the futures contract expires (usually interest on borrowed funds). 3. Income on Cash Position: Any coupon interest or income received from holding the bond until expiry Formula : Futures Price = Cash Price + Financing Cost − Income on Cash Position","answer_source":"explicit"},{"n":28,"q":"As per the rules, what are the allowed maturity durations of the GoI bonds that can be the basis for exchange-traded, cash-settled interest rate futures?","options":["2, 5 and 9 years","3, 7 and 12 years","6, 10 and 13 years","2, 7 and 10 years"],"answer":2,"explanation":"The allowed maturity durations of Government of India (GoI) bonds for exchange-traded, cash-settled interest rate futures are: - 6 years - 10 years - 13 years According to SEBI circular, stock exchanges are permitted
