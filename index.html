<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>NISM Practice Tests</title>
<style>
:root{--blue:#173b9b;--blue2:#2456a6;--bg:#f4f6fa;--card:#fff;--text:#172033;--muted:#657087;--green:#18864b;--red:#c83b3b;--line:#dfe4ee}
*{box-sizing:border-box}
body{margin:0;font-family:Arial,Helvetica,sans-serif;background:var(--bg);color:var(--text)}
.container{max-width:1100px;margin:28px auto;padding:0 16px}
.header{background:linear-gradient(135deg,#173b9b,#2456a6);color:#fff;border-radius:14px;padding:24px 26px;margin-bottom:18px;box-shadow:0 6px 20px #173b9b22}
.header h1{margin:0 0 7px;font-size:30px}.header p{margin:0;opacity:.92}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;margin-bottom:16px;box-shadow:0 3px 14px #16213a0c}
.section-title{font-size:21px;font-weight:700;margin:4px 0 12px}
.table{width:100%;border-collapse:collapse}.table th,.table td{padding:13px 12px;border-bottom:1px solid var(--line);text-align:left}.table th{background:#f7f9fc;font-size:14px}.table tr:last-child td{border-bottom:0}
.start{background:#165dcc;color:#fff;border:0;border-radius:8px;padding:10px 16px;font-weight:700;cursor:pointer}.start:hover{filter:brightness(.95)}
.meta{color:var(--muted);font-size:14px}
.exam-top{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin-bottom:14px}
.timer{font-size:24px;font-weight:800;font-variant-numeric:tabular-nums}
.progress-wrap{height:8px;background:#e8edf5;border-radius:99px;overflow:hidden;margin:10px 0 18px}.progress{height:100%;background:#2456a6;width:0}
.qnum{color:var(--blue2);font-weight:700;margin-bottom:8px}.question{font-size:21px;line-height:1.45;font-weight:700;margin-bottom:18px}.statements{margin:0 0 14px}.statement{background:#f7f9fc;border:1px solid var(--line);border-radius:9px;padding:10px 12px;margin:7px 0;font-size:16px;line-height:1.4}.continuation{margin:0 0 14px;padding:10px 12px;background:#f7f9fc;border:1px solid var(--line);border-radius:9px;font-size:16px;line-height:1.4}.continuation div{margin:4px 0}.answer-label{font-weight:700;color:var(--blue2);margin:10px 0 7px}
.option{display:block;width:100%;text-align:left;border:1px solid #ccd4e2;background:#fff;border-radius:10px;padding:13px 14px;margin:9px 0;cursor:pointer;font-size:16px;line-height:1.4}
.option:hover{background:#f7faff}.option:disabled{cursor:default}.option.correct{border-color:#1c8d51;background:#eaf8f0}.option.wrong{border-color:#d54a4a;background:#fff0f0}
.feedback{display:none;margin-top:15px;padding:14px;border-radius:10px}.feedback.show{display:block}.feedback.correct{background:#eaf8f0;border:1px solid #a8ddbf;color:#126b3d}.feedback.wrong{background:#fff0f0;border:1px solid #efb1b1;color:#8e2323}
.explanation{margin-top:9px;padding-top:9px;border-top:1px solid #ffffffaa;line-height:1.55;white-space:pre-line}
.actions{display:flex;gap:10px;justify-content:space-between;align-items:center;margin-top:18px;flex-wrap:wrap}
.btn{border:0;border-radius:8px;padding:11px 17px;font-weight:700;cursor:pointer}.next{background:#173b9b;color:#fff}.end{background:#7a1f1f;color:#fff}.back{background:#e9edf4;color:#172033}
.result{text-align:center}.result h2{font-size:30px;margin:6px 0}.status-pass{color:var(--green)}.status-try{color:var(--red)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:18px 0}.stat{border:1px solid var(--line);border-radius:10px;padding:15px;background:#fafbfd}.stat b{display:block;font-size:24px;margin-top:4px}
.hidden{display:none!important}
.small{font-size:13px;color:var(--muted)}
@media(max-width:700px){.header h1{font-size:24px}.question{font-size:18px}.table th:nth-child(3),.table td:nth-child(3){text-align:center}.stats{grid-template-columns:1fr 1fr}.timer{font-size:20px}}
</style>
</head>

  <div id="app"></div>

<script>
const DATA = {"title":"NISM Practice Tests","sets":[{"category":"Mutual Fund","set":"Set 1","count":70,"questions":[{"n":1,"q":"An ABC Mutual Fund distributor wishes to conduct an investor awareness drive using printed pamphlets that describe the fund's schemes. Which of the following statements holds true ?","options":["The pamphlet material must be approved in advance by the AMC","The pamphlet material requires prior approval from SEBI’s advertising committee","The pamphlet content must receive prior approval from AMFI","The distributor is free to distribute the pamphlets as long as the details mentioned are factually correct"],"answer":0,"explanation":"As per SEBI regulations and AMFI guidelines, any marketing, advertising, or promotional material related to a mutual fund scheme — including pamphlets, brochures, presentations, and leaflets — must be pre-approved by the Asset Management Company (AMC) before a distributor can use or distribute it. The AMC is responsible for ensuring all communication about its schemes is fair, accurate, and not misleading to investors.","answer_source":"heuristic"},{"n":2,"q":"Which of the following correctly describes the primary role of an Asset Management Company?","options":["It manages the mutual fund’s investments and assets","It establishes and promotes the mutual fund","It functions as the custodian of the mutual fund","It is responsible for appointing trustees"],"answer":0,"explanation":"The main role of an Asset Management Company (AMC) is to professionally manage the investments and assets of the mutual fund schemes. It makes investment decisions such as buying and selling securities according to the scheme objectives. The trustees act as the guardians of the mutual fund and supervise the AMC to protect investors’ interests. The sponsor promotes or establishes the mutual fund, while trustees are appointed by the sponsor with SEBI approval procedures. Therefore, the AMC’s primary role is managing the mutual fund’s assets.","answer_source":"manual"},{"n":3,"q":"FATCA-related details are required to be submitted in which of the following situations ?","options":["If the folio had earlier been maintained as an NRI account only","If the investment originates from a foreign bank account only","If the investor resides in the United States only","If the investor holds tax residency in a country other than India"],"answer":3,"explanation":"FATCA (Foreign Account Tax Compliance Act) is a US law, but India has signed an Inter-Governmental Agreement (IGA) with the USA, making FATCA compliance mandatory in India too. As per SEBI and AMFI guidelines, all mutual fund investors whose tax residency is outside India — not just the USA — must provide FATCA declaration. This helps Indian financial institutions report foreign account holders to relevant tax authorities and prevent tax evasion globally.","answer_source":"explicit"},{"n":4,"q":"A portfolio manager chooses to invest in cement manufacturing companies because the industry is expanding through new capacity additions. This investment approach is best described as :","options":["Value investing","Growth investing","Blend investing","Cyclical investing"],"answer":1,"explanation":"Growth investing focuses on companies expected to grow rapidly in the future. In this case, cement companies are setting up new capacities, which indicates expected business expansion and higher future earnings. The portfolio manager is investing based on future growth potential. Therefore, this investment style is called growth investing.","answer_source":"explicit"},{"n":5,"q":"Who is responsible for making the application to SEBI for mutual fund registration?","options":["The Asset Management Company","The Board of directors of the fund","The Trustees of the mutual fund","The Sponsors of the mutual fund"],"answer":3,"explanation":"The sponsor is the person or entity that sets up the mutual fund. To start a mutual fund in India, the sponsor must apply to SEBI for registration. After SEBI approval, the trust, trustees, and Asset Management Company (AMC) are formed. Therefore, the application for registration is made by the sponsors.","answer_source":"explicit"},{"n":6,"q":"Identify the mutual fund scheme(s) whose NAV is closely linked to international gold price movements.","options":["Only A","Only B","Only C","All A, B and C"],"answer":0,"explanation":"Gold ETFs (Exchange Traded Funds) invest directly in physical gold or gold-related assets, so their NAVs closely track gold prices in domestic and international markets. Gold sector funds mainly invest in shares of gold mining or gold-related companies. Their performance depends not only on gold prices but also on company performance and stock market conditions. Gilt funds invest in government securities, not gold, so their NAVs are linked to interest rate movements rather than gold prices. Therefore, among the given options, only Gold ETFs closely track international gold prices.","answer_source":"manual","statements":["A) Gold ETF","B) Gold Sector Funds","C) Gilt Funds"]},{"n":7,"q":"Which category of investors must obtain approval through a board resolution before investing in a mutual fund scheme?","options":["Non-Resident Indians (NRIs)","Minors","Hindu Undivided Families (HUFs)","Institutional investors"],"answer":3,"explanation":"Institutional investors: Entities like companies, trusts, or organizations must pass a board resolution to approve investments in mutual fund schemes. This ensures accountability and compliance with corporate governance. Non-Resident Indians (NRIs): They can invest directly in Indian mutual funds, subject to FEMA guidelines, without board resolutions. Minors: Investments are made through a guardian; no board resolution is required. Hindu Undivided Family (HUF): Investments are made by the Karta (head of family) without needing a board resolution.","answer_source":"explicit"},{"n":8,"q":"A mutual fund is prohibited from carrying out purchase or sale transactions in securities with which of the following entities ?","options":["Primary dealers","Other schemes under the same AMC management","A director of the Asset Management Company (AMC)","All of the above"],"answer":2,"explanation":"SEBI regulations clearly prohibit mutual funds from buying or selling securities with related parties such as directors of the AMC, trustees, or sponsors, to avoid conflicts of interest. Transactions with primary dealers (who deal in government securities) and other schemes of the AMC are allowed, provided they follow SEBI guidelines and are done at arm’s length with proper valuation.","answer_source":"explicit"},{"n":9,"q":"What does 'spread risk' signify with respect to floating rate debt instruments?","options":["The extent to which investments are diversified across debt mutual funds","Fluctuations in prevailing market interest rates","The extent to which a portfolio is diversified","Changes in the markup over the benchmark rate for floating rate securities"],"answer":3,"explanation":"In a floating rate debt instrument, the interest rate is not fixed — it keeps changing and is expressed as: Interest Rate = Benchmark Rate + Spread (Markup) For example: MIBOR + 0.50% Spread risk refers to the risk that this markup over the benchmark may change due to market conditions or changes in the issuer’s credit quality. Even if the benchmark rate remains unchanged, changes in the spread can affect the value of the security.","answer_source":"explicit"},{"n":10,"q":"Among the following options, which type of fund is considered to have the highest risk exposure ?","options":["Sector funds","Arbitrage funds","Index funds","Money market funds"],"answer":0,"explanation":"Sector funds invest only in one specific sector such as banking, IT, or pharma. Since the investment is concentrated in a single sector, the risk is very high. If that sector performs badly, the entire fund may suffer losses. Index funds are diversified, while money market and arbitrage funds are generally lower-risk funds compared to sector funds.","answer_source":"manual"},{"n":11,"q":"A group of investors joins a new Ponzi scheme after noticing that many of their friends have already invested in it. This behaviour reflects which type of bias ?","options":["Confidence bias","Herd mentality","Anchoring","Recency bias"],"answer":1,"explanation":"Herd mentality means investors follow what others are doing instead of making independent decisions. In a Ponzi scheme, people often invest because friends or relatives are investing and appearing to earn very high returns. They assume the investment is safe simply because many others are participating. Hence, this behaviour is called herd mentality.","answer_source":"explicit"},{"n":12,"q":"For a benchmark to be credible and relevant for a mutual fund scheme, it should match which of the following ?","options":["The overall size of the scheme","The scheme’s expense ratio","The scheme’s investment objective","All of the above"],"answer":2,"explanation":"A benchmark is used to compare the performance of a mutual fund scheme. Therefore, it should match the scheme’s investment objective and portfolio style. For example, a large-cap equity fund should be compared with a large-cap market index (Like Nifty50 or BSE Sensex). Similarly, a Gilt Fund should be compared against a Government Securities Index. Expense ratio or scheme size does not decide the benchmark.","answer_source":"explicit"},{"n":13,"q":"Identify the correct statement(s) from the following:","options":["A) Order processing of mutual fund units routed through stock exchanges is outside the control of the mutual fund house","B) Changes in government economic policies do not impact mutual fund investments","Only statement A is correct","Only statement B is correct","Both A and B are correct","None of the above"],"answer":2,"explanation":"Statement (A) is true because when mutual fund transactions happen through stock exchanges, the order processing is handled by the exchange platform and related infrastructure, not directly controlled by the mutual fund house. Statement (B) is false because mutual fund investments are affected by government economic policies, interest rates, taxation, and market conditions.","answer_source":"manual"},{"n":14,"q":"Which of the following documents can be inspected by unitholders with respect to mutual fund investments?","options":["Memorandum & Articles of Association of the Asset Management Company","Agreement for custodial services","Investment Management Agreement","All the above-mentioned documents"],"answer":3,"explanation":"Mutual fund unitholders have the right to inspect important legal and operational documents related to the mutual fund. These include the Custodial Services Agreement, Memorandum & Articles of Association of the AMC and the Investment Management Agreement. This ensures transparency and protects investor interests. Therefore, all the given documents can be inspected by unitholders.","answer_source":"explicit"},{"n":15,"q":"The Market Value of a scheme is Rs 579 crores. Dividend accrued but not received is Rs 18 crore. The Expenses payable are Rs 3 crore. The total number of outstanding units is 300 lakhs. What is the NAV of the scheme ?","options":["188","198","208","218"],"answer":1,"explanation":"NAV = Total market value i.e. Total Assets − Total Liabilities / Total Outstanding Units Breakdown: Total Assets: Includes market value of securities, cash, dividends receivable, and accrued income. Total Liabilities: Covers fund expenses, management fees, and any outstanding payments. Total Outstanding Units: The number of mutual fund units held by investors. Total Market Value = Rs 579 crore Add : Dividend Accrued of Rs 18 crore Less: Expenses Payable of Rs 3 crore = Rs. 594 cr Divided by Units 300 lakhs 5,940,000,000 / 30,000,000 = 198 NAV = 198","answer_source":"explicit"},{"n":16,"q":"The Key Information Memorandum is attached to which of these documents?","options":["The Application Form","The Scheme Information Document (SID)","The Statement of Additional Information (SAI)","The Transaction Slip"],"answer":0,"explanation":"While an investor is expected to read all the scheme related documents, circulation of the same along with the application forms is too difficult and costly, especially if the printed forms are to be distributed. In order to ensure the investor gets access to sufficient information in spite of such a constraint, a Key Information Memorandum (KIM) is mandatorily circulated along with the application form. KIM is essentially a summary of the Scheme Information Document (SID) and Statement of Additional Information (SAI).","answer_source":"manual"},{"n":17,"q":"Identify the CORRECT statement/s with respect to investments in Real Estate Investment Trusts (REITs).","options":["REITs are exposed to risks of lower-than-expected distributions","The distributions by the REIT will not be based on the net cash flows available for distribution","Both of the above are correct","None of the above"],"answer":0,"explanation":"Real Estate Investment Trusts (REIT) are trusts registered with SEBI that invest in commercial real estate assets. REITs are exposed to price-risk, interest rate risk, credit risk, liquidity or marketability risk, reinvestment risk. Also, there is a risk of lower-than-expected distributions. The distributions by the REIT will be based on the net cash flows available for distribution. The amount of cash available for distribution principally depends upon the amount of cash that the REIT receives as dividends or the interest and principal payments from portfolio assets.","answer_source":"manual"},{"n":18,"q":"The format of Key Information Memorandum (KIM) is as per the regulations related to ___________ .","options":["Securities Market","Risk Management Systems","Scheme Related Documents","Valuation of a mutual fund"],"answer":2,"explanation":"KIM is essentially a summary of the two Scheme related documents - Scheme Information Document (SID) and Statement of Additional Information (SAI) It contains the key points of these documents that are essential for the investor to know to make a decision on the suitability of the investment for their needs. It is more easily and widely distributed in the market. As per SEBI regulations, every application form is to be accompanied by the KIM.","answer_source":"explicit"},{"n":19,"q":"The employees of institutions that are into the distribution of mutual funds need to clear the _______ and obtain an Employee Unique Identification Number (EUIN) from AMFI.","options":["SEBI - VA Mutual Fund Distributors Certification Examination","NISM - VB Mutual Fund Distributors Certification Foundation","AMFI - VA Mutual Fund Distributors Certification Examination","NISM - VA Mutual Fund Distributors Certification Examination"],"answer":3,"explanation":"Institutions that are into the distribution of mutual funds need to register with AMFI. The employees of these institutions need to clear the NISM Series V-A: Mutual Fund Distributors Certification Examination and obtain an Employee Unique Identification Number (EUIN) from AMFI.","answer_source":"explicit"},{"n":20,"q":"An investor who wants liquidity in his investments will invest in ______ .","options":["Equity Linked Saving Scheme (ELSS)","Fixed Deposits","PPF","Liquid Funds"],"answer":3,"explanation":"A person who wants liquidity should invest in liquid funds as they can be redeemed very fast. Equity linked saving schemes have a lock in period of three years Fixed Deposits and Public Provident Fund (PPF) cannot be easily encashed before maturity.","answer_source":"explicit"},{"n":21,"q":"Identify the security which will be most impacted by interest rate movements in the economy ?","options":["Public Sector Units (PSU) Bonds","Money Market securities","Government securities","Corporate debentures"],"answer":2,"explanation":"Interest rate sensitivity is a measure of how much the price of a fixed-income asset will fluctuate as a result of changes in the interest rate environment. Generally, the longer the maturity of the asset, the more sensitive the asset to changes in interest rates. Higher the duration of a bond, the more its prices will fall when interest rates rise and vice versa. Generally Government securities have a higher duration as compared to PSU bonds and Corporate debentures. Money market securities have the lowest duration.","answer_source":"explicit"},{"n":22,"q":"The function of mutual fund scheme related documents includes ______ .","options":["Providing all the scheme related information to the investors","Providing a comparison of various mutual fund schemes","Both of the above","None of the above"],"answer":0,"explanation":"The legal documents that provide the information that the investor requires are available in the scheme related documents (Scheme Information Document, Statement of Additional Information) and the Key Information Memorandum. Scheme related documents can be used for making an informed investment decision. The suitability of a mutual fund scheme to an investor depends upon the features of the scheme and matching it to the needs of the investor from the investment. These documents do not provide any comparison of the various mutual fund schemes currently available in the market.","answer_source":"manual"},{"n":23,"q":"Statement of Additional Information (SAI) has to be regularly updated and the updation has to be done by the end of 3 months every financial year - State whether True or False?","options":["True","False"],"answer":0,"explanation":"Updation of Scheme Documents—Regulatory provisions Updation of SAI : Regular update has to be done by the end of 3 months of every financial year. Material changes have to be updated on an ongoing basis and uploaded on the websites of the mutual fund and AMFI.","answer_source":"manual"},{"n":24,"q":"Normally, a fund manager will have to provide the maximum liquid assets for which of these funds?","options":["ETF-Gold","Open-end schemes","Close-end schemes","ETF-Equity"],"answer":1,"explanation":"ETFs and Close-end funds are listed on the stock exchanges and investors can sell their units their. They need not give redemption request to the AMCs. So, the fund manager need not maintain liquid funds for Close-end funds and ETFs. Open-end funds have to keep a minimum stipulated per cent of their corpus in liquid assets. This has been done to ensure that there is enough liquidity available with the open-ended funds to meet redemption needs.","answer_source":"explicit"},{"n":25,"q":"The distributable reserve of Income Distribution cum Capital Withdrawal of a mutual fund scheme is calculated as _________ .","options":["All the profits earned (excluding the Marked to Market profits) Less the accrued expenses Less the Mark to Market losses","All the profits earned (including the Marked to Market profits) Less the accrued expenses Less the Mark to Market losses","Only the dividend received","Only the Capital Gains"],"answer":0,"explanation":"Distributable Reserve: This represents the portion of a mutual fund's profits that can be distributed to investors. It's crucial to understand that unrealized gains (Marked to Market profits) are not part of the distributable reserve. This is a key principle in mutual fund accounting. Distributions should come from realized gains. Realized Profits: These are the profits actually earned from selling investments. This is what forms the basis of the distributable reserve. Marked to Market (MTM) Profits/Losses: These are unrealized gains or losses based on the current market value of the fund's holdings. While MTM is important for calculating the Net Asset Value (NAV) of the fund, it's not used for calculating the distributable reserve. Including MTM profits would mean distributing money that the fund hasn't actually received yet. Accrued Expenses: These are expenses that the fund has incurred but not yet paid. They are deducted from profits before calculating the distributable reserve. Therefore, the distributable reserve includes realized profits (profits earned from actual sales), less any accrued expenses and less any MTM losses (as these would offset realized gains). MTM gains are specifically excluded.","answer_source":"manual"},{"n":26,"q":"The Risk Free Return of a scheme is 7% , the beta is 1.6 and the actual return earned is 9 %. What is the Treynor Ratio of this scheme?","options":["1.25","2.50","1.00074","2"],"answer":0,"explanation":"Treynor Ratio = (Return Earned - Risk Free Return) / Beta = (9 - 7) / 1.6 = 2 / 1.6 = 1.25 Treynor Ratio is a risk premium per unit of risk. Higher the Treynor Ratio, better the scheme is considered to be.","answer_source":"heuristic"},{"n":27,"q":"The Fund Manager of a ' Fund of Fund ' has to select _______ for investments.","options":["Right Stocks","Sectors","Funds","All of the above"],"answer":2,"explanation":"A 'Fund of funds' is a pooled investment fund that invests in other types of mutual funds. In other words, its portfolio contains different underlying portfolios of other funds.","answer_source":"explicit"},{"n":28,"q":"Asset allocation means ____________.","options":["Distribution of funds between Fund Managers in a Mutual Fund","Distribution of funds between various asset classes in a portfolio","Allocating a portfolio to cash","Allocating mutual funds to investors"],"answer":1,"explanation":"The distribution of an investor’s portfolio between different asset classes is called asset allocation. For eg - If an investor wishes to invest Rs 10 lakhs - His funds can be divided and invested in Equity, Debt and Gold - This is asset allocation.","answer_source":"explicit"},{"n":29,"q":"A credible benchmark of a mutual fund scheme should be in sync with the __________ .","options":["Investment strategy of the scheme","Asset allocation pattern of the scheme","Investment objective of the scheme","All of the above"],"answer":3,"explanation":"A credible benchmark should meet the following requirements: It should be in sync with (a) the investment objective of the scheme (i.e., the securities or variables that go into the calculation of the benchmark should be representative of the kind of portfolio implicit in the scheme’s investment objective); (b) asset allocation pattern; and (c) investment strategy of the scheme.","answer_source":"explicit"},{"n":30,"q":"___________ is not a financial asset.","options":["A Picasso painting","Insurance","ETF Gold","Real Estate Fund"],"answer":0,"explanation":"A painting is a physical asset whereas Insurance, mutual funds, ETFs are financial assets.","answer_source":"manual"},{"n":31,"q":"__________ is a Passive Fund.","options":["Gold Sector Fund","Gilt Fund","Gold Exchange Traded Fund (ETF)","ELSS Fund"],"answer":2,"explanation":"Passive funds invest on the basis of a specified index whose performance it seeks to track. For eg. NIfty Index fund. Exchange Traded Funds (traded on exchanges) are passive funds that generate returns in line with the index or benchmark. So, from the above options, only Gold Exchange Traded Fund is a passive fund.","answer_source":"explicit"},{"n":32,"q":"Thematic funds are risky because of _________ in one theme.","options":["under exposure","high beta","diversification","concentration"],"answer":3,"explanation":"A Thematic fund invests in line with an investment theme. For example, an infrastructure thematic fund might invest in shares of companies that are into infrastructure, construction, cement, steel, telecom, power etc. Thematic funds are risky because of the concentration in one theme. If the theme under-performs then the scheme’s returns is likely to be poor.","answer_source":"explicit"},{"n":33,"q":"Which risk is higher in a Gilt Fund when compared to a Corporate Bond Fund?","options":["Concentration Risk","Credit Risk","Interest Rate Risk","Duration Risk"],"answer":2,"explanation":"Interest rate risk is the risk that an investment's value will change as a result of a change in interest rates. The interest rate risk varies for bonds with different maturities. Those with longer maturity would witness higher price fluctuations in comparison to those with shorter maturities. Gilt funds get affected by interest rate movements as the Government borrowing typically happens to be for a longer duration. Corporate bond funds invest in corporate bonds with time period of 1 to 3 years. Due to lower duration, they have lower interest rate risks.","answer_source":"explicit"},{"n":34,"q":"Gold prices are used as benchmark for ________ .","options":["Gold Savings Fund","Gilt Funds","Gold Mining Companies fund","All of the above"],"answer":0,"explanation":"The performance of Gold ETFs / Gold saving funds would track the price of gold. Therefore, gold prices will the appropriate benchmark for these funds. The performance of Gold sector funds or Gold mining companies fund is linked to the profitability of the gold companies and not to gold prices.","answer_source":"manual"},{"n":35,"q":"The market value of a mutual fund scheme's portfolio is Rs. 15 crores. Its current liabilities are Rs. 2 crore. The unit capital is Rs. 10 crore and face value per unit is Rs 10. Calculate the NAV per unit?","options":["Rs. 15","Rs. 10","Rs. 11.50","Rs. 13"],"answer":3,"explanation":"The formula for calculating NAV is: (Total Assets minus Liabilities other than to Unitholders) / No. of outstanding Units Total assets minus liabilities = 15 cr - 2 cr = Rs 13 cr Number of outstanding units = Unit Capital / Face value = 10 cr / 10 = 1 crore outstanding units NAV = 13 cr / 1 cr = Rs. 13","answer_source":"explicit"},{"n":36,"q":"Mr. Tarun is in his 30's and has a steady job. He is investing most of his savings in bank deposits. Due to low rate of return on bank deposits, he is putting his financial goals at risk. Which behavioral bias is his portfolio suffering from?","options":["Familiarity bias","Anchoring","Herd mentality","Confidence bias"],"answer":0,"explanation":"The familiarity bias is when investors tend to invest in what they know and are comfortable with. An individual tends to prefer the familiar over the novel, as the popular proverb goes, “A known devil is better than an unknown angel.” This leads an investor to concentrate the investments in what is familiar, which at times prevents one from exploring better opportunities, as well as from a meaningful diversification. As a result, investors are not diversified across multiple sectors and types of investments.","answer_source":"heuristic"},{"n":37,"q":"Identify the FALSE statement :","options":["1. When an investor sells his mutual fund units, the re-purchase is done by the mutual fund. Therefore the investor does not have to bear a tax on the capital gains","2. When an investor invests in a debt mutual fund for more than three years, the capital gains will be considered as Long term capital gain","Only 1 is false","Only 2 is false","Both 1 and 2 are false"],"answer":4,"explanation":"1. Re-purchase transactions are treated as a sale of units by the investor. Therefore, there will be an element of capital gain (or capital loss) and it will be taxed accordingly. 2. As per Finance Act 2023, growth option of debt funds was made taxable as short term capital gains (STCG) irrespective of holding period. Therefore there is no Long term capital gain tax in debt funds.","answer_source":"explicit"},{"n":38,"q":"In order to ensure fairness to investors, _____ has prescribed cut-off timing to determine the applicable NAV.","options":["AMFI","SEBI","RBI","Stock Exchange"],"answer":1,"explanation":"SEBI has prescribed cut-off timing to determine the applicable NAV and these timings are uniformly applicable for all mutual funds.","answer_source":"explicit"},{"n":39,"q":"'Not more than 25% of the Net Assets will be invested in the Derivatives Market' - This statement best describes the ________ of the mutual fund scheme.","options":["Investment Objective","Investment Interest","Investment Strategy","Investment Policy"],"answer":3,"explanation":"Investment objective defines the broad investment charter. Investment policy describes in greater detail, the kind of portfolio that will be maintained. The investment policy includes the scheme’s asset allocation and investment style.","answer_source":"explicit"},{"n":40,"q":"When a mutual fund distributor empanels with an AMC, he/she has to sign a declaration for ______ .","options":["Declaring the rebates given back to the investors","Ensuring that all employees who are selling mutual funds will have more than on ARN code","Guarantee of adding a minimum of 25 investors every month","Commitment to abide by statutory codes, guidelines and circulars"],"answer":3,"explanation":"As per the procedure for getting empaneled as a mutual fund distributor with AMC, one of the requirement is : The applicant needs to sign a declaration, which provides for the following - Commitment to abide by instructions given, as also statutory codes, guidelines and circulars.","answer_source":"explicit"},{"n":41,"q":"Mr. Anand has Rs. 5 lakhs to invest but he may need money in the short term. In which of these funds should he NOT invest?","options":["Liquid Fund","Money-market fund","Index fund","Overnight fund"],"answer":2,"explanation":"When an investor needs money in the short term, he should invest in debt funds like liquid funds, money market funds, overnight fund etc. where he can withdraw money without any risk of capital loss. He should not invest in an Index fund as its an equity fund and there can be possibility of losses in the short term due to stock market fluctuations.","answer_source":"explicit"},{"n":42,"q":"Identify which of the foll statement/s is/are false in context of benchmarks.","options":["A. An independent agency should calculate the benchmark in a transparent manner","B. The process of choosing a benchmark for an Index Fund is very complex","Only A is false","Only B is false","Both A and B are false","None of the above"],"answer":3,"explanation":"For an Index Fund, choosing a benchmark is generally straightforward because the fund is designed to replicate a specific index (like Nifty 50 or Sensex). The benchmark is usually the same index the fund tracks. Benchmarks should be calculated by an independent and credible agency, and the methodology must be transparent to ensure fairness and reliability.","answer_source":"explicit"},{"n":43,"q":"Identify the TRUE statement/s with respect to Statement of Additional Information (SAI).","options":["A. Regular update has to be done by the end of 3 months of every financial year","B. Material changes have to be updated on an ongoing basis and uploaded on the websites of the mutual fund and AMFI.","Only A is true","Only B is true","Both A and B are true","None of the above"],"answer":4,"explanation":"Updation of Scheme Documents—Regulatory provisions Updation of SAI : Regular update has to be done by the end of 3 months of every financial year. Material changes have to be updated on an ongoing basis and uploaded on the websites of the mutual fund and AMFI.","answer_source":"explicit"},{"n":44,"q":"What is the full form of AGNI ?","options":["AMFI Guidelines and Norms for Intermediaries","AMFI Guidelines for Nominations and Investments","AMFI Guidelines for New issues and Investments","AMFI Guidelines for New Investors"],"answer":0,"explanation":"AMFI has framed a set of guidelines and code of conduct for intermediaries (known as AMFI Guidelines & Norms for Intermediaries (AGNI)), consisting of individual agents, brokers, distribution houses and banks engaged in selling of mutual fund products.","answer_source":"heuristic"},{"n":45,"q":"Identify the TRUE statement with respect to Systematic Investment Plan (SIP) ?","options":["A SIP cannot be done in an New Fund Offer (NFO)","A SIP can be done only in an existing folio","A SIP can be done in a Close-end fund","A SIP can be used to initiate a fresh purchase of mutual funds"],"answer":3,"explanation":"A SIP can be used to initiate a fresh purchase of mutual funds is correct. You do not need to make a large \"lump sum\" payment to start your journey with a mutual fund. An investor can open a new account (folio) and begin their investment immediately using the SIP route. Why others are not correct : 1. A SIP cannot be done in an New Fund Offer (NFO) - This is wrong as you can actually start a SIP during an NFO period. Many Asset Management Companies (AMCs) allow investors to register a SIP while the fund is being launched 2. A SIP can be done only in an existing folio - This is wrong as a SIP can be started with a new folio; an existing folio is not mandatory. 3. A SIP can be done in a Close-end fund - This is wrong as generally, SIPs are not available for Close-end funds.","answer_source":"explicit"},{"n":46,"q":"What is the investment range in equity instruments for a Conservative hybrid fund?","options":["Between 20 percent and 30 percent of total assets","Between 30 percent and 40 percent of total assets","Between 10 percent and 25 percent of total assets","Between 5 percent and 20 percent of total assets"],"answer":2,"explanation":"Conservative Hybrid Fund is an open-ended hybrid scheme investing predominantly in debt instruments. Investment in debt instruments shall be between 75 percent and 90 percent of total assets while investment in equity and equity instruments shall be between 10 percent and 25 percent of total assets.","answer_source":"explicit"},{"n":47,"q":"______ is NOT accepted as a photo identity documentation for Micro SIP.","options":["Debit card with a photo","Permanent Retirement Account Number (PRAN) card issued to National Pension System (NPS)","Employee ID cards issued by companies registered with the Registrar of Companies","Credit card"],"answer":3,"explanation":"Credit card is not accepted because it may not be backed up by a bank account.","answer_source":"explicit"},{"n":48,"q":"The Net Asset Value (NAV) of a segregated portfolio has to be declared on a ______ .","options":["Daily basis after the credit event","Weekly basis (on every Saturday) after the credit event","Monthly basis after the credit event","NAV need not be declared"],"answer":0,"explanation":"To ensure fair treatment to all investors in case of a credit event and to deal with the liquidity risk, in December 2018, SEBI permitted creation of segregated portfolio of debt and money market instruments by mutual funds schemes. “Segregated portfolio” means a portfolio, comprising of debt or money market instrument affected by a credit event, that has been segregated in a mutual fund scheme. The Net Asset Value (NAV) of the segregated portfolio shall be declared on a daily basis.","answer_source":"heuristic"},{"n":49,"q":"A folio which is held by a _______ CANNOT have a nominee.","options":["Minor","Trust","Registered Company","All of the above"],"answer":3,"explanation":"Only individual investors can make a nomination. Therefore, a Trust or Registered Company cannot have a nominee. Also investments by minors cannot have a nomination.","answer_source":"explicit"},{"n":50,"q":"When does an investor in mutual funds have to provide information under the Foreign Account Tax Compliance Act (FATCA) ?","options":["When the investment is made through a foreign bank account","When the investor's folio was a NRI account before change","When the investor's place of birth is other than India","When the investor is a resident of USA or UK only"],"answer":2,"explanation":"For applicants, including guardians, whose country of birth/citizenship/nationality/tax residency is other than India, the application requires additional information under Foreign Account Tax Compliance Act (FATCA).","answer_source":"explicit"},{"n":51,"q":"In the case of a Sectoral Fund, the minimum investment in equity and equity related instruments of a particular sector of total assets should be _____ .","options":["65%","70%","80%","95%"],"answer":2,"explanation":"Sectoral fund is an open-ended equity scheme investing in a specific sector such as bank; power etc. The minimum investment in equity and equity related instruments of a particular sector/ theme shall be 80 percent of total assets.","answer_source":"explicit"},{"n":52,"q":"Diversified equity funds are less risky compared to Thematic funds in terms of _______ risk.","options":["Duration","Size","Concentration","Style"],"answer":2,"explanation":"A Thematic fund invests in line with an investment theme. For example, an infrastructure thematic fund might invest in shares of companies that are into infrastructure, construction, cement, steel, telecom, power etc. A Diversified equity fund invests in many sectors and themes as per the investment policy and fund managers decisions. Thematic funds are risky because of the concentration in one theme. If the theme under-performs then the scheme’s returns is likely to be poor.","answer_source":"explicit"},{"n":53,"q":"Identify the TRUE statement with respect to Time Horizon to the financial goal.","options":["Longer the horizon to the goal, the ability to take risk is higher","Longer the horizon to the goal, the ability to take risk is lower","Shorter the horizon to the goal, the ability to take risk is higher","Time horizon has no link to financial goals"],"answer":0,"explanation":"When the time horizon is long, investors can afford to take more risk (e.g., equities) because short-term volatility can be absorbed, and there’s time to recover from market downturns. - When the time horizon is short, investors need safer assets (e.g., debt, liquid funds) since there’s little time to recover losses. - Hence, risk-taking ability is directly proportional to the time available before the goal. Therefore “More time = more risk capacity”","answer_source":"manual"},{"n":54,"q":"While the SID, SAI and KIM need to be updated periodically, the interim changes are updated by the AMC through the issuance _______ .","options":["Fact Sheet","Director's Report","Auditor's Report","Addendum"],"answer":3,"explanation":"While the SID, SAI and KIM need to be updated periodically, the interim changes are updated through the issuance of addendum. The addendum is considered to be a part of the scheme related documents and must accompany the KIM.","answer_source":"explicit"},{"n":55,"q":"On whom is the compliance requirement under Foreign Account Tax Compliance Act (FATCA) applicable?","options":["Only on those mutual funds who have foreign institutions as their sponsors","Only on those mutual funds who are registered with a foreign agency","All financial institutions including mutual funds","Only Indian mutual funds"],"answer":2,"explanation":"The Foreign Account Tax Compliance Act (FATCA) is a US law that aims to combat tax evasion by US persons opening accounts offshore. It enhances due diligence and information reporting requirements for both individual and entity accounts. On July 9, 2015, India signed Inter-Governmental Agreement (IGA) with the USA for implementation of FATCA. This is applicable to all financial institutions including mutual funds. To comply with the requirements of the Foreign Account Tax Compliance Act (FATCA) and Common Reporting Standards (CRS) provisions, financial institutions, including mutual funds, are required to undertake a due diligence process to identify foreign reportable accounts and collect such information as required under the said provisions and report the same to the US Internal Revenue Service/any other foreign government or to the Indian Tax Authorities for onward transmission to the concerned foreign authorities.","answer_source":"explicit"},{"n":56,"q":"______ is the most relevant factor for comparing performance of liquid funds of similar category offered by various mutual fund houses.","options":["Expenses","Maturity","Current NAV","Taxation"],"answer":0,"explanation":"Comparing the Expense Ratio of different schemes is imperative for investors looking for the best liquid mutual fund. These schemes more or less earn similar returns. Hence, a fund with a high expense ratio will significantly reduce the returns generated. For example, suppose two funds deliver returns of 5% and 5.5%, respectively. Let’s say the expense ratio of the first fund is 0.2%, and the second fund is 0.8%. Therefore, the actual yield will be 4.8% and 4.7%. Hence, a fund with a lower expense ratio may be more profitable for an investor.","answer_source":"manual"},{"n":57,"q":"Mutual funds CANNOT distribute income / dividend out of ______ .","options":["Dividends which are received from equity investments","Unrealised appreciation in value of investments","Income accruals","Realised gains from sale of investments"],"answer":1,"explanation":"SEBI guidelines stipulate those dividends can be paid out of distributable reserves. In the calculation of distributable reserves: - All the profits earned (based on the accrual of income and expenses as detailed above) are treated as available for distribution. - Valuation gains are ignored. But valuation losses need to be adjusted against the profits. - That portion of the sale price on new units, which is attributable to valuation gains, is not available as a distributable reserve. Since the investments in the portfolio are not yet sold, the gains in them are on paper - they are not realised. They will be realized when those investments are sold.","answer_source":"explicit"},{"n":58,"q":"Identify the False statement -","options":["Mutual funds units which have been purchased on a stock exchange have a compulsory lock-in period","Mutual funds units can be bought on stock exchanges but they cannot be sold there","Both of the above are false"],"answer":2,"explanation":"SEBI has facilitated buying and selling of the units of open-ended mutual funds through the stock exchanges. The low cost and deeper reach of the stock exchange network enable an increased level of participation of retail investors in mutual funds. Mutual fund units can be bought and sold on stock exchange and they do not have a lock-in period except some funds like ELSS.","answer_source":"explicit"},{"n":59,"q":"Sale of units of equity oriented mutual fund (delivery based) will attract Securities Transaction Tax at ______ %.","options":["0.01","0.001","0.017","0.125"],"answer":1,"explanation":"When an investor sells units of an equity fund in the stock exchange, or offers them for re-purchase to the fund, he/she will have to incur Securities Transaction Tax (STT). STT is charged at 0.001% on such sale transactions.","answer_source":"explicit"},{"n":60,"q":"In which of the following options does an investor receive the distribution in hand?","options":["Income Distribution cum capital withdrawal option only","Income distribution cum capital withdrawal reinvestment plan only","Income Distribution cum capital withdrawal option and Income distribution cum capital withdrawal reinvestment plan both","Growth"],"answer":0,"explanation":"Most mutual fund schemes offer two options – Income Distribution cum capital withdrawal and Growth. A third option, which is possible, is the Re-investment of Income Distribution cum capital withdrawal Option In a Pay-out of Income Distribution cum capital withdrawal option, the investor receives the dividend in his bank account. In a Re-investment of Income Distribution cum capital withdrawal plan the investor does not receive the dividend in his bank account; the amount is re-invested in the same scheme and additional units are allotted to the investor In a growth option, dividend is not declared. Therefore, nothing is received in the bank account.","answer_source":"manual"},{"n":61,"q":"The return from a mutual fund scheme is 8.3% and the Standard Deviation is 0.6. The risk-free rate of return is 5%. Calculate the Sharpe ratio.","options":["3.5","5.5","4","2.87"],"answer":1,"explanation":"The formula for Sharpe Ratio is : ( Rs-Rf ) / Standard Deviation ie. ( Return Earned - Risk free Return ) / Standard Deviation = (8.3 - 5) / 0.6 = 3.3 / 0.6 = 5.5","answer_source":"explicit"},{"n":62,"q":"What is required for the termination of the services of an Asset Management Company (AMC) ?","options":["75 % of the mutual funds distributors should approve the termination of the Asset Management Company","75 % of the unitholders should approve the termination of the Asset Management Company","The custodian should approve the termination of the Asset Management Company","AMFI should approve the termination of the Asset Management Company"],"answer":1,"explanation":"The appointment of the AMC for the Mutual Fund can be terminated by majority of the Directors of the Trustee Board or by 75 percent of the Unitholders of the Scheme.","answer_source":"explicit"},{"n":63,"q":"Recency bias applies to ______ events.","options":["only positive","only negative","both positive and negative"],"answer":2,"explanation":"Recency bias : The impact of recent events on decision making can be very strong. This applies equally to positive and negative experiences. Investors tend to extrapolate the event into the future and expect a repeat. A bear market or a financial crisis leads people to prefer safe assets. Similarly, a bull market makes people allocate more than what is advised for risky assets.","answer_source":"explicit"},{"n":64,"q":"Identify the category of mutual fund scheme in which the Net Asset Value (NAV) has to be declared for up to 4 decimal points?","options":["Mid-Cap Funds","Blue Chip Funds","Hybrid Funds","Liquid Funds"],"answer":3,"explanation":"NAV is to be calculated upto 4 decimal places in the case of index funds, liquid funds and other debt funds. Liquid funds deal with very short-term money market instruments and usually have a large number of unit transactions daily. To ensure accurate calculation and fair valuation, their NAV is declared up to 4 decimal places. (NAV for equity and balanced funds is to be calculated upto at least 2 decimal places)","answer_source":"explicit"},{"n":65,"q":"Mr. Ashu holds his mutual fund units in demat form. If he wants to change his nominee or his bank account, he has to contact the ______ and complete the required procedure.","options":["Stock Exchange","Depository Participant","R&T agent of the mutual fund","AMC / Mutual fund"],"answer":1,"explanation":"Since Mr. Ashu holds his mutual fund units in DEMAT form, any changes related to: Nominee details Bank account information must be done through the Depository Participant (DP) — i.e., the entity through which he holds his demat account (like a broker or bank).","answer_source":"explicit"},{"n":66,"q":"Which of these is an important factor while estimating the correct future value of a financial goal?","options":["Risks which are unexpected","Economic Growth","Return and Gains","Inflation Rate"],"answer":3,"explanation":"The formula to calculate the Future Value is : A = P * (1 + r) ^ n Where A is the future value ; P is the present value, r is the rate of inflation and n is the number of years. Therefore, inflation rate is important for estimating the future value.","answer_source":"explicit"},{"n":67,"q":"The ARN is allotted to the mutual fund distributors by ______ .","options":["SEBI","NISM","AMFI","AMC"],"answer":2,"explanation":"A major role of AMFI involves the registration of mutual fund distributors, by allotting them AMFI Registration Number (ARN), which is mandatory for becoming a mutual fund distributor.","answer_source":"explicit"},{"n":68,"q":"How can the empanelment of a mutual fund distributor be terminated?","options":["The empanelment gets automatically terminated on the completion of the term of empanelment","Asset Management Company can terminate the empanelment at any time","When all the clients of the distributor shift to Direct Plans","All of the above"],"answer":1,"explanation":"Empanelment of a mutual fund distributor does not end automatically with time; it continues as long as the distributor’s ARN remains valid. Also, even if all clients move to Direct Plans, the empanelment legally stays intact. The only clear ground for termination is that the AMC can terminate the empanelment at its discretion. While empaneling with an AMC, the mutual fund distributor applicant signs a declaration which gives power to the AMC to terminate the empanelment at any time.","answer_source":"explicit"},{"n":69,"q":"Identify the TRUE statement with respect to Total Expense Ratio (TER).","options":["Disclosure of TER is very critical as there is no regulation capping it","As the TER of mutual fund schemes is highly regulated and therefore no disclosures are required","SEBI has specific and strict regulations regarding the cap for TER as well as the periodic disclosure of the same","None of the above"],"answer":2,"explanation":"One of the important factors that impact the scheme’s NAV is the Total Expense Ratio (TER), charged to the scheme. Though the same is very tightly regulated through SEBI regulations, the investor should know about the scheme expense ratio. SEBI has mandated that the Asset Management Companies (AMCs) should prominently disclose on a daily basis, the Total expense ratio (scheme-wise, date-wise) of all schemes.","answer_source":"explicit"},{"n":70,"q":"While empaneling mutual fund distributors, an AMC has to do a due diligence to satisfy the 'Fit and Proper' criteria for eligible distributors. Which of the following form a part of this due diligence process?","options":["The eligible distributor should have the requisite Employee to Customer ratio as prescribed by SEBI","The eligible distributor should have strict internal controls to limit investors exposure to an asset class or fund house","Adequate controls to delink sales functions from customer risk and investment objective evaluation","All of the above"],"answer":2,"explanation":"At the time of empaneling distributors and during the period i.e., review process, mutual funds/AMCs have to undertake a due diligence process to satisfy ‘fit and proper’ criteria that incorporate, amongst others, the following factors: a. Business model, experience and proficiency in the business. b. Record of regulatory/statutory levies, fines and penalties, legal suits, customer compensations made; causes for these and resultant corrective actions taken. c. Review of associates and subsidiaries on the above factors. d. Organizational controls to ensure that the following processes are delinked from sales and relationship management processes and personnel: i. Customer risk/investment objective evaluation. ii. MF scheme evaluation and defining its appropriateness to various customer risk categories.","answer_source":"explicit"}]},{"category":"Mutual Fund","set":"Set 2","count":70,"questions":[{"n":1,"q":"Mutual fund distributors receive compensation from _____ after the removal of transaction charges by SEBI.","options":["SEBI or AMFI","Stock exchanges","Investors themselves","Asset Management Companies (AMCs)"],"answer":3,"explanation":"After the withdrawal of transaction charges in 2025, mutual fund distributors are mainly compensated through commissions paid by the AMC. These commissions are paid from the scheme expenses within SEBI-prescribed limits.","answer_source":"explicit"},{"n":2,"q":"Identify the investors that fall under the classification of Institutional Investors-","options":["Trusts","Non-Resident Indians (NRIs)","High Net-worth Individuals (HNIs)","Persons of Indian Origin (PIOs)"],"answer":0,"explanation":"Institutional investors are organizations or entities that invest funds on behalf of a group or institution. Trusts fall under this category because they are legally formed entities managing money for specific purposes or beneficiaries. NRIs, PIOs and High Networth Individuals (HNIs) are classified as individual investors, not institutional investors.","answer_source":"heuristic"},{"n":3,"q":"For resolving investor grievances, mutual fund investors can approach __________.","options":["Finance Ministry","Securities and Exchange Board of India (SEBI)","Reserve Bank of India (RBI)","Association of Mutual Funds in India (AMFI)"],"answer":1,"explanation":"SEBI is the primary regulatory authority for mutual funds in India. If investors have complaints or grievances against a mutual fund or AMC, they can approach SEBI for redressal. SEBI provides an online grievance redressal platform called SCORES, where investors can file complaints and track their status.","answer_source":"explicit"},{"n":4,"q":"Identify the category of funds that adopts positions contrary to the overall market direction.","options":["Hi Growth Funds","Contra funds","Index funds","Thematic funds"],"answer":1,"explanation":"Contra funds follow a contrarian investment strategy. They invest in stocks or sectors that are currently unpopular or underperforming in the market, with the expectation that these investments may perform well in the future. The idea is to “go against the market trend” when fund managers believe the market has undervalued certain opportunities.","answer_source":"explicit"},{"n":5,"q":"A segregated portfolio in a debt mutual fund scheme may be formed in which of the following situations ?","options":["Change in the fund management team","Increase in interest rates","Occurrence of a credit event","Fall in interest rates"],"answer":2,"explanation":"A segregated portfolio (also called a side pocket) in a debt mutual fund scheme can be created when there is a credit event, such as: default in payment, downgrade of a security to below investment grade, or similar credit risk issues. This helps separate the troubled assets from the healthy portfolio and protects existing investors in the scheme.","answer_source":"explicit"},{"n":6,"q":"Units of a close-ended mutual fund scheme may sometimes trade at a premium to NAV in the stock exchange because of which of the following reasons?","options":["Anticipated weakness in stock markets leading to higher prices for the scheme units","Mutual fund units never trade at prices different from their NAV","Demand and supply forces in the market influencing unit prices","Units generally trade above NAV when the scheme approaches maturity"],"answer":2,"explanation":"Units of a close-ended mutual fund are traded on the stock exchange like shares. Their market price depends on demand and supply among investors. If more people want to buy the units, the price can become higher than NAV (called premium). Similarly, if demand is low, the units may trade below NAV (called discount). Example: If a close-ended fund holds promising stocks and investors are eager to buy its units on the exchange, competition among buyers can push the traded price above the actual NAV — simply because demand exceeds supply.","answer_source":"explicit"},{"n":7,"q":"Identify the option that falls under the category of physical assets.","options":["Real estate fund","Mortgage-backed security","Real estate","Gold futures"],"answer":0,"explanation":"A physical asset is a tangible asset that has a physical form and can be seen or touched. Real estate, such as land, buildings, or property, is therefore classified as a physical asset. The other options are financial instruments: Real estate fund - a mutual fund investment linked to real estate Gold futures - a derivative contract based on gold prices Mortgage-backed security - a financial security backed by home loans These represent financial claims or investments, not direct physical ownership of assets.","answer_source":"explicit"},{"n":8,"q":"Which of the following investment options is considered the most illiquid?","options":["Fixed Deposits in bank","Equity shares","Gold","Real estate"],"answer":3,"explanation":"Real estate is considered the most illiquid asset among the given options because buying or selling property usually takes significant time, involves legal procedures, and may require finding suitable buyers. In contrast, shares and gold can generally be sold quickly in the market, and bank deposits can be withdrawn relatively easily, though sometimes with a penalty. Illiquidity means difficulty in converting an asset into cash quickly without substantial loss in value, which is highest in the case of real estate.","answer_source":"explicit"},{"n":9,"q":"Consider this arrangement of mutual fund schemes from lower to higher risk: 1) Government Securities Fund 2) Corporate Bond Fund 3) Credit Risk Fund.","options":["What type of risk is being referred to in this ranking ?","Interest rate risk","Credit risk","Duration risk","Concentration risk"],"answer":2,"explanation":"Government securities funds invest in sovereign-backed securities and therefore have the lowest credit risk. Corporate bond funds invest in high-rated corporate debt, carrying moderate credit risk. Credit risk funds invest significantly in lower-rated instruments to earn higher returns, so they carry the highest credit risk. Thus, the sequence reflects increasing Credit Risk.","answer_source":"explicit"},{"n":10,"q":"Trail commission payable to mutual fund distributors is calculated periodically. If there are no transactions in an investor’s folio, which of the following values would still change across different calculation periods?","options":["Applicable trail commission rate","Holding period in days","Number of units held/sold","NAV of the scheme"],"answer":3,"explanation":"Trail commission is an ongoing commission paid to the MF distributor as long as the investor stays invested. It is calculated as a percentage of the Assets Under Management (AUM), which is essentially the number of units × NAV. When there are no transactions in the folio, the number of units remains fixed and unchanged. The trail commission percentage is also fixed as agreed. However, the NAV changes every single day based on the market performance of the underlying securities in the fund. Since NAV fluctuates daily, the value of the investor's holdings changes every period, and therefore the trail commission amount also changes — even without any buying or selling in the folio.","answer_source":"explicit"},{"n":11,"q":"An Ultra Short Duration Fund generally maintains a portfolio with a Macaulay duration within which of the following ranges ?","options":["Below 3 months","Between 3 months and 6 months","Not more than 90 days","Between 6 months and 12 months"],"answer":1,"explanation":"Macaulay Duration is a measure of the average time it takes to receive all cash flows (interest + principal) from a bond/portfolio. The longer the duration, the more sensitive the fund is to interest rate changes. An Ultra Short Duration Fund holds debt instruments with a Macaulay Duration of 3 to 6 months — making it slightly longer than a Liquid Fund but shorter than a Low Duration Fund. It is ideal for investors who want slightly better returns than a savings account with low interest rate risk and a short investment horizon of 3 to 6 months.","answer_source":"explicit"},{"n":12,"q":"Which disclosure is most important for an investor to determine the current value of their investments?","options":["Net Asset Value (NAV)","Total assets managed under the scheme","Credit rating profile of the debt holdings","Sector-wise allocation"],"answer":0,"explanation":"Net Asset Value (NAV) represents the per-unit value of a mutual fund scheme. Investors use the NAV to calculate the current value of their investments by multiplying it with the number of units held. It is declared regularly by mutual funds and is the most important valuation indicator for investors.","answer_source":"manual"},{"n":13,"q":"Portfolio performance is affected by which of the following factors?","options":["Only A and B","Only A and C","Only B and C","All A, B and C"],"answer":3,"explanation":"Portfolio performance is influenced by all three factors working together. The Investment Policy sets the overall framework and boundaries within which the fund must operate — such as what types of securities can be bought and what risks can be taken. Within that framework, the Asset Allocation Strategy decides how money is divided across asset classes like equity, debt, and gold — and research shows this is the single biggest determinant of long-term returns. Finally, Stock Selection reflects the fund manager's skill in picking the right individual securities within each asset class to generate returns above the benchmark.","answer_source":"explicit","statements":["A) Selection of stocks","B) Investment policy framework","C) Asset allocation approach"]},{"n":14,"q":"Identify the factors that are considered fundamental attributes of a mutual fund scheme:","options":["A) Management committee of the AMC","B) The scheme’s investment objective","C) Pattern of investments under the scheme","D) Terms relating to the issue of the scheme","A, B and C","B, C and D","A and D","All A, B, C and D"],"answer":5,"explanation":"As per SEBI Regulations, the fundamental attributes of a scheme are its core defining characteristics — the investment objective (what the scheme aims to achieve), the issue terms (whether open/close ended, entry/exit load, maturity period) and the investment pattern (asset allocation — where the money will be invested like equity, debt etc.). Managing committee of AMC – Not a fundamental attribute. This relates to AMC governance, not scheme-level attributes.","answer_source":"explicit"},{"n":15,"q":"Calculate the Average Holding Period if the portfolio turnover ratio is 50 percent.","options":["50 months","2 Years","3.5 Years","15 Years"],"answer":1,"explanation":"Average Holding Period = 1 / Portfolio Turnover Ratio. Turnover ratio = 50% = 0.5 So, Average Holding Period = 1 / 0.5 = 2 years. This means the portfolio, on average, is held for two years before being completely churned.","answer_source":"explicit"},{"n":16,"q":"Who can attest the copies of supporting documents in the KYC procedure ?","options":["Gazetted Officer","Manager of a Scheduled Commercial Bank","Both of the above","Mutual Fund Distributor"],"answer":2,"explanation":"KYC documents can be attested by a Notary Public, Gazetted Officer or Manager of a Scheduled Commercial Bank. They cannot be attested by a mutual fund distributor.","answer_source":"explicit"},{"n":17,"q":"An institutional investor cannot invest in the equity market under its investment mandate. Which of the following mutual fund scheme categories may be recommended by a mutual fund distributor to such an investor?","options":["Equity Savings Fund","Corporate Bond Fund","Arbitrage Fund","Multi Asset Allocation Fund"],"answer":1,"explanation":"Since the institutional investor cannot invest in equity markets at all, the MF distributor must recommend a scheme that has zero equity exposure — making a pure debt fund the only suitable option here. Arbitrage funds, multi asset allocation funds, and equity savings funds all have exposure to equities. A corporate bond fund invests mainly in debt instruments issued by companies and does not require equity exposure. Therefore, a corporate bond fund is suitable for such an investor.","answer_source":"explicit"},{"n":18,"q":"While giving the mutual fund units for re-purchase, the distributor should consider the impact of Capital Gains Tax and ______ on the investor's portfolio.","options":["Beta","Entry Load","Exit Load","Sharpe Ratio"],"answer":2,"explanation":"Both taxes and loads reduce investment returns. Therefore, it is important for the distributor to consider these two aspects during repurchases/redemptions. This means that when there is a need to withdraw money from a scheme, the distributor must assess the implications of capital gains tax and exit loads.","answer_source":"explicit"},{"n":19,"q":"What is the difference between a mutual fund schemes actual return and its optimal return know as ? This is also a measure of a fund managers performance.","options":["Beta","Sharpe","Basis","Alpha"],"answer":3,"explanation":"The difference between a scheme’s actual return and its optimal return is its Alpha—a measure of the fund manager’s performance. Alpha, therefore, measures the performance of the investment in comparison to a suitable market index. Positive alpha is indicative of out- performance by the fund manager; negative alpha might indicate under-performance.","answer_source":"explicit"},{"n":20,"q":"The transaction costs are low for investments in real estate as compared to other financial assets. State whether True or False?","options":["True","False"],"answer":1,"explanation":"Transaction costs, in the form of stamp duty, registration fees, brokerage etc. are high in real estate transactions.","answer_source":"explicit"},{"n":21,"q":"Mr. Sachin wants to initiate a Systematic Investment Plan (SIP) in a mutual fund scheme. Which of the following statement is correct?","options":["A SIP can be done only in an existing folio","A SIP can be used to initiate a fresh purchase of mutual funds","A SIP cannot be done in an New Fund Offer (NFO)","A SIP can be done in a Close-end fund"],"answer":1,"explanation":"An SIP can be used to initiate a fresh purchase in a scheme and open a folio. It can be used to make additional purchases in an existing folio. An SIP can also be initiated during a New Fund Offer (NFO). A Close-end fund does not have SIP facility.","answer_source":"explicit"},{"n":22,"q":"Which of the following is/are also stamped on the application form along with the time stamp?","options":["Only A and B","Only B and C","Only A and C","All A, B and C"],"answer":3,"explanation":"When one submits an application form to a mutual fund or its registrar’s office, it is passed through a machine that stamps the time and day of submission. This process is called time-stamping and is the first acknowledgement or proof of investment. Application for purchase of units is stamped with automatically generated location code, machine identifier, serial number, date and time.","answer_source":"explicit","statements":["A) Location Code","B) Serial Number","C) Machine Identifier"]},{"n":23,"q":"Identify the FALSE statement/s.","options":["A) When dividend is declared on mutual fund units which are under a lien, this dividend can be paid either to the unit-holder or to the lender depending on the agreement between them","B) Mutual Fund units cannot be pledged by individual investors.","Only A is false","Only B is false","Both A and B are false","Neither A nor B are false"],"answer":3,"explanation":"Both individuals and non-individuals can pledge their mutual fund units. Banks, NBFCs and other financiers lend money against the pledge of Units by the Unitholder. The Pay-out (Dividend) of Income Distribution cum capital withdrawal (IDCW) plan declared on units under lien may be paid to the unit- holder or the lender depending upon the agreement. Note - Dividend option of schemes is now called Income Distribution Cum Capital Withdrawal (IDCW) option.","answer_source":"explicit"},{"n":24,"q":"As per SEBI regulations, _______ is required while declaring mutual fund scheme performance.","options":["The new fund open and closing dates","Returns of the peer group mutual fund schemes","Returns of the scheme compared to other financial products","Returns of the scheme compared to the benchmark"],"answer":3,"explanation":"To know how well a mutual fund scheme is performing, it has to be compared to a pre-defined comparable benchmark. For eg. A midcap fund can be benchmarked / compared to Nifty Midcap index.","answer_source":"explicit"},{"n":25,"q":"Identify which of these statement/s is/are CORRECT?","options":["A. Investors can be categorized on the basis of their age and investors of same age should always have the same asset allocation in their investment portfolios","B. Only after considering the individual's risk profile, the asset allocation should be done between core portfolio and satellite portfolio.","Only statement A is correct","Only statement B is correct","Both statements A and B are correct","None of the above"],"answer":3,"explanation":"Ideally an investor's portfolio should be divided into Core and Satellite portfolios. The core portfolio will be invested according to the long-term needs of the investor and the satellite portfolio will be invested to take advantage of expected short-term market movements. However, the division between core and satellite portfolios will depend upon each investor’s profile. Conservative investors may like a very small proportion of their overall portfolio to be managed tactically and an investor comfortable with taking higher risk may have an even higher exposure to tactical investments. Different investors have different financial goals at different age levels. In fact, investors in the same age group may also have different goals. Their financial situations may also differ. At the same time, many of the financial goals may pertain to the whole families and not just an individual. In such cases, it may not be prudent to categorize investors on the basis of age alone.","answer_source":"explicit"},{"n":26,"q":"Identify from the following practices, which is/are NOT an approved practice by a registered mutual fund distributor?","options":["Not levying transaction charges on investors based on the value of their investments","Attracting new investors by offering them monetary incentives","Both of the above","None of the above"],"answer":1,"explanation":"Not levying transaction charges : This is perfectly allowed. Distributors may choose not to levy transaction charges; it’s optional. Offering monetary incentives to attract investors : This is not permitted. SEBI regulations prohibit distributors from offering cash or monetary benefits to lure investors, as it can lead to mis-selling. Therefore, the practice that is NOT approved is offering monetary incentives.","answer_source":"explicit"},{"n":27,"q":"The risk of encroachment will be the most in _______ .","options":["Art work","Land","Gold","Building"],"answer":1,"explanation":"Encroachment basically means a movement into or an entry to another's property without right or permission. Encroachment generally happens the most on an open land.","answer_source":"explicit"},{"n":28,"q":"Which of these investors will settle for lower returns as he/she prefers low level of risks?","options":["A Moderate investor","A Conservative investor","An Aggressive investor","An Adventurous investor"],"answer":1,"explanation":"A conservative investor is someone who wants his money to grow but does not want to risk his principle investment. Conservative investors choose financial products that do not fluctuate much in value, such as conservative mutual funds.","answer_source":"explicit"},{"n":29,"q":"Identify the FALSE statement/s.","options":["A) All investors of the similar age group should have the same asset allocation in their portfolio","B) Risk profile of the investor should not be considered if his mutual fund distributor understands the risks associated with the mutual fund scheme.","Only A is false","Only B is false","Both A and B are false","Neither A nor B are false"],"answer":4,"explanation":"Different investors have different financial goals at different age levels. In fact, investors in the same age group may also have different goals. Their financial situations may also differ. At the same time, many of the financial goals may pertain to the whole families and not just an individual. In such cases, it may not be prudent to categorize investors on the basis of age alone. The investor’s risk appetite is a function of three things—the need to take risks, the ability to take risks, and the willingness to take risks. Thus, an understanding of the risk profile of the investor and the investment risks associated with various mutual fund schemes, both would be essential for deciding the asset allocation in an investor’s portfolio.","answer_source":"explicit"},{"n":30,"q":"When an institutional investor is not allowed to invest in equity markets than the mutual fund distributor can sell _________ to such an investor.","options":["Corporate Bond Fund","Equity Savings Fund","Multi Asset Allocation Fund","Arbitrage Fund"],"answer":0,"explanation":"When an institutional investor is not allowed to invest in equity markets, the mutual fund distributor must recommend funds that invest only in debt instruments, not in equity or equity-related instruments. From the options given above, only Corporate Bond Fund invests purely in debt instruments and not in any equity.","answer_source":"heuristic"},{"n":31,"q":"According to the AMFI's code of conduct for mutual fund intermediaries, if a second violation against the intermediary is proved, their registration will be ______ .","options":["Suspended for 1 year","Suspended for 3 years","With held","Cancelled"],"answer":3,"explanation":"In the event of breach of the Code of Conduct by an intermediary, the following sequence of steps is initiated by AMFI: • Write to the intermediary and ask for an explanation within 3 weeks. • In case explanation is not received within 3 weeks, or is not satisfactory, AMFI will issue a warning letter indicating that any subsequent violation will result in cancellation of AMFI registration. • If there is a proved second violation by the intermediary, the registration will be cancelled, and intimation sent to all AMCs.","answer_source":"explicit"},{"n":32,"q":"Which of these mutual fund distributors have to mandatorily go through the due diligence process as mandated by SEBI?","options":["Distributors who get investments of over Rs. 1 crore in a single mutual fund","Distributors who receive commission over Rs. 50 lakhs from a single mutual fund","Distributors who service less than 25 investors","All of the above"],"answer":1,"explanation":"SEBI has mandated AMCs to put in place a due diligence process to regulate distributors who qualify any one of the following criteria: a. Multiple point presence (More than 20 locations) b. AUM raised over Rs. 100 crore across industry in the non-institutional category but including high networth individuals (HNIs) c. Commission received of over Rs. 1 Crore p.a. across industry d. Commission received of over Rs. 50 Lakhs from a single mutual fund.","answer_source":"explicit"},{"n":33,"q":"Mr. Mehta is a stock market investor. The stock market had crashed recently. Mr. Mehta pulls back all his investment from the stock markets because he fears that the markets will fall again. Which bias is Mr. Mehta exhibiting?","options":["Confirmation Bias","Overconfidence Bias","Recency Bias","Herd mentality"],"answer":2,"explanation":"Recency bias : The impact of recent events on decision making can be very strong. The recent experience overrides analysis in decision making. For example, a rise in prices of equities will make people think only about a further rise which would lead to more investment being made in equities. This increases the risk. On the other hand, a fall in prices in an asset would make people stay away thinking it would fall further which could lead to loss of opportunities.","answer_source":"explicit"},{"n":34,"q":"Ms. Janhvi invests Rs 2,00,000 in an equity fund. The face value of this scheme is Rs 10 and the NAV is Rs 40. The exit load is 1%. How many units will be allotted to Ms. Janhvi ?","options":["4950","7474.66","20000","5000"],"answer":3,"explanation":"Exit load is NOT applicable on purchase of units. Its applicable only on sale of units. The units will be allotted to Ms. Janhvi as per the NAV which is Rs. 40. Amount invested is Rs 2,00,000 Units allotted = Amount Invested / NAV = 200000 / 40 = 5000","answer_source":"explicit"},{"n":35,"q":"The first Account Statement under SIP/STP shall be issued within 10 working days of the initial investment/transfer - State whether True or False?","options":["True","False"],"answer":0,"explanation":"As pe
