r SEBI rules for Account Statements - The first Account Statement under Systematic Investment Plan (SIP) / Systematic Transfer Plan (STP) shall be issued within 10 working days of the initial investment/transfer.","answer_source":"heuristic"},{"n":36,"q":"Identify the TRUE statement.","options":["A) While calculating scheme returns for an investor, if there is an entry load, then the initial value of the Net Asset Value (NAV) is taken as NAV minus Entry Load","B) While calculating scheme returns for an investor, if there is an exit load, then the later value of the Net Asset Value (NAV) is taken as NAV minus Exit Load","Only A is true","Only B is true","Both A and B are true"],"answer":3,"explanation":"If there is an Entry load on a mutual fund scheme then while calculating the scheme returns, the initial value of the net asset value (NAV) is taken as NAV PLUS entry load as the purchase value increases due to entry load. If there is an exit load on a scheme then while calculating the scheme returns, the later value of the Net Asset Value (NAV) is taken as NAV minus the exit load as the sale value decreases due to the exit load. (Note - Entry load has now been banned by SEBI)","answer_source":"explicit"},{"n":37,"q":"What is the disadvantage of company fixed deposits when compared to bank fixed deposits?","options":["Lower rate of interest","Lower safety","Highly volatile","Difficult to liquidate"],"answer":1,"explanation":"Company fixed deposits are considered to risky when compared to bank fixed deposits due to the credit risk. A company is a private entity and may default in payment of interest and principal amount. A bank is much more safer than a private company and so its fixed deposits are more safer to invest.","answer_source":"explicit"},{"n":38,"q":"While giving the mutual fund units for re-purchase, the distributor should consider the impact of ______ and ______ on the investor's portfolio.","options":["Exit Load ; Capital Gains Tax","Exit Load ; Entry Load","Entry Load ; Capital Gains Tax","Entry Load : Beta"],"answer":0,"explanation":"Both taxes and loads reduce investment returns. Therefore, it is important for the distributor to consider these two aspects during repurchases/redemptions. This means that when there is a need to withdraw money from a scheme, the distributor must assess the implications of capital gains tax and exit loads.","answer_source":"heuristic"},{"n":39,"q":"_____ investment styles means buying stocks which are priced lower in the markets than the assessment based on fundamental analysis.","options":["Growth","Blend","Value","Cyclical"],"answer":2,"explanation":"Value investment style is an approach of picking up stocks, which are priced lower than their intrinsic value, based on fundamental analysis. The belief is that the market has not appreciated some aspect of the value in a company’s share – and hence it is cheap. When the market recognizes the intrinsic value, then the price would shoot up.","answer_source":"explicit"},{"n":40,"q":"Which intermediary is responsible for implementation of uniform KYC?","options":["Asset Management Company","KYC Registration Agencies","Registrar and Transfer Agents","Depository participants"],"answer":1,"explanation":"It is mandatory for all investors in the securities market, including the mutual fund investors, to be KYC (Know Your Customer) compliant under the provisions of the Prevention of Money Laundering Act. If the investor has to go through the KYC process with each mutual fund, then it would become a repetitive process. SEBI issued regulations for registration of central KYC Registry Agencies (KRAs). This introduced a common KYC for investors investing in securities markets.","answer_source":"explicit"},{"n":41,"q":"Which of the following do not impact the calculation of Net Asset Value (NAV) ?","options":["Change in value of investments held by the scheme","Daily accrual of expenses","Daily accrual of income","Change in the number of investors in the fund"],"answer":3,"explanation":"NAV gets changed due to : 1) Change in value of investments - If the stocks or bonds the fund owns go up or down, the NAV changes. 2) Daily accrual of expenses - The fund has costs (like management fees). These reduce the NAV a little each day. 3) Daily accrual of income - The fund earns money (like dividends or interest). This increases the NAV However a change in the number of investors doesn’t matter for NAV. Whether 1 person or 1,000 people invest, the NAV per unit stays the same. Just because more or fewer people invest, the NAV does not change.","answer_source":"explicit"},{"n":42,"q":"Usually most investors might have invested across various asset categories. However the problem with such asset allocation is that _______ .","options":["such asset allocation earns low returns","such asset allocation is done without defining any objective or without any process","such asset allocation increases the portfolio risk","such asset allocation leads to payment of additional taxes"],"answer":1,"explanation":"The basic meaning of asset allocation is to allocate an investor’s money across asset categories in order to achieve some objective. In reality, most investors’ portfolios would have the money allocated across various asset categories. However, in many such cases, the same may be done without any process or rationale behind it. Asset Allocation is a process of allocating money across various asset categories in line with a stated objective. The underlined words are very important. First, it is a “process”, which always involves several steps, and those steps should not be ignored or skipped. Second, the whole idea behind asset allocation is to achieve some objective. Whichever approach one selects, one must go through the steps of the process in order to achieve the objective.","answer_source":"explicit"},{"n":43,"q":"Which of the following is true for a monthly income distribution cum capital withdrawal plan (IDCW) of a mutual fund scheme?","options":["The mutual fund guarantees declaring the IDCW, however the amount may differ","The mutual fund guarantees declaring the IDCW amount","The mutual fund cannot guarantee declaring the IDCW amount or frequency","None of the above"],"answer":2,"explanation":"The Income distribution cum capital withdrawal (dividend) pay-out option seems attractive for investors wanting a regular income. It should however be kept in mind that even in a mutual fund scheme with a monthly pay-out option, dividend declaration is a function of distributable surplus. If there is no surplus to distribute, dividend cannot be declared. Therefore, the investor is not assured of dividend in the scheme even when there is a monthly dividend option.","answer_source":"explicit"},{"n":44,"q":"How often should the Key Information Memorandum (KIM) be updated ?","options":["Every quarter","At least once a year","Twice in a year","It need not be updated after it is issued once"],"answer":2,"explanation":"As per SEBI circular in 2021 - KIM shall be updated at least once in half-year, within one month from the end of the respective half-year, based on the relevant data and information as at the end of September and March and shall be filed with SEBI forthwith through electronic mode only.","answer_source":"explicit"},{"n":45,"q":"A Floating interest rate is _______ .","options":["usually the prime lending rate","The actual yield spread","only payable only on maturity","Base rate + spread"],"answer":3,"explanation":"The interest rate payable on a debt security may be specified as a fixed rate, say 6 percent. Alternatively, it may be a floating rate i.e., a rate linked to some other rate that may be prevailing in the market, say the rate that is applicable to Gilt. Interest rates on floating rate securities (also called floaters) are specified as a “Base + Spread” For example, 5-year G-Sec + 2 percent, this means that the interest rate that is payable on the debt security would be 2 percent above whatever is the rate prevailing in the market for Government Securities of 5- year maturity.","answer_source":"explicit"},{"n":46,"q":"Securities transaction Tax (STT) is applicable on redemption of both Equity mutual funds and Debt mutual funds - State whether True or False?","options":["True","False"],"answer":1,"explanation":"STT is not applicable to transactions in debt securities or debt mutual fund schemes.","answer_source":"explicit"},{"n":47,"q":"______ is responsible for ensuring the valuation of the securities in a mutual fund scheme’s portfolio are true and fair.","options":["Association of Mutual Funds in India (AMFI)","Registrar and Transfer Agent","The auditor of the fund","Asset Management Company (AMC)"],"answer":3,"explanation":"As per SEBI Fair Valuation Principles - The responsibility of true and fairness of valuation of assets/securities and correct NAV shall be of the Asset management company (AMC), irrespective of disclosure of the approved valuation policies and procedures i.e., if the established policies and procedures of valuation do not result in fair/ appropriate valuation, the asset management company shall deviate from the established policies and procedures in order to value the assets/ securities at fair value.","answer_source":"explicit"},{"n":48,"q":"How can the fundamental attributes of a mutual fund scheme be changed?","options":["The fundamental attributes cannot be changed","The fundamental attributes can be changed but this should be communicated to all the unit holders who should be provided an option to exit the scheme","The fundamental attributes can be changed with the permission of SEBI and AMFI","The fundamental attributes can be changed but only with the consent of 100 percent of unit holders"],"answer":1,"explanation":"The fundamental attributes of a mutual fund scheme, such as its investment objective or structure, can be changed only after following the prescribed regulatory process. The mutual fund must inform all unit holders about the proposed change and provide them with a free exit option within the specified period if they do not wish to continue with the scheme. This ensures that investors are not adversely affected by changes made after their investment.","answer_source":"explicit"},{"n":49,"q":"When does the market price of close-end mutual fund scheme converge with the NAV price?","options":["During the New Fund Offer","Before the New Fund Offer","Toward maturity","It never converges"],"answer":2,"explanation":"In a close-ended mutual fund scheme, units are listed and traded on the stock exchange, so their market price may differ from the NAV due to demand and supply. However, as the scheme approaches maturity, the market price tends to converge (become same) with the NAV, since investors will ultimately receive the NAV value on redemption at maturity.","answer_source":"explicit"},{"n":50,"q":"Identify the FALSE statement :","options":["A. When the mutual fund distributor understands the needs of his investor, one can ignore the investment objective of the mutual fund schemes","B. The best strategy in selecting a mutual fund scheme is that based on its past performance","Only A is false","Only B is false","Both A and B are false"],"answer":4,"explanation":"Experience has shown time and again, the top performers during one period may not necessarily remain as a top performer forever or near the other top performers and vice versa. In such a case, simply buying into a scheme due to good returns in the recent past may not be a wise approach. In order to evaluate various mutual fund schemes, it is important to consider the scheme’s investment objective and strategy. Both of these can help one understand what to expect from the scheme. The suitability of a mutual fund scheme to an investor depends upon the features of the scheme and matching it to the needs of the investor from the investment. Therefore, one cannot ignore the investment objectives of the scheme.","answer_source":"explicit"},{"n":51,"q":"Identify the FALSE statement/s.","options":["Only 1 is false","Only 2 is false","Both 2 and 3 are false","Both 1 and 3 are false"],"answer":1,"explanation":"Arbitrage Fund is an open-ended scheme investing in arbitrage opportunities. Arbitrage funds work on the mispricing of equity shares in the spot and futures market. The fund manager simultaneously buys shares in the cash market and sells it in futures or derivatives markets. The difference in the cost price and the selling price is the return you earn. Their risk level is comparable with that of a pure debt fund. The returns from an Arbitrage fund is comparable to a debt fund. There is no capital appreciation.","answer_source":"explicit","statements":["1. Arbitrage funds have lower risk as compared to Equity Funds","2. The main objective of an Arbitrage Fund is to provide capital appreciation","3. Arbitrage funds can invest in both Futures/Options(F&O) and cash markets"]},{"n":52,"q":"Unitholders have the right to inspect key document/s like ________ with respect to their mutual fund investments.","options":["Memorandum & Articles of Association","RTA agreement","Custodial Services Agreement","All of the above"],"answer":3,"explanation":"As per Investors’ Rights & Obligations : Right to Inspect documents - Unit-holders have the right to inspect key documents such as the Trust Deed, Investment Management Agreement, Custodial Services Agreement, RTA agreement and Memorandum & Articles of Association of the AMC.","answer_source":"explicit"},{"n":53,"q":"For a VALUE FUND, the minimum investment in equity and equity related instruments is 50% of the total assets. State whether True or False?","options":["True","False"],"answer":1,"explanation":"A value fund is an open-ended equity scheme following a value investment strategy. Minimum investment in equity & equity related instruments are 80 % of total assets. (Value investment style is an approach of picking up stocks, which are priced lower than their intrinsic value, based on fundamental analysis. When the market recognizes the intrinsic value, then the price would shoot up)","answer_source":"explicit"},{"n":54,"q":"A fundamental analyst will study the Candle-Stick charts and also the financial statement of a company. State whether True or False?","options":["True","False"],"answer":1,"explanation":"Fundamental analysis is a study of the business and financial statements of a firm. It does not study the charts like the Candle-Stick charts. Charts are studied by the Technical analysts.","answer_source":"explicit"},{"n":55,"q":"The investment objective of a/an ______ is to seek capital appreciation.","options":["Income Fund","Growth Fund","Liquid Fund","Arbitrage Fund"],"answer":1,"explanation":"A Growth fund is a mutual fund which invests in the stocks and aims at achieving capital appreciation through the investment of funds in growth stocks.","answer_source":"explicit"},{"n":56,"q":"Identify the CORRECT statement/s with respect to Conservative hybrid funds.","options":["Only A and B are correct","Only B is correct","Only A and C are correct","All A, B and C are correct"],"answer":1,"explanation":"Conservative Hybrid Fund is an open-ended hybrid scheme investing predominantly in debt instruments. Investment in debt instruments shall be between 75 percent and 90 percent of total assets while investment in equity and equity instruments shall be between 10 percent and 25 percent of total assets. The word “conservative” in the name of Conservative hybrid funds category only refers to the equity allocation. Therefore, a Conservative hybrid fund cannot invest more than 25% of their total assets in equity instruments. Statement A is incorrect as there is no specific restriction on the Macaulay Duration for the debt portion of a Conservative Hybrid Fund Statement C is incorrect - While these funds are \"conservative,\" they are not prohibited from investing in debt securities rated below AAA.","answer_source":"explicit","statements":["A. A Conservative hybrid fund cannot invest in debt securities for which the Macaulay Duration is more than 1 year","B. A Conservative hybrid fund cannot invest more than 25% of their total assets in equity instruments","C. A Conservative hybrid fund cannot invest in debt securities which have lower than AAA rating"]},{"n":57,"q":"If a mutual fund enters into a transaction for purchase or sale of securities with any of its associates, then the members of Asset Management Company of the mutual fund have to ________ .","options":["Inform the mutual fund unitholders of the intent to undertake the transaction before it is done","Justify the fairness of the transaction to the Board of Trustees","Make certain that the transactions happens at a price that is better than the closing market price","Take the approval of the trustees before undertaking the transactions"],"answer":1,"explanation":"As per the AMFI Code of Ethics for Mutual Funds : Members shall in respect of transactions of purchase and sale of securities entered into with any of their associates or any significant unitholder : 1. Submit to the Board of Trustees details of such transactions, justifying its fairness to the scheme 2. Disclose to the unitholders details of the transaction in brief through annual and half yearly reports","answer_source":"explicit"},{"n":58,"q":"In which of the following case can a mutual fund charge the additional expense of 0.30 % of daily net assets of the scheme ?","options":["When the new inflows from beyond top 30 cities is at least i) 30% of the gross new inflows in the scheme OR ii) 15% of the average AUM (Year To Date) of the scheme, which ever is higher","When the new inflows from beyond top 25 cities is at least 30% of the gross new inflows","When the new inflows from beyond top 30 cities is at least 10% of the gross new inflows","When the new inflows from beyond top 15 cities is at least 20% of the gross new inflows"],"answer":0,"explanation":"In addition to the regular limits, the following expenses may be charged to the scheme: i. Brokerage and transaction cost which are incurred for the purpose of execution of trade up to 0.12 percent of trade value in case of cash market transactions and 0.05 percent of trade value in case of derivatives transactions. ii. If the new inflows from beyond top 30 cities are at least a) 30 percent of gross new inflows in the scheme or b) 15 percent of the average assets under management (year to date) of the scheme, whichever is higher, funds can charge the additional expense of up to 0.30 percent of the daily net assets of the scheme.","answer_source":"heuristic"},{"n":59,"q":"What happens in the process of Indexation?","options":["In indexation, the impact of capital gains tax is reduced in case of both short term and long term capital gains","In indexation, the mutual fund’s performance is benchmarked against a suitable index","In indexation, the cost of acquisition is adjusted upwards to reflect the impact of inflation","None of the above"],"answer":2,"explanation":"Indexation means that the cost of acquisition or the cost of purchase is adjusted upwards to reflect the impact of inflation. For eg. - A stock was purchased at Rs 500 and sold for Rs 800 after 5 years. The long term capital gains is Rs 300 on which tax is to paid. But when adjusted for indexation, the capital gains will be reduced and the tax will have to be paid on a lower amount.","answer_source":"explicit"},{"n":60,"q":"In case one of the joint holders dies, then the units will ________ .","options":["be transferred to the HUF of deceased holder","be transferred to nominee/s","continue to be held by surviving joint holders","redeemed automatically"],"answer":2,"explanation":"Once a mutual fund folio is created as a jointly held account there can be no change in the joint holders. A joint holder cannot be deleted or a new one added, except in the event of death. In the event of a death of a joint holder. his/her name is deleted and the surviving joint holders can continue with the investment.","answer_source":"explicit"},{"n":61,"q":"_______ is not included in the fundamental attributes of a mutual fund scheme.","options":["Exit loads","Liquidity provisions such as listing, repurchase, redemption","Aggregate fees and expenses charged to the scheme","Any safety net or guarantee provided"],"answer":0,"explanation":"As per SEBI regulations, the fundamental attributes of a mutual fund scheme include: Type of scheme Investment objectives Liquidity provisions (repurchase/redemption/listing) Aggregate fees and expenses Any safety net or guarantee Exit load is NOT a fundamental attribute.","answer_source":"manual"},{"n":62,"q":"Which of these statements is true with respect to Key Information Memorandum (KIM)?","options":["KIM is a document that provides key information of the past performance of the scheme","KIM is the annual newsletter of the mutual fund","KIM provided NAV history of all mutual fund schemes","KIM is a document which must accompany all mutual fund application forms"],"answer":3,"explanation":"While an investor is expected to read all the scheme related documents, circulation of the same along with the application forms is too difficult and costly, especially if the printed forms are to be distributed. In order to ensure the investor gets access to sufficient information in spite of such a constraint, a Key Information Memorandum (KIM) is mandatorily circulated along with the application form.","answer_source":"explicit"},{"n":63,"q":"Dividing an individual’s portfolio allocation between Core portfolio and Satellite portfolio is dependent on the risk profile of the investor - State whether True or False?","options":["True","False"],"answer":0,"explanation":"Ideally an investor's portfolio should be divided into Core and Satellite portfolios. The core portfolio will be invested according to the long-term needs of the investor and the satellite portfolio will be invested to take advantage of expected short-term market movements. However, the division between core and satellite portfolios will depend upon each investor’s profile. Conservative investors may like a very small proportion of their overall portfolio to be managed tactically and an investor comfortable with taking higher risk may have an even higher exposure to tactical investments.","answer_source":"heuristic"},{"n":64,"q":"Condensed financial information for schemes launched in last 3 financial years is mentioned in the ______________.","options":["Statement of Additional Information (SAI)","Scheme Information Document (SID)","Fact Sheet","Prospectus"],"answer":0,"explanation":"Section I of the SAI gives complete details of the constituents of the mutual fund--Sponsors, AMC and Trustee Company, of service providers {Custodian, Registrar & Transfer Agent, Statutory Auditor, Fund Accountant (if outsourced) and Collecting Bankers}. This includes their experience, condensed financial information (for schemes launched in last 3 financial years), key personnel, rights and obligations and other information the investor may require to evaluate the investment.","answer_source":"manual"},{"n":65,"q":"If a investor has to change his default bank account in a mutual fund folio, he/she has to do it with ____ .","options":["The KYC Registration agency","AMFI","Either KRA or AMFI","The mutual fund (AMC) directly"],"answer":3,"explanation":"Mutual funds provide investors the facility to register multiple bank accounts to facilitate receiving the redemption, dividends and any other payouts from the fund. An individual investor can register up to five bank accounts. One of the accounts is designated as the default account, and unless otherwise specified all credits are made to this account by the mutual fund. Investors can change the default bank account at any time by instructing the AMC to do so.","answer_source":"explicit"},{"n":66,"q":"Identify the TRUE statement/s.","options":["1. The market liquidity can get impacted due to market related events and company factors","2. There cannot be a price impact on mutual fund units due to liquidity demands due to redemption or portfolio rebalancing","Only 1 is true","Only 2 is true","Both 1 and 2 are true","Both 1 and 2 are false"],"answer":2,"explanation":"Statement 1 is true as liquidity can reduce because of market panic/crashes, economic events, bad news about a company etc. Statement 2 is false as large redemptions or portfolio rebalancing may force a mutual fund to sell securities quickly. This can affect security prices and indirectly impact NAV/unit prices.","answer_source":"manual"},{"n":67,"q":"Tactical Asset Allocation decisions are based on which of these factor/s?","options":["Likely behaviour of the markets","Age of the investor","Income of the investor","All of the above"],"answer":0,"explanation":"Tactical asset allocation means changing the investment mix temporarily to benefit from expected market movements. These decisions are mainly based on the expected behavior or trend of the market. For example, if equity markets are expected to rise, more money may be allocated to equities. The purpose of such an approach is to take advantage of the opportunities presented by various markets at different points of time.","answer_source":"heuristic"},{"n":68,"q":"Which of these investors CANNOT do CASH investments in mutual funds up to a limit of Rs. 50,000?","options":["Investments made by a PIO (Person of Indian Origin)","Investments made by Sole Proprietorship firm","Investments made by minors","Investments made by resident Indian investors without PAN"],"answer":0,"explanation":"Mutual funds usually do not accept cash. Small investors, who may not be taxpayers and may not have PAN/bank accounts, such as farmers, small traders/businessmen/workers are allowed cash transactions for the purchase of units in mutual funds to the extent of Rs. 50,000/-per investor, per mutual fund, per financial year. This facility is available only for resident individuals, sole proprietorships and minors investing through their guardians. PIO is not among the eligible investors.","answer_source":"manual"},{"n":69,"q":"Who specifies the heads of expenses that can be charged to a mutual fund scheme by the Asset Management Company?","options":["SEBI","AMFI","Trustees","RBI"],"answer":0,"explanation":"Under SEBI (Mutual Funds) Regulations, 1996, Mutual Funds are permitted to charge certain operating expenses for managing a mutual fund scheme – such as sales & marketing / advertising expenses, administrative expenses, transaction costs, investment management fees, registrar fees, custodian fees, audit fees – as a percentage of the fund’s daily net assets. All such costs for running and managing a mutual fund scheme are collectively referred to as ‘Total Expense Ratio’ (TER) The regulatory limits of TER that can be incurred/charged to the fund by a Mutual Fund AMC have been specified under Regulation 52 of SEBI Mutual Fund Regulations.","answer_source":"manual"},{"n":70,"q":"Which of these statement/s is/are INCORRECT?","options":["A. The impact of exit load can be ignored by the distributor at the time of re-purchase of a mutual fund units","B. When the investor wants to redeem mutual fund units, the distributor must suggest redemption from the scheme with the maximum exit load","Only statement A is incorrect","Only statement B is incorrect","Both statements A and B are incorrect"],"answer":4,"explanation":"Both statements describe unethical and incorrect practices that a MF distributor must never follow. Let us understand why each is false: Statement A is FALSE — At the time of repurchase, the MF distributor must inform the investor about the exit load and its impact on the redemption amount. Ignoring exit load means the investor is not getting complete and transparent information — which is a violation of the distributor's duty of proper disclosure. Statement B is FALSE — A distributor must never ask an investor to redeem from a scheme with the maximum exit load. This would cause unnecessary financial loss to the investor. A responsible distributor should instead guide the investor to redeem from a scheme where exit load is nil or minimum, protecting the investor's interest.","answer_source":"explicit"}]},{"category":"Mutual Fund","set":"Set 3","count":70,"questions":[{"n":1,"q":"Which of the following serves as the basis for creating a mutual fund’s investment portfolio?","options":["Risk-taking capacity of investors","Investment objectives defined for the fund","The characteristics of the unit holders","Investor recommendations and preferences"],"answer":1,"explanation":"Every mutual fund scheme is launched with a specific investment objective (e.g., growth, income, balanced, sector-focused). The fund manager designs the portfolio — choosing stocks, bonds, or other securities — to match this objective. The risk appetite, preferences or characteristics of individual investors are not considered while constructing the portfolio, because a mutual fund is a pooled vehicle — hundreds or thousands of investors with different profiles invest together in the same scheme.","answer_source":"explicit"},{"n":2,"q":"Identify the category of investors that does not need to provide a PAN card at the time of investing in mutual funds.","options":["Investors whose total annual investment, including SIPs, does not exceed Rs 75,000 per mutual fund","Investors whose annual investment excluding SIPs is capped at Rs 75,000 per mutual fund","Investors whose total annual investment, including SIPs, does not exceed Rs 50,000 per mutual fund","Investors whose annual investment excluding SIPs is capped at Rs 50,000 per mutual fund"],"answer":2,"explanation":"As per SEBI regulations, small investors who invest up to Rs. 50,000 per year per mutual fund are exempted from submitting a PAN card. This is called the \"Micro SIP\" or small investment exemption — designed to encourage first-time or low-income investors to participate in mutual funds without the barrier of having a PAN card. This limit of Rs. 50,000 includes SIP investments as well — meaning even if you invest through monthly SIPs, the total across the year must stay within Rs. 50,000 to enjoy this exemption.","answer_source":"explicit"},{"n":3,"q":"Identify the true statement(s) from the options given below:","options":["A) Indian investors have no option for diversifying in international investments","B) One of the key reasons for investing in international funds is global diversification","Only A","Only B","Both A and B","None of the above"],"answer":3,"explanation":"Statement (A) is false because Indian investors do have options to invest internationally through international mutual funds, feeder funds and overseas ETFs offered by Indian AMCs. Statement (B) is true because one major benefit of investing in international funds is global diversification. These funds allow Indian investors to invest in foreign markets, companies, and economies, reducing dependence on only the Indian market.","answer_source":"explicit"},{"n":4,"q":"State whether the following statement is true or false:","options":["“Mutual fund distributors receive a unique ARN number from the Asset Management Company, which has to be renewed every three years.”","False, since the ARN is issued by AMFI rather than the AMC","True, as mandated under SEBI guidelines"],"answer":1,"explanation":"ARN (AMFI Registration Number) is issued by Association of Mutual Funds in India (AMFI), not by individual Asset Management Companies (AMCs). Mutual fund distributors must obtain an ARN from AMFI to distribute mutual fund products in India after meeting certification and registration requirements.","answer_source":"manual"},{"n":5,"q":"Identify the false statement(s) regarding benchmarks used for mutual fund schemes.","options":["Asset Management Companies (AMCs) are permitted to select a sectoral index as the benchmark for a multi-cap mutual fund","The BSE Sensex is the most appropriate benchmark for a multi-cap fund because it includes leading large-cap companies","Both of the above are false","None of the above"],"answer":2,"explanation":"A sector index represents only one industry or sector, whereas a multi-cap fund invests across multiple sectors and market capitalizations. Therefore, a sector index would NOT properly reflect the fund’s diversified investment universe. BSE Sensex contains only 30 large-cap companies and is therefore NOT the most appropriate benchmark for a multi-cap mutual fund, which invests across large-cap, mid-cap, and small-cap stocks. A broader index like the Nifty 500 is usually more suitable.","answer_source":"explicit"},{"n":6,"q":"Identify the correct statement relating to unclaimed dividend and redemption amounts in mutual funds.","options":["The AMC may recover investment management fees within the prescribed limits","AMC can impose penalties on investors","Such unclaimed amounts are transferred to the Investor Education Fund","All of the above"],"answer":0,"explanation":"As per SEBI regulations, when dividend or redemption amounts remain unclaimed by investors, the AMC is allowed to deploy these unclaimed amounts in the money market instruments and earn returns on them. From these earnings, the AMC is permitted to recover investment management fees within the prescribed limits — but nothing beyond that. The unclaimed amounts are not transferred to the Investor Education Fund directly — they remain with the AMC and are kept available for the investor to claim at any time. The investor can claim the amount along with returns earned on it.","answer_source":"manual"},{"n":7,"q":"Information relating to the current economy and market outlook is generally found in which of the following mutual fund documents?","options":["Key Information Memorandum (KIM)","Scheme Information Document (SID)","Statement of Additional Information (SAI)","Fund factsheet"],"answer":3,"explanation":"A mutual fund factsheet generally contains: current market outlook, economic commentary, portfolio strategy, sector allocation insights, recent fund performance.","answer_source":"explicit"},{"n":8,"q":"In a Conservative Hybrid Fund, what is the prescribed investment range in equity and equity-related instruments as a percentage of total assets?","options":["10% to 25%","25% to 50%","50% to 75%","75% to 100%"],"answer":0,"explanation":"A Conservative Hybrid Fund is designed for risk-averse investors who want the stability of debt with a small exposure to equity for slightly better returns. As per SEBI's categorization and rationalization circular, this fund must invest 75% to 90% in debt instruments and only 10% to 25% in equity instruments. This makes conservative hybrid funds less risky than aggressive hybrid funds.","answer_source":"heuristic"},{"n":9,"q":"For mutual fund units held in a Demat account, the redemption value will be credited to which account ?","options":["Through cheque payment by the stock exchange","The default bank account recorded with the mutual fund company","The account mentioned in the redemption instruction","The investor’s bank account registered with the depository"],"answer":3,"explanation":"When mutual fund units are held in Demat form, the redemption proceeds are credited to the bank account linked with the investor’s Demat account/depository records. The depository maintains the bank details for such transactions. It is not sent by cheque nor to any random account specified in the redemption request. This rule ensures security and uniformity.","answer_source":"explicit"},{"n":10,"q":"Identify the CRISIL index best suited to be used as a benchmark for a dynamic bond fund.","options":["CRISIL Composite Bond Fund Index","CRISIL Corporate Bond Fund Index","CRISIL Long Term Bond Index","CRISIL Liquid Fund Index"],"answer":0,"explanation":"A Dynamic Bond Fund invests across debt instruments with different maturities depending on interest rate movements and market conditions. Since its portfolio keeps changing dynamically, it requires a broad-based benchmark. The CRISIL Composite Bond Fund Index represents a mix of debt securities across various maturities and categories, making it suitable for comparing the performance of dynamic bond funds.","answer_source":"heuristic"},{"n":11,"q":"Bank-sponsored mutual funds are governed by SEBI and also by _______ .","options":["Association of Mutual Funds in India (AMFI)","Reserve Bank of India (RBI)","Bombay Stock Exchange (BSE)","Finance Ministry"],"answer":1,"explanation":"When a bank sponsors a mutual fund in India, it comes under the regulatory supervision of both SEBI and the Reserve Bank of India (RBI). SEBI regulates the mutual fund operations, investor protection, and market-related activities, while RBI supervises the banking functions and financial stability of the sponsoring bank.","answer_source":"explicit"},{"n":12,"q":"A mutual fund investor redeems 300 units at a Net Asset Value of Rs. 75 after holding the investment for 2 years. The scheme levies an exit load of 2% for redemption within one year and 1% for redemption beyond one year. Determine the redemption value that will be credited to the investor.","options":["Rs. 22,275","Rs. 22,500","Rs. 22,100","Rs. 22,050"],"answer":0,"explanation":"The investor redeems 300 units at an NAV of Rs. 75 after holding for 2 years. Since the investment was held for more than 1 year, the applicable exit load = 1%. Step 1: Calculate Gross Redemption Value Gross Value = 300 × 75 = 22,500 Step 2: Calculate Exit Load Exit Load = 1% × 22,500 =225 Step 3: Calculate Net Redemption Value Net Redemption Value = 22,500 − 225 = Rs. 22,275","answer_source":"manual"},{"n":13,"q":"Which of the following information is generally NOT provided in a Scheme Information Document (SID) ?","options":["The scheme’s investment objective","Risk factors associated with the scheme","Complete list of securities in the portfolio","Portfolio characteristics/features"],"answer":2,"explanation":"The SID (Scheme Information Document) is prepared at the time of NFO (New Fund Offer) or scheme launch. It provides details such as the investment objective, portfolio strategy/features, and risk factors of the scheme. Even after the fund is running, the portfolio keeps changing daily as the fund manager buys and sells securities. So the actual names of securities held in the portfolio are disclosed through the monthly factsheet / portfolio disclosure — not the SID.","answer_source":"explicit"},{"n":14,"q":"Dividends declared on mutual fund units that are under lien will be paid to whom ?","options":["The unit holder in all cases","The lien holder in all cases","Either the unit holder or the lien holder, based on the terms of issue of the mutual fund units","Either the unit holder or the lien holder, as specified in the agreement"],"answer":3,"explanation":"When units are marked under a lien, it means they are pledged as security to a lender or another party. The payment of dividends on such units depends on the agreement between the unit holder and the lien holder. In some cases, dividends go to the investor, while in others they may go to the lien holder. Therefore, it depends on the terms agreed between the parties.","answer_source":"explicit"},{"n":15,"q":"Which is the most important factor for comparing performance of liquid funds ?","options":["The Maturity","The Expense Ratio","The taxation aspect","The NAV"],"answer":1,"explanation":"Comparing the Expense Ratio of different schemes is imperative for investors looking for the best liquid mutual fund. These schemes more or less earn similar returns. Hence, a fund with a high expense ratio will significantly reduce the returns generated. Therefore, one should invest in those liquid funds which have the lowest expense ratio.","answer_source":"explicit"},{"n":16,"q":"Identify the TRUE statement with respect to Equity Linked Savings Scheme (ELSS).","options":["Only A is true","Only B is true","Only C is true","All A, B and C are true"],"answer":1,"explanation":"Income Distribution and Cash Withdrawal (IDCW) plan was earlier known as the Dividend Payout Plan Equity Linked Savings Scheme is an open-ended equity linked saving scheme with a statutory lock-in of 3 years and tax benefit. The scheme has a lock-in period of three years from the date of investment. If one opts for (dividend) Income distribution cum capital withdrawal reinvestment plan, each time a dividend is reinvested, the same would also attract a 3-year lock-in. (Most AMCs have done away with this option in case of ELSS. They only allow growth option or dividend pay- out)","answer_source":"explicit","statements":["A) In an ELSS - Income Distribution and Cash Withdrawal (IDCW) option -Reinvestment Plan, there would be no lock-in for the units acquired on account of IDCW","B) In an ELSS - Income Distribution and Cash Withdrawal (IDCW) option -Reinvestment Plan, the units acquired on account of IDCW would have a three year lock-in from the date of allotment","C) In an ELSS - Income Distribution and Cash Withdrawal (IDCW) option, no dividends can be paid due to the three year lock-in period"]},{"n":17,"q":"The main document which authorises a company to invest in a particular Mutual Fund scheme is __________.","options":["The Articles of Association","The Memorandum of Association","Share holder Resolution","Specific Board Resolution"],"answer":3,"explanation":"The Board resolution authorises the company to invest in mutual fund schemes.","answer_source":"explicit"},{"n":18,"q":"Identify the documents which have to filed with SEBI before launch of a mutual fund New Fund Offer (NFO).","options":["List of benchmarks for the NFO","Addendum","Scheme Information Document","Fund Factsheet"],"answer":2,"explanation":"Units in a mutual fund scheme are offered to investors for the first time through a New Fund Offer (NFO). AMC prepares the Scheme Information Document (SID) for the NFO. This needs to be approved by the Trustees and the Board of Directors of the AMC. SID is then then filed with SEBI. (The interim changes in SID, SAI and KIM are updated through the issuance of an Addendum. Fund Factsheet contains the basic information of each scheme, the fund’s performance relative to the benchmark etc. )","answer_source":"explicit"},{"n":19,"q":"KIM has to be updated ________.","options":["Once in a year","Once in two years","Every month","Twice in a year"],"answer":3,"explanation":"As per SEBI circular in 2021 - KIM shall be updated at least once in half-year, within one month from the end of the respective half-year, based on the relevant data and information as at the end of September and March and shall be filed with SEBI.","answer_source":"explicit"},{"n":20,"q":"Calculate the NAV for the following information : Value of stock 200 cr, Value of money market instruments - Rs 25 cr, Dividend accrued but not received - Rs 10 cr, Amount receivable on sale of shares - Rs 5 cr, Amount payable on purchase of shares: Rs. 10.5 cr, Fees payable - Rs 1 cr. No. of outstanding units:3 cr","options":["75.83","80.77","76.16","79.17"],"answer":2,"explanation":"NAV = (Value of stocks + Value of money market instruments + Dividend accrued but not received + Amount receivable on sale of shares – Amount payable on purchases of shares – Fees payable) / No. of outstanding units = 200 cr + 25 cr + 10 cr + 5 cr - 10.5 cr - 1 cr / 3 cr = 228.5 cr / 3 cr = 76.16","answer_source":"explicit"},{"n":21,"q":"Identify the category of mutual fund scheme in which the Net Asset Value (NAV) has to be declared for up to 4 decimal points ?","options":["Large cap funds","Small cap funds","Index funds","Hybrid funds"],"answer":2,"explanation":"NAV is to be calculated upto 4 decimal places in the case of Index funds, Liquid funds and other Debt funds. (NAV for equity and balanced funds is to be calculated upto at least 2 decimal places)","answer_source":"explicit"},{"n":22,"q":"Identify the FALSE statement/s with respect to BENCHMARKS of mutual fund schemes.","options":["A) The right benchmark for a Sector Fund will be an index representing the respective sector","B) All Equity Funds schemes will have similar benchmarks","Only A is false","Only B is false","Both A and B are false","Neither A nor B are false"],"answer":3,"explanation":"Different type of equity funds will have different benchmarks. For eg. Some equity funds investing in large companies; while there are others that focus on mid-cap stocks or small cap stocks. S&P BSE Sensex and Nifty 50 indices are appropriate benchmarks for those equity funds that invest in large companies. For mid-cap funds, mid-cap indices such as Nifty Midcap 50 or S&P BSE Midcap are considered as better benchmarks. A sector fund would invest in only the concerned sector. Sectoral / thematic funds select sectora / thematic indices such as S&P BSE Bankex, S&P BSE FMCG Index, Nifty Infrastructure Index, Nifty Energy Index etc.","answer_source":"explicit"},{"n":23,"q":"______ is NOT a function of AMFI.","options":["Representing the mutual fund industry to the Government, RBI etc.","Undertaking studies and research of the mutual fund industry","Undertaking investor awareness programs","Conducting certification exams for mutual fund distributors"],"answer":3,"explanation":"AMFI (Association of Mutual Funds in India) is the industry body that represents all mutual fund houses in India. It promotes investor education, disseminates industry data, and liaises with the government and RBI — but it does NOT conduct any certification exams. The certification exam for becoming a MF distributor is conducted by NISM (National Institute of Securities Markets) — specifically the NISM Series V-A exam.","answer_source":"explicit"},{"n":24,"q":"Identify the true statement with respect to measuring returns for Mutual Funds schemes.","options":["Only A and B are correct","Only A and C are correct","Only B and C are correct","All A, B and C are correct"],"answer":3,"explanation":"1. Whenever a dividend is paid – and compounding is to be considered - the CAGR technique (or the reinvestment method, as some call it) prescribed by SEBI is used 2. The return is calculated using CAGR if the holding period is over one year. If returns are less than one year, than Simple Return is calculated 3. Simple Return can be calculated with the following formula : (Sale Price - Cost Price) / Cost Price * 100","answer_source":"explicit","statements":["A. Compounded Annual Growth Rate 'CAGR' technique has been prescribed by SEBI when dividend is paid and compounding is to be considered","B. CAGR is the recognized standard for calculating returns for investment horizon of greater than or equal to 1 year","C. Simple Return can be calculated using the formula : (Sale Price - Cost Price) / Cost Price * 100"]},{"n":25,"q":"The Valuation Policy of a mutual fund is mentioned in which document?","options":["Fund Factsheet","Statement of Additional Information (SAI)","Annual accounts of the AMC","Addendum"],"answer":1,"explanation":"As per the Fair Valuation Principles laid down by SEBI : Disclosure of the valuation policy and procedures approved by the Board of the asset management company shall be made in Statement of Additional Information, on the website of the asset management company/mutual fund and at any other place where the Board may specify to ensure transparency of valuation norms to be adopted by asset management company.","answer_source":"explicit"},{"n":26,"q":"Identify the TRUE statement/s with respect to Addendum.","options":["An Addendum must accompany the KIM","Addendum is considered to be a part of the Scheme Related Documents","Both of the above are true","None of the above are true"],"answer":2,"explanation":"The addendum is considered to be a part of the scheme related documents and must accompany the KIM. Any interim changes in the Scheme Information Document (SID), Statement of Additional Information (SAI) and Key Information Memorandum (KIM) are updated through the issuance of an Addendum.","answer_source":"explicit"},{"n":27,"q":"A Mutual Fund scheme gives a return of 10 % and the beta of that scheme is 0.5. The risk free return is 7.5%. What is the Treynor Ratio of this scheme ?","options":["3%","5%","7.5%","10%"],"answer":1,"explanation":"Treynor Ratio measures the returns earned in excess of that which would have earned on a riskless investment. Treynor Ratio Formula : (Return earned on the Scheme - Risk Free Rate) / Beta of the Scheme = (10 - 7.5) / 0.5 = 5","answer_source":"explicit"},{"n":28,"q":"Identify the FALSE statement :","options":["1. The investor does not have to bear a tax on the capital gains as the re-purchase of units is done by the mutual fund","2. Capital gains will be considered as Long term capital gain in case of debt funds only if the holding period is more than 3 years","Both 1 and 2 is false","Only 1 is false","Only 2 is false"],"answer":2,"explanation":"Re-purchase transactions are treated as a sale of units by the investor. Therefore, there will be an element of capital gain (or capital loss) and it will be taxed accordingly. In the Finance Act of 2023, growth option of debt funds was made taxable as short term capital gains (STCG) irrespective of holding period. The Long Term capital gains tax was removed.","answer_source":"manual"},{"n":29,"q":"__________ funds will benchmark themselves against indices based on Government securities.","options":["Credit Risk","Liquid","Over-night","Gilt"],"answer":3,"explanation":"Gilt funds invest only in Government securities. Therefore, indices based on Government Securities are the appropriate benchmark for Gilt funds.","answer_source":"explicit"},{"n":30,"q":"Identify which of these statement/s is / are CORRECT.","options":["When an unitholder gives a request for an Unit Certificate, it is has to be issued within 5 working days","When an unitholder gives a repurchase request, the re-purchase cheque have to be dispatched to the unitholder within 10 working days","Both of the above are correct","None of the above"],"answer":2,"explanation":"As per SEBI’s guidelines on turnaround times for investors’ transactions with the mutual fund : - Unit certificate to be issued within 5 working days of the receipt of request for the certificate. - The redemption or repurchase proceeds shall be dispatched to the unitholders within 10 working days from the date of redemption or repurchase.","answer_source":"explicit"},{"n":31,"q":"Identify the FALSE statement/s.","options":["A) During redemption, the mutual fund distributor should guide the investor to redeem those schemes which have the highest exit load","B) The best strategy in selecting a mutual fund scheme for investment is that based on its past performance","Only A is false","Only B is false","Both A and B are false","Neither A nor B are false"],"answer":4,"explanation":"Both statements A and B are false because : Past performance is only one indicator; it cannot be the sole or “best” strategy. SEBI and AMFI guidelines emphasize considering risk profile, investment objectives, fund category, and consistency — not just past returns. A distributor must act in the best interest of the investor. Suggesting redemption from the scheme with the maximum exit load would increase the investor’s cost, which is against fair practice norms.","answer_source":"explicit"},{"n":32,"q":"Identify which of these is NOT a benefit of investing in mutual funds?","options":["Choice Overload","Economies of scale","Diversification of portfolio","All of the above"],"answer":0,"explanation":"Choice Overload - There are multiple mutual fund schemes offered by several mutual fund houses and multiple options within those schemes which makes it difficult for investors to choose between them.","answer_source":"manual"},{"n":33,"q":"Who has to sign the form for registering a change in the default bank account in a mutual fund folio?","options":["By all the holders of the folio","By all the holders of the folio as per the mode of holding","Only by the first holder of the folio"],"answer":0,"explanation":"The form for registering the change has to be signed by all the holders according to the mode of holding of the folio.","answer_source":"explicit"},{"n":34,"q":"Identify the TRUE statement/s.","options":["A) The Turnover Ratio will be higher in a momentum oriented investment strategy of an equity mutual fund.","B) Its always simpler to invest in balanced mutual funds as compared to investing separately in equity and debt funds, but this limits choices.","Only A is true","Only B is true","Both A and B are true","Neither A nor B is true"],"answer":4,"explanation":"Momentum mutual funds seek to capture upward trends in the market by investing in stocks that have shown strong recent performance. They follow the momentum factor, which involves buying assets that have been rising in price with the expectation that this positive trend will continue in the near future. As such funds buy and sell several times, they will have a high turnover ratio (Turnover Ratio reflects the percentage of portfolio holdings that were changed/bought/sold/turned over in? a year) Investing in a hybrid/balanced scheme makes things simpler for the investor, because fewer scheme selection decisions need to be taken. However, the investor cannot decide the composition of portfolio and would need to go by the debt- equity mix in the investment portfolio of the schemes.","answer_source":"explicit"},{"n":35,"q":"Identify the CORRECT statement/s.","options":["A. Valuation gains are ignored. But valuation losses need to be adjusted against the profits while calculating distributable surplus.","B. The Mark-to-market gains form a part of the distributable reserves in case of mutual fund Income Distribution Cum Capital Withdrawal plan","Only A is correct","Only B is correct","Both A and B are correct","Both A and B are incorrect"],"answer":2,"explanation":"SEBI guidelines stipulate dividends can be paid out of distributable reserves. Mark-to-market gains are on paper - they are not realised. They will be realized when those investments are sold. So these cannot be included in distributable reserves Also Valuation gains are ignored. But valuation losses need to be adjusted against the profits. This conservative approach to calculating distributable reserves ensures that dividend is paid out of real and realized profits, after providing for all possible losses.","answer_source":"manual"},{"n":36,"q":"Risk Profilers are used to ascertain the risk appetite of an investor. State whether True or False?","options":["True","False"],"answer":0,"explanation":"Risk Profilers usually revolve around investors answering a few questions, based on which the risk appetite score gets generated. The risk profilers try to ascertain the risk appetite of the investor so that one does not sell mutual fund schemes that carry a higher risk than what the investor can handle.","answer_source":"manual"},{"n":37,"q":"Calculate the Average holding period if the portfolio turnover ratio is 25 percent.","options":["25 months","48 days","40 months","4 Years"],"answer":3,"explanation":"Average Holding Period = 1 / Portfolio Turnover Ratio. Turnover ratio = 25% = 0.25. So, Average Holding Period = 1 / 0.25 = 4 years. This means the portfolio, on average, is held for four years before being completely churned.","answer_source":"explicit"},{"n":38,"q":"In which of the following cases can Goods and Service Tax (GST) be charged to the mutual fund scheme over and above the Total Expense Ratio of the scheme ?","options":["GST applicable on AMC fees only can be charged to the scheme over and above the Total Expense Ratio","GST applicable on any fees must be within the Total Expense Ratio","GST applicable on distributor commission only can be charged to the scheme over and above the Total Expense Ratio","GST applicable on AMC fees as well as distributor commission can be charged to the scheme over and above the Total Expense Ratio"],"answer":0,"explanation":"AMC(s) can charge GST, as per applicable Taxation Laws, to the schemes within the limits prescribed under SEBI (Mutual Fund) Regulations. - GST on fees paid on investment management and advisory fees shall be charged to the scheme in addition to the overall limits specified as per the Total Expense Ratio (TER) provisions. - The commission payable to the distributors of mutual funds may be subject to GST, as applicable in case of the ARN holder. Such tax cannot be charged to the scheme.","answer_source":"manual"},{"n":39,"q":"Management of investments by mutual funds is governed by ______ .","options":["Association of Mutual Funds in India (AMFI)","Reserve Bank of India (RBI)","Securities and Exchange Board of India (SEBI)","Both RBI and SEBI"],"answer":2,"explanation":"SEBI is the primary regulator for the securities markets in India, which includes mutual funds. They set the rules and regulations that mutual funds must follow to ensure investor protection and market integrity. AMFI is a self-regulatory body that promotes ethical practices but does not govern mutual fund regulations. RBI primarily regulates banks and NBFCs, and its role in mutual funds is limited to specific aspects like foreign exchange regulations.","answer_source":"explicit"},{"n":40,"q":"A Trail Commission is paid _______ .","options":["as long as the investor stays invested in the mutual fund scheme","when the investor invests into the mutual fund scheme","when the investor exits the mutual fund scheme","Trail Commission means no commission"],"answer":0,"explanation":"Trail commission is calculated as a percentage of the net assets attributable to the units sold by the distributor. A mutual fund distributor is paid trail commission for as long as the investor’s money is held in the fund.","answer_source":"manual"},{"n":41,"q":"Mutual funds must publish their unaudited accounts once every six months _________ .","options":["on the AMC website","on the AMFI website","in atleast two English newspaper","on the SEBI website"],"answer":0,"explanation":"According to SEBI regulations, mutual funds must publish their unaudited half-yearly financial results: On the website of the Asset Management Company (AMC) On the AMFI website (optional but common practice) Additionally, they must issue a public notice in at least one national English daily and one regional language newspaper to inform investors that the results are available online. Thus, publishing on AMC website is mandatory. Publishing on AMFI is not mandatory but generally done.","answer_source":"manual"},{"n":42,"q":"Which of the following function can an Asset Management Company (AMC) do in-house?","options":["Custodial Services","Broking","Registrar and Transfer Agent"],"answer":2,"explanation":"The appointment of Registrar and Transfer Agent (RTA) is done by the AMC. However, It is not compulsory to appoint an RTA. The AMC can choose to handle this activity in-house. AMC cannot be a custodian or a broker. An independent custodian ensures that the securities are indeed held in the scheme for the benefit of investors, which is an important control aspect.","answer_source":"explicit"},{"n":43,"q":"_________ would not be an originator to a special purpose vehicle, in case of securitized asset.","options":["A Commercial Bank","Non-banking finance company","Reserve Bank of India (RBI)","Housing finance company"],"answer":2,"explanation":"A securitization transaction involves sale of receivables by the originator (a commercial bank, non-banking finance company, housing finance company, or a manufacturing/service company) to a Special Purpose Vehicle (SPV), typically set up in the form of a trust. Investors are issued rated Pass Through Certificates (PTCs), the proceeds of which are paid as consideration to the originator. (RBI will not be an originator) In this manner, the originator, by selling his loan receivables to an SPV, receives consideration from investors much before the maturity of the underlying loans.","answer_source":"explicit"},{"n":44,"q":"The trustees of a mutual fund is appointed by the ______ .","options":["Sponsors","SEBI","Asset Management Company (AMC)","Custodian"],"answer":0,"explanation":"The application to SEBI for registration of a mutual fund is made by the Sponsor(s). The Sponsors then appoints the Trustees. The operations of the mutual fund trust are governed by a Trust Deed, which is executed between the sponsors and the trustees.","answer_source":"manual"},{"n":45,"q":"The AMC or its Trustees are not liable for any loss to Foreign Investors arising from adverse changes in foreign exchange rates. - State whether True of False?","options":["True","False"],"answer":0,"explanation":"A Mutual Fund Scheme may be denominated in Indian Rupees (INR) which is different from the home currency for Foreign Portfolio Investors in the mutual fund units. The INR value of investments when translated into home currency by Foreign Portfolio Investors could be lower because of the currency movements. The AMC does not manage currency risk for Foreign Portfolio Investors and it is the sole responsibility of the Foreign Portfolio Investors to manage or reduce currency risk on their own. The Sponsor/Fund/Trustees/ AMC are not liable for any loss to Foreign Investors arising from such changes in exchange rates.","answer_source":"manual"},{"n":46,"q":"Which information has to be included in the mutual fund application form when a Non-Resident Indian (NRI) subscribes for the units?","options":["Passport details","Countries of residence in the past one year","Details of investments made in the last one year","Current overseas address"],"answer":3,"explanation":"The information to be provided for mutual fund investments includes the name(s), nationality, identity proof and KYC compliance, signatures of all the holder(s), address and communication details of the first holder. In case of NRI investors, an overseas address must also be provided.","answer_source":"explicit"},{"n":47,"q":"The minimum number of investors that a mutual fund scheme should have :","options":["10 investors","20 investors","50 investors","100 investors"],"answer":1,"explanation":"Every mutual fund scheme/plan should have a minimum of 20 investors and no single investor shall account for more than 25 percent of the corpus of the Scheme/Plan(s).","answer_source":"explicit"},{"n":48,"q":"Identify which of these is NOT a function of Association of Mutual Funds in India (AMFI) ?","options":["To represent to the Government, Reserve Bank of India and other bodies on all matters relating to the mutual fund Industry","To disseminate information on the mutual fund industry and to undertake studies and research directly and/or in association with other bodies.","To conduct a certification examination for Mutual Fund distributors","To undertake a nationwide investor awareness programme to promote proper understanding of the concept and working of mutual funds."],"answer":2,"explanation":"Function of AMFI includes all of the above except - Conducting a certification examination for Mutual Fund distributors. National Institute of Securities Markets (NISM) conducts the certification examination for Mutual Fund distributors.","answer_source":"explicit"},{"n":49,"q":"Can an investor redeem any amount from a Segregated Portfolio. If Yes, than what are the restrictions?","options":["There is no restriction on redemptions from a Segregated Portfolio","Only 25 % of the value of current investments can be redeemed from a Segregated Portfolio","Only 50 % of the value of current investments can be redeemed from a Segregated Portfolio","An investor cannot redeem any amount from a Segregated Portfolio from the AMC"],"answer":3,"explanation":"“Segregated portfolio” means a portfolio, comprising of debt or money market instrument affected by a credit event, that has been segregated in a mutual fund scheme. No redemption or subscription is allowed in the segregated portfolio. However, in order to facilitate exit to unitholders in segregated portfolio, AMC shall enable listing of units of segregated portfolio on the recognized stock exchange.","answer_source":"explicit"},{"n":50,"q":"Which distributor will be covered under the due diligence process of the Asset Management Company as mandated by SEBI?","options":["A distributor who has presence in more than 10 locations","A distributor who has AUM of over Rs. 100 crores from non-institutional investors","A distributor who has received commission of over Rs 25 lakhs from one mutual fund","All of the above"],"answer":1,"explanation":"SEBI has mandated AMCs to put in place a due diligence process to regulate distributors who qualify any one of the following criteria: - Multiple point presence (More than 20 locations) - AUM raised over Rs. 100 crores across the industry in the non-institutional category butincluding high net worth individuals (HNIs) - The commission received of over Rs. 1 Crore p.a. across industry - The commission received of over Rs. 50 Lakhs from a single mutual fund","answer_source":"explicit"},{"n":51,"q":"A Closed-end fund will have a _______ .","options":["Fixed Dividend pay-out ratio","Fixed Unit Capital","Fixed Net Asset Value (NAV)","Fixed Asset Under Management (AUM)"],"answer":1,"explanation":"Close-ended Schemes have an NFO Open Date and NFO Close Date. But, they do not have a Scheme Re-opening Date, because the scheme does not sell or re-purchase units. What ever sale-purchase of units takes place is between the investors on the stock exchange. Since post-NFO sale and purchase of units happen to or from counter-party in the stock exchange–and not to or from the scheme–the unit capital of the scheme remains stable or fixed (The number of units issued by a scheme multiplied by its face value (Rs. 10) is the capital of the scheme–its Unit Capital) (In an Open-End scheme, the ongoing entry and exit of investors imply that the unit capital in an open-ended fund would keep changing on a regular basis)","answer_source":"explicit"},{"n":52,"q":"Identify the document which authorizes a company to invest in a specific mutual fund?","options":["Resolution passed in the shareholders meeting","Specific Board resolution","As per the Companies Act, a company can invest in any mutual fund scheme as long it is beneficial to the interest of the shareholders, without any special authorisation","As per the Companies Act, a company cannot invest in mutual funds"],"answer":1,"explanation":"Since institutional investors like Companies etc. are not natural persons, authorised individuals invest on behalf of the institution. Therefore, some additional documents are essential and one of them is - Authorisation for the investing institution to invest. This is typically in the form of a Board Resolution.","answer_source":"explicit"},{"n":53,"q":"Which of these can be a benchmark for a Banking Fund?","options":["S&P BSE FMCG Index","S&P BSE Auto","S&P BSE Bankex","S&P BSE 500"],"answer":2,"explanation":"The S&P BSE Bankex index comprises constituents of the S&P BSE 500 that are classified as members of the banks sector as defined by the BSE industry classification system.","answer_source":"explicit"},{"n":54,"q":"What does a higher portfolio turnover imply?","options":["It implies higher transaction costs","It implies higher capital gains","It implies lower capital gains","It implies a long term orientation of the fund"],"answer":0,"explanation":"Portfolio Turnover is the value of Purchase and Sale of Securities during a period in a mutual fund scheme. Purchase and sale of securities entails broking costs for the scheme. Frequent churning of the portfolio would add to the transaction costs.","answer_source":"manual"},{"n":55,"q":"Mr. Amit want to invest in a mutual fund scheme. He has to give the request for purchase specifying the _____ .","options":["Units he wants","Amount he wants to invest","Lots he wants"],"answer":1,"explanation":"Purchase request in a MF scheme can only be given specifying the amount the investor will be investing. The units allotted will depend on the NAV of the date of allotment. Re-purchase (Sale) request can be given in Units to be sold or Amount required.","answer_source":"explicit"},{"n":56,"q":"Identify the FALSE statement :","options":["1. As per AMFI guidelines, the intermediary has a no right of appeal to AMFI","2. It is not the sole responsibility of the mutual fund distributors for spreading investor awareness","Only 1 is false","Only 2 is false","Both 1 and 2 are false"],"answer":2,"explanation":"As per AMFI guidelines, an intermediary does have a right of appeal against certain decisions/actions taken by AMFI. So statement 1 is false. Statement 2 is true because investor awareness is not the sole responsibility of mutual fund distributors; AMFI, mutual funds and other stakeholders also contribute. Therefore, only Statement 1 is false.","answer_source":"manual"},{"n":57,"q":"Different investors of the similar age group should always have the same asset allocation in their investment portfolios - State whether True or False?","options":["True","False"],"answer":1,"explanation":"Different investors have different financial goals at different age levels. In fact, investors in the same age group may also have different goals. Their financial situations may also differ. At the same time, many of the financial goals may pertain to the whole families and not just an individual. In such cases, it may not be prudent to categorize investors on the basis of age alone.","answer_source":"explicit"},{"n":58,"q":"The NFO price of a mutual fund scheme was Rs. 10 and its current Net Asset Value (NAV) is Rs. 8. What would happen if the transactions were to happen at NFO price?","options":["The new investors as well as the existing investors in this scheme would stand to lose","The new investors as well as the existing investors in this scheme would stand to gain","The new investors stand to gain at the cost of existing investors","The new investors stand to lose at the cost of existing investors"],"answer":3,"explanation":"In mutual funds, transactions always happen at the current NAV, not at the old NFO price. Let’s break down your scenario: NFO price = Rs. 10 Current NAV = Rs. 8 If, hypothetically, transactions were forced to happen at the NFO price of ?10 instead of the current NAV: New investors would be buying units at Rs. 10, even though the actual value of each unit is only ?8. That means they are overpaying and immediately incurring a loss. Existing investors would benefit, because their units (worth ?8) would be sold to new investors at ?10. This artificially props up their position at the expense of newcomers. Therefore, the correct outcome is: The new investors stand to lose at the cost of existing investors.","answer_source":"explicit"},{"n":59,"q":"State whether the statement is True or False - Investment in Income Distribution cum Capital Withdrawal re-investment option grows faster than Growth option as the investor gets additional units.","options":["Its true for all categories of mutual fund schemes","Its false for all categories of mutual fund schemes","Its true only for equity funds","It depends on whether the fund is open-end or close-end"],"answer":1,"explanation":"In a Re-investment of Income Distribution cum capital withdrawal plan, the NAV declines to the extent of dividend. The resulting NAV is called ex- dividend NAV. However, the investor does not receive the dividend in his bank account; the amount is re-invested in the same scheme and additional units are allotted to the investor. The reinvestment happens at the ex-dividend NAV. The amount invested in the fund remains the same. Only the units increases and NAV decreases. Therefore the growth is same for the Growth Option and Income Distribution cum Capital Withdrawal Re-investment option.","answer_source":"explicit"},{"n":60,"q":"Which of these are considered as Institutional group of investors ?","options":["Non-Resident Indians (NRIs)","Hindu Undivided Families (HUFs)","High Networth Individuals (HNIs)","Companies"],"answer":3,"explanation":"NRIs, HUFs and HNIs are considered as individual investors. Companies are non-individual investors ie. Institutional investors.","answer_source":"explicit"},{"n":61,"q":"Which of these statement/s is/are TRUE?","options":["1. Mutual Funds offer various options like Growth, Income distribution cum capital withdrawal / Reinvestment etc. as different investors have different preferences on how profits are to be handled","2. Interval funds offer better liquidity to investors as compared to Close-Ended mutual fund","Only 1 is True","Only 2 is True","Both 1 and 2 are true"],"answer":4,"explanation":"Interval funds combine features of both open-ended and close-ended schemes. They are largely close-ended but become open-ended at pre-specified intervals. The benefit for investors is that, unlike in a purely close-ended scheme, they are not completely dependent on the stock exchange to be able to buy or sell units of the interval fund. The options offered under a scheme allow investors to structure their investments in line with their liquidity preference and tax position.","answer_source":"explicit"},{"n":62,"q":"The interest rate sensitivity of a bond is determined by its maturity - State whether True or False?","options":["True","False"],"answer":0,"explanation":"The interest rate sensitivity of a bond is primarily determined by its maturity (duration). Longer-maturity bonds are more sensitive to interest rate changes than shorter-maturity bonds. This happens because a bond's price moves inversely to interest rates: - When interest rates rise, bond prices fall. - When interest rates fall, bond prices rise. Bonds with a longer maturity have more future cash flows that are affected by changes in interest rates, making them more volatile.","answer_source":"manual"},{"n":63,"q":"Identify the false statement/s.","options":["A. Investments in mutual funds can be made on a repatriable basis by NRIs","B. The mutual fund will automatically pay in Dollars when the NRI redeems his investments which were made on a repatriable basis","Only A is false","Only B is false","Both A and B are false"],"answer":3,"explanation":"For Non-resident investors, payment is made by the AMC in Rupees and not Dollars. In case the investment has been made on a repatriable basis, and the investor wishes to transfer the money abroad, the costs associated with converting the rupees into any foreign currency would be to the account of the investor. Proceeds of investments made on a repatriable basis can be credited to an NRE (Non-Resident External) or FCNR ( Foreign Currency Non-Resident) account, as required by the investor.","answer_source":"explicit"},{"n":64,"q":"Identify the TRUE statement/s :","options":["1. The Indian inheritance laws are NOT applicable to mutual fund unit holders","2. A Power of Attorney (POA) cannot make or change nominations in a mutual fund","Only 1 is true","Only 2 is true","Both 1 and 2 are true","Both 1 and 2 are false"],"answer":3,"explanation":"The Indian inheritance laws are NOT applicable to mutual fund unit holders: This statement is false. Indian inheritance laws do apply to mutual fund unit holders. In the absence of a nominee, mutual fund units are passed on to the legal heirs as per inheritance laws. A Power of Attorney (POA) cannot make or change nominations in a mutual fund: This statement is true. As per regulations, a POA holder is not allowed to add, modify, or delete nominations for mutual fund investments.","answer_source":"explicit"},{"n":65,"q":"Limitation of Interest Rate Derivatives for Hedgers is mainly due to _________.","options":["Standardised Contract","Non-availability on all kind of underlying instruments","Both of the above","None of the above"],"answer":2,"explanation":"Interest rate derivatives have some limitations for hedgers. Standardised contracts may not exactly match the hedger’s specific requirement in terms of amount, maturity, or other terms. Also, interest rate derivatives are not available for all types of underlying instruments. Therefore, both of the above are limitations.","answer_source":"explicit"},{"n":66,"q":"______ is/are frequently used by media and research analysts to check the performance of various schemes of a mutual fund.","options":["Fund Fact Sheet","Annual Accounts of the AMC","Key Information Memorandum (KIM)","Investment Management Agreement"],"answer":0,"explanation":"One of the most popular documents from the mutual fund is the monthly Fund Factsheet. This document is extensively used by investors, fund distributors, fund rating agencies, research analysts, media and others to access information about the various schemes of the mutual fund.","answer_source":"heuristic"},{"n":67,"q":"Key Information Memorandum (KIM) is a summary of ______ .","options":["Only Scheme Information Document (SID)","Only Statement of Additional Information (SAI)","Both SID and SAI","Fund Factsheet"],"answer":2,"explanation":"While an investor is expected to read all the scheme related documents, circulation of the same along with the application forms is too difficult and costly, especially if the printed forms are to be distributed. In order to ensure the investor gets access to sufficient information in spite of such a constraint, a Key Information Memorandum (KIM) is mandatorily circulated along with the application form. KIM is essentially a summary of the SID and SAI (Scheme Related Documents) . It contains the key points of these documents that are essential for the investor to know to make a decision on the suitability of the investment for their needs. It is more easily and widely distributed in the market. As per SEBI regulations, every application form is to be accompanied by the KIM.","answer_source":"explicit"},{"n":68,"q":"As the complete exposure is to a single sector, Sector Funds are high on _____ .","options":["Credit Risk","Concentration Risk","Interest Rate Risk","Liquidity Risk"],"answer":1,"explanation":"The sector funds invest in stocks belonging to just one sector of the economy, in order to take advantages within the said sector. The examples of such funds are: Pharma fund or Banking fund etc. Sector funds are risky because of the concentration in one sector. If the sector under-performs then the scheme’s returns is likely to be very poor.","answer_source":"explicit"},{"n":69,"q":"Identify the TRUE statement with respect to a Gilt Fund?","options":["The minimum investment in G-secs (as a percentage of total assets) is 70%","The minimum investment in G-secs (as a percentage of total assets) is 75%","The minimum investment in G-secs (as a percentage of total assets) is 80%","The minimum investment in G-secs (as a percentage of total assets) is 85%"],"answer":2,"explanation":"Gilt Fund is an open-ended debt scheme investing in government securities across maturity. The minimum investment in G-secs is defined to be 80 percent of total assets (across maturity).","answer_source":"explicit"},{"n":70,"q":"The return from a fund is 9 %, Standard Deviation is 0.75 and the Beta is 1.4. The risk free rate of return is 7%. What is the DENOMINATOR in the calculation of the Sharpe Ratio?","options":["9","0.4","7","0.75"],"answer":2,"explanation":"In a fraction - Eg. 21 / 38 , the number above the line (21) is called the Numerator and the number below the line (the bottom number 38) is called the Denominator The formula for Sharpe Ratio is : ( Return Earned - Risk free Return ) / Standard Deviation Here the Numerator is 'Return Earned - Risk free Return' and the Denominator is 'Standard Deviation' So the Denominator is the Standard Deviation which is given as 0.75"
