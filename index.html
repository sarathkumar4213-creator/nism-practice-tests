,"answer_source":"explicit"}]},{"category":"Mutual Fund","set":"Set 4","count":70,"questions":[{"n":1,"q":"A Systematic Transfer Plan (STP) is essentially a combination of which of the following ?","options":["A one-time investment followed by a one-time redemption between two mutual fund schemes","Multiple purchases followed by multiple redemptions within the same mutual fund scheme","A lump sum investment followed by periodic redemptions between two mutual fund schemes","A Systematic Withdrawal Plan (SWP) and a Systematic Investment Plan (SIP) occurring simultaneously between two mutual fund schemes"],"answer":3,"explanation":"A Systematic Transfer Plan (STP) allows investors to move money at regular intervals from one mutual fund scheme (usually a debt or liquid fund) to another (often an equity fund). It works like a Systematic Withdrawal Plan (SWP) from the source scheme and a Systematic Investment Plan (SIP) into the target scheme, happening together. Both these actions happen simultaneously and automatically, making STP essentially a SWP + SIP combo running together between two schemes.","answer_source":"explicit"},{"n":2,"q":"Which of the following is mandatory for a distributor to become empaneled with an AMC?","options":["More than 10 years of mutual fund distribution experience","Registration with SEBI","Completion of KYC formalities","Completion of the Know Your Distributor (KYD) process"],"answer":3,"explanation":"Before empanelment with mutual funds or AMCs, mutual fund distributors must complete the Know Your Distributor (KYD) process. The KYD process involves verification of the distributor's identity, address, bank details, and AMFI Registration Number (ARN) — ensuring that only genuine and verified intermediaries are allowed to distribute mutual funds. A SEBI registration is not required for MF distributors — they operate under an ARN (AMFI Registration Number) issued by AMFI.","answer_source":"explicit"},{"n":3,"q":"Which of the following best describes the concept of Asset Allocation?","options":["Choosing how many mutual fund schemes an investor should hold","Determining which asset class will generate superior returns","Allocating money among various asset categories according to financial objectives, present financial condition and risk appetite","All of the above"],"answer":2,"explanation":"Asset Allocation is a fundamental investment strategy that involves dividing an investment portfolio across different asset classes such as equity, debt, gold, real estate, and cash equivalents. The allocation is not random — it is carefully determined based on three key personal factors: the investor's financial goals (retirement, child's education, etc.), current financial situation (income, liabilities, time horizon), and risk profile (conservative, moderate, or aggressive).","answer_source":"explicit"},{"n":4,"q":"What change regarding Dividend Distribution Tax (DDT) was introduced in the Union Budget 2020?","options":["DDT was abolished for all categories of mutual fund schemes","The DDT rate was reduced, but the tax continued to apply","DDT was removed only for equity-oriented mutual fund schemes, while continuing for non-equity schemes","DDT was removed only for non-equity mutual fund schemes, while continuing for equity-oriented schemes"],"answer":0,"explanation":"In the Union Budget 2020, the Government abolished Dividend Distribution Tax (DDT) on mutual funds. Earlier, mutual fund companies paid DDT before distributing dividends to investors. After abolition, dividend income became taxable directly in the hands of investors according to their income tax slab.","answer_source":"manual"},{"n":5,"q":"Which of the following indicates that a scheme does not benefit from economies of scale?","options":["Net Asset Value (NAV)","Small fund size","Cost of fund management","None of the above"],"answer":1,"explanation":"Economies of scale mean that larger funds can spread their expenses over more assets, reducing cost per investor. Such large funds spread costs across many investors, lowering expenses. A smaller fund size does not get this benefit because expenses are spread over a lower asset base, so costs per investor stay high. This means smaller fund size prevents economies of scale.","answer_source":"explicit"},{"n":6,"q":"Which document contains details such as minimum investment requirements, investor service center locations, and the process for purchasing mutual fund units?","options":["Fund Factsheet","Application form","Key Information Memorandum","Transaction slip"],"answer":2,"explanation":"The Key Information Memorandum (KIM) contains essential details about a mutual fund scheme in a simple and summarized form. It includes information such as minimum investment amount, investor service centres, purchase procedure, and other important scheme details. The KIM helps investors quickly understand the scheme before investing.","answer_source":"explicit"},{"n":7,"q":"An application submitted for repurchase of mutual fund units is stamped with __________ .","options":["A and B","B and C","A and C","All A, B and C"],"answer":1,"explanation":"As per mutual fund transaction processing rules, repurchase applications are stamped with an automatically generated location code and machine identifier. These details help in proper time-stamping and tracking of transactions for NAV applicability and audit purposes. ARN of the distributor is not part of the mandatory stamping requirement on repurchase applications.","answer_source":"explicit","statements":["A) ARN number of the distributor","B) Automatically generated location code","C) Machine identifier"]},{"n":8,"q":"Identify the correct statement(s) related to risk in mutual fund schemes:","options":["A) Credit Risk Funds generally carry a higher default risk compared to Corporate Bond Funds","B) The NAV of gilt funds may fluctuate significantly more than liquid funds because of changes in market yields","Only A","Only B","Both A and B","None of the above"],"answer":4,"explanation":"Credit Risk Funds chase higher returns by investing in lower-rated bonds (below AA) — this means the companies issuing these bonds have a higher chance of defaulting on repayment. Corporate Bond Funds stick to high quality AA+ and above rated bonds — much safer but with slightly lower returns. So, Credit Risk Funds have a higher default risk than Corporate Bond Funds. Gilt funds invest in long-term government bonds (sometimes 10–30 year maturity). When interest rates/yields rise, the prices of these bonds fall sharply — causing significant NAV fluctuation. Liquid funds invest in instruments maturing within 91 days, so yield changes barely affect their NAV.","answer_source":"explicit"},{"n":9,"q":"Investments held in a mutual fund portfolio are valued at:","options":["Book value","Face value","Market value","Cost price"],"answer":2,"explanation":"Mutual fund investments are valued using their current market price. This helps calculate the correct Net Asset Value (NAV) of the scheme every day. Face value, book value, or purchase cost may not reflect the current worth of the securities. Therefore, mutual fund portfolios are valued at market value.","answer_source":"explicit"},{"n":10,"q":"The interest rate sensitivity of a mutual fund scheme having a longer average maturity is generally:","options":["High","Medium","Moderate","Low"],"answer":0,"explanation":"Interest rate sensitivity refers to how much the price of a bond or debt fund changes when interest rates move. Mutual funds with long average maturity hold long-term bonds, which have higher duration. Duration is the key measure of sensitivity. This is because the fund is locked into current interest rates for a longer period, making it more vulnerable to rate fluctuations. When interest rates rise, the prices of these long-term bonds fall more sharply, leading to greater volatility in the fund’s NAV. Conversely, if interest rates decline, such funds benefit more, as bond prices rise significantly. Hence, investors in long maturity debt funds face higher risk and reward potential compared to short maturity funds.","answer_source":"heuristic"},{"n":11,"q":"Which of the following statements correctly reflects SEBI guidelines regarding Income Distribution cum Capital Withdrawal (IDCW), formerly known as dividends, in mutual fund schemes?","options":["IDCW can be paid only from dividends earned by the scheme from its investments","IDCW may be distributed only out of distributable reserves","IDCW may be distributed only if the current NAV exceeds Rs. 10","Mutual fund schemes are prohibited from distributing IDCW to unit holders"],"answer":1,"explanation":"As per SEBI guidelines, mutual fund schemes can distribute IDCW only from distributable surplus/reserves available in the scheme. Which means only from realized profits and surplus available in the scheme. The fund cannot distribute more than what it has earned and realized — preventing any artificial or funded payouts. IDCW is not guaranteed and depends on the availability of distributable reserves. It is not necessary that NAV should be above Rs. 10 for paying IDCW. Also, IDCW is not restricted only to dividends received from invested companies.","answer_source":"explicit"},{"n":12,"q":"Identify the true statement(s) regarding arbitrage funds:","options":["A) Arbitrage funds are riskier compared to equity mutual funds","B) Arbitrage funds aim to exploit price inefficiencies between different market segments","Statement A only","Statement B only","Both statements A and B","None of the above"],"answer":3,"explanation":"Statement B is true : Arbitrage funds try to earn profit from price differences of the same security in different markets, such as cash and futures markets. It works on very simple principle — \"Buy Low in one market, Sell High in another market simultaneously.\" Statement A is false : Since every position is hedged (covered), the risk is actually very low — much lower than regular equity funds. Therefore, arbitrage funds generally have lower risk than equity funds since positions are usually hedged.","answer_source":"explicit"},{"n":13,"q":"At what stage does a nominee become entitled to have mutual fund units transferred in their name ?","options":["Once the nomination is made by the unit holders","Once the nomination is registered by the mutual fund","Upon the death of the first unit holder","Upon the death of all unit holders"],"answer":3,"explanation":"In a jointly held mutual fund account, if the first holder passes away, the surviving joint holders automatically continue to hold the units. The nominee’s right arises only when no registered holder remains alive.","answer_source":"explicit"},{"n":14,"q":"Which among the following statements about real estate investments is NOT true?","options":["The ticket size for investing in real estate is usually higher compared to financial investments","Real estate investments are illiquid and cannot be readily converted into cash in a few days at a clear market price","Real estate transactions generally carry lower costs than investments in financial assets","All of the above"],"answer":2,"explanation":"Real estate investments involve very high transaction costs — including stamp duty, registration charges, brokerage fees, legal charges, and maintenance costs. Therefore the statement - 'Real estate transactions generally carry lower costs than investments in financial assets' is false. The other two statements are true — real estate is indeed illiquid (cannot be sold quickly at a fair price within days), and the ticket size is very high (you need lakhs or crores to invest, unlike mutual funds where you can start with Rs. 500).","answer_source":"explicit"},{"n":15,"q":"What is the NAV if the value of stocks in a Mutual Fund scheme is Rs 100 cr, Value of Bonds is Rs 10 cr, Value of Money Market Instruments is Rs 25 cr, Dividend Accrued but not received is Rs 3 cr and Fees payable is Rs 5 cr. The number of outstanding units is 75 lacs.","options":["173.33","177.33","184","186.74"],"answer":1,"explanation":"NAV = (Value of stocks + Value of bonds + Value of money market instruments + Dividend accrued but not received – Fees payable) / No. of outstanding units = 100 cr + 10 cr + 25 cr + 3 cr - 5 cr / 75 lacs (75 lacs = 0.75 cr) = 133 cr / 0.75 cr = 177.33","answer_source":"explicit"},{"n":16,"q":"Identify the transactions on which Securities Transaction Tax (STT) is applicable","options":["Purchase transactions of debt mutual funds","Purchase transactions of equity mutual funds","Redemption transactions of debt mutual funds","Redemption transactions of equity mutual funds"],"answer":3,"explanation":"When an investor sells units of an equity fund in the stock exchange, or offers them for repurchase to the fund, he will have to incur Securities Transaction Tax (STT) i.e., STT is applicable only on redemption/switch to other schemes/sale of units of equity oriented mutual funds whether sold on stock exchange or otherwise. STT is not applicable on purchase of units of an equity scheme. It is also not applicable to transactions in debt securities or debt mutual fund schemes.","answer_source":"explicit"},{"n":17,"q":"Identify the TRUE statement with respect to regulation of mutual funds in India.","options":["AMFI along with SEBI regulates the mutual funds in India","The two stock exchanges NSE and BSE regulate the open-end mutual fund schemes","SEBI regulates the mutual funds in India","RBI along with SEBI regulate the bank sponsored mutual funds in India"],"answer":0,"explanation":"Securities markets in India are regulated by the Securities and Exchange Board of India (SEBI). It regulates, among other entities, mutual funds, depositories, custodians, registrars and transfer agents (RTAs) and credit rating agencies in the country. AMFI does not regulate the Mutual Fund. The objectives of AMFI are to define and maintain high professional and ethical standards in all areas of operation of the mutual fund industry.","answer_source":"explicit"},{"n":18,"q":"Identify which of these is not included in the 'Fundamental Attributes' of a mutual fund scheme?","options":["Aggregate fees and expenses charged to the scheme","Any safety net or guarantee provided","Exit Loads","Liquidity provisions such as listing, repurchase, redemption"],"answer":2,"explanation":"Within the Scheme Information Document, there is an important section on fundamental attributes of a scheme with following parameters on terms of issue : Terms of Issue - 1. Liquidity provisions such as listing, repurchase, redemption. 2. Aggregate fees and expenses charged to the scheme. 3. Any safety net or guarantee provided. Exit Loads do not form a part of 'Fundamental Attributes' of a scheme.","answer_source":"explicit"},{"n":19,"q":"Tactical Asset Allocation is the decision that comes out of calls on the likely behaviour of the market - True or False ?","options":["False","True"],"answer":1,"explanation":"Tactical Asset Allocation is the decision that comes out of calls on the likely behaviour of the market. An investor who decides to go overweight on equities because of expectations of a rise in share markets, is taking a tactical asset allocation call.","answer_source":"explicit"},{"n":20,"q":"What will be the minimum investment in corporate bonds (AA and below rated) in a Credit Risk fund?","options":["50% of of total assets","55% of of total assets","60% of of total assets","65% of of total assets"],"answer":3,"explanation":"Credit Risk Fund is an open-ended debt scheme investing in below highest rated corporate bonds. The minimum investment in corporate bonds shall be 65 percent of total assets (only in AA (excludes AA+ rated corporate bonds) and below rated corporate bonds).","answer_source":"explicit"},{"n":21,"q":"The Market Value of stocks of a scheme is Rs 240 crores. Dividend accrued but not received is Rs 30 crore. The Expenses payable are Rs 10 crore. The total number of outstanding units is 120 lakhs. What is the NAV of the scheme ?","options":["175.80","216.66","224.70","311.74"],"answer":1,"explanation":"Total Market Value = Rs 240 crore Add Dividend Accrued of Rs 30 crore Less Expenses Payable of Rs 10 crore Divided by Units 120 lakhs ie. 1.20 crore units 260 cr / 1.2 cr = 216.66 NAV","answer_source":"explicit"},{"n":22,"q":"The _______ is the promoter of a Mutual Fund.","options":["Trust","AMC","Sponsor","Custodian"],"answer":2,"explanation":"Mutual funds are constituted as Trusts. The mutual fund trust is created by one or more Sponsors, who are the main persons behind the mutual fund business.","answer_source":"explicit"},{"n":23,"q":"Identify the CORRECT statement.","options":["Mutual funds can only be purchased on the stock exchange platform and they cannot be sold","All mutual funds purchased on the stock exchange platform have a mandatory lock-in period","Stock exchange mutual fund trading platform has become another channel for mutual fund companies to reach out to investors","All of the above"],"answer":2,"explanation":"SEBI has facilitated buying and selling of the units of open-ended mutual funds through the stock exchanges. Both National Stock Exchange (NSE) and Bombay Stock Exchange (BSE) have extended their trading platforms to help the stock exchange brokers become a channel for investors to transact in Mutual Fund units.","answer_source":"explicit"},{"n":24,"q":"Once the New Fund Offer (NFO) of a Close Ended Fund has closed, a person can buy the listed units of such close ended fund ____________.","options":["At prices usually higher than NAV","At prices usually lower than NAV","At prices which can be higher or lower than NAV","Units of a Close Ended Fund cannot be bought after NFO"],"answer":2,"explanation":"After the NFO of a close ended fund, sale and purchase transactions happen on the stock exchange between two different investors, and that the fund is not involved in the transaction. The transaction price is likely to be different from the NAV. Depending on the demand-supply situation for the units of the scheme on the stock exchange, the transaction price could be higher or lower than the prevailing NAV.","answer_source":"explicit"},{"n":25,"q":"________ is prohibited as per the AMFI Code of Ethics.","options":["Inter-Scheme transfer of securities","Front running in those securities in which the mutual fund is dealing","Transaction in securities through associated brokers","Distribution of mutual fund schemes through Sponsor or its associates"],"answer":1,"explanation":"Front running means buying or selling of any securities ahead of transaction of the fund, with access to information regarding the transaction which is not public and which is material to making an investment decision, so as to derive unfair advantage. As per the AMFI code of ethics - Members or any of their directors, officers or employees shall not indulge in front running.","answer_source":"explicit"},{"n":26,"q":"Mohit is currently studying but wants to start a business after 5 years. The present cost of starting such a business is Rs. 10 lakhs. The inflation in the economy is 9%. Which formula should be used to calculate the amount which Mohit will need 5 years down the line?","options":["10,000,00 * (1+0.09)^5","10,000,00 / (1+0.09)^5","10,000,00 * (1+0.09)*5","10,000,00 * (1*0.09)^5"],"answer":0,"explanation":"The formula for calculating the Future Value of an investment made today is FV = PV * (1 + r) ^ n The PV ie. Present Value is Rs. 10 lakhs. The inflation rate (r) is 9% ie. 0.09 and time (n) is 5 years Subsituting in the formula : FV = 10,000,00 * (1+0.09)^5","answer_source":"manual"},{"n":27,"q":"What will happen to the scheme’s Net Asset Value (NAV) after the dividend is paid?","options":["The NAV will Rise","The NAV will Fall","The NAV will remain same"],"answer":1,"explanation":"In a mutual fund, dividend is paid out of the scheme’s assets. Once the dividend is distributed, that amount is deducted from the scheme’s NAV. So, immediately after the dividend payout, the NAV falls by the dividend amount.","answer_source":"explicit"},{"n":28,"q":"Identify the plan which could be used in lieu of income distribution cum capital withdrawal pay-outs?","options":["Systematic Withdrawal Plan","Systematic Transfer Plan","Systematic Investment Plan","None of the above"],"answer":0,"explanation":"The Income distribution cum capital withdrawal (dividend) pay-out option is for investors wanting a regular income. Systematic Withdrawal Plan(SWP) is a facility which allows an investor to withdraw a fixed amount at pre-determined intervals. Therefore an Income distribution cum capital withdrawal (dividend) pay-out option is similar to SWP. The difference is that the dividend is paid only when the fund has a surplus amount and in SWP the amount is compulsarily paid. (The dividend pay-out plan is renamed as pay-out of income distribution cum capital withdrawal, dividend re-investment plan is renamed as reinvestment of income distribution cum capital withdrawal option followed by renaming of dividend transfer plan to transfer of income distribution cum capital withdrawal plan)","answer_source":"heuristic"},{"n":29,"q":"Can an investor change his mutual fund distributor?","options":["Yes, but a permission from AMFI and SEBI is needed for the same","Yes, but the investor has to give a written request to the fund house","Yes, but an upfront fees have to be paid to the existing distributor to cover up his loss of income","No, a change of distributor is not permitted by SEBI"],"answer":1,"explanation":"Investors can choose to change their distributor or opt for direct investing. This needs to be done through a written request by the investor to the AMC. In such cases, AMCs will need to comply, without insisting on any kind of ‘No Objection Certificate’ from the existing distributor.","answer_source":"explicit"},{"n":30,"q":"Identify the CORRECT statement with respect to a Fund Factsheet.","options":["A Fund Factsheet has to be published only at the time of a New Fund Offer (NFO)","As per SEBI regulations, a Fund Factsheet has to be published on a monthly basis by the AMCs","A Fund Factsheet is published by AMCs on a voluntary basis","All mutual fund distributors have to mandatorily read the Fund Factsheet before recommending a scheme to their investors"],"answer":2,"explanation":"A Fund Factsheet is a document that provides key information about a mutual fund scheme, such as portfolio holdings, asset allocation, and recent performance. SEBI does not legally mandate AMCs to publish a factsheet. However, most AMCs voluntarily publish it (usually monthly) to keep investors informed and improve transparency.","answer_source":"explicit"},{"n":31,"q":"Identify the true statement with respect to 'Unclaimed Dividend' and redemption amounts in mutual fund schemes.","options":["The Asset Management Company can charge a penalty from the investors to refund the unclaimed dividend","The Asset Management Company can recover investment management fees from the investor but within the prescribed rates","The Asset Management Company has to transfer the unclaimed amounts to investor education fund","All of the above"],"answer":1,"explanation":"Unclaimed dividends/redemptions are kept aside by the AMC. They can be invested and AMCs may deduct management fees (within SEBI rules). As per SEBI rules - The mutual fund has to deploy unclaimed dividend and redemption amounts in the money market and in a separate plan of Liquid scheme floated by mutual funds especially for investing the unclaimed amounts. AMC can recover investment management and advisory fees on management of these unclaimed amounts, at a maximum rate of 0.50 percent per annum and there shall be no exit loads charged on this plan.","answer_source":"explicit"},{"n":32,"q":"Mr. Prakash has made an one time investment in a mutual fund scheme through a distributor. He has done no other subsequent transactions. How will the trail commission payable to the distributor be calculated ?","options":["The NAV as on the date of purchase X Number of units X Rate of trail commission X Number of days the investment is held / 365","The NAV as on the date of calculation of trail commission X Number of units X Rate of trail commission X Number of days the investment is held / 365","Average of all NAVs from the date of purchase to the date of calculation of trail commission X Number of units X Rate of trail commission X Number of days the investment is held / 365","Face value of unit X Number of units X Rate of trail commission X Number of days the investment is held / 365"],"answer":1,"explanation":"Trail commission is calculated as a percentage of the net assets attributable to the Units sold by the distributor. The commission payable is calculated on the daily balances and paid out periodically to the distributor as per the agreement entered into with AMC. As the trail commission is calculated on net assets, distributors benefit from increase in net assets arising out of valuation gains in the market. The formula for calculating the trail commission for a day is : Value of Net Assets as on the date of calculating trail commission x Trail commission Rate / 365 Trail commission for each day is added to get the total trail commission for a period. Value of net assets for the day will be the Number of Units held x the NAV of the day.","answer_source":"explicit"},{"n":33,"q":"The information which is provided in a mutual fund advertisement has to be _______ .","options":["Published in one English and one regional language newspaper","Approved by Securities and Exchange Board of India","Timely","Valid for at least 6 months investment horizon"],"answer":2,"explanation":"As per the SEBI Advertisement Code for Mutual Funds - Advertisements shall contain information that is timely and consistent with the disclosures made in the Scheme Information Document, Statement of Additional Information and the Key Information Memorandum. (No approval is required from SEBI except - Prior approval of SEBI shall be required for issuance of any endorsement of Mutual Funds as a financial product, which features a celebrity for the purpose of increasing awareness of Mutual Funds)","answer_source":"explicit"},{"n":34,"q":"Which of these expenses can be charged to a mutual fund scheme by the AMC ?","options":["Office salaries of fund management team","Rent of the AMC registered office","AMC general administration expenses","Custodian and Fund Administrator fees"],"answer":3,"explanation":"In addition to the investment and advisory fee, the AMC may charge the mutual fund scheme with recurring expenses including: - marketing and selling expenses including agents’ commission, if any - brokerage and transaction cost - registrar services for transfer of units sold or redeemed - fees and expenses of trustees - audit fees - custodian fees etc.","answer_source":"explicit"},{"n":35,"q":"Which is the Source Scheme in a Systematic Transfer Plan ?","options":["It is the scheme with the lower NAV","It is the scheme from which funds are transferred","It is the scheme to which funds are transferred","It is the scheme with the higher NAV"],"answer":1,"explanation":"In a Systematic Transfer Plan (STP), the amount that is withdrawn from a scheme (called the source scheme) is re-invested in some other scheme (called the target scheme) of the same mutual fund. For eg. An investor has invested Rs 50,000 in SBI Debt Fund and has a STP to transfer Rs 5000 every month into SBI Mid Cap Fund. Here SBI Debt Fund is the Source fund and SBI Mid Cap Fund is the Target fund.","answer_source":"explicit"},{"n":36,"q":"Identify the FALSE statement/s with respect to a New Fund Offer (NFO).","options":["1. A Closed-ended mutual fund NFO will have a NFO opening date, a NFO closing date and a scheme Re-opening date","2. A Open-ended mutual fund NFO will have a NFO opening date, a NFO closing date and a scheme Re-opening date","Only 1 is false","Only 2 is false","Both 1 and 2 are false"],"answer":3,"explanation":"Closed-ended mutual funds typically do not have a scheme re-opening date, as they are not open for continuous subscription and redemption. Once the NFO period is over, investors can buy or sell units on the stock exchange, but the fund is not open for fresh subscriptions . On the other hand, open-ended mutual funds usually re-open for subscription after the NFO period, allowing investors to buy or sell units at the prevailing Net Asset Value (NAV) Therefore, only statement 1 is false.","answer_source":"manual"},{"n":37,"q":"Which of these information is not contained in the Scheme Information Document (SID)?","options":["Names of securities in the scheme's portfolio","Investment objective of the scheme","Risk factors of the scheme","Portfolio features"],"answer":0,"explanation":"The names of securities in the scheme's portfolio is contained in the Fund fact sheet and not in the SID.","answer_source":"heuristic"},{"n":38,"q":"Opening of time stamping machine needs to be documented and reported to the Asset Management Company (AMC) - State whether True or False?","options":["True","False"],"answer":1,"explanation":"The points of acceptance for mutual fund transactions have time stamping machines with tamper-proof seal. Opening the machine for repairs or maintenance is permitted only by vendors or nominated persons of the mutual fund. Such opening of the machine has to be properly documented and reported to the Trustees.","answer_source":"explicit"},{"n":39,"q":"Identify the INCORRECT statement with respect to SEBI Complaints Redress System (SCORES).","options":["SCORES enables the market intermediaries and listed companies to receive complaints from investors, redress such complaints and report redressal","SCORES is a web-based centralized grievance redress system","SCORES is completely online, so an investor cannot lodge a physical compliant","If an investor lodges a physical complaint then such complaints are scanned and then uploaded in SCORES for processing"],"answer":2,"explanation":"While SCORES is primarily online, investors can still submit physical complaints to the SEBI office or concerned intermediary. These physical complaints are then scanned and uploaded onto SCORES for further processing. Therefore - 'SCORES is completely online, so an investor cannot lodge a physical compliant' - is incorrect.","answer_source":"explicit"},{"n":40,"q":"Identify the FALSE statement/s with respect to benchmarks for mutual fund schemes.","options":["A. A Multi-Cap fund can have Nifty 500 index as its benchmark","B. A Multi-Cap fund can have BSE Sensex as its benchmark","Only A is false","Only B is false","Both A and B are false","None of the above"],"answer":3,"explanation":"A Multi-Cap fund invests in Large Cap, Mid Cap and Small Cap stocks as per proportions stipuated by SEBI. The Nifty500 index represents top 100 large cap companies, top 150 Mid-cap companies and top 250 small cap companies. Therefore, it can be a good benchmark for a Multi-Cap fund. The BSE Sensex has 30 large cap stocks from various sectors and it can be good benchmark for a large cap fund and not for a multi cap fund.","answer_source":"explicit"},{"n":41,"q":"Identify the TRUE statement/s with respect to the risks associated with short selling and stock lending.","options":["1. There is counterparty risk and liquidity risk in short selling","2. There is no risk associated with stock lending as the transaction is done through an approved intermediary","Only 1 is true","Only 2 is true","Both 1 and 2 are true"],"answer":2,"explanation":"Short-selling is the sale of shares or securities that the seller does not own at the time of trading. Instead, he borrows it from someone who already owns it. Later, the short seller buys back the stock/security he shorted and returns the stock/security to the lender to close out the loan. The inherent risks are Counterparty risk and liquidity risk of the stock/security being borrowed. The security being short sold might be illiquid or become illiquid and covering of the security might occur at a much higher price level than anticipated, leading to losses. Securities Lending is lending of securities through an approved intermediary to a borrower under an agreement for a specified period with the condition that the borrower will return equivalent securities of the same type or class at the end of the specified period along with the corporate benefits accruing on the securities borrowed. There are risks inherent in securities lending, including the risk of failure of the other party. Such failure can result in a possible loss of rights to the collateral, the inability of the approved intermediary to return the securities deposited by the lender and the possible loss of corporate benefits accruing thereon.","answer_source":"manual"},{"n":42,"q":"Mr. Suresh invests Rs 30000 in an equity fund. The face value of this scheme is Rs 10 and the NAV is Rs 12. The exit load is 2%. How many units will be allotted to Mr. Suresh ?","options":["3000","2142.8571","2500","2411.1574"],"answer":2,"explanation":"Exit load is not applicable on purchase of units. Its applicable only on sale of units. The units will be allotted to Mr. Suresh as per the NAV which is Rs. 12. Amount invested is Rs 30,000 Units allotted = Amount Invested / NAV = 30000 / 12 = 2500","answer_source":"explicit"},{"n":43,"q":"Amongst the distribution channel mentioned below, which one is likely to sell funds of only a single mutual fund house?","options":["Distribution Company","Independent financial advisor","Institutional sales team of the Asset Management Company","Bank"],"answer":2,"explanation":"An independent financial advisor, a bank or a distribution company will sell mutual fund schemes of various mutual fund houses as per their clients requirements and other considerations. However, an institutional sales team of an Asset Management Company will sell schemes only of the single mutual fund house which has appointed it.","answer_source":"explicit"},{"n":44,"q":"These debt mutual funds have been arranged from lowest risk to highest risk. Identify the risk which we are discussing :","options":["1. Liquid Funds 2. Money market funds 3. Medium term bond funds","Interest Rate Risk","Concentration Risk","Default Risk","Credit Risk"],"answer":1,"explanation":"Interest rate risk is the risk that an investment's value will change as a result of a change in interest rates. The interest rate risk varies for bonds with different maturities. Those with longer maturity would witness higher price fluctuations in comparison to those with shorter maturities. Similarly short term debt funds will have lower interest rate risk when compared to longer term debt funds. In the above question, Liquid funds have the shortest duration and so will have less adverse effect of interest rate risk when compared to Money market funds and Medium term bond funds.","answer_source":"heuristic"},{"n":45,"q":"Which of these funds will generally have a higher fund management cost?","options":["Debt Fund","Active Equity Fund","Passive Equity Fund","Equity Index Fund"],"answer":1,"explanation":"In Active Equity Funds the fund manager does a lot of buying / selling which result in higher transaction costs. Also a lot of research work goes into it. So the cost of fund management are higher. Equity Index Funds or Passive Equity funds invest in a portfolio that mimics a market index. There is no selection risk in index funds because the fund manager has no role in creating the portfolio. For this reason, the costs that an index fund is allowed to charge is also lower since there are no research or other fund management expenses.","answer_source":"explicit"},{"n":46,"q":"SEBI Complaint Redress System (SCORES) helps an investor to ______ .","options":["Only 1","Only 1 and 3","Only 1 and 2","All 1, 2 and 3"],"answer":3,"explanation":"SEBI Complaint Redress System (SCORES) is a web-based centralized grievance redress system of SEBI. SCORES enables investors to lodge, follow up on their complaints and track the status of redressal of such complaints online on the website - http://scores.gov.in","answer_source":"explicit","statements":["1. Lodge a complaint for a grievance","2. Make a follow-up on the complaint","3. Track the status of redressal of such complaints online"]},{"n":47,"q":"Among equity funds, Focused funds carry _______ risks as compared to diversified funds due to ______ .","options":["Lower ; highly concentrated portfolio","Higher ; highly concentrated portfolio","Lower ; lower expenses of the fund","Higher ; investments in debt securities"],"answer":1,"explanation":"Among the equity funds, some schemes may have a portfolio concentrated in a few stocks. Such scheme category is known as “Focused funds”. . These schemes carry higher risk than a diversified fund, due to higher concentration among smaller number of stocks.","answer_source":"explicit"},{"n":48,"q":"Which debt schemes of mutual funds invest only in debt securities where moneys will be repaid within 91 days?","options":["Money Market Funds","Medium term debt funds","Fixed Maturity Plans","Liquid Funds"],"answer":3,"explanation":"Liquid Funds invest in debt and money market instruments with a maturity of up to 91 days. These are considered relatively low-risk and highly liquid among debt mutual funds.","answer_source":"explicit"},{"n":49,"q":"Identify the false statement/s :","options":["A. While evaluating the mutual fund schemes, the expense ratio matters more in debt funds than equity funds","B. An Ultra-short term debt fund has to mandatorily invest in high credit quality debt securities","Only A is false","Only B is false","Both A and B are false"],"answer":3,"explanation":"Any cost is a drag on investor’s returns. Investors need to be particularly careful about the cost structure of debt schemes, because in the normal course, debt returns can be much lower than equity schemes. So expense ratio is more critical for debt funds. When the limits are not tightly defined, the fund manager may assume an active role in managing the risk, e.g. an ultra-short term debt fund may take credit risk, since the SEBI regulations only define the permitted maturity profile, which indicates how much interest rate risk the scheme can take.","answer_source":"explicit"},{"n":50,"q":"Identify the TRUE statement -","options":["A. It is mandatory for the AMC to disclose the valuation policy","B. The AMC is not accountable for policies and procedures for detecting and preventing incorrect valuation","Only A is true","Only B is true","Both A and B are true"],"answer":2,"explanation":"Disclosure of the valuation policy and procedures approved by the Board of the AMC shall be made in Statement of Additional Information, on the website of the AMC to ensure transparency of valuation norms to be adopted by asset management company. The responsibility of true and fairness of valuation and correct NAV shall be of the Asset Management Company, irrespective of disclosure of the approved valuation policies and procedures.","answer_source":"manual"},{"n":51,"q":"Performance of a portfolio is influenced by _______ .","options":["Stock Selection","Investment Policy","Asset Allocation Strategy","All of the above"],"answer":3,"explanation":"A portfolio consists of various types of investment products. It is influenced by the investment policy includes the scheme’s asset allocation and investment style. Also equity returns are a function of sector and stock selection which will influence the portfolio performance.","answer_source":"explicit"},{"n":52,"q":"The additional Total Expense Ratio (TER) charged has to be credited back to the Mutual Fund in which of these situations?","options":["When the performance of the mutual fund declines as compared to previous year","When the inflows from beyond the top 30 cities are redeemed within a period of 1 year from the date of investment.","When the TER of the mutual fund exceeds the limit specified under the regulations","All of the above"],"answer":1,"explanation":"Mutual funds can charge additional TER if the new inflows are from beyond top 30 cities (subject to some conditions) However, the additional TER on account of inflows from beyond the top 30 cities so charged shall be credited back to the scheme in case the said inflows are redeemed within a period of 1 year from the date of investment.","answer_source":"explicit"},{"n":53,"q":"All transactions of purchase and sale of securities by key personnel of the AMC, who are directly involved in investment operations shall be disclosed to the compliance officer of the member at least on _______ .","options":["Weekly basis","Monthly basis","Half-Yearly basis","Yearly basis"],"answer":2,"explanation":"As per the AMFI Code of Ethics - All transactions of purchase and sale of securities by key personnel who are directly involved in investment operations shall be disclosed to the compliance officer of the member at least on half yearly basis and subsequently reported to the Board of Trustees if found having conflict of interest with the transactions of the fund.","answer_source":"explicit"},{"n":54,"q":"Identify the correct statement(s) related to the Statement of Additional Information (SAI).","options":["A) The SAI should be updated regularly within three months after the close of every financial year.","B) Any material changes must be updated on an ongoing basis and displayed on the websites of both the mutual fund and AMFI.","Only A","Only B","Both A and B","None of the above"],"answer":4,"explanation":"The Statement of Additional Information (SAI) contains extra details about the mutual fund, such as operational and legal information. SEBI rules require that the SAI be updated regularly within 3 months after the end of each financial year. Any material changes must also be updated immediately and uploaded on the websites of the Mutual Fund and Association of Mutual Funds in India (AMFI).","answer_source":"explicit"},{"n":55,"q":"Identify the FALSE statement/s :","options":["1. For equity mutual funds schemes which are actively managed (eg. Diversified equity fund/Balance funds), the net asset value need NOT be declared up to 4 decimal points","2. Each mutual fund scheme’s account is combined with the accounts of the Asset Management Company","Only 1 is false","Only 2 is false","Both 1 and 2 are false"],"answer":3,"explanation":"Key Accounting and Reporting Requirements for mutual funds : - The accounts of the schemes need to be maintained distinct from the accounts of the AMC. The auditor for the AMC has to be different from that of the schemes. - NAV for equity and balanced funds is to be calculated up to at least 2 decimal places. (and not 4). NAV is to be calculated up to 4 decimal places in the case of index funds, liquid funds and other debt funds.","answer_source":"explicit"},{"n":56,"q":"A top performing scheme within a category _______ .","options":["Is the best choice for an investor to invest his funds","may or may not be the top performer in the next years to come","usually remains the top performer for a long period of time","usually be the worst performer in the next years to come"],"answer":1,"explanation":"As experience has shown time and again, the top performers during one period may not necessarily remain as a top performer forever or near the other top performers. In such a case, simply buying into a scheme due to good returns in the recent past may not be a wise approach. The mutual fund advertisements use the disclaimer: “Past performance may or may not be sustained in future”.","answer_source":"explicit"},{"n":57,"q":"Identify the TRUE statement with respect to ‘Jensen’s Alpha’ of a mutual fund scheme?","options":["It is a measure of outperformance after adjusting for the risk taken","It is a measure of risk and outperformance is related to returns","It is a measure of simple outperformance, irrespective of the risk taken","None of the above"],"answer":0,"explanation":"Jensen's Alpha is used to determine the abnormal return of a security or portfolio of securities over the theoretical expected return. It is a risk-adjusted performance measure that represents the average return on a portfolio or investment, above or below that predicted by the capital asset pricing model (CAPM), given the portfolio's or investment's beta and the average market return.","answer_source":"manual"},{"n":58,"q":"The appropriate benchmark for a short term debt scheme will be _______ .","options":["1 Year T-Bill index","Nifty50","10 year dated GoI security","5 year dated GoI security"],"answer":0,"explanation":"Appropriate Benchmarks : Equity scheme - Sensex or Nifty Long term debt scheme - 10 year dated GoI security Short-term debt fund - 1 year T-Bill","answer_source":"manual"},{"n":59,"q":"As per SEBI guidelines, _________ is/are vested with the responsibility of developing indices as benchmark for debt mutual fund schemes.","options":["AMFI","The mutual fund themselves","The risk management department of the AMC's","Research and rating agencies"],"answer":3,"explanation":"As per the SEBI guidelines, the benchmark for debt (and balanced schemes) should be developed by research and rating agencies recommended by AMFI. CRISIL, ICICI Securities and NSE have developed various such indices.","answer_source":"explicit"},{"n":60,"q":"SEBI has to approve the Scheme Related Documents in ______ .","options":["7 days","15 days","1 month","SEBI does not approve the Scheme Related Documents. It only gives its observations"],"answer":3,"explanation":"SEBI does not approve or disapprove the Scheme Related Documents, it gives its observations. The mutual fund needs to incorporate these observations in these documents. Thus, the documents in the market are “vetted” by SEBI, and not approved by SEBI.","answer_source":"explicit"},{"n":61,"q":"______ is an example of physical asset.","options":["Bank Deposit","Shares and Debentures","Land and Building","Futures and Options"],"answer":2,"explanation":"Land and buildings are physical property. Shares, Debentures, Bank Deposits, F&O are all financial assets/instruments.","answer_source":"explicit"},{"n":62,"q":"Mohit needs Rs. 2,00,000 in 5 years from now. The interest rate is 7%. The amount required today to be invested can be calculated by using the formula ______ .","options":["200000 / (1+0.07)^5","200000 * (1- 0.07)^5","200000 / (1+0.07)*5","200000 * (1+0.07)*5"],"answer":0,"explanation":"The formula for calculating the Future Value of an investment made today is FV = PV * (1 + r) ^ n Where FV is the future value ; PV is the present value ; r is the rate of inflation or interest rate ; n is the number of years Thus the formula for Present value will be PV = FV / (1 + r) ^ n Subsituting the above numbers : PV = 2,00,000 / (1+0.07)^ 5","answer_source":"manual"},{"n":63,"q":"SEBI has regulations pertaining to restrictions on the investment policies of mutual fund schemes for ensuring that _____ .","options":["The mutual scheme can improve their ratings over a period of time","The scheme returns are better than the benchmark returns","The scheme returns are better than the Nifty/Sensex","The mutual fund scheme has a minimum diversification as per the requirements"],"answer":3,"explanation":"The investors have no control, over the investment management of the mutual fund. It is in this context that SEBI has laid down regulations pertaining to investment universe, restrictions and portfolio diversification for investment by mutual fund schemes. Such regulations intend to control the risks taken by the mutual fund managers.","answer_source":"explicit"},{"n":64,"q":"Which exam has to be cleared to get the Employee Unique Identification Number (EUIN) from AMFI?","options":["SEBI - VA Mutual Fund Distributors Certification Examination","AMFI - VA Mutual Fund Distributors Certification Examination","NISM - VA Mutual Fund Distributors Certification Examination","NISM - VB Mutual Fund Distributors Certification Foundation"],"answer":2,"explanation":"Institutions that are into the distribution of mutual funds need to register with AMFI. The employees of these institutions need to clear the NISM Series V-A: Mutual Fund Distributors Certification Examination and obtain an Employee Unique Identification Number (EUIN) from AMFI.","answer_source":"explicit"},{"n":65,"q":"In the usual course of events, a fund manager will have to provide the maximum liquid assets for _______ .","options":["Gold ETFs","Equity ETFs","Close-end fund","Open-end fund"],"answer":3,"explanation":"ETFs and Close-end funds are listed on the stock exchanges and investors can sell their units their. They need not give redemption request to the AMCs. So, the fund manager need not maintain liquid funds for Close-end funds and ETFs. In an open-end fund, investors can buy or redeem units directly from the fund at any time. Therefore, the fund manager needs to maintain higher liquid assets/cash to meet frequent redemption requests. Hence, maximum liquidity is normally required for an Open-end fund.","answer_source":"explicit"},{"n":66,"q":"_______ can be used in lieu of Income distribution cum capital withdrawal pay-outs.","options":["Systematic Investment Plan","Systematic Transfer Plan","Systematic Withdrawal Plan","All of the above"],"answer":2,"explanation":"The Income distribution cum capital withdrawal (dividend) pay-out option is for investors wanting a regular income. Systematic Withdrawal Plan(SWP) is a facility which allows an investor to withdraw a fixed amount at pre-determined intervals. Therefore an Income distribution cum capital withdrawal (dividend) pay-out option is similar to SWP. The difference is that the dividend is paid only when the fund has a surplus amount and in SWP the amount is compulsarily paid. (The dividend pay-out plan is renamed as pay-out of income distribution cum capital withdrawal, dividend re-investment plan is renamed as reinvestment of income distribution cum capital withdrawal option followed by renaming of dividend transfer plan to transfer of income distribution cum capital withdrawal plan)","answer_source":"explicit"},{"n":67,"q":"Which of these expenses can be charged to a mutual fund scheme by the AMC?","options":["Rent for registered office of the mutual fund","Salaries of fund management team","General administration expenses of the AMC","Fees of custodians and fund administrators"],"answer":3,"explanation":"As per SEBI regulations, Asset Management Companies (AMCs) can charge certain expenses to a mutual fund scheme, but they must be directly related to the management and operation of the fund. Custodian and fund administrator fees are essential expenses for managing the fund’s assets and ensuring compliance with regulatory requirements. Rent for the registered office, salaries of the fund management team, and general administration expenses of the AMC are not directly attributable to a specific mutual fund scheme and must be borne by the AMC itself.","answer_source":"explicit"},{"n":68,"q":"As per the Advertisement Guidelines for Mutual Funds, Point-to-point returns on a standard investment of Rs. 10,000 shall also be shown in addition to CAGR for a scheme which has been for existence _______ .","options":["More than 5 years","More than 3 years","More than 2 years","Irrespective of years of existence, all mutual fund schemes must show the point to point returns"],"answer":1,"explanation":"As per the SEBI Advertisement Guidelines for Mutual Funds, when the mutual fund scheme has been in existence for more than THREE years : - Performance advertisement of mutual fund schemes shall be provided in terms of CAGR for the past 1 year, 3 years, 5 years and since inception. - Point-to-point returns on a standard investment of Rs. 10,000 shall also be shown in addition to CAGR for the scheme to provide ease of understanding to retail investors.","answer_source":"explicit"},{"n":69,"q":"Which of the following is INCORRECT with respect to advertisements of Mutual Funds by AMCs.","options":["The advertisements can use celebrities for endorsements","The advertisements can show past performance of the scheme","The advertisements can show the return numbers","All of the above are incorrect"],"answer":0,"explanation":"As per SEBI guidelines, mutual fund advertisements cannot use celebrities for endorsements. The aim is to ensure that investment decisions are based on the merits of the scheme and not influenced by the popularity of a celebrity. (Note - AMFI can use celebrities to promote mutual funds investment like it does with the tag line 'Mutual Funds Sahi Hai' but individual mutual funds cannot use celebrities)","answer_source":"manual"},{"n":70,"q":"Ms. Priya redeems 2000 units at an NAV of Rs 13. If the exit load is 1 percent, what is the redemption value of the investment?","options":["Rs. 25500","Rs. 26000","Rs. 25740","Rs. 26250"],"answer":2,"explanation":"Ms. Priya redeems 2000 units at an NAV of Rs 13 = 2000 x 13 = 26000 Exit load at 1% of 26000 = 260 Redemption value = 26000 - 260 = Rs. 25740","answer_source":"explicit"}]},{"category":"Mutual Fund","set":"Set 5","count":70,"questions":[{"n":1,"q":"A Systematic Transfer Plan (STP) is essentially a combination of which of the following ?","options":["A one-time investment followed by a one-time redemption between two mutual fund schemes","Multiple purchases followed by multiple redemptions within the same mutual fund scheme","A lump sum investment followed by periodic redemptions between two mutual fund schemes","A Systematic Withdrawal Plan (SWP) and a Systematic Investment Plan (SIP) occurring simultaneously between two mutual fund schemes"],"answer":3,"explanation":"A Systematic Transfer Plan (STP) allows investors to move money at regular intervals from one mutual fund scheme (usually a debt or liquid fund) to another (often an equity fund). It works like a Systematic Withdrawal Plan (SWP) from the source scheme and a Systematic Investment Plan (SIP) into the target scheme, happening together. Both these actions happen simultaneously and automatically, making STP essentially a SWP + SIP combo running together between two schemes.","answer_source":"explicit"},{"n":2,"q":"Which of the following is mandatory for a distributor to become empaneled with an AMC?","options":["More than 10 years of mutual fund distribution experience","Registration with SEBI","Completion of KYC formalities","Completion of the Know Your Distributor (KYD) process"],"answer":3,"explanation":"Before empanelment with mutual funds or AMCs, mutual fund distributors must complete the Know Your Distributor (KYD) process. The KYD process involves verification of the distributor's identity, address, bank details, and AMFI Registration Number (ARN) — ensuring that only genuine and verified intermediaries are allowed to distribute mutual funds. A SEBI registration is not required for MF distributors — they operate under an ARN (AMFI Registration Number) issued by AMFI.","answer_source":"explicit"},{"n":3,"q":"Which of the following best describes the concept of Asset Allocation?","options":["Choosing how many mutual fund schemes an investor should hold","Determining which asset class will generate superior returns","Allocating money among various asset categories according to financial objectives, present financial condition and risk appetite","All of the above"],"answer":2,"explanation":"Asset Allocation is a fundamental investment strategy that involves dividing an investment portfolio across different asset classes such as equity, debt, gold, real estate, and cash equivalents. The allocation is not random — it is carefully determined based on three key personal factors: the investor's financial goals (retirement, child's education, etc.), current financial situation (income, liabilities, time horizon), and risk profile (conservative, moderate, or aggressive).","answer_source":"explicit"},{"n":4,"q":"What change regarding Dividend Distribution Tax (DDT) was introduced in the Union Budget 2020?","options":["DDT was abolished for all categories of mutual fund schemes","The DDT rate was reduced, but the tax continued to apply","DDT was removed only for equity-oriented mutual fund schemes, while continuing for non-equity schemes","DDT was removed only for non-equity mutual fund schemes, while continuing for equity-oriented schemes"],"answer":0,"explanation":"In the Union Budget 2020, the Government abolished Dividend Distribution Tax (DDT) on mutual funds. Earlier, mutual fund companies paid DDT before distributing dividends to investors. After abolition, dividend income became taxable directly in the hands of investors according to their income tax slab.","answer_source":"manual"},{"n":5,"q":"Which of the following indicates that a scheme does not benefit from economies of scale?","options":["Net Asset Value (NAV)","Small fund size","Cost of fund management","None of the above"],"answer":1,"explanation":"Economies of scale mean that larger funds can spread their expenses over more assets, reducing cost per investor. Such large funds spread costs across many investors, lowering expenses. A smaller fund size does not get this benefit because expenses are spread over a lower asset base, so costs per investor stay high. This means smaller fund size prevents economies of scale.","answer_source":"explicit"},{"n":6,"q":"Which document contains details such as minimum investment requirements, investor service center locations, and the process for purchasing mutual fund units?","options":["Fund Factsheet","Application form","Key Information Memorandum","Transaction slip"],"answer":2,"explanation":"The Key Information Memorandum (KIM) contains essential details about a mutual fund scheme in a simple and summarized form. It includes information such as minimum investment amount, investor service centres, purchase procedure, and other important scheme details. The KIM helps investors quickly understand the scheme before investing.","answer_source":"explicit"},{"n":7,"q":"An application submitted for repurchase of mutual fund units is stamped with __________ .","options":["A and B","B and C","A and C","All A, B and C"],"answer":1,"explanation":"As per mutual fund transaction processing rules, repurchase applications are stamped with an automatically generated location code and machine identifier. These details help in proper time-stamping and tracking of transactions for NAV applicability and audit purposes. ARN of the distributor is not part of the mandatory stamping requirement on repurchase applications.","answer_source":"explicit","statements":["A) ARN number of the distributor","B) Automatically generated location code","C) Machine identifier"]},{"n":8,"q":"Identify the correct statement(s) related to risk in mutual fund schemes:","options":["A) Credit Risk Funds generally carry a higher default risk compared to Corporate Bond Funds","B) The NAV of gilt funds may fluctuate significantly more than liquid funds because of changes in market yields","Only A","Only B","Both A and B","None of the above"],"answer":4,"explanation":"Credit Risk Funds chase higher returns by investing in lower-rated bonds (below AA) — this means the companies issuing these bonds have a higher chance of defaulting on repayment. Corporate Bond Funds stick to high quality AA+ and above rated bonds — much safer but with slightly lower returns. So, Credit Risk Funds have a higher default risk than Corporate Bond Funds. Gilt funds invest in long-term government bonds (sometimes 10–30 year maturity). When interest rates/yields rise, the prices of these bonds fall sharply — causing significant NAV fluctuation. Liquid funds invest in instruments maturing within 91 days, so yield changes barely affect their NAV.","answer_source":"explicit"},{"n":9,"q":"Investments held in a mutual fund portfolio are valued at:","options":["Book value","Face value","Market value","Cost price"],"answer":2,"explanation":"Mutual fund investments are valued using their current market price. This helps calculate the correct Net Asset Value (NAV) of the scheme every day. Face value, book value, or purchase cost may not reflect the current worth of the securities. Therefore, mutual fund portfolios are valued at market value.","answer_source":"explicit"},{"n":10,"q":"The interest rate sensitivity of a mutual fund scheme having a longer average maturity is generally:","options":["High","Medium","Moderate","Low"],"answer":0,"explanation":"Interest rate sensitivity refers to how much the price of a bond or debt fund changes when interest rates move. Mutual funds with long average maturity hold long-term bonds, which have higher duration. Duration is the key measure of sensitivity. This is because the fund is locked into current interest rates for a longer period, making it more vulnerable to rate fluctuations. When interest rates rise, the prices of these long-term bonds fall more sharply, leading to greater volatility in the fund’s NAV. Conversely, if interest rates decline, such funds benefit more, as bond prices rise significantly. Hence, investors in long maturity debt funds face higher risk and reward potential compared to short maturity funds.","answer_source":"heuristic"},{"n":11,"q":"Which of the following statements correctly reflects SEBI guidelines regarding Income Distribution cum Capital Withdrawal (IDCW), formerly known as dividends, in mutual fund schemes?","options":["IDCW can be paid only from dividends earned by the scheme from its investments","IDCW may be distributed only out of distributable reserves","IDCW may be distributed only if the current NAV exceeds Rs. 10","Mutual fund schemes are prohibited from distributing IDCW to unit holders"],"answer":1,"explanation":"As per SEBI guidelines, mutual fund schemes can distribute IDCW only from distributable surplus/reserves available in the scheme. Which means only from realized profits and surplus available in the scheme. The fund cannot distribute more than what it has earned and realized — preventing any artificial or funded payouts. IDCW is not guaranteed and depends on the availability of distributable reserves. It is not necessary that NAV should be above Rs. 10 for paying IDCW. Also, IDCW is not restricted only to dividends received from invested companies.","answer_source":"explicit"},{"n":12,"q":"Identify the true statement(s) regarding arbitrage funds:","options":["A) Arbitrage funds are riskier compared to equity mutual funds","B) Arbitrage funds aim to exploit price inefficiencies between different market segments","Statement A only","Statement B only","Both statements A and B","None of the above"],"answer":3,"explanation":"Statement B is true : Arbitrage funds try to earn profit from price differences of the same security in different markets, such as cash and futures markets. It works on very simple principle — \"Buy Low in one market, Sell High in another market simultaneously.\" Statement A is false : Since every position is hedged (covered), the risk is actually very low — much lower than regular equity funds. Therefore, arbitrage funds generally have lower risk than equity funds since positions are usually hedged.","answer_source":"explicit"},{"n":13,"q":"At what stage does a nominee become entitled to have mutual fund units transferred in their name ?","options":["Once the nomination is made by the unit holders","Once the nomination is registered by the mutual fund","Upon the death of the first unit holder","Upon the death of all unit holders"],"answer":3,"explanation":"In a jointly held mutual fund account, if the first holder passes away, the surviving joint holders automatically continue to hold the units. The nominee’s right arises only when no registered holder remains alive.","answer_source":"explicit"},{"n":14,"q":"Which among the following statements about real estate investments is NOT true?","options":["The ticket size for investing in real estate is usually higher compared to financial investments","Real estate investments are illiquid and cannot be readily converted into cash in a few days at a clear market price","Real estate transactions generally carry lower costs than investments in financial assets","All of the above"],"answer":2,"explanation":"Real estate investments involve very high transaction costs — including stamp duty, registration charges, brokerage fees, legal charges, and maintenance costs. Therefore the statement - 'Real estate transactions generally carry lower costs than investments in financial assets' is false. The other two statements are true — real estate is indeed illiquid (cannot be sold quickly at a fair price within days), and the ticket size is very high (you need lakhs or crores to invest, unlike mutual funds where you can start with Rs. 500).","answer_source":"explicit"},{"n":15,"q":"What is the NAV if the value of stocks in a Mutual Fund scheme is Rs 100 cr, Value of Bonds is Rs 10 cr, Value of Money Market Instruments is Rs 25 cr, Dividend Accrued but not received is Rs 3 cr and Fees payable is Rs 5 cr. The number of outstanding units is 75 lacs.","options":["173.33","177.33","184","186.74"],"answer":1,"explanation":"NAV = (Value of stocks + Value of bonds + Value of money market instruments + Dividend accrued but not received – Fees payable) / No. of outstanding units = 100 cr + 10 cr + 25 cr + 3 cr - 5 cr / 75 lacs (75 lacs = 0.75 cr) = 133 cr / 0.75 cr = 177.33","answer_source":"explicit"},{"n":16,"q":"Identify the transactions on which Securities Transaction Tax (STT) is applicable","options":["Purchase transactions of debt mutual funds","Purchase transactions of equity mutual funds","Redemption transactions of debt mutual funds","Redemption transactions of equity mutual funds"],"answer":3,"explanation":"When an investor sells units of an equity fund in the stock exchange, or offers them for repurchase to the fund, he will have to incur Securities Transaction Tax (STT) i.e., STT is applicable only on redemption/switch to other schemes/sale of units of equity oriented mutual funds whether sold on stock exchange or otherwise. STT is not applicable on purchase of units of an equity scheme. It is also not applicable to transactions in debt securities or debt mutual fund schemes.","answer_source":"explicit"},{"n":17,"q":"Identify the TRUE statement with respect to regulation of mutual funds in India.","options":["AMFI along with SEBI regulates the mutual funds in India","The two stock exchanges NSE and BSE regulate the open-end mutual fund schemes","SEBI regulates the mutual funds in India","RBI along with SEBI regulate the bank sponsored mutual funds in India"],"answer":0,"explanation":"Securities markets in India are regulated by the Securities and Exchange Board of India (SEBI). It regulates, among other entities, mutual funds, depositories, custodians, registrars and transfer agents (RTAs) and credit rating agencies in the country. AMFI does not regulate the Mutual Fund. The objectives of AMFI are to define and maintain high professional and ethical standards in all areas of operation of the mutual fund industry.","answer_source":"explicit"},{"n":18,"q":"Identify which of these is not included in the 'Fundamental Attributes' of a mutual fund scheme?","options":["Aggregate fees and expenses charged to the scheme","Any safety net or guarantee provided","Exit Loads","Liquidity provisions such as listing, repurchase, redemption"],"answer":2,"explanation":"Within the Scheme Information Document, there is an important section on fundamental attributes of a scheme with following parameters on terms of issue : Terms of Issue - 1. Liquidity provisions such as listing, repurchase, redemption. 2. Aggregate fees and expenses charged to the scheme. 3. Any safety net or guarantee provided. Exit Loads do not form a part of 'Fundamental Attributes' of a scheme.","answer_source":"explicit"},{"n":19,"q":"Tactical Asset Allocation is the decision that comes out of calls on the likely behaviour of the market - True or False ?","options":["False","True"],"answer":1,"explanation":"Tactical Asset Allocation is the decision that comes out of calls on the likely behaviour of the market. An investor who decides to go overweight on equities because of expectations of a rise in share markets, is taking a tactical asset allocation call.","answer_source":"explicit"},{"n":20,"q":"What will be the minimum investment in corporate bonds (AA and below rated) in a Credit Risk fund?","options":["50% of of total assets","55% of of total assets","60% of of total assets","65% of of total assets"],"answer":3,"explanation":"Credit Risk Fund is an open-ended debt scheme investing in below highest rated corporate bonds. The minimum investment in corporate bonds shall be 65 percent of total assets (only in AA (excludes AA+ rated corporate bonds) and below rated corporate bonds).","answer_source":"explicit"},{"n":21,"q":"The Market Value of stocks of a scheme is Rs 240 crores. Dividend accrued but not received is Rs 30 crore. The Expenses payable are Rs 10 crore. The total number of outstanding units is 120 lakhs. What is the NAV of the scheme ?","options":["175.80","216.66","224.70","311.74"],"answer":1,"explanation":"Total Market Value = Rs 240 crore Add Dividend Accrued of Rs 30 crore Less Expenses Payable of Rs 10 crore Divided by Units 120 lakhs ie. 1.20 crore units 260 cr / 1.2 cr = 216.66 NAV","answer_source":"explicit"},{"n":22,"q":"The _______ is the promoter of a Mutual Fund.","options":["Trust","AMC","Sponsor","Custodian"],"answer":2,"explanation":"Mutual funds are constituted as Trusts. The mutual fund trust is created by one or more Sponsors, who are the main persons behind the mutual fund business.","answer_source":"explicit"},{"n":23,"q":"Identify the CORRECT statement.","options":["Mutual funds can only be purchased on the stock exchange platform and they cannot be sold","All mutual funds purchased on the stock exchange platform have a mandatory lock-in period","Stock exchange mutual fund trading platform has become another channel for mutual fund companies to reach out to investors","All of the above"],"answer":2,"explanation":"SEBI has facilitated buying and selling of the units of open-ended mutual funds through the stock exchanges. Both National Stock Exchange (NSE) and Bombay Stock Exchange (BSE) have extended their trading platforms to help the stock exchange brokers become a channel for investors to transact in Mutual Fund units.","answer_source":"explicit"},{"n":24,"q":"Once the New Fund Offer (NFO) of a Close Ended Fund has closed, a person can buy the listed units of such close ended fund ____________.","options":["At prices usually higher than NAV","At prices usually lower than NAV","At prices which can be higher or lower than NAV","Units of a Close Ended Fund cannot be bought after NFO"],"answer":2,"explanation":"After the NFO of a close ended fund, sale and purchase transactions happen on the stock exchange between two different investors, and that the fund is not involved in the transaction. The transaction price is likely to be different from the NAV. Depending on the demand-supply situation for the units of the scheme on the stock exchange, the transaction price could be higher or lower than the prevailing NAV.","answer_source":"explicit"},{"n":25,"q":"________ is prohibited as per the AMFI Code of Ethics.","options":["Inter-Scheme transfer of securities","Front running in those securities in which the mutual fund is dealing","Transaction in securities through associated brokers","Distribution of mutual fund schemes through Sponsor or its associates"],"answer":1,"explanation":"Front running means buying or selling of any securities ahead of transaction of the fund, with access to information regarding the transaction which is not public and which is material to making an investment decision, so as to derive unfair advantage. As per the AMFI code of ethics - Members or any of their directors, officers or employees shall not indulge in front running.","answer_source":"explicit"},{"n":26,"q":"Mohit is currently studying but wants to start a business after 5 years. The present cost of starting such a business is Rs. 10 lakhs. The inflation in the economy is 9%. Which formula should be used to calculate the amount which Mohit will need 5 years down the line?","options":["10,000,00 * (1+0.09)^5","10,000,00 / (1+0.09)^5","10,000,00 * (1+0.09)*5","10,000,00 * (1*0.09)^5"],"answer":0,"explanation":"The formula for calculating the Future Value of an investment made today is FV = PV * (1 + r) ^ n The PV ie. Present Value is Rs. 10 lakhs. The inflation rate (r) is 9% ie. 0.09 and time (n) is 5 years Subsituting in the formula : FV = 10,000,00 * (1+0.09)^5","answer_source":"manual"},{"n":27,"q":"What will happen to the scheme’s Net Asset Value (NAV) after the dividend is paid?","options":["The NAV will Rise","The NAV will Fall","The NAV will remain same"],"answer":1,"explanation":"In a mutual fund, dividend is paid out of the scheme’s assets. Once the dividend is distributed, that amount is deducted from the scheme’s NAV. So, immediately after the dividend payout, the NAV falls by the dividend amount.","answer_source":"explicit"},{"n":28,"q":"Identify the plan which could be used in lieu of income distribution cum capital withdrawal pay-outs?","options":["Systematic Withdrawal Plan","Systematic Transfer Plan","Systematic Investment Plan","None of the above"],"answer":0,"explanation":"The Income distribution cum capital withdrawal (dividend) pay-out option is for investors wanting a regular income. Systematic Withdrawal Plan(SWP) is a facility which allows an investor to withdraw a fixed amount at pre-determined intervals. Therefore an Income distribution cum capital withdrawal (dividend) pay-out option is similar to SWP. The difference is that the dividend is paid only when the fund has a surplus amount and in SWP the amount is compulsarily paid. (The dividend pay-out plan is renamed as pay-out of income distribution cum capital withdrawal, dividend re-investment plan is renamed as reinvestment of income distribution cum capital withdrawal option followed by renaming of dividend transfer plan to transfer of income distribution cum capital withdrawal plan)","answer_source":"heuristic"},{"n":29,"q":"Can an investor change his mutual fund distributor?","options":["Yes, but a permission from AMFI and SEBI is needed for the same","Yes, but the investor has to give a written request to the fund house","Yes, but an upfront fees have to be paid to the existing distributor to cover up his loss of income","No, a change of distributor is not permitted by SEBI"],"answer":1,"explanation":"Investors can choose to change their distributor or opt for direct investing. This needs to be done through a written request by the investor to the AMC. In such cases, AMCs will need to comply, without insisting on any kind of ‘No Objection Certificate’ from the existing distributor.","answer_source":"explicit"},{"n":30,"q":"Identify the CORRECT statement with respect to a Fund Factsheet.","options":["A Fund Factsheet has to be published only at the time of a New Fund Offer (NFO)","As per SEBI regulations, a Fund Factsheet has to be published on a monthly basis by the AMCs","A Fund Factsheet is published by AMCs on a voluntary basis","All mutual fund distributors have to mandatorily read the Fund Factsheet before recommending a scheme to their investors"],"answer":2,"explanation":"A Fund Factsheet is a document that provides key information about a mutual fund scheme, such as portfolio holdings, asset allocation, and recent performance. SEBI does not legally mandate AMCs to publish a factsheet. However, most AMCs voluntarily publish it (usually monthly) to keep investors informed and improve transparency.","answer_source":"explicit"},{"n":31,"q":"Identify the true statement with respect to 'Unclaimed Dividend' and redemption amounts in mutual fund schemes.","options":["The Asset Management Company can charge a penalty from the investors to refund the unclaimed dividend","The Asset Management Company can recover investment management fees from the investor but within the prescribed rates","The Asset Management Company has to transfer the unclaimed amounts to investor education fund","All of the above"],"answer":1,"explanation":"Unclaimed dividends/redemptions are kept aside by the AMC. They can be invested and AMCs may deduct management fees (within SEBI rules). As per SEBI rules - The mutual fund has to deploy unclaimed dividend and redemption amounts in the money market and in a separate plan of Liquid scheme floated by mutual funds especially for investing the unclaimed amounts. AMC can recover investment management and advisory fees on management of these unclaimed amounts, at a maximum rate of 0.50 percent per annum and there shall be no exit loads charged on this plan.","answer_source":"explicit"},{"n":32,"q":"Mr. Prakash has made an one time investment in a mutual fund scheme through a distributor. He has done no other subsequent transactions. How will the trail commission payable to the distributor be calculated ?","options":["The NAV as on the date of purchase X Number of units X Rate of trail commission X Number of days the investment is held / 365","The NAV as on the date of calculation of trail commission X Number of units X Rate of trail commission X Number of days the investment is held / 365","Average of all NAVs from the date of purchase to the date of calculation of trail commission X Number of units X Rate of trail commission X Number of days the investment is held / 365","Face value of unit X Number of units X Rate of trail commission X Number of days the investment is held / 365"],"answer":1,"explanation":"Trail commission is calculated as a percentage of the net assets attributable to the Units sold by the distributor. The commission payable is calculated on the daily balances and paid out periodically to the distributor as per the agreement entered into with AMC. As the trail commission is calculated on net assets, distributors benefit from increase in net assets arising out of valuation gains in the market. The formula for calculating the trail commission for a day is : Value of Net Assets as on the date of calculating trail commission x Trail commission Rate / 365 Trail commission for each day is added to get the total trail commission for a period. Value of net assets for the day will be the Number of Units held x the NAV of the day.","answer_source":"explicit"},{"n":33,"q":"The information which is provided in a mutual fund advertisement has to be _______ .","options":["Published in one English and one regional language newspaper","Approved by Securities and Exchange Board of India","Timely","Valid for at least 6 months investment horizon"],"answer":2,"explanation":"As per the SEBI Advertisement Code for Mutual Funds - Advertisements shall contain information that is timely and consistent with the disclosures made in the Scheme Information Document, Statement of Additional Information and the Key Information Memorandum. (No approval is required from SEBI except - Prior approval of SEBI shall be required for issuance of any endorsement of Mutual Funds as a financial product, which features a celebrity for the purpose of increasing awareness of Mutual Funds)","answer_source":"explicit"},{"n":34,"q":"Which of these expenses can be charged to a mutual fund scheme by the AMC ?","options":["Office salaries of fund management team","Rent of the AMC registered office","AMC general administration expenses","Custodian and Fund Administrator fees"],"answer":3,"explanation":"In addition to the investment and advisory fee, the AMC may charge the mu
