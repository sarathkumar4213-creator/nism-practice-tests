to introduce cash-settled Interest Rate Futures (IRF) on 6-year, 10-year, and 13-year GoI securities.","answer_source":"explicit"},{"n":29,"q":"Which of the following can only be done by a Trading member?","options":["Execution of trade","Execution of trade and Settlement of trade","Both of the above","None of the above"],"answer":0,"explanation":"In the structure of exchange-traded markets, the roles are divided between Trading Members and Clearing Members: 1. Trading Member - Authorized to execute trades on the exchange. - Cannot clear or settle trades unless they are also a Clearing Member. 2. Clearing Member - Responsible for clearing and settlement of trades (their own or on behalf of trading members).","answer_source":"manual"},{"n":30,"q":"What entity acts as the guarantor for transactions in the exchange-traded derivatives market?","options":["The Trading Member","The Clearing Member","The Clearing Bank","None of these"],"answer":3,"explanation":"The Clearing Corporation provides a trade guarantee by becoming the central counterparty (CCP) to both the buyer and seller. This happens through a process called Novation, where the CCP steps in and replaces the original contract — becoming the buyer to every seller and the seller to every buyer. This ensures smooth settlement and reduces counterparty risk.","answer_source":"explicit"},{"n":31,"q":"How are futures contracts on 91-day treasury bills settled?","options":["By Cash","By Physical delivery","By Cash or physical delivery as per the buyers choice","By Cash or physical delivery as per the sellers choice"],"answer":0,"explanation":"Treasury bill futures are generally cash-settled. This means that at expiration, instead of physically delivering the treasury bills, the contract is settled with a cash payment based on the difference between the futures price and the prevailing market price.","answer_source":"heuristic"},{"n":32,"q":"For the purposes of determining the expiry of cash-settled single Government of India bond futures contracts, identify which of the following constitutes a 'three 'quarterly' month'.","options":["January","February","March","April"],"answer":2,"explanation":"For cash-settled single Government of India (GOI) bond futures, expiry months typically follow the quarterly cycle, which includes: March June September December These are known as the \"quarterly months\" for derivatives contracts. From the list — January, March, April, February — the only quarterly month is March.","answer_source":"explicit"},{"n":33,"q":"What is the net financial outcome for a trader who bought a Rs. 300.25 call (Rs. 0.20 premium) and a Rs. 299.75 put (Rs. 0.15 premium) when the underlying price closes at Rs. 299.40?","options":["Rs - 0.40","Rs 0.40","Rs. - 0.35","0"],"answer":0,"explanation":"First lets calculate the Payoff at Expiry: 1. Call Option (300.25 Call) : Since the underlying closes at ?299.40, which is below the strike price (?300.25), the call expires worthless. The Payoff is zero. 2. Put Option (299.75 Put) : Since the underlying closes at ?299.40, which is below the strike price (?299.75), the put is in the money Intrinsic Value = Rs 299.75 – Rs 299.40 = Rs 0.35 Payoff = Profit of Rs 0.35 The Total Premium paid = 0.20 + 0.15 = Rs 0.35 Net Outcome = Total Payoff − Total Premium = Rs 0.35 - Rs 0.35 = 0","answer_source":"explicit"},{"n":34,"q":"An inter-bond spread in futures involves two trades with these features:","options":["Different market side but same expiry month","Different market side, different underlying but same expiry month","Different market side and different expiry months","Same market side but different expiry months"],"answer":1,"explanation":"An inter-bond spread in futures refers to a strategy where a trader takes opposite positions (buy one, sell another) in two different bond futures contracts (i.e., different underlyings) that have the same expiry month. Key characteristics of inter-bond spread: Different market sides: One long (buy), one short (sell) Different underlyings: Two different bonds Same expiry month: Both contracts expire in the same month This spread is used to profit from the relative movement between the prices of the two bond futures.","answer_source":"explicit"},{"n":35,"q":"What is the minimum percentage of the Minimum Required Corpus (MRC) that the stock exchange must contribute to the Core SGF?","options":["15","20","25","30"],"answer":2,"explanation":"The Core SGF (Settlement Guarantee Fund) is a dedicated fund to ensure settlement obligations are met in case of a default, and stock exchanges are required to contribute at least 25% of the MRC to this fund. This is outlined in SEBI's guidelines, which specify that the Clearing Corporation contributes at least 50% of the MRC, the Stock Exchange contributes at least 25%, and the remaining up to 25% can come from Clearing Members.","answer_source":"explicit"},{"n":36,"q":"Mrs. Ayushi takes two positions: buying a call option (strike Rs150, premium Rs 0.30) and buying a put option (strike Rs 150.00, premium Rs 0.20). Determine her net profit or loss if the underlying asset's price at expiry is Rs 149.50.","options":["Rs. 0.20","Rs. - 0.20","Rs. 0.50","0"],"answer":0,"explanation":"Let's evaluate each option at expiry: 1. Call Option (Strike 150) Since spot price < strike price, the call expires worthless. Payoff = 0 2. Put Option (Strike 150) Since spot price < strike price, the put is in the money. Payoff = 150 - 149.50 = Rs 0.50 Total Payoff = 0 (call) + 0.50 (put) = Rs. 0.50 The total cost is the premiums paid which are 0.30 and 0.20 = Rs 0.50 Net P/L = Payoff - Premiums = 0.50 - 0.50 = 0.00","answer_source":"explicit"},{"n":37,"q":"The contract amount i.e. 'market lot' for treasury bill futures (in terms of face value) is ________ .","options":["Rs. 20,000","Rs. 50,000","Rs. 2,00,000","Rs. 5,00,000"],"answer":2,"explanation":"In India, the contract size (also known as market lot) for Treasury Bill Futures — specifically for 91-day T-Bill futures — is Rs. 2,00,000 face value per contract. This is the standard lot size as specified by exchanges like NSE and BSE for trading in T-Bill futures.","answer_source":"explicit"},{"n":38,"q":"Where, according to RBI guidelines, can interest rate derivatives contracts be traded?","options":["On Exchanges","On Over-the-Counter (OTC) Market","On Electronic Trading Platforms (ETPs)","All of the above"],"answer":3,"explanation":"As per RBI guidelines, Interest Rate Derivatives (IRDs) can be traded through: - Over-the-Counter (OTC) Market – Customized contracts between parties. - Electronic Trading Platforms (ETPs) – RBI-regulated platforms for standardized products. - Exchanges – Like NSE, BSE, where standardized IRD contracts are listed and traded.","answer_source":"explicit"},{"n":39,"q":"Identify which of these can be considered as a Derivative?","options":["Interest Rate Futures","Interest Rate Swap","Interest Rate Options","All of the above"],"answer":3,"explanation":"All these are derivatives because their value is derived from an underlying interest rate. - Interest Rate Option – A contract that gives the buyer the right (but not the obligation) to benefit from interest rate movements - Interest Rate Swap – A contract where two parties exchange interest rate cash flows, typically swapping fixed for floating rates. - Interest Rate Futures – Standardized contracts traded on exchanges to buy or sell an interest rate-linked instrument at a future date.","answer_source":"explicit"},{"n":40,"q":"The purpose of a stop-loss sell order is to limit losses if the price moves _______.","options":["Up","Down","No change in price","become volatile"],"answer":1,"explanation":"A stop-loss sell order is placed to limit losses when the price of a security falls below a certain level. It automatically triggers a sell when the price drops to or below the trigger price. This helps protect the investor from further downside.","answer_source":"explicit"},{"n":41,"q":"For the cash-settled bond futures contract that is currently being traded, what is its last trading day?","options":["First day of the expiry month","Last Wednesday of expiry month","Last Thursday of expiry month","Last Friday of expiry month"],"answer":2,"explanation":"The last trading day for cash settled bond futures contract is last Thursday of expiry month. In case the last Thursday is a trading holiday, the previous trading day shall be the expiry / last trading day.","answer_source":"explicit"},{"n":42,"q":"According to the Security Contracts (Regulation) Rules, 1957, what is the minimum age for an individual to become a trading member?","options":["18 years","20 years","21 years","25 years"],"answer":2,"explanation":"As per the Securities Contracts (Regulation) Rules, 1957, the minimum age requirement for an individual to be eligible for trading membership of a recognized stock exchange is 21 years This is to ensure that the individual is legally an adult with sufficient maturity and capacity to enter into financial contracts and take on trading responsibilities.","answer_source":"explicit"},{"n":43,"q":"How can a person, who is holding a fixed income security, hedge his position?","options":["By Buying GOI bond to call option","By Selling GOI bond futures","Both of the above","None of the above"],"answer":1,"explanation":"A person who holds a fixed income security (like a bond) is exposed to interest rate risk — specifically, the risk that interest rates may rise, which would decrease the price of the bond. To hedge this risk, the person can sell GOI bond futures Thus, if interest rates rise, bond prices fall. By selling bond futures, the person profits from the drop in futures prices, which offsets the loss in the value of the bond.","answer_source":"explicit"},{"n":44,"q":"For interest rate derivatives transactions executed on Indian Exchanges, Stamp Duty is levied on ______.","options":["The Buyer","The Seller","Both the buyer and seller","None of these"],"answer":0,"explanation":"In India, stamp duty on interest rate derivatives traded on exchanges is levied only on the buyer of the contract.","answer_source":"heuristic"},{"n":45,"q":"Which of the following options presents a true description?","options":["A) The price in a forward rate agreement is primarily determined through direct negotiation between the involved parties.","B) Interest rate futures contracts derive their prices from the collective bids and offers of market participants on a centralized exchange.","Only statement 'A' is true","Only statement 'B' is true","Both statements 'A' and 'B' are true","Both statements 'A' and 'B' are false"],"answer":4,"explanation":"Forward Rate Agreements are Over-the-counter (OTC) contracts between two parties. The terms, including the rate, are negotiated bilaterally. There is no centralized price discovery. Interest Rate Futures are traded on centralized exchanges (e.g., NSE, BSE). The prices are discovered through free market interaction of buyers and sellers.","answer_source":"explicit"},{"n":46,"q":"Identify the correct statement with respect to Quantity freeze.","options":["Quantity freeze involves a limit on the total quantity during a day at a clearing member level","Quantity freeze involves a limit on the total quantity during a day by a single client","Quantity freeze involves a limit on the total quantity during a day by a single trading member","Quantity freeze involves a limit on the total quantity during a day by all trading members"],"answer":2,"explanation":"Quantity freeze is a mechanism used by exchanges to control excessive order sizes, particularly in volatile market conditions. It sets a maximum limit on the number of contracts or shares that can be traded in a single order or within a specific timeframe by a single trading member or trading ID. This helps to prevent large, disruptive orders from causing market instability.","answer_source":"explicit"},{"n":47,"q":"What is the name of the document that provides crucial information about the risks of trading in equities and derivatives on a stock exchange?","options":["Risk Disclosure Document (RDD)","Rights and obligations document","Know Your Client (KYC) Form","Policies and procedures"],"answer":0,"explanation":"The Risk Disclosure Document (RDD) is a document provided to clients by brokers or stock exchanges that outlines the risks involved in trading, particularly in the equities and derivatives segments. It is an important document that helps investors understand the potential risks associated with different financial instruments and strategies.","answer_source":"heuristic"},{"n":48,"q":"What are the available options for a client to submit a trade order on a securities exchange?","options":["Through Internet","By Phone","Using Direct Market Access","All of the above"],"answer":3,"explanation":"The Broker accepts orders from the client and sends the same to the Exchange after performing the risk management checks. Clients have the option of placing their orders directly through various channels, provided by members, like internet, phone, direct market access (DMA) (for institutional clients), securities trading using wireless technology facility (STWT) / Automated / Algorithm Trading (ALGO) / Smart order router (SOR), etc.","answer_source":"explicit"},{"n":49,"q":"When trading government bond futures, which of the following quantity of face value can be bought or sold?","options":["Rs 1 lakh","Rs 5 lakhs","Rs 10 lakhs","Rs 15 lakhs"],"answer":2,"explanation":"In India, Government Bond Futures traded on exchanges like NSE or BSE have a standardized contract size based on face value multiples of Rs. 2 lakhs. - Permissible Quantities: Only multiples of Rs. 2 lakhs (e.g., 2L, 4L, 6L, 8L, 10L, etc.) can be traded. - Non-Permissible Quantities: Amounts like 1L, 5L, 15L, etc., are not allowed because they are not exact multiples of Rs. 2 lakhs.","answer_source":"explicit"},{"n":50,"q":"Which of these constitute an 'Operational Risk' for a broker?","options":["Non-Delivery of scrips","Trading errors","Both of the above","None of the above"],"answer":2,"explanation":"Operational risk is the risk of monetary loss resulting from inadequate or failed internal processes, manual and systems error or external events. For the stock broker, operations risks are essentially risk arises on account of handling of client assets, regulatory non-compliance, trading error, non-payment for buying or selling a scrip, non-delivery of scrip(s), denial of matched order by clients, sudden closure of banks where funds are deposited etc.","answer_source":"explicit"}]}]};
let currentSet = null, currentIndex = 0, answers = [], elapsed = 0, timerId = null, examStarted = false;

const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

function fmtTime(sec){
  sec = Math.max(0, Math.floor(sec));
  const h=Math.floor(sec/3600), m=Math.floor((sec%3600)/60), s=sec%60;
  return (h?String(h).padStart(2,'0')+':':'')+String(m).padStart(2,'0')+':'+String(s).padStart(2,'0');
}
function stopTimer(){ if(timerId){clearInterval(timerId);timerId=null;} }
function startTimer(){
  stopTimer(); elapsed=0; $('timer').textContent='00:00';
  timerId=setInterval(()=>{elapsed++;$('timer').textContent=fmtTime(elapsed)},1000);
}
function home(){
  stopTimer(); examStarted=false; currentSet=null;
  const groups={};
  DATA.sets.forEach((s,i)=>(groups[s.category]??=[]).push({...s,i}));
  let out=`<div class="header"><h1>NISM Practice Tests</h1><p>Mutual Fund • Equity Derivatives • Interest Rate Derivatives</p></div>`;
  Object.entries(groups).forEach(([cat,items])=>{
    out+=`<div class="card"><div class="section-title">${esc(cat)}</div>
    <table class="table"><thead><tr><th>Sr. No.</th><th>Test</th><th>Total Questions</th><th>Online</th></tr></thead><tbody>`;
    items.forEach((s,n)=>out+=`<tr><td>${n+1}</td><td><b>Practice Qs on ${esc(cat)} — ${esc(s.set)}</b></td><td>${s.count}</td><td><button class="start" onclick="startExam(${s.i})">Start Test</button></td></tr>`);
    out+=`</tbody></table></div>`;
  });
  out+=`<div class="card small"><b>Exam format:</b> One question at a time • No fixed time limit • Timer starts at 00:00 and counts upward • End the exam anytime • 1 mark per correct answer • PASS if percentage is above 60%; TRY AGAIN if 60% or below.</div>`;
  $('app').innerHTML=out;
}
function startExam(setIndex){
  currentSet=DATA.sets[setIndex]; currentIndex=0; answers=Array(currentSet.count).fill(null); examStarted=true;
  $('app').innerHTML=`<div class="card">
    <div class="exam-top"><div><b>NISM Practice Test</b><div class="meta">${esc(currentSet.category)} — ${esc(currentSet.set)} • ${currentSet.count} Questions</div></div><div id="timer" class="timer">00:00</div></div>
    <div class="progress-wrap"><div id="progress" class="progress"></div></div>
    <div id="questionArea"></div>
  </div>`;
  renderQuestion(); startTimer();
}
function renderQuestion(){
  const q=currentSet.questions[currentIndex];
  const pct=(currentIndex/currentSet.count)*100;
  $('progress').style.width=pct+'%';
  let options='';
  q.options.forEach((o,i)=>options+=`<button class="option" id="opt${i}" onclick="choose(${i})">${String.fromCharCode(65+i)}. ${esc(o)}</button>`);
  let extraHtml='';
  if(q.statements){
    extraHtml=`<div class="statements">${q.statements.map(s=>`<div class="statement">${esc(s)}</div>`).join('')}</div>`;
  } else if(q.continuation){
    extraHtml=`<div class="continuation">${q.continuation.map(s=>`<div>${esc(s)}</div>`).join('')}</div>`;
  }
  $('questionArea').innerHTML=`<div class="qnum">Question ${q.n} of ${currentSet.count}</div>
    <div class="question">${esc(q.q)}</div>
    ${extraHtml}
    <div class="answer-label">Answer options</div>
    <div>${options}</div>
    <div id="feedback" class="feedback"></div>
    <div class="actions"><button class="btn end" onclick="endExam()">End Exam</button><div>${currentIndex<currentSet.count-1?'<button id="next" class="btn next hidden" onclick="nextQuestion()">Next Question</button>':'<button id="next" class="btn next hidden" onclick="endExam()">Finish Exam</button>'}</div></div>`;
  if(answers[currentIndex]!==null) showFeedback(answers[currentIndex]);
}
function choose(i){
  if(answers[currentIndex]!==null)return;
  answers[currentIndex]=i; showFeedback(i);
}
function showFeedback(selected){
  const q=currentSet.questions[currentIndex];
  document.querySelectorAll('.option').forEach((b,i)=>{b.disabled=true;if(i===q.answer)b.classList.add('correct');});
  const fb=$('feedback');
  const correct=selected===q.answer;
  if(!correct)$('opt'+selected).classList.add('wrong');
  fb.className='feedback show '+(correct?'correct':'wrong');
  fb.innerHTML=`<b>${correct?'Correct':'Wrong'}</b>${correct?'':'<br>Correct answer: <b>'+String.fromCharCode(65+q.answer)+'. '+esc(q.options[q.answer])+'</b>'}<div class="explanation"><b>Explanation</b><br>${esc(q.explanation)}</div>`;
  $('next').classList.remove('hidden');
}
function nextQuestion(){
  if(currentIndex<currentSet.count-1){currentIndex++;renderQuestion();window.scrollTo({top:0,behavior:'smooth'});}
}
function endExam(){
  if(!examStarted)return;
  stopTimer(); examStarted=false;
  const total=currentSet.count;
  let correct=0,answered=0;
  answers.forEach((a,i)=>{if(a!==null){answered++;if(a===currentSet.questions[i].answer)correct++;}});
  const wrong=answered-correct,unanswered=total-answered,marks=correct, pct=(correct/total)*100;
  const passed=pct>60;
  $('app').innerHTML=`<div class="card result">
    <div class="meta">${esc(currentSet.category)} — ${esc(currentSet.set)}</div>
    <h2 class="${passed?'status-pass':'status-try'}">${passed?'PASS':'TRY AGAIN'}</h2>
    <div class="stats">
      <div class="stat">Correct<b>${correct}</b></div>
      <div class="stat">Wrong<b>${wrong}</b></div>
      <div class="stat">Unanswered<b>${unanswered}</b></div>
      <div class="stat">Marks<b>${marks}/${total}</b></div>
      <div class="stat">Percentage<b>${pct.toFixed(1)}%</b></div>
      <div class="stat">Time Taken<b>${fmtTime(elapsed)}</b></div>
    </div>
    <div class="actions"><button class="btn back" onclick="home()">Back to Tests</button><button class="btn next" onclick="startExam(DATA.sets.indexOf(currentSet))">Restart Exam</button></div>
  </div>`;
}
home();
</script>
</body>
</html>
